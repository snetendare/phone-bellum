<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<link rel="icon" href="icon.png">
<title>No Mans Land · 3D test</title>
<style>
/* Layout: one column, a war table at night. HUD on top, square board, controls under the thumb. Single dark look by choice. */
:root {
  --bg: #0D1315;
  --panel: #152125;
  --board: #13201F;
  --line: #27393D;
  --ink: #E5ECE9;
  --muted: #8DA1A1;
  --you: #5CC6DF;
  --foe: #EE6E5C;
  --gold: #E6B84A;
  --gold-dark: #C4932C;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 28px; -webkit-tap-highlight-color: transparent; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { display: grid; gap: 4px; min-width: 0; }
.side.foe { text-align: right; }
.side .lbl { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 8px; }
.side.you .lbl { color: var(--you); }
.side.foe .lbl { color: var(--foe); flex-direction: row-reverse; }
.side .lbl .num { color: var(--ink); font-weight: 500; }
.hp { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.hp i { display: block; height: 100%; transition: width 0.6s ease; }
.side.you .hp i { background: var(--you); }
.side.foe .hp i { background: var(--foe); margin-left: auto; }
.round { text-align: center; font-family: var(--font-display); }
.round b { display: block; font-size: 22px; font-weight: 700; line-height: 1; }
.round span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Board */
.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--board); touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.board3d { position: absolute; inset: 0; touch-action: none; } /* the 3D board (the Board setting): its own canvas, the camera takes every finger */
.note3d { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3; width: max-content; max-width: calc(100% - 16px); padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: rgba(13, 19, 21, 0.88); color: var(--ink); font-size: 13px; line-height: 1.35; text-align: center; cursor: pointer; } /* one line when the 3D board falls back to 2D; tap to close */
.meter3d { position: absolute; top: 6px; right: 6px; max-width: calc(100% - 12px); padding: 3px 6px; border: 0; border-radius: 4px; background: rgba(13, 19, 21, 0.72); color: var(--muted); font: 10px/1.35 var(--font-data); text-align: right; white-space: pre-wrap; cursor: pointer; }
.tag-clock { position: absolute; top: 8px; left: 10px; font-family: var(--font-data); font-size: 12px; color: var(--muted); pointer-events: none; }
.overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: rgba(13, 19, 21, 0.86); text-align: center; }
.card { margin: auto; display: grid; gap: 10px; justify-items: center; max-width: 36ch; }
.card h2 { font-size: clamp(26px, 8vw, 38px); font-weight: 700; text-transform: uppercase; line-height: 1; }
.card h2.you { color: var(--you); }
.card h2.foe { color: var(--foe); }
.card p { margin: 0; color: var(--muted); }
.card .big { color: var(--ink); font-size: 17px; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; text-align: left; color: var(--muted); font-size: 13px; line-height: 1.35; }
.card ul li::before { content: "▸ "; color: var(--gold); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }

/* Controls */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.gold { font-family: var(--font-data); font-size: 16px; color: var(--gold); font-weight: 500; }
.deploys { font-size: 13px; color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }
.btn { border-radius: 4px; border: 1px solid var(--line); background: transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-family: var(--font-data); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--gold); }

.shop { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.uwrap { flex: 0 0 132px; scroll-snap-align: start; position: relative; display: grid; }
.ucard { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 10px 34px 9px 10px; background: var(--bg); display: grid; gap: 3px; align-content: start; }
.ucard[aria-pressed="true"] { border-color: var(--you); box-shadow: inset 0 0 0 1px var(--you); }
.ucard[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.ucard .t { font-family: var(--font-data); font-size: 12px; color: var(--you); letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 5px; }
.ucard .n { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.ucard .r { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ucard .c { font-family: var(--font-data); font-size: 12px; color: var(--gold); }
.uwrap .info { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-family: var(--font-display); font-size: 12px; display: grid; place-items: center; }

/* Unit sheet */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; align-items: end; justify-items: center; z-index: 5; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.sheet h3 { font-size: 22px; }
.sheet .role { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.stats span { color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.vs h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.vs .good h4 { color: var(--you); }
.vs .bad h4 { color: var(--foe); }
.vs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; }
.traits span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hp i { transition: none; } }

html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
/* the bars sit above and below the board, so the strategic view fits the board between them and nothing covers your zone */
body { display: flex; flex-direction: column; }
#view { position: relative; flex: 1; min-height: 0; touch-action: none; }
#view canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.hud { display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
.top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); justify-content: space-between; }
.bottom { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { font: 500 12px var(--font-data); padding: 6px 10px; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; background: rgba(13,19,21,0.75); color: var(--muted); }
.chip.on { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.levels { display: flex; gap: 4px; }
.stats { font: 400 11px var(--font-data); color: var(--muted); background: rgba(13,19,21,0.75); padding: 4px 8px; border-radius: 4px; }
.hud .btn { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.hud select { min-height: 36px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font: inherit; }
#msg { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 600 13px var(--font-data); color: var(--ink); background: rgba(13,19,21,0.8); padding: 6px 12px; border-radius: 4px; pointer-events: none; text-align: center; max-width: calc(100% - 32px); }
#shop { width: 100%; max-width: 640px; display: grid; gap: 4px; }
#shop[hidden], #help[hidden], #msg[hidden] { display: none; }
#msg, #help { z-index: 1; }
#shop .line { display: flex; justify-content: space-between; gap: 8px; font: 400 12px var(--font-body); color: var(--muted); }
#gold { font: 500 12px var(--font-data); color: var(--gold); white-space: nowrap; }
#cards { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#cards .ucard { flex: 0 0 auto; min-width: 84px; padding: 6px 8px; }
#cards .ucard .n { font-size: 13px; }
#help { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: max-content; font: 400 12px var(--font-body); color: var(--muted); background: rgba(13,19,21,0.8); padding: 6px 10px; border-radius: 4px; pointer-events: none; text-align: center; max-width: min(520px, calc(100% - 24px)); box-sizing: border-box; }
</style>
</head>
<body>
<div class="hud top">
  <div class="levels" id="levels"><button class="chip on">Strategic</button><button class="chip">Tilted</button><button class="chip">Angled</button><button class="chip">Ground</button></div>
  <span class="stats" id="stats"></span>
</div>
<div id="view"><div id="msg"></div><div id="help"></div></div>
<div class="hud bottom">
  <div id="shop" hidden><div class="line"><span id="hint"></span><span id="gold"></span></div><div id="cards"></div></div>
  <div class="row">
  <select id="map" aria-label="Map"><option value="standard">Standard</option><option value="forest">Forest Clearing</option><option value="cavern">Mushroom Cavern</option><option value="ice">Frozen Peak</option></select>
  <select id="who" aria-label="Who deploys blue"><option value="you">Blue: you</option><option value="ai">Blue: AI</option></select>
  <button class="btn" id="auto">Auto</button>
  <button class="btn primary" id="fight">Fight</button>
  <button class="btn" id="next">Next</button>
  <button class="btn" id="new">New</button>
  </div>
</div>
<script>
// ===== Unit shapes (shared by Counter Lab and the demo) =====
const Shapes = (() => {
  const LIST = ['circle', 'ring', 'square', 'triangle', 'diamond', 'pentagon', 'hexagon', 'star', 'cross', 'bar', 'horse', 'spider', 'sun', 'flame', 'spear', 'imp', 'knife', 'drop', 'dagger'];
  const LABELS = { circle: 'Circle', ring: 'Ring', square: 'Square', triangle: 'Triangle', diamond: 'Diamond', pentagon: 'Pentagon', hexagon: 'Hexagon', star: 'Star', cross: 'Cross', bar: 'Bar', horse: 'Horse', spider: 'Spider', sun: 'Sun', flame: 'Flame', spear: 'Spear', imp: 'Imp', knife: 'Knife', drop: 'Drop', dagger: 'Dagger' };
  const DEFAULTS = {
    'Goblin Swarm': 'triangle', 'Skeleton Archers': 'diamond', 'Ember Imps': 'imp', 'Fire Mage': 'hexagon',
    'Sniper': 'cross', 'Brute': 'square', 'Wisps': 'ring', 'Crossbow Volley': 'pentagon', 'Ballista': 'bar',
    'Boar Riders': 'circle', 'Spinning Golem': 'hexagon', 'Blunderbuss Crew': 'star', 'Ogre Smasher': 'square',
  };
  const valid = (s) => LIST.includes(s);
  // Unit colours: picked to stay clear of the team colours (blue and red), which outline every body
  const PALETTE = ['#9BD35A', '#E9E3CF', '#FFA94D', '#C77DFF', '#F7D154', '#8D99AE', '#E07A9B', '#B08155', '#3FD39A', '#B4A7F5', '#D9C49A', '#7FA650'];
  const DEFAULT_COLORS = {
    'Goblin Swarm': '#9BD35A', 'Skeleton Archers': '#E9E3CF', 'Ember Imps': '#FFA94D', 'Fire Mage': '#C77DFF',
    'Sniper': '#F7D154', 'Brute': '#8D99AE', 'Wisps': '#B4A7F5', 'Crossbow Volley': '#B08155', 'Ballista': '#D9C49A',
    'Boar Riders': '#E07A9B', 'Spinning Golem': '#7FA650', 'Blunderbuss Crew': '#3FD39A', 'Ogre Smasher': '#B08155',
  };
  // a unit's short label on the board: the first three letters of its name
  const tag = (u) => ((typeof u.tag === 'string' && u.tag.replace(/[^A-Za-z]/g, '')) || u.name.replace(/[^A-Za-z]/g, '').slice(0, 3) || 'UNT').slice(0, 3).toUpperCase(); // a unit may pick its own (tag)
  const validColor = (c) => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);

  // Give every unit a shape and a colour: keep valid ones, else a known default, else the first one not used yet
  function assign(units) {
    const used = new Set(units.filter(u => valid(u.shape)).map(u => u.shape));
    const usedC = new Set(units.filter(u => validColor(u.color)).map(u => u.color.toUpperCase()));
    return units.map((u) => {
      let out = u;
      if (!valid(u.shape)) {
        let s = DEFAULTS[u.name];
        if (!s || used.has(s)) s = LIST.find(x => !used.has(x)) || LIST[used.size % LIST.length];
        used.add(s);
        out = { ...out, shape: s };
      }
      if (!validColor(u.color)) {
        let c = DEFAULT_COLORS[u.name];
        if (!c || usedC.has(c)) c = PALETTE.find(x => !usedC.has(x)) || PALETTE[usedC.size % PALETTE.length];
        usedC.add(c);
        out = { ...out, color: c };
      }
      return out;
    });
  }

  // A horse seen from the side, facing right: rump, back, neck and head, chest, front leg, belly, hind leg, tail.
  // Points are in units of r around the centre; it always stands upright, whichever side it is on.
  const HORSE = [[-0.95, -0.3], [0.3, -0.3], [0.62, -0.95], [0.82, -0.85], [1.12, -0.5], [1.02, -0.36], [0.74, -0.46], [0.66, -0.05], [0.62, 0.3],
    [0.62, 1.05], [0.42, 1.05], [0.38, 0.32], [-0.52, 0.32], [-0.58, 1.05], [-0.78, 1.05], [-0.86, 0.22], [-1.18, 0.55], [-1.08, 0.05]];

  // Pictures made of several parts, in units of r around the centre, always upright: { c: [x, y, radius] } is a
  // disc, { p: [[x, y], ...] } a polygon. Every part runs the same way round, so overlapping parts fill as one.
  const clockwise = (pts) => pts.reduce((s, [x1, y1], i) => { const [x2, y2] = pts[(i + 1) % pts.length]; return s + x1 * y2 - x2 * y1; }, 0) > 0 ? pts : pts.slice().reverse();
  // a leg drawn as a thin strip along a bent line (w = half its thickness)
  function strip(line, w) {
    const nrm = (i) => { const [ax, ay] = line[Math.max(0, i - 1)], [bx, by] = line[Math.min(line.length - 1, i + 1)], l = Math.hypot(bx - ax, by - ay); return [-(by - ay) / l * w, (bx - ax) / l * w]; };
    const n = line.map((_, i) => nrm(i));
    return line.map(([x, y], i) => [x + n[i][0], y + n[i][1]]).concat(line.map(([x, y], i) => [x - n[i][0], y - n[i][1]]).reverse());
  }
  const SPIDER_LEGS = [[[0.15, -0.5], [0.72, -0.95], [1.02, -1.28]], [[0.22, -0.3], [0.92, -0.5], [1.3, -0.42]],
    [[0.24, -0.08], [0.92, 0.12], [1.3, 0.48]], [[0.2, 0.12], [0.72, 0.62], [0.98, 1.22]]];
  const ray = (a) => [[Math.cos(a) * 1.32, Math.sin(a) * 1.32], [Math.cos(a + 0.3) * 0.56, Math.sin(a + 0.3) * 0.56], [Math.cos(a - 0.3) * 0.56, Math.sin(a - 0.3) * 0.56]];
  const IMP = [{ p: [[-0.8, -0.6], [0.8, -0.6], [0.8, 0.95], [-0.8, 0.95]] }, { p: [[-0.8, -0.58], [-0.36, -0.58], [-0.74, -1.22]] }, { p: [[0.36, -0.58], [0.8, -0.58], [0.74, -1.22]] }];
  const FIGURES = {
    spider: [{ c: [0, 0.32, 0.56] }, { c: [0, -0.42, 0.33] }, ...SPIDER_LEGS.flatMap(l => [{ p: strip(l, 0.15) }, { p: strip(l.map(([x, y]) => [-x, y]), 0.15) }])],
    sun: [{ c: [0, 0, 0.64] }, ...Array.from({ length: 8 }, (_, i) => ({ p: ray(-Math.PI / 2 + i * Math.PI / 4) }))],
    flame: [{ p: [[0, -1.32], [0.2, -0.86], [0.42, -0.56], [0.54, -0.9], [0.74, -0.38], [0.88, 0.1], [0.82, 0.52], [0.6, 0.86], [0.26, 1.04],
      [-0.16, 1.04], [-0.52, 0.9], [-0.8, 0.6], [-0.9, 0.18], [-0.8, -0.22], [-0.6, -0.54], [-0.54, -0.24], [-0.36, -0.58], [-0.2, -0.98]] }],
    // a spear standing upright: leaf-shaped head, crossguard, shaft
    spear: [{ p: [[0, -1.36], [0.4, -0.78], [0.14, -0.5], [-0.14, -0.5], [-0.4, -0.78]] }, { p: [[-0.42, -0.52], [0.42, -0.52], [0.42, -0.34], [-0.42, -0.34]] },
      { p: [[-0.13, -0.4], [0.13, -0.4], [0.13, 1.32], [-0.13, 1.32]] }],
    // an imp: a square body with two small horns
    imp: IMP,
    // a throwing knife standing upright: blade, crossguard, grip, pommel
    knife: [{ p: [[0, -1.36], [0.3, -0.86], [0.24, 0.2], [-0.24, 0.2], [-0.3, -0.86]] }, { p: [[-0.6, 0.2], [0.6, 0.2], [0.6, 0.42], [-0.6, 0.42]] },
      { p: [[-0.16, 0.42], [0.16, 0.42], [0.16, 1.1], [-0.16, 1.1]] }, { c: [0, 1.16, 0.24] }],
    // a curved dagger standing upright, point up: blade, hilt, grip, pommel (the Assassin)
    dagger: [{ p: [[0.08, -1.38], [0.38, -0.9], [0.36, -0.3], [0.16, 0.18], [-0.2, 0.18], [-0.1, -0.4], [-0.12, -0.9]] }, { p: [[-0.62, 0.18], [0.58, 0.18], [0.44, 0.38], [-0.48, 0.38]] },
      { p: [[-0.15, 0.38], [0.13, 0.38], [0.13, 1.08], [-0.15, 1.08]] }, { c: [-0.01, 1.14, 0.22] }],
    // a drop of water
    drop: [{ p: [[0, -1.32], [0.74, 0.02], [-0.74, 0.02]] }, { c: [0, 0.32, 0.84] }],
  };
  for (const parts of Object.values(FIGURES)) for (const pt of parts) if (pt.p) pt.p = clockwise(pt.p);

  // Points of a regular polygon; up = 1 points toward the top of the screen, -1 toward the bottom
  function poly(ctx, x, y, r, n, rot) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI * 2 / n;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  // Builds the path for a shape. Returns true if the shape should be stroked instead of filled (ring).
  function path(ctx, shape, x, y, r, up = 1) {
    const top = up >= 0 ? -Math.PI / 2 : Math.PI / 2;
    switch (shape) {
      case 'square': ctx.beginPath(); ctx.rect(x - r * 0.88, y - r * 0.88, r * 1.76, r * 1.76); return false;
      case 'triangle': poly(ctx, x, y + (up >= 0 ? r * 0.15 : -r * 0.15), r * 1.25, 3, top); return false;
      case 'diamond': poly(ctx, x, y, r * 1.2, 4, top); return false;
      case 'pentagon': poly(ctx, x, y, r * 1.08, 5, top); return false;
      case 'hexagon': poly(ctx, x, y, r * 1.05, 6, 0); return false;
      case 'star': {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = top + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3;
          const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath(); return false;
      }
      case 'cross': {
        const a = r * 1.15, b = r * 0.42;
        ctx.beginPath();
        ctx.moveTo(x - b, y - a); ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y - b); ctx.lineTo(x + a, y - b);

        ctx.beginPath();

        return false;
      case 'horse': ctx.beginPath(); HORSE.forEach(([px, py], i) => i ? ctx.lineTo(x + px * r, y + py * r) : ctx.moveTo(x + px * r, y + py * r)); ctx.closePath(); return false;

  function outline(ctx, shape, x, y, r, up = 1) { path(ctx, shape, x, y, r, up); ctx.stroke(); }

  // Small inline SVG icon in the current text colour
  function svg(shape, size = 14) {
    const c = size / 2, r = size * 0.36;
    const pts = (n, rr, rot, cy = c) => Array.from({ length: n }, (_, i) => {
      const a = rot + i * Math.PI * 2 / n; return `${(c + Math.cos(a) * rr).toFixed(2)},${(cy + Math.sin(a) * rr).toFixed(2)}`;
    }).join(' ');
    let body;
    switch (shape) {
      case 'square': body = `<rect x="${c - r * 0.88}" y="${c - r * 0.88}" width="${r * 1.76}" height="${r * 1.76}"/>`; break;
      case 'triangle': body = `<polygon points="${pts(3, r * 1.25, -Math.PI / 2, c + r * 0.15)}"/>`; break;
      case 'diamond': body = `<polygon points="${pts(4, r * 1.2, -Math.PI / 2)}"/>`; break;
      case 'pentagon': body = `<polygon points="${pts(5, r * 1.08, -Math.PI / 2)}"/>`; break;
      case 'hexagon': body = `<polygon points="${pts(6, r * 1.05, 0)}"/>`; break;
      case 'star': body = `<polygon points="${Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3; return `${(c + Math.cos(a) * rr).toFixed(2)},${(c + Math.sin(a) * rr).toFixed(2)}`; }).join(' ')}"/>`; break;
      case 'cross': { const a = r * 1.15, b = r * 0.42; body = `<polygon points="${[[-b, -a], [b, -a], [b, -b], [a, -b], [a, b], [b, b], [b, a], [-b, a], [-b, b], [-a, b], [-a, -b], [-b, -b]].map(([px, py]) => `${(c + px).toFixed(2)},${(c + py).toFixed(2)}`).join(' ')}"/>`; break; }
      case 'bar': body = `<rect x="${c - r * 1.3}" y="${c - r * 0.55}" width="${r * 2.6}" height="${r * 1.1}"/>`; break;
      case 'horse': { const rr = r * 0.95; body = `<polygon points="${HORSE.map(([px, py]) => `${(c + px * rr).toFixed(2)},${(c + py * rr).toFixed(2)}`).join(' ')}"/>`; break; }
      case 'spider': case 'sun': case 'flame': case 'spear': case 'imp': case 'knife': case 'drop': case 'dagger': { const rr = r * 0.95; body = FIGURES[shape].map(pt => pt.c
        ? `<circle cx="${(c + pt.c[0] * rr).toFixed(2)}" cy="${(c + pt.c[1] * rr).toFixed(2)}" r="${(pt.c[2] * rr).toFixed(2)}"/>`
        : `<polygon points="${pt.p.map(([px, py]) => `${(c + px * rr).toFixed(2)},${(c + py * rr).toFixed(2)}`).join(' ')}"/>`).join(''); break; }
      case 'ring': body = `<circle cx="${c}" cy="${c}" r="${r * 0.8}" fill="none" stroke="currentColor" stroke-width="${Math.max(1.5, r * 0.45)}"/>`; break;
      default: body = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
    }
    return `<svg class="shape-icon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="currentColor" aria-hidden="true">${body}</svg>`;
  }

  // A body: filled with the unit's colour, outlined in its team colour
  function body(ctx, shape, x, y, r, up, fill, team, fillAlpha = 1) {
    if (FIGURES[shape]) {
      // a picture made of parts: a thick team-coloured stroke underneath, so only its outer edge shows
      ctx.strokeStyle = team; ctx.lineWidth = Math.max(2, Math.min(3.5, r * 0.3)); ctx.lineJoin = 'round';
      path(ctx, shape, x, y, r, up); ctx.stroke(); ctx.lineJoin = 'miter';
      ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill; draw(ctx, shape, x, y, r, up); ctx.globalAlpha = 1;
      return;
    }
    ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill;
    draw(ctx, shape, x, y, r, up);
    ctx.globalAlpha = 1; ctx.strokeStyle = team; ctx.lineWidth = Math.max(1.5, Math.min(2.5, r * 0.32));
    outline(ctx, shape, x, y, shape === 'ring' ? r * 1.05 : r + 0.6, up);
  }

  return { IMP, LIST, tag, LABELS, PALETTE, valid, validColor, assign, draw, outline, path, svg, body };
})();

  const skillParam = (d, k) => {
    const v = d.params && d.params[k];
    if (v !== undefined && v !== null && v !== '') return v;
    const def = (SKILL_TYPES[d.type].params.find(p => p[0] === k) || [])[2];
    return def;
  };

  // One plain sentence describing what a skill does with its current settings. A skill can carry its own `text`, and
  // `also`: more effects (each { type, params }) that come with it, described after it
  function describeSkill(d) {
    if (!d || !SKILL_TYPES[d.type]) return '';
    if (typeof d.text === 'string' && d.text) return d.text;
    const own = describeOne(d);
    return Array.isArray(d.also) ? [own, ...d.also.map(describeSkill)].filter(Boolean).join(' ') : own;
  }
  function describeOne(d) {
    const P = (k) => skillParam(d, k);
    const n = (k) => { const v = +P(k); return isFinite(v) ? String(Math.round(v * 100) / 100) : '0'; };
    switch (d.type) {
      case 'regen': return `+${n('hp')}% health, and regains ${n('pct')}% of its max health every second.`;
      case 'poison': return `Hits poison the target for ${n('pct')}% of the hit over ${n('duration')} s, ignoring armor and ward. ${n('slow')}% more time between attacks.`;
      case 'stealth': return `Can’t be targeted until it attacks, and hides again after ${STEALTH_BACK} s without attacking. Splash and piercing shots can still hit it.`;
      case 'armorHp': return +P('hp') ? `+${n('armor')} armor and +${n('hp')}% health.` : `+${n('armor')} armor.`;
      case 'spawn': return `Every ${n('every')} s, spawns ${n('count')} ${String(P('unit'))} ${+P('count') === 1 ? 'body' : 'bodies'}, up to ${n('max')} alive at once${+P('waves') > 0 ? `, at most ${n('waves')} ${+P('waves') === 1 ? 'wave' : 'waves'} per fight` : ''}.`;
      case 'rapid': return `+${n('aps')}% attack speed, −${n('range')}% range.`;
      case 'swift': return +P('hit') ? `+${n('speed')}% move speed and +${n('hit')}% hit size.` : `+${n('speed')}% move speed.`;
      case 'heavy': return `Projectiles fly ${n('slow')}% slower (${n('instant')} m/s if it normally hits instantly), +${n('hit')}% hit size.`;
      case 'healer': return `Each attack heals a random wounded ally for ${n('pct')}% of its hit.`;
      case 'range': return `+${n('m')} m range.`;
      case 'shrink': return `Hits cut the target’s range by ${n('m')} m for ${n('duration')} s, but not below 1 m.`;
      case 'ward': return `No single hit can deal more than ${n('cap')} damage to it.`;
      case 'slow': return `Hits slow the target for ${n('duration')} s: −${n('move')}% move speed and −${n('attack')}% attack speed.`;
      case 'forward': return 'Squads of this unit can also be placed in no man’s land.';
      case 'split': return `Attacks ${n('beams')} different enemies at once${+P('hit') > 0 ? `, −${n('hit')}% hit each` : ''}. −${n('range')}% range.`;
      case 'deathSpawn': return `When a body dies, ${n('count')} ${String(P('unit'))} ${+P('count') === 1 ? 'body takes' : 'bodies take'} its place${+P('strength') !== 100 ? `, at ${n('strength')}% health and damage` : ''}. A spawn of the unit itself starts from the dead body's own stats. Spawns don’t spawn again.`;
      case 'blast': return `When a body dies it explodes, dealing ${+P('pct') === 100 ? 'the damage of its hit' : `${n('pct')}% of its hit`} (for a ram, what it deals to the tower) to every enemy within ${n('radius')} m.`;
      case 'explode': return `When a body dies it explodes for ${n('pct')}% of its max health, hurting every enemy within ${n('radius')} m.`;
      case 'dodge': return `Each hit has a ${n('pct')}% chance to miss it completely. Poison already on it still ticks.`;
      case 'lifesteal': return `Each body heals itself for ${n('pct')}% of the damage it deals.`;
      case 'turret': return `Each body attacks ${n('turrets')} different enemies at once, each attack with its own target and its own reload, as if it carried ${n('turrets')} copies of its weapon. They never aim at the same enemy, so with only one enemy in reach just one fires.`;
      case 'frenzy': return `Each hit it lands gives that body +${n('pct')}% attack speed for the rest of the fight, up to ${n('cap')} attacks per second.`;
      case 'spread': return `At the start of a fight the bodies scatter in all directions, ${n('min')} to ${n('max')} m from where they stand (some stay on the tile), then charge. Splash catches fewer of them.`;
      case 'mortar': return `+${n('range')} m range and +${n('aps')} attacks per second, but it can’t attack enemies ${n('min')} m away or closer.`;
      case 'shield': return `Each body fully blocks the first ${n('hits')} ${+P('hits') === 1 ? 'hit' : 'hits'} it takes in a fight, however big. Poison already on it still ticks.`;
      case 'building': return `Pick a free tile in your zone for a ${String(P('building'))}. Your nearest builder builds it during fights; once built it stays all match, and each round you can buy one of its own skills.`;
      case 'momentum': return `Gets up to full rolling speed ${n('accel')}% faster, so it rolls over its targets more often.`;
      case 'unfold': return 'Rolls in as usual, but once it has rolled through its first enemy it folds out into a walking unit: from then on it walks up to its target and hits it in melee, one enemy at a time. Same health and stats.';
      case 'link': return `+${n('hp')}% health, and the bodies of a squad share one health pool: damage to any of them is shared by all, and they fall together.`;
      case 'healbot': return `Each squad brings a healbot (${n('hp')} health) that follows it, never attacks, and heals every body of the squad within ${n('range')} m for ${n('pct')}% of its max health every second.`;
      case 'builder': {
        const parts = [];
        if (+P('extra') > 0) parts.push(`builds ${+P('extra') === 1 ? 'one more construct' : `${n('extra')} more constructs`} at once, ${BUILD_GAP} m apart`);
        if (+P('faster') > 0) parts.push(`builds ${n('faster')}% faster, its buildings too`);
        const c = [+P('aps') > 0 && `+${n('aps')}% attack speed`, +P('shield') > 0 && `a shield that blocks ${n('shield')} ${+P('shield') === 1 ? 'hit' : 'hits'}`, +P('armor') > 0 && `+${n('armor')} armor`].filter(Boolean);
        if (c.length) parts.push(`its constructs and what its buildings make get ${c.join(', ')}`);
        return parts.length ? parts.join('; ').replace(/^./, s => s.toUpperCase()) + '.' : 'No change.';
      }
      case 'stats': {
        const sg = (k, txt) => +P(k) ? `${+P(k) > 0 ? '+' : '−'}${String(Math.round(Math.abs(+P(k)) * 100) / 100)}${txt}` : null;
        const parts = [sg('hp', '% health'), sg('hit', '% hit size'), sg('hitAdd', ' hit size'), sg('aps', ' attacks per second'), sg('apsPct', '% attack speed'),
          sg('range', ' m range'), sg('splash', ' m splash'), sg('armor', ' armor'), sg('speed', ' m/s move speed'), sg('bodies', +P('bodies') === 1 ? ' body per squad' : ' bodies per squad')].filter(Boolean);
        if (+P('burst') > 0) parts.push(+P('burst') === 1 ? 'attacks twice in quick succession' : `attacks ${+P('burst') + 1} times in quick succession`);
        return parts.length ? parts.join(', ').replace(/^./, s => s.toUpperCase()) + '.' : 'No change.';
      }
      case 'double': return `${+P('hit') ? `+${n('hit')}% hit size, and e` : 'E'}very ${+P('every') === 2 ? 'second' : +P('every') === 3 ? 'third' : `${n('every')}th`} attack strikes twice in quick succession.`;
      case 'bleedDeep': return `Its bleed lasts ${n('secs')} s longer, and a unit bleeding from it can’t heal or regenerate until the bleed runs out.`;
      case 'bleedStun': return `An enemy its bleed brings to ${BLEED.max} stacks is stunned for ${n('secs')} s (not towers).`;
      case 'pools': return `+${n('splash')} m splash, −${n('aps')} attacks per second. Its attacks leave pools the size of their splash for the rest of the fight (pools can’t overlap): every second enemies in a pool take ${n('pct')}% of the hit and allies in it heal that much, and allies in it move ${n('speed')} m/s faster for ${n('secs')} s.`;
      case 'flow': return `Each attack it makes while standing still gives it +${n('aps')} attacks per second and +${n('range')} m range, up to ${n('max')} stacks. Moving takes them all away.`;
      case 'aura': return `${+P('armor') ? `+${n('armor')} armor. ` : ''}Allies within ${n('radius')} m get +${n('hit')} damage on every hit and +${n('aps')} attacks per second.`;
      case 'spears': return `Apart from its own attack, it spends 1 armor to forge a titanium spear (${n('forge')} s), then throws it at an enemy in reach (${n('speed')} m/s): ${n('hit')} damage${+P('bleed') > 0 ? ` and ${+P('bleed') === 1 ? 'a stack' : `${n('bleed')} stacks`} of bleed` : ''}. It keeps forging while it has armor left.`;
      case 'slam': return `+${n('armor')} armor, −${n('range')} m range. Its attack becomes a slam that hits every enemy in a cone in front of it for ${n('hit')} damage and stuns them for ${n('stun')} s (not towers).`;
      case 'burn': return `Its attacks burn: ${n('pct')}% of each hit lands at once and the rest burns over 3 s (most in the first second, least in the last), past armor. A new burn adds to what is still burning and starts the 3 s again.`;
      case 'roots': return `Each body grabs one enemy ${n('min')}–${n('max')} m away and drags it slowly toward itself (${n('pull')} m/s; it can still attack, but not walk), dealing ${n('dps')} damage a second. Once it is in reach the body attacks it and grabs another.`;
      case 'killStack': return `Each kill gives that body +${n('speed')} m/s move speed and +${n('aps')} attacks per second for the rest of the fight${+P('max') > 0 ? `, up to ${n('max')} stacks` : ''}.`;
      case 'killSpawn': return `Each kill brings ${+P('count') === 1 ? 'a new body' : `${n('count')} new bodies`} of it into the fight.`;
      case 'bull': return `Its first attack and every ${+P('every') === 3 ? 'third' : `${n('every')}th`} one after also send it charging through its target and ${n('run')} m on: ${n('hit')} damage to every enemy in its path, each knocked back ${n('push')} m. +${n('armor')} armor while it charges.`;
      case 'flare': return `Every second it doesn’t attack it stores ${n('per')}% attack speed (up to ${n('max')}%). Its next attack releases it as a burst: an extra shot in quick succession for every ${n('shot')}% stored.`;
      case 'portal': return `At the start of a fight each squad opens a portal and holds still for ${n('secs')} s, then sacrifices itself and a ${String(P('unit')) === 'Brute' ? 'Hellfiend' : String(P('unit'))} walks out to fight: a level ${+P('level') + 1} ${String(P('unit'))} with ${n('speed')} m/s move speed and a swipe in front of it, levelling up with the squad. If the whole squad falls first, nothing comes out.`;
      case 'overwatch': return `Can be placed in one of your buildings (your tower, treasury or buildings; one each): there it can’t be hit until the building falls. Placed anywhere else it fights from a small watchtower (${n('hp')} health).`;
      case 'freeMove': return 'Squads of it can be moved every round for free, as often as you like.';
      case 'silent': return 'Its first attack in a fight doesn’t give it away: it stays hidden.';
      case 'firstHit': return `Its first attack in a fight hits ${n('pct')}% harder.`;
      case 'flurry': return `Each attack is ${n('hits')} blows of ${n('hit')} damage in quick succession (${n('aps')} attacks per second). When a blow kills, it leaps to the nearest enemy within ${n('leap')} m for the next one.`;
      case 'windWalk': return `Each hit has a ${n('pct')}% chance to miss it completely. When one does, it dashes ${n('step')} m (a tile) straight back.`;
      case 'bounce': return `A shot that hits bounces on to the nearest other enemy within ${n('reach')} m for ${n('pct')}% of its damage, up to ${n('n')} ${+P('n') === 1 ? 'time' : 'times'}.`;
      case 'leafblade': return `It becomes a leaf-mech suit with two long leaf blades: +${n('hp')}% health, +${n('armor')} armor, and its attack becomes a spin that hits every enemy within ${n('range')} m (+${n('hit')}% hit). It dashes at enemies within ${n('dash')} m. At the start of a fight and every ${n('every')} s it fires ${n('missiles')} homing missiles at the nearest enemies, ${n('mhit')} damage each in a ${n('msplash')} m blast.`;
      case 'berserk': return `Can’t be slowed or displaced (slows, knockback, pushes and roots don’t take). When the fight starts it roars: enemies within ${n('radius')} m attack ${n('attack')}% slower and allies there move ${n('speed')}% faster, for the fight. Roars stack, up to ${n('max')}% on any one unit.`;
      case 'lone': return `Ignores enemies that share a tile with others and hunts lone ones. With no lone enemy left for ${n('secs')} s it fights as usual, until it kills a lone one again.`;
    }
    return '';
  }

  // A unit with skills applied. defs = the skill definitions that are active; roster = all units (for spawns).
  function applySkills(unit, defs, roster) {
    let u = withTraits(unit);
    for (const d of defs || []) {
      if (!d || !SKILL_TYPES[d.type]) continue;
      const P = (k) => { const v = +skillParam(d, k); return isFinite(v) ? v : 0; };
      switch (d.type) {
        case 'regen': u.regen = (u.regen || 0) + Math.max(0, P('pct')); u.hp = u.hp * (1 + P('hp') / 100); break;
        case 'poison':
          u.poisonPct = (u.poisonPct || 0) + Math.max(0, P('pct'));
          u.poisonDur = Math.max(u.poisonDur || 0, Math.max(0.5, P('duration')));
          u.aps = u.aps / (1 + Math.max(0, P('slow')) / 100);
          break;
        case 'stealth': u.stealth = true; break;
        case 'armorHp': u.bonusArmor = (u.bonusArmor || 0) + Math.max(0, P('armor')); u.hp = u.hp * (1 + P('hp') / 100); break;
        case 'spawn': {
          const name = String(skillParam(d, 'unit'));
          const src = (roster || []).find(r => r && r.name === name);
          if (src) {
            const { skills, skillDefs, skillsOn, ...plain } = src;
            u.spawn = { unit: withTraits({ ...plain, level: 0 }), count: Math.max(1, Math.round(P('count'))), every: Math.max(0.5, P('every')), max: Math.max(1, Math.round(P('max'))), waves: Math.max(0, Math.round(P('waves'))) };
          }
          break;
        }
        case 'rapid': u.aps = u.aps * (1 + P('aps') / 100); u.range = Math.max(0.5, u.range * (1 - Math.min(90, P('range')) / 100)); break;
        case 'swift': u.speed = u.speed * (1 + P('speed') / 100); u.hit = u.hit * (1 + P('hit') / 100); break;
        case 'heavy':
          u.projSpeed = u.projSpeed > 0 ? Math.max(2, u.projSpeed * (1 - Math.min(90, P('slow')) / 100)) : Math.max(2, P('instant'));
          u.hit = u.hit * (1 + P('hit') / 100);
          break;
        case 'healer': u.healPct = (u.healPct || 0) + Math.max(0, P('pct')); break;
        case 'range': u.range = u.range + P('m'); break;
        case 'shrink': u.shrinkM = Math.max(u.shrinkM || 0, P('m')); u.shrinkDur = Math.max(u.shrinkDur || 0, Math.max(0.5, P('duration'))); break;
        case 'ward': { const c = Math.max(1, P('cap')); u.bonusWard = u.bonusWard ? Math.min(u.bonusWard, c) : c; break; }
        case 'slow':
          u.slowMove = Math.max(u.slowMove || 0, Math.min(90, P('move')));
          u.slowAtk = Math.max(u.slowAtk || 0, Math.min(90, P('attack')));
          u.slowDur = Math.max(u.slowDur || 0, Math.max(0.5, P('duration')));
          break;
        case 'deathSpawn': {
          const name = String(skillParam(d, 'unit'));
          const src = (roster || []).find(r => r && r.name === name);
          if (src) {
            const { skills, skillDefs, skillsOn, ...plain } = src;
            u.deathSpawn = { name, unit: withTraits({ ...plain, level: 0 }), count: Math.max(1, Math.round(P('count'))), strength: Math.max(1, P('strength')) / 100 };
          }

    // Bouncing blade: from body v the shot flies on (homing, as fast as the unit's shots) to the nearest other enemy

      if (p.missile && p.splash > 0) {
        if (opts.record) shots.push([p.x, p.y, p.x, p.y, p.owner.side, p.splash, 1, 0, 0]);

    // a thrown titanium spear lands: its hit to the nearest enemy body within reach of where it is, and its bleed

        b.lock = g.aware2 ? (valid.find(f => (f.claimDmg || 0) < f.hp) || valid[0]) : valid[0];

    // keeping its current one unless another is clearly better. null: nobody in sight (it goes for the nearest, as before)
    function goalOf(b, rg) {
      const aware = Math.max(rg + sight, minSight), melee = rg <= AWARE.melee;
      let best = null, bc = Infinity;
      for (const f of sides[1 - b.side]) {
        if (!pickable(b, f)) continue;

        if (d > aware * (mine ? AWARE.leash : 1)) continue;

        else c += ((f.claimsR || 0) - (mine ? 1 : 0)) * 0.5;

    }

    // one shot, or a spread of shotgun pellets each at a different body in the cone
    function aim(b, primary, valid) {
      if (b.u.flame > 0) return flameTargets(b, primary);

      if (n === 1 && b.u.beams > 1) {

        const out = [primary];

    }

    // flame cone: every enemy in range inside the cone toward the target, hidden ones too
    function flameTargets(b, primary) {
      const ax = primary.x - b.x, ay = primary.y - b.y, al = hyp(ax, ay);
      const c = cosDeg(b.u.flame), reach = reachOf(b) + 0.01;
      const out = [];
      for (const f of sides[1 - b.side]) {
        if (!f.alive) continue;

    // a roller's turn (see ROLL_START): marches like any unit until it spots an enemy, then rolls at its target

        if (tgt) { const d = dist(tgt, b) || 1; wx = (tgt.x - b.x) / d; wy = (tgt.y - b.y) / d; }

        const src = brutes ? unitFor(m, side, bi) : (m.units || []).find(x => x && x.name === 'Wisps') || GUARD;
        const { skills, skillDefs, skillsOn, skillsInnate, skillMods, ...plain } = src;
        const gu = E.withTraits({ ...plain, name: brutes ? 'Brute Guard' : 'Guard', level: 0, bodies: TOWER_SKILL.guards, ...(brutes ? {} : { shape: 'diamond' }), color: '#E2D3A6' });
        const gb = E.buildSquad(gu, side, w.x, w.y, -3, TILE, idx), fwd = side === 0 ? 1 : -1, off = TILE * 0.6;
        const posts = [[0, fwd], [-1, 0], [1, 0], [0, -fwd]]; // front, the two sides, behind
        gb.forEach((x, k) => { const [px, py] = posts[k % posts.length]; x.x = w.x + px * off; x.y = w.y + py * off; x.holdT = TOWER_SKILL.guardHold; x.guard = true; });
        idx += gb.length; out.push(...gb);
      }
      // Deploy airship (sniper tower's second skill): flies from the tower, shoots like it, drops guards as paratroopers
      if (airship) {
        const { skills, skillDefs, skillsOn, skillsInnate, skillMods, ...plain } = (m.units || []).find(x => x && x.name === 'Wisps') || GUARD;
        const para = E.withTraits({ ...plain, name: 'Paratrooper', level: 0, bodies: 1, shape: 'diamond', color: '#E2D3A6' });
        const au = E.withTraits({ ...tu, name: 'Airship', kind: 'airship', structure: false, aloft: true, hp: 1, speed: AIRSHIP.speed, hover: AIRSHIP.hover,
          spawn: { unit: para, count: 1, every: AIRSHIP.every, max: AIRSHIP.max, waves: 0 } });
        const aw = tileToWorld(t.col, side === 0 ? ROWS - ZONE - 1 : ZONE); // it takes off from the front row of its side's half of no man's land
        const ab = E.buildSquad(au, side, aw.x, aw.y, -4, TILE, idx);
        idx += ab.length; out.push(...ab);
      }
    }
    // devtest: lesser buildings and walls (spells) stand on their tiles; squad ids LESSER_SQ - key, WALL_SQ - cast index
    if (isDev(m)) {
      for (const bd of placedLessers(m, side)) {
        const w = tileToWorld(bd.col, bd.row), bb = E.buildSquad(lesserUnit(m, side, bd), side, w.x, w.y, LESSER_SQ - bd.key, TILE, idx);
        idx += bb.length; out.push(...bb);
      }
      casts(m).forEach((c, k) => {
        const sp = devSpell(c.id) || {};
        if (c.side !== side || sp.kind !== 'wall' || !castActive(m, c)) return;
        const wu = E.withTraits({ name: sp.name || 'Wall', cost: 0, bodies: 1, hp: +sp.hp || 600, hit: 0, aps: 1, range: 0, speed: 0, splash: 0, shape: 'square', color: '#9C8F7A', structure: true, lesser: true, kind: 'wall', level: 0 });
        const w = tileToWorld(c.col, c.row), wb = E.buildSquad(wu, side, w.x, w.y, WALL_SQ - k, TILE, idx);
        idx += wb.length; out.push(...wb);
      });
    }
    if (treasuryUp(m)) {
      const ts = treasurySpot(m, side), w = tileToWorld(ts.col, ts.row), tb = E.buildSquad(treasuryUnit(), side, w.x, w.y, TREASURY_SQ, TILE, idx);
      idx += tb.length; out.push(...tb);
    }
    // Defensive walls (bastion's second skill)
    if (towerSkill2On(m, side, 'bastion')) bwallsOf(m, side).forEach((bw, k) => {
      const w = bwallWorld(side, bw), wb = E.buildSquad(bwallUnit(edgeOf(side, bw)), side, w.x, w.y, BWALL_SQ - k, TILE, idx);
      idx += wb.length; out.push(...wb);
    });
    // buildings (the Mechites' Factory)
    const bb = buildingBodies(m, side, idx);
    idx += bb.length; out.push(...bb);
    // Overwatch: a squad on a building's tile sits in it; any other squad of it gets a watchtower of its own
    let watch = 0;
    for (const sq of m.armies[side]) {
      if (isRider(sq)) continue;
      const mine = out.filter(x => x.squad === sq.id && x.u.overwatch);
      if (!mine.length) continue;
      const w = tileToWorld(sq.col, sq.row);
      let host = inBuilding(m, side, sq) ? out.find(x => (x.u.structure || x.u.building) && !x.u.aloft && Math.abs(x.x - w.x) < 0.5 && Math.abs(x.y - w.y) < 0.5) : null;
      if (!host) {
        [host] = E.buildSquad(watchUnit(mine[0].u.overwatch.hp), side, w.x, w.y, WATCH_SQ - watch++, TILE, idx);
        idx++; out.push(host);
      }
      for (const x of mine) { x.inside = host; x.x = host.x; x.y = host.y; x.delay = 0; }
    }
    // Snowgres stand on their own tiles in no man's land; squad ids -10, -11, ... (not squads in the army)
    snowgres(m, side).forEach((sg, k) => {
      const w = tileToWorld(sg.col, sg.row), b = E.buildSquad(snowgreUnit(m, sg.strength), side, w.x, w.y, -10 - k, TILE, idx);
      idx += b.length; out.push(...b);
    });
    // Yot-Yot's imps: single Ember Imp bodies on random free tiles, squad id YOT_SQUAD (not squads in the army)
    const yot = yotImps(m, side);
    if (yot.length) {
      const ui = m.units.findIndex(u => u && u.name === CHAR.yotUnit);
      const iu = { ...unitFor(m, side, ui), bodies: 1, portal: null }; // one body each: no hellfiend portal (that's a squad's)
      for (const t of yot) {
        const w = tileToWorld(t.col, t.row), b = E.buildSquad(iu, side, w.x, w.y, YOT_SQUAD, TILE, idx, yotLevel(m));
        idx += b.length; out.push(...b);
      }
    }
    return out;
  }

  // the range a squad fights at (its skills, Eagle eye, the map's range cut), as bodiesFor works it out.
  // pub: as the opponent can know it (skills and a tower skill bought this round left out)
  function squadRange(m, side, sq, pub) {
    const ui = sq.unit, base = m.units[ui];
    let u = unitFor(m, side, ui, sq);
    if (pub) { const defs = E.SLOTS.filter(k => skillVisible(m, side, ui, k)).map(k => skillDef(m, ui, k)); u = withFactionTrait(defs.length ? E.applySkills(base, defs, m.units) : E.withTraits(base), base.faction); }
    let r = u.range;
    if (u.name === 'Sniper' && towerSkillOn(m, side, 'sniper') && (!pub || towerSkillVisible(m, side))) r += TOWER_SKILL.eagleRange;
    const mp = mapOf(m);
    if (mp && mp.rangeCut && r > mp.rangeKeep) r = Math.max(mp.rangeKeep, r * (1 - mp.rangeCut / 100));
    return mapTuned(mp, { name: u.name, range: r, speed: u.speed }).range;
  }

  // ---------- Yot-Yot's imps ----------
  // At the start of every fight, one Ember Imp per round number on random free tiles on the player's side of the
  // board: their zone, all of no man's land and (once flanks are open) their own flank tiles. Seeded from the
  // match and round, so both phones get the same tiles.
  const YOT_SQUAD = -100;
  const yotLevel = (m) => m.round >= CHAR.yotLv3 ? 2 : m.round >= CHAR.yotLv2 ? 1 : 0;
  function yotImps(m, side) {
    if (charOf(m, side) !== 'yotyot' || !m.units.some(u => u && u.name === CHAR.yotUnit)) return [];
    const taken = (col, row) => [0, 1].some(sd => occupied(m, sd, col, row)) || snowgres(m, 0).concat(snowgres(m, 1)).some(g => g.col === col && g.row === row);
    const spots = [];
    for (let row = 0; row < ROWS; row++) for (let col = 0; col < COLS; col++) {
      if (reserved(side, col, row) || taken(col, row)) continue;
      if (inZone(side, row) || inNoMans(row) || (flankOpen(m) && isFlank(side, col, row))) spots.push({ col, row });
    }
    const r = rng(m.seed + m.round * 7307 + side * 2903 + 41), out = [];
    for (let k = 0; k < m.round && spots.length; k++) out.push(spots.splice(Math.floor(r() * spots.length), 1)[0]);
    return out;
  }

  // ---------- Zoe's buff tiles ----------
  // Rolled at the start of every round (and when Zoe is picked): random free-standing tiles in her zone,
  // never the tower's tile. Seeded from the match, so both phones get the same tiles.
  function rollBuffTiles(m, side) {
    if (!m.buff) m.buff = [[], []];
    m.buff[side] = [];
    if (charOf(m, side) !== 'zoe') return;
    const r = rng(m.seed + m.round * 6151 + side * 3571 + 99);
    const spots = [];
    for (const row of zoneRows(side)) for (let col = 0; col < COLS; col++) if (!reserved(side, col, row) && !towerAt(m, side, col, row) && !treasuryAt(m, side, col, row) && !shroomAt(m, col, row)) spots.push({ col, row });
    for (let k = 0; k < CHAR.zoeTiles && spots.length; k++) m.buff[side].push(spots.splice(Math.floor(r() * spots.length), 1)[0]);
  }
  const onBuffTile = (m, side, col, row) => charOf(m, side) === 'zoe' && !!(m.buff && m.buff[side] || []).some(t => t.col === col && t.row === row);
  // The buff grows with use: m.zoeUses[side] = fights in which a squad started on one of her tiles (see resolve).
  // Returns the bonus in percent for this round's fight: { dmg, hp, aps }
  const zoeBuff = (m, side) => {
    const lv = Math.min(CHAR.zoeDmg.length - 1, (m && m.zoeUses && m.zoeUses[side]) || 0);
    return { dmg: CHAR.zoeDmg[lv], hp: CHAR.zoeHp[lv], aps: CHAR.zoeAps[lv] };
  };

  function startBattle(m) {
    ensureTower(m, 0); ensureTower(m, 1);
    settleTowerPicks(m);
    ensureBwalls(m, 0); ensureBwalls(m, 1);
    ensurePack(m, 0); ensurePack(m, 1);
    ensureCharm(m, 0); ensureCharm(m, 1);
    settleDev(m);
    const mp = mapOf(m), elf = elfSpot(m);
    let g = { ...SETTINGS, bounds: { ...BOUNDS }, ...(mp && mp.healMul ? { healMul: mp.healMul } : {}) };
    if (m.rules) g = { ...g, rules: m.rules }; // the roster's rules (a Counter Lab roster can switch mechanics off)
    const T2 = TILE / 2, tiles = [];
    if (mp && mp.shrooms) for (const t of m.map.tiles || []) {
      if (t.type === 'purple' || shroomRemoval(m, t.col, t.row)) continue; // purple only counts for squads that start there (see bodiesFor)
      const w = tileToWorld(t.col, t.row);
      tiles.push(t.type === 'yellow' ? { type: 'speed', speed: SHROOM.speed, x0: w.x - T2, x1: w.x + T2, y0: w.y - T2, y1: w.y + T2 }
        : { type: 'toxic', poisonPct: SHROOM.poisonPct, poisonDur: SHROOM.poisonDur, slowMove: SHROOM.slowMove, slowAtk: SHROOM.slowAtk, slowDur: SHROOM.slowDur, x0: w.x - T2, x1: w.x + T2, y0: w.y - T2, y1: w.y + T2 });
    }
    for (const h of hailTiles(m)) { const w = tileToWorld(h.col, h.row); tiles.push({ type: 'hail', dps: ICE.hailDps, x0: w.x - T2, x1: w.x + T2, y0: w.y - T2, y1: w.y + T2 }); }
    const fx = isDev(m) ? castEffects(m) : { tiles: [], strikes: [] }; // devtest spells
    tiles.push(...fx.tiles);
    if (isDev(m) && DEV.awareness) g = { ...g, aware2: true, ...(DEV.awareLane != null ? { awareLane: DEV.awareLane } : {}) };
    const neutrals = elf ? [{ u: elfUnit(m), x: elf.x, y: elf.y, friends: [bribeLeader(m) === 0, bribeLeader(m) === 1] }] : [];
    for (const side of [0, 1]) { const e = elfOwnOf(m, side); if (e) { const w = tileToWorld(e.col, e.row); neutrals.push({ u: elfUnit(m), x: w.x, y: w.y, friends: [side === 0, side === 1], side }); } }
    return E.createBattle(bodiesFor(m, 0), bodiesFor(m, 1), g, { record: true, tiles, strikes: fx.strikes, neutrals, charm: [charmMap(m, 0), charmMap(m, 1)] });
  }

  // Damage a side deals = points of its squads, scaled by how much of each squad is still alive.
  // TIER_DMG: a share for the squads of a tier (tier 3 squads deal 25% less than their price would)
  const TIER_DMG = { 3: 0.75 };
  function survivorDamage(m, res, side) {
    let sum = 0;
    for (const k in res.squads) {
      const s = res.squads[k];
      if (s.side !== side || s.alive <= 0) continue;
      if (s.squad <= -10 && s.squad > YOT_SQUAD) { const sg = snowgres(m, side)[-10 - s.squad]; if (sg) sum += SQUAD_POINTS * GOLEM.cost * sg.strength * s.alive / s.total; continue; } // a Snowgre
      if (s.squad < 0) continue; // spawned bodies don't count
      const sq = m.armies[side].find(q => q.id === s.squad);
      if (sq && m.units[sq.unit].building) continue; // nor do buildings
      const value = sq ? (m.units[sq.unit].cost || 1) * (TIER_DMG[tierOf(m.units, sq.unit)] || 1) : 1; // pricier squads hit harder, like their price
      sum += SQUAD_POINTS * value * s.alive / s.total;
    }
    return sum > 0 ? Math.min(MAX_ROUND_DMG, Math.max(1, Math.round(sum))) : 0; // at most MAX_ROUND_DMG per round
  }

  // Apply a finished battle to the match. Returns a summary for the results screen.
  function resolve(m, res) {
    const dmg = [0, 0]; // damage taken by each side
    // Zoe: a fight with a squad on one of her buff tiles makes the buff stronger from the next round on
    if (!m.zoeUses) m.zoeUses = [0, 0];
    for (const sd of [0, 1]) if (m.armies[sd].some(sq => onBuffTile(m, sd, sq.col, sq.row))) m.zoeUses[sd]++;
    let roundWinner = res.winner;
    if (res.timeout) {
      dmg[0] = survivorDamage(m, res, 1);
      dmg[1] = survivorDamage(m, res, 0);
    } else if (res.winner === 0) dmg[1] = survivorDamage(m, res, 0);
    else if (res.winner === 1) dmg[0] = survivorDamage(m, res, 1);
    m.hp[0] = Math.max(0, m.hp[0] - dmg[0]);
    m.hp[1] = Math.max(0, m.hp[1] - dmg[1]);
    // experience carries over between rounds; squads that reach the next threshold become ready to level up
    const newlyReady = [[], []];
    for (let side = 0; side < 2; side++) {
      for (const sq of m.armies[side]) {
        const r = res.squads[side + ':' + sq.id];
        if (!r) continue;
        const was = isReady(m, sq);
        sq.xp += r.xp;
        if (!was && isReady(m, sq)) newlyReady[side].push({ id: sq.id, unit: sq.unit, level: sq.level + 1 });
      }
    }
    // how each squad did: share of bodies left and damage dealt (for reports and Claude)
    const squads = [[], []];
    for (let side = 0; side < 2; side++) for (const sq of m.armies[side]) {
      const r = res.squads[side + ':' + sq.id];
      if (r) squads[side].push({ id: sq.id, unit: sq.unit, level: sq.level, left: r.alive / r.total, dealt: Math.round(r.dealt || 0) });
    }
    const towerFell = [0, 1].map(sd => { const q = res.squads[sd + ':-2']; return !!(q && q.alive === 0); });
    const treasuryFell = [0, 1].map(sd => { const q = res.squads[sd + ':' + TREASURY_SQ]; return q ? q.alive === 0 : null; }); // null: no treasury in this fight
    const buildingNews = settleBuildings(m, res);
    // Matteo: the squads keep the charisma they ended the fight with; note the ones that became Gentlemen
    const gentlemen = [[], []];
    for (let side = 0; side < 2; side++) {
      const c = res.charm && res.charm[side];
      if (!c) continue;
      for (const sq of m.armies[side]) {
        const was = isGentleman(sq);
        if (c[sq.id] > 0) sq.charm = c[sq.id];
        if (!was && isGentleman(sq)) gentlemen[side].push({ id: sq.id, unit: sq.unit });
      }
    }
    // damage each side dealt in the fight, by unit type ('u' + unit index) and by what isn't a squad: 'tower' (with its
    // name, as it was in this fight), 'guards', 'airship', 'snowgre', 'yot' (Yot-Yot's imps), 'won' (bodies won over
    // by a Gentleman) and 'spawn' (anything spawned in the fight). For the damage stats dropdown.
    const dealtBy = [0, 1].map(sd => {
      const by = {};
      for (const k in res.squads) {
        const q = res.squads[k];
        if (q.side !== sd) continue;
        const sq = q.squad >= 0 && m.armies[sd].find(x => x.id === q.squad);
        const key = sq ? 'u' + sq.unit : q.squad === -2 ? 'tower' : q.squad === -3 ? 'guards' : q.squad === -4 ? 'airship' : q.squad === YOT_SQUAD ? 'yot'
          : q.squad === E.CONVERT_SQUAD ? 'won' : q.squad <= -10 && q.squad > YOT_SQUAD ? 'snowgre'
          : q.squad <= BUILDING_SQUAD && buildingsOf(m, sd)[BUILDING_SQUAD - q.squad] ? 'b:' + buildingsOf(m, sd)[BUILDING_SQUAD - q.squad].id : q.squad < 0 ? 'spawn' : null;
        if (!key || (!sq && !(q.dealt > 0))) continue; // squads always show; the rest only if they dealt damage
        by[key] = (by[key] || 0) + (q.dealt || 0);
      }
      return Object.keys(by).map(key => ({ key, dealt: Math.round(by[key]), ...(key === 'tower' ? { name: towerType(m, sd).name } : key.startsWith('b:') ? { name: (buildingInfo(key.slice(2)) || {}).name || 'Building' } : {}) }));
    });
    const summary = { round: m.round, winner: roundWinner, timeout: res.timeout, dmg, time: res.time, newlyReady, squads, towerFell, treasuryFell, gentlemen, converted: res.converted || [0, 0], dealtBy, buildings: buildingNews };
    // devtest: buildings destroyed in the fight cost their owner what their onDestroyed says (health now, gold below)
    if (isDev(m)) {
      summary.devLoss = [0, 1].map(sd => {
        const out = { hp: 0, gold: 0, fell: [] };
        for (const bd of placedLessers(m, sd)) {
          const q = res.squads[sd + ':' + (LESSER_SQ - bd.key)];
          if (!q || q.alive > 0) continue;
          const od = (devBuilding(bd.id) || {}).onDestroyed || {};
          out.hp += Math.max(0, Math.round(+od.hp || 0)); out.gold += Math.max(0, Math.round(+od.gold || 0)); out.fell.push(bd.id);
        }
        m.hp[sd] = Math.max(0, m.hp[sd] - out.hp);
        return out;
      });
    }
    m.history.push(summary);
    if (m.hp[0] <= 0 || m.hp[1] <= 0) {
      m.over = true;
      m.winner = m.hp[0] > 0 ? 0 : m.hp[1] > 0 ? 1 : -1;
      return summary;
    }
    // next round
    m.round++;
    m.extraDeploys = [0, 0];
    m.moved = [null, null];
    for (const a of m.armies) for (const sq of a) { delete sq.from; delete sq.movedRound; }
    rollBuffTiles(m, 0); rollBuffTiles(m, 1);
    const income = incomeFor(m.round), before = m.gold.slice();
    m.gold[0] += income; m.gold[1] += income;
    summary.income = income;
    summary.felix = [0, 1].map(sd => felixGold(m, sd));
    for (const sd of [0, 1]) m.gold[sd] += summary.felix[sd];
    if (isDev(m)) { // devtest: Powers' gold and buildings' income in, destroyed buildings' gold out
      summary.devGold = [0, 1].map(sd => devGold(m, sd));
      for (const sd of [0, 1]) m.gold[sd] = Math.max(0, m.gold[sd] + summary.devGold[sd] - summary.devLoss[sd].gold);
    }
    const loser = dmg[0] > dmg[1] ? 0 : dmg[1] > dmg[0] ? 1 : -1;
    if (loser >= 0) m.gold[loser] += LOSER_BONUS;
    summary.bonusTo = loser;
    // treasuries: one that stood through the fight pays its owner; a destroyed one lets the opponent steal from its owner
    summary.treasury = [0, 1].map(sd => ({ gold: treasuryFell[sd] === false ? TREASURY.gold : 0, lost: 0 }));
    for (const sd of [0, 1]) m.gold[sd] += summary.treasury[sd].gold;
    for (const sd of [0, 1]) if (treasuryFell[sd]) {
      const take = Math.min(TREASURY.steal, m.gold[sd]);
      m.gold[sd] -= take; m.gold[1 - sd] += take;
      summary.treasury[sd].lost = take; summary.treasury[1 - sd].stole = take;
    }
    // Major investment (bank) bought in the round just fought pays out now
    summary.invest = [0, 1].map(sd => m.towerSkill2 && m.towerSkill2[sd] === m.round - 1 && towerType(m, sd).id === 'bank' ? INVEST.gold : 0);
    for (const sd of [0, 1]) m.gold[sd] += summary.invest[sd];
    // a bank loan taken in the round just fought is paid back out of this round's gold (never below nothing)
    summary.loan = [0, 1].map(sd => {
      if (!(m.loan && m.loan[sd] === m.round - 1)) return 0;
      const cut = Math.min(LOAN.payback, m.gold[sd] - before[sd]);
      m.gold[sd] -= cut;
      return cut;
    });
    return summary;
  }

  // Felix: extra gold every round from CHAR.felixRound on, more from CHAR.felixRound2 on (on top of the income)
  const felixGold = (m, side, round = m.round) => charOf(m, side) !== 'felix' ? 0 : round >= CHAR.felixRound2 ? CHAR.felixGold2 : round >= CHAR.felixRound ? CHAR.felixGold : 0;

  // ---------- leveling (manual, costs gold) ----------
  const isReady = (m, sq) => sq.level < E.MAX_LEVEL && sq.xp >= xpNeeded(m.units[sq.unit], sq.level) && !(m.units[sq.unit].building && !sq.built); // a building levels once built

  function levelUp(m, side, sqId) {
    const sq = m.armies[side].find(s => s.id === sqId);
    if (!sq || !isReady(m, sq)) return false;
    const cost = levelCost(m.units[sq.unit]);
    if (m.gold[side] < cost) return false;
    m.gold[side] -= cost;
    sq.level++;
    (sq.boughtLevels = sq.boughtLevels || {})[m.round] = ((sq.boughtLevels || {})[m.round] || 0) + 1;
    return true;
  }

  // the level the opponent sees: levels bought this round stay hidden until the fight
  const seenLevel = (m, sq) => Math.max(0, (sq.level || 0) - ((sq.boughtLevels && sq.boughtLevels[m.round]) || 0));

  // Undo a level bought this round (full refund)
  function undoLevel(m, side, sqId) {
    const sq = m.armies[side].find(s => s.id === sqId);
    if (!sq || !sq.boughtLevels || !sq.boughtLevels[m.round]) return false;
    sq.boughtLevels[m.round]--;
    sq.level--;
    m.gold[side] += levelCost(m.units[sq.unit]);
    return true;
  }

  // AI levels up at fight time, using only what it knew at the start of the round.
  // It skips chaff (8+ bodies): feeding leveled chaff to the enemy gives away XP.
  function aiLevel(m, side) {
    const done = [];
    if (AI.levelPolicy === 'never') return done;
    const ready = m.armies[side].filter(s => isReady(m, s))
      .sort((a, b) => E.withTraits(m.units[b.unit]).range - E.withTraits(m.units[a.unit]).range);
    for (const sq of ready) {
      const u = m.units[sq.unit];
      if (AI.levelPolicy === 'smart' && u.bodies >= 8) continue;

//

// close to the ground. In a cinematic view you can only look around: drag to move, twist (or right/middle drag, Q/E) to rotate, and a tap
// goes back to the strategic view.

//          nearest level when they lift.

// those names gets that model too. A faction's tower (Factions mode) is one tower model in the faction's colour. height(kind): the top of the model, for markers above it.
// parts(kind) gives up to three geometries, drawn as separate instanced meshes so each can be coloured per body:
//   tint  - takes the unit's own colour (its clothes or hide), as the 2D board fills the shape with it
//   team  - takes the side's colour (shields, banners, sashes)

  }

  // ---------- the tile under the pointer (view().hoverTile), in the strategic view ----------
  // model column / row <-> the board as this side sees it (the flip is its own inverse)
  const screenTile = (me, col, row) => me === 1 ? { col: Game.COLS - 1 - col, row: Game.ROWS - 1 - row } : { col, row };
  function tileOfGround(p, me) {
    if (!p) return null;
    const x = (p.x + BW / 2) / T, z = (p.z + BD / 2) / T, c = Math.floor(x), r = Math.floor(z);
    if (c < 0 || r < 0 || c >= Game.COLS || r >= Game.ROWS) return null;
    const fx = x - c, fy = z - r; // where in the tile (for a wall's edge), in model terms
    return { ...screenTile(me, c, r), fx: me === 1 ? 1 - fx : fx, fy: me === 1 ? 1 - fy : fy };
  }

  // ---------- what a finger points at ----------
  // In the angled view a model stands above its tile, so a touch on its body meets the ground behind it. Follow the
  // touch down from the height of the tallest model: the first squad model it passes through gives the tile; else
  // the tile on the ground.
  function pick(p, cx, cy) {
    const t = tileOfGround(p, lastMe);
    if (cx == null || viewMode === 'strategic' || !models_.length) return t;
    const top = Math.max(...models_.map(b => b[3]));
    for (let h = top; h > 0.1; h -= 0.25) {
      const q = cam.groundAt(cx, cy, h); if (!q) continue;
      for (const [x, z, r, mh, col, row] of models_) if (h <= mh && Math.hypot(q.x - x, q.z - z) < r * 0.75) return { col, row };
    }

  }

  // ---------- camera ----------
  let lastMe = 0;
  const cam = Camera3D(THREE, camera, renderer.domElement, {
    width: BW, depth: BD,
    onTap: (p, cx, cy) => { if (opts.onTap) opts.onTap(pick(p, cx, cy)); },
    // a press on a squad never moves the camera: one the page doesn't drag is held still, as on the 2D board
    onPress: (p, cx, cy) => { const t = pick(p, cx, cy); return !!(opts.onPress && opts.onPress(t)) || !!(t && squadTiles.has(t.col + ',' + t.row)); },
    onDrag: (p) => { if (opts.onDrag) opts.onDrag(tileOfGround(p, lastMe)); },
    onDrop: (p) => { if (opts.onDrop) opts.onDrop(tileOfGround(p, lastMe), !!p); },
    onHover: (p) => { if (opts.onHover) opts.onHover(tileOfGround(p, lastMe)); },
    placing: () => !!(opts.placing && opts.placing()),
    onLevel: (lv) => { if (opts.onLevel) opts.onLevel(lv); },

  // ---------- the calls ----------
  function sizeTo() {
    const r = el.getBoundingClientRect();

  let last = 0, camOn = false; // camOn: the battle cam has the camera
  function draw() {
    const now = performance.now(), dt = last ? Math.min(0.1, (now - last) / 1000) : 0.016; last = now;
    clock += dt;

    paintFloor(v, dt);
    used.clear(); ns = 0;
    placeBodies(v, dt);
    drawFx(v);
    if (v.hoverTile && cam.handsOn() && !(v.selected !== null || v.moving != null)) { const s = screenTile(v.me, v.hoverTile.col, v.hoverTile.row); tileSq(s.col, s.row, color(css('--you') || '#5CC6DF'), 0.35, 1, 0, 0.03); }
    drawBeams(); drawWalls();

    sprGeo.instanceCount = ns;
    for (const a of Object.values(sprAttr)) { a.clearUpdateRanges(); a.addUpdateRange(0, ns * a.itemSize); a.needsUpdate = true; }
    showNote(uiOff ? {} : v);

    scene.fog.near = 400 - 310 * near; scene.fog.far = 600 - 380 * near;

  // the tile a touch there picks (a squad's model in front of the ground wins, see pick()), for checks
  const pickAt = (clientX, clientY) => pick(cam.groundAt(clientX, clientY), clientX, clientY);
  // where the middle of a tile (model column / row), h metres above the ground, is on the screen: [clientX, clientY]
  const scrV = new THREE.Vector3();
  function screenAt(col, row, h = 0) {
    const f = view().me === 1 ? -1 : 1, w = Game.tileToWorld(col, row), r = renderer.domElement.getBoundingClientRect();
    scrV.set(w.x * f, h, -w.y * f).project(camera);

  function quality(q) {

  // for checks: what the last frame drew of each body (its unit's name, kind, shape and colour, side, look, coat of
  // arms and its edge, whether it got markers)
  const drawn = () => bodies.map(s => ({ name: s.u.name || null, kind: s.u.kind || null, shape: s.u.shape || null, color: s.u.color || null,
    side: s.side, look: s.look, crest: s.crest || null, edge: s.edge || null, structure: !!s.u.structure, building: s.u.building || null, spire: !!s.u.spire, aloft: !!s.u.aloft, marked: !!s.marked }));

    still: () => !cam.busy(), quality, pixelRatio: () => renderer.getPixelRatio(), dispose, drawn, screenAt, pickAt };
};

// ===== 3D test page: real battles from the engine on the 3D board, to try the camera, the models and the renderer =====
// The page only runs the match; the drawing is src/render3d.js, which sees it through view() just as the game's 2D
// board does. Battle effects (fx) are made the same way as in the game.
// You deploy blue (or leave it to the AI): pick a unit in the shop and tap a tile in the strategic view, tap a squad
// from this round to take it back, drag it to move it, and in round 1 place the tower first. Red is always the AI.
const $ = (id) => document.getElementById(id);
const units = Shapes.assign(DATA.units).map(u => ({ ...Engine.withTraits(u), level: 0, bodies: Math.max(1, Math.round(u.bodies)), skillDefs: Engine.SLOTS.map(() => null) }));
const touch = matchMedia('(pointer: coarse)').matches;

// ---------- the match: AI armies on both sides; a fight is the engine's real battle ----------
let m = null, bt = null, phase = 'deploy', fx = [], acc = 0, result = null, hoverTile = null;
let extra = {}; // for tests: view fields to set (selected, placingUnit, placingTower, ...)
let player = true;  // you deploy blue; false: the AI deploys both sides
const RICH = 1e6;   // blue's gold while you deploy: as good as unlimited, kept topped up (the AI plays red as usual)
let selected = null, drag = null, dragEndAt = 0; // the shop pick, and a squad being dragged to another tile
const DT = Game.SETTINGS.dt;
function newMatch() {
  m = Game.createMatch(units, DATA.matrix, (Math.random() * 1e9) >>> 0, $('map').value);
  deploy();
}
function deploy() {
  for (const s of player ? [1] : [0, 1]) aiSide(s);
  if (player && Game.needsPack(m, 0)) Game.choosePack(m, 0, 0); // the first package: its squads go straight on the board
  phase = 'deploy'; bt = null; fx = []; result = null; selected = null; drag = null;
  msg(`Round ${m.round} · deploy`);
  shop();
}
function aiSide(s) { Game.aiDeploy(m, s); Game.ensureTower(m, s); Game.ensurePack(m, s); }
// before a fight: whatever blue left undone (the tower, package squads) is filled in, and tower types settle
function fight() {
  if (phase !== 'deploy') deploy();
  Game.ensureTower(m, 0); Game.ensurePack(m, 0); Game.settleTowerPicks(m);
  selected = null; drag = null;
  bt = Game.startBattle(m);
}
// as the game's absorb(): this tick's shots and deaths become effects
function absorb() {
  for (const s of bt.lastShots()) if (s[12] === 1) fx.push({ kind: 'roar', x: s[0], y: s[1], r: s[5], side: s[4], age: 0, life: 0.8 });
  else if (s[8] > 0) fx.push({ kind: 'flame', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], half: s[8], slam: s[11] === 1, spin: s[11] === 2, age: 0, life: s[11] === 1 ? 0.45 : 0.3 });
  else if (s[10] === 1) fx.push({ kind: 'bolt', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], age: 0, life: 0.22 });
  else fx.push({ kind: s[7] === 1 ? 'heal' : 'shot', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], age: 0, life: s[7] === 1 ? 0.35 : 0.18 });
  for (const b of bt.bodies) if (!b.alive && !b._gone) { b._gone = true; fx.push({ kind: 'death', x: b.x, y: b.y, u: b.u, side: b.side, age: 0, life: 0.5 }); }
}
$('fight').addEventListener('click', () => {
  fight(); phase = 'battle'; acc = 0; fx = []; msg(''); shop();
});
$('next').addEventListener('click', () => {
  if (phase === 'deploy') fight();
  if (!result) { while (bt.step()) {} result = bt.result(); }
  Game.resolve(m, result);
  if (m.over) { newMatch(); return; }
  deploy();
});
$('new').addEventListener('click', newMatch);
$('map').addEventListener('change', newMatch);
$('who').addEventListener('change', () => { player = $('who').value === 'you'; newMatch(); });
$('auto').addEventListener('click', () => { if (phase === 'deploy') { aiSide(0); selected = null; shop(); } });

// ---------- deploying blue: the shop and the board input (as the game's, without its sheets and abilities) ----------
const ME = 0;
const placingTower = () => player && phase === 'deploy' && Game.needsTower(m, ME);
function placingUnit() {
  if (selected !== null) return selected;
  const sq = drag && drag.moved && m.armies[ME].find(s => s.id === drag.id);
  return sq ? sq.unit : null;
}
function shop() {
  const on = player && phase === 'deploy';
  $('shop').hidden = !on; help();
  if (!on) return;
  m.gold[ME] = Math.max(m.gold[ME], RICH);
  const free = Game.freeLeft(m, ME), left = Game.deploysLeft(m, ME);
  $('gold').textContent = `Unlimited gold · ${left} deployment${left === 1 ? '' : 's'} left`;
  $('hint').textContent = placingTower() ? 'Place your tower first: tap a gold tile on the left or right of your zone.'
    : selected !== null ? `Tap a highlighted tile to place ${units[selected].name}.`
    : free.length ? 'Your package squads are on the board: drag them where you want them.'
    : 'Pick a unit, then tap a tile. Tap a new squad to take it back, drag to move it.';
  $('cards').innerHTML = units.map((u, i) => {
    if (Game.isOff(m, i)) return '';
    const locked = !Game.isUnlocked(m, ME, i), n = free.filter(x => x === i).length, cost = Game.shopCost(m, ME, i);
    const can = !placingTower() && (n > 0 || (!locked && m.gold[ME] >= cost && left > 0)) || (locked && m.gold[ME] >= Game.unlockCost(m, i, ME));
    return `<button class="ucard" data-i="${i}" aria-pressed="${selected === i}" aria-disabled="${!can}"${locked ? ' data-locked="1"' : ''}>
      <span class="t"><span style="color:${u.color};display:inline-flex">${Shapes.svg(u.shape, 13)}</span> ${Shapes.tag(u)}</span><span class="n">${u.name}</span>
      <span class="c">${locked ? `Unlock ${Game.unlockCost(m, i, ME)}` : n ? `Free ×${n}` : cost}</span></button>`;
  }).join('');
}
$('cards').addEventListener('click', (e) => {
  const b = e.target.closest('.ucard'); if (!b || phase !== 'deploy') return;
  const i = +b.dataset.i;
  if (b.dataset.locked) { if (Game.unlock(m, ME, i)) selected = i; }
  else if (b.getAttribute('aria-disabled') === 'false') selected = selected === i ? null : i;
  shop();
});
// a tap on the board: as the game's click on its canvas
function tapTile(t) {
  if (!player || phase !== 'deploy' || !t || performance.now() - dragEndAt < 400) return false;
  if (placingTower()) { Game.placeTower(m, ME, t.col, t.row); shop(); return true; }
  const own = Game.squadAt(m, ME, t.col, t.row);
  if (own && selected !== null && Game.boardable(m, ME, t.col, t.row, selected)) placeSel(t); // into a carrier with room
  else if (own) { if (own.round === m.round) Game.unplace(m, ME, t.col, t.row); }
  else if (selected !== null && Game.canPlaceAt(m, ME, t.col, t.row, selected)) placeSel(t);
  else return false;
  shop();
  return true;
}
function placeSel(t) {
  if (!Game.place(m, ME, selected, t.col, t.row)) return;
  if (!Game.freeLeft(m, ME).includes(selected) && (m.gold[ME] < Game.shopCost(m, ME, selected) || Game.deploysLeft(m, ME) <= 0)) selected = null;
}
// a squad from this round can be dragged to another tile
function press(t) {
  if (!player || phase !== 'deploy' || !t || placingTower()) return false;
  const sq = Game.squadAt(m, ME, t.col, t.row);
  if (!sq || sq.round !== m.round || !Game.canMove(m, ME, sq)) return false;
  drag = { id: sq.id, from: t, over: t, moved: false };

}
function dragTo(t) { if (drag && t && (t.col !== drag.over.col || t.row !== drag.over.row)) { drag.over = t; drag.moved = true; } }
function drop(t, ended) {
  const d = drag; drag = null;
  if (!d || !ended || !d.moved) return;
  dragEndAt = performance.now(); // the tap that follows a drag is not a tap
  const to = t || d.over;
  if (to.col !== d.from.col || to.row !== d.from.row) Game.moveSquad(m, ME, d.id, to.col, to.row);

// ---------- the board ----------
const board = Render3D(THREE, $('view'), () => ({ m, me: ME, phase, units, mode: 'ai', bt, battlePre: m, fx, selected, moving: null, drag, hoverTile,
  editable: player && phase === 'deploy', placingUnit: placingUnit(), placingElf: false, placingTower: placingTower(), ...extra }), {
  // a tap in the strategic view deploys; anywhere else it marks a tile, in the game's own column / row numbers
  onTap: (t) => { if (tapTile(t)) return; hoverTile = t; if (t && !(player && phase === 'deploy')) msg(`Tapped tile: column ${t.col + 1}, row ${t.row + 1}`); },
  onPress: press, onDrag: dragTo, onDrop: drop,
  onHover: (t) => { hoverTile = t; },
  placing: () => player && phase === 'deploy', // you can place in the angled view too
  onLevel: (lv) => { if (lv > 2 || !(player && phase === 'deploy')) hoverTile = null; help(lv); },
});
// the level chips switch views (in the angled view a tap places, so it no longer goes back)
[...$('levels').children].forEach((c, k) => c.addEventListener('click', () => board.camera.setLevel(k)));
function showLevel() { [...$('levels').children].forEach((c, k) => c.classList.toggle('on', k === board.camera.level())); }
// the help line for a view: none in the strategic view while deploying (the shop says what to do)
function help(lv = board.camera.level()) {
  const deploying = player && phase === 'deploy';
  $('help').hidden = deploying && lv <= 1;
  $('help').textContent = deploying && lv === 2
    ? (touch ? 'Tap a tile to place · drag a new squad to move it · drag elsewhere to look around · pinch or tap Strategic to go back'
      : 'Click a tile to place · drag a new squad to move it · drag elsewhere to look around · scroll, Esc or Strategic to go back')
    : touch ? 'Spread two fingers to go in · drag to look around · twist two fingers to rotate · tap to go back'
    : 'Scroll to go in or out · drag to look around · hold the right or middle button and drag to rotate (or Q / E) · click or Esc to go back';
}
let msgTimer = 0;
function msg(t) { $('msg').textContent = t; $('msg').hidden = !t; clearTimeout(msgTimer); if (t && t.startsWith('Tapped')) msgTimer = setTimeout(() => msg(''), 1800); }
new ResizeObserver(() => board.size()).observe($('view')); // the bars change height as the shop comes and goes

// ---------- the loop ----------
let last = 0, fpsT = 0, fpsN = 0;
function frame(ts) {
  const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0.016; last = ts;
  if (phase === 'battle') {
    const speed = bt.time() > 20 ? 3 : 1.5;
    acc += dt * speed;
    while (acc >= DT) { acc -= DT; if (!bt.step()) break; absorb(); }
    for (const e of fx) e.age += dt * speed;
    fx = fx.filter(e => e.age < e.life);
    if (bt.isOver()) {
      result = bt.result(); phase = 'result'; fx = []; shop();
      msg(result.winner === 0 ? `Round ${m.round}: blue wins` : result.winner === 1 ? `Round ${m.round}: red wins` : `Round ${m.round}: draw`);
    }
  }
  board.draw();
  showLevel();
  fpsN++; fpsT += dt;
  if (fpsT >= 0.5) {
    const n = bt ? bt.bodies.filter(b => b.alive).length : 0;
    $('stats').textContent = `${Math.round(fpsN / fpsT)} fps · ${n} bodies · ${board.info().calls} draws`; fpsN = 0; fpsT = 0;

board.size();
newMatch();
requestAnimationFrame(frame);
window.__lab3d = { board, get m() { return m; }, get bt() { return bt; }, get phase() { return phase; }, view(x) { extra = x || {}; },
  get selected() { return selected; }, set selected(i) { selected = i; shop(); } }; // for tests

</script>
