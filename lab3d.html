<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<link rel="icon" href="icon.png">
<title>No Mans Land · 3D test</title>
<style>
/* Layout: one column, a war table at night. HUD on top, square board, controls under the thumb. Single dark look by choice. */
:root {
  --bg: #0D1315;
  --panel: #152125;
  --board: #13201F;
  --line: #27393D;
  --ink: #E5ECE9;
  --muted: #8DA1A1;
  --you: #5CC6DF;
  --foe: #EE6E5C;
  --gold: #E6B84A;
  --gold-dark: #C4932C;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 28px; -webkit-tap-highlight-color: transparent; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { display: grid; gap: 4px; min-width: 0; }
.side.foe { text-align: right; }
.side .lbl { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 8px; }
.side.you .lbl { color: var(--you); }
.side.foe .lbl { color: var(--foe); flex-direction: row-reverse; }
.side .lbl .num { color: var(--ink); font-weight: 500; }
.hp { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.hp i { display: block; height: 100%; transition: width 0.6s ease; }
.side.you .hp i { background: var(--you); }
.side.foe .hp i { background: var(--foe); margin-left: auto; }
.round { text-align: center; font-family: var(--font-display); }
.round b { display: block; font-size: 22px; font-weight: 700; line-height: 1; }
.round span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Board */
.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--board); touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.board3d { position: absolute; inset: 0; touch-action: none; } /* the 3D board (the Board setting): its own canvas, the camera takes every finger */
.note3d { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 3; width: max-content; max-width: calc(100% - 16px); padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: rgba(13, 19, 21, 0.88); color: var(--ink); font-size: 13px; line-height: 1.35; text-align: center; cursor: pointer; } /* one line when the 3D board falls back to 2D; tap to close */
.meter3d { position: absolute; top: 6px; right: 6px; max-width: calc(100% - 12px); padding: 3px 6px; border: 0; border-radius: 4px; background: rgba(13, 19, 21, 0.72); color: var(--muted); font: 10px/1.35 var(--font-data); text-align: right; white-space: pre-wrap; cursor: pointer; }
.tag-clock { position: absolute; top: 8px; left: 10px; font-family: var(--font-data); font-size: 12px; color: var(--muted); pointer-events: none; }
.overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: rgba(13, 19, 21, 0.86); text-align: center; }
.card { margin: auto; display: grid; gap: 10px; justify-items: center; max-width: 36ch; }
.card h2 { font-size: clamp(26px, 8vw, 38px); font-weight: 700; text-transform: uppercase; line-height: 1; }
.card h2.you { color: var(--you); }
.card h2.foe { color: var(--foe); }
.card p { margin: 0; color: var(--muted); }
.card .big { color: var(--ink); font-size: 17px; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; text-align: left; color: var(--muted); font-size: 13px; line-height: 1.35; }
.card ul li::before { content: "▸ "; color: var(--gold); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }

/* Controls */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.gold { font-family: var(--font-data); font-size: 16px; color: var(--gold); font-weight: 500; }
.deploys { font-size: 13px; color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }
.btn { border-radius: 4px; border: 1px solid var(--line); background: transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-family: var(--font-data); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--gold); }

.shop { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.uwrap { flex: 0 0 132px; scroll-snap-align: start; position: relative; display: grid; }
.ucard { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 10px 34px 9px 10px; background: var(--bg); display: grid; gap: 3px; align-content: start; }
.ucard[aria-pressed="true"] { border-color: var(--you); box-shadow: inset 0 0 0 1px var(--you); }
.ucard[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.ucard .t { font-family: var(--font-data); font-size: 12px; color: var(--you); letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 5px; }
.ucard .n { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.ucard .r { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ucard .c { font-family: var(--font-data); font-size: 12px; color: var(--gold); }
.uwrap .info { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-family: var(--font-display); font-size: 12px; display: grid; place-items: center; }

/* Unit sheet */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; align-items: end; justify-items: center; z-index: 5; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.sheet h3 { font-size: 22px; }
.sheet .role { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.stats span { color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.vs h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.vs .good h4 { color: var(--you); }
.vs .bad h4 { color: var(--foe); }
.vs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; }
.traits span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hp i { transition: none; } }
.lvl-pair { display: inline-flex; gap: 2px; }
.lvl-pair .btn:first-child:not(:only-child) { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.lvl-pair .lvl-all { padding: 10px 10px; font-size: 12px; letter-spacing: 0.04em; border-top-left-radius: 0; border-bottom-left-radius: 0; }

html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
/* the bars sit above and below the board, so the strategic view fits the board between them and nothing covers your zone */
body { display: flex; flex-direction: column; }
#view { position: relative; flex: 1; min-height: 0; touch-action: none; }
#view canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.hud { display: flex; gap: 8px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
.top { padding-top: calc(8px + env(safe-area-inset-top, 0px)); justify-content: space-between; }
.bottom { padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); flex-direction: column; gap: 6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.chip { font: 500 12px var(--font-data); padding: 6px 10px; cursor: pointer; border: 1px solid var(--line); border-radius: 999px; background: rgba(13,19,21,0.75); color: var(--muted); }
.chip.on { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.levels { display: flex; gap: 4px; }
.stats { font: 400 11px var(--font-data); color: var(--muted); background: rgba(13,19,21,0.75); padding: 4px 8px; border-radius: 4px; }
.hud .btn { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.hud select { min-height: 36px; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 8px; font: inherit; }
#msg { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font: 600 13px var(--font-data); color: var(--ink); background: rgba(13,19,21,0.8); padding: 6px 12px; border-radius: 4px; pointer-events: none; text-align: center; max-width: calc(100% - 32px); }
#shop { width: 100%; max-width: 640px; display: grid; gap: 4px; }
#shop[hidden], #help[hidden], #msg[hidden] { display: none; }
#msg, #help { z-index: 1; }
#shop .line { display: flex; justify-content: space-between; gap: 8px; font: 400 12px var(--font-body); color: var(--muted); }
#gold { font: 500 12px var(--font-data); color: var(--gold); white-space: nowrap; }
#cards { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
#cards .ucard { flex: 0 0 auto; min-width: 84px; padding: 6px 8px; }
#cards .ucard .n { font-size: 13px; }
#help { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: max-content; font: 400 12px var(--font-body); color: var(--muted); background: rgba(13,19,21,0.8); padding: 6px 10px; border-radius: 4px; pointer-events: none; text-align: center; max-width: min(520px, calc(100% - 24px)); box-sizing: border-box; }
</style>
</head>
<body>
<div class="hud top">
  <div class="levels" id="levels"><button class="chip on">Strategic</button><button class="chip">Tilted</button><button class="chip">Angled</button><button class="chip">Ground</button></div>
  <span class="stats" id="stats"></span>
</div>
<div id="view"><div id="msg"></div><div id="help"></div></div>
<div class="hud bottom">
  <div id="shop" hidden><div class="line"><span id="hint"></span><span id="gold"></span></div><div id="cards"></div></div>
  <div class="row">
  <select id="map" aria-label="Map"><option value="standard">Standard</option><option value="forest">Forest Clearing</option><option value="cavern">Mushroom Cavern</option><option value="ice">Frozen Peak</option></select>
  <select id="who" aria-label="Who deploys blue"><option value="you">Blue: you</option><option value="ai">Blue: AI</option></select>
  <button class="btn" id="auto">Auto</button>
  <button class="btn primary" id="fight">Fight</button>
  <button class="btn" id="next">Next</button>
  <button class="btn" id="new">New</button>
  </div>
</div>
<script>
// ===== Unit shapes (shared by Counter Lab and the demo) =====
const Shapes = (() => {
  const LIST = ['circle', 'ring', 'square', 'triangle', 'diamond', 'pentagon', 'hexagon', 'star', 'cross', 'bar', 'horse', 'spider', 'sun', 'flame', 'spear', 'imp', 'knife', 'drop', 'dagger', 'snowflake', 'obelisk'];
  const LABELS = { circle: 'Circle', ring: 'Ring', square: 'Square', triangle: 'Triangle', diamond: 'Diamond', pentagon: 'Pentagon', hexagon: 'Hexagon', star: 'Star', cross: 'Cross', bar: 'Bar', horse: 'Horse', spider: 'Spider', sun: 'Sun', flame: 'Flame', spear: 'Spear', imp: 'Imp', knife: 'Knife', drop: 'Drop', dagger: 'Dagger', snowflake: 'Snowflake', obelisk: 'Obelisk' };
  const DEFAULTS = {
    'Goblin Swarm': 'triangle', 'Skeleton Archers': 'diamond', 'Ember Imps': 'imp', 'Fire Mage': 'hexagon',
    'Sniper': 'cross', 'Brute': 'square', 'Wisps': 'ring', 'Crossbow Volley': 'pentagon', 'Ballista': 'bar',
    'Boar Riders': 'circle', 'Spinning Golem': 'hexagon', 'Blunderbuss Crew': 'star', 'Ogre Smasher': 'square',
  };
  const valid = (s) => LIST.includes(s);
  // Unit colours: picked to stay clear of the team colours (blue and red), which outline every body
  const PALETTE = ['#9BD35A', '#E9E3CF', '#FFA94D', '#C77DFF', '#F7D154', '#8D99AE', '#E07A9B', '#B08155', '#3FD39A', '#B4A7F5', '#D9C49A', '#7FA650'];
  const DEFAULT_COLORS = {
    'Goblin Swarm': '#9BD35A', 'Skeleton Archers': '#E9E3CF', 'Ember Imps': '#FFA94D', 'Fire Mage': '#C77DFF',
    'Sniper': '#F7D154', 'Brute': '#8D99AE', 'Wisps': '#B4A7F5', 'Crossbow Volley': '#B08155', 'Ballista': '#D9C49A',
    'Boar Riders': '#E07A9B', 'Spinning Golem': '#7FA650', 'Blunderbuss Crew': '#3FD39A', 'Ogre Smasher': '#B08155',
  };
  // a unit's short label on the board: the first three letters of its name
  const tag = (u) => ((typeof u.tag === 'string' && u.tag.replace(/[^A-Za-z]/g, '')) || u.name.replace(/[^A-Za-z]/g, '').slice(0, 3) || 'UNT').slice(0, 3).toUpperCase(); // a unit may pick its own (tag)
  const validColor = (c) => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);

  // Give every unit a shape and a colour: keep valid ones, else a known default, else the first one not used yet
  function assign(units) {
    const used = new Set(units.filter(u => valid(u.shape)).map(u => u.shape));
    const usedC = new Set(units.filter(u => validColor(u.color)).map(u => u.color.toUpperCase()));
    return units.map((u) => {
      let out = u;
      if (!valid(u.shape)) {
        let s = DEFAULTS[u.name];
        if (!s || used.has(s)) s = LIST.find(x => !used.has(x)) || LIST[used.size % LIST.length];
        used.add(s);
        out = { ...out, shape: s };
      }
      if (!validColor(u.color)) {
        let c = DEFAULT_COLORS[u.name];
        if (!c || usedC.has(c)) c = PALETTE.find(x => !usedC.has(x)) || PALETTE[usedC.size % PALETTE.length];
        usedC.add(c);
        out = { ...out, color: c };
      }
      return out;
    });
  }

  // A horse seen from the side, facing right: rump, back, neck and head, chest, front leg, belly, hind leg, tail.
  // Points are in units of r around the centre; it always stands upright, whichever side it is on.
  const HORSE = [[-0.95, -0.3], [0.3, -0.3], [0.62, -0.95], [0.82, -0.85], [1.12, -0.5], [1.02, -0.36], [0.74, -0.46], [0.66, -0.05], [0.62, 0.3],
    [0.62, 1.05], [0.42, 1.05], [0.38, 0.32], [-0.52, 0.32], [-0.58, 1.05], [-0.78, 1.05], [-0.86, 0.22], [-1.18, 0.55], [-1.08, 0.05]];

  // Pictures made of several parts, in units of r around the centre, always upright: { c: [x, y, radius] } is a
  // disc, { p: [[x, y], ...] } a polygon. Every part runs the same way round, so overlapping parts fill as one.
  const clockwise = (pts) => pts.reduce((s, [x1, y1], i) => { const [x2, y2] = pts[(i + 1) % pts.length]; return s + x1 * y2 - x2 * y1; }, 0) > 0 ? pts : pts.slice().reverse();
  // a leg drawn as a thin strip along a bent line (w = half its thickness)
  function strip(line, w) {
    const nrm = (i) => { const [ax, ay] = line[Math.max(0, i - 1)], [bx, by] = line[Math.min(line.length - 1, i + 1)], l = Math.hypot(bx - ax, by - ay); return [-(by - ay) / l * w, (bx - ax) / l * w]; };
    const n = line.map((_, i) => nrm(i));
    return line.map(([x, y], i) => [x + n[i][0], y + n[i][1]]).concat(line.map(([x, y], i) => [x - n[i][0], y - n[i][1]]).reverse());
  }
  const SPIDER_LEGS = [[[0.15, -0.5], [0.72, -0.95], [1.02, -1.28]], [[0.22, -0.3], [0.92, -0.5], [1.3, -0.42]],
    [[0.24, -0.08], [0.92, 0.12], [1.3, 0.48]], [[0.2, 0.12], [0.72, 0.62], [0.98, 1.22]]];
  const ray = (a) => [[Math.cos(a) * 1.32, Math.sin(a) * 1.32], [Math.cos(a + 0.3) * 0.56, Math.sin(a + 0.3) * 0.56], [Math.cos(a - 0.3) * 0.56, Math.sin(a - 0.3) * 0.56]];
  const IMP = [{ p: [[-0.8, -0.6], [0.8, -0.6], [0.8, 0.95], [-0.8, 0.95]] }, { p: [[-0.8, -0.58], [-0.36, -0.58], [-0.74, -1.22]] }, { p: [[0.36, -0.58], [0.8, -0.58], [0.74, -1.22]] }];
  const FIGURES = {
    spider: [{ c: [0, 0.32, 0.56] }, { c: [0, -0.42, 0.33] }, ...SPIDER_LEGS.flatMap(l => [{ p: strip(l, 0.15) }, { p: strip(l.map(([x, y]) => [-x, y]), 0.15) }])],
    sun: [{ c: [0, 0, 0.64] }, ...Array.from({ length: 8 }, (_, i) => ({ p: ray(-Math.PI / 2 + i * Math.PI / 4) }))],
    flame: [{ p: [[0, -1.32], [0.2, -0.86], [0.42, -0.56], [0.54, -0.9], [0.74, -0.38], [0.88, 0.1], [0.82, 0.52], [0.6, 0.86], [0.26, 1.04],
      [-0.16, 1.04], [-0.52, 0.9], [-0.8, 0.6], [-0.9, 0.18], [-0.8, -0.22], [-0.6, -0.54], [-0.54, -0.24], [-0.36, -0.58], [-0.2, -0.98]] }],
    // a spear standing upright: leaf-shaped head, crossguard, shaft
    spear: [{ p: [[0, -1.36], [0.4, -0.78], [0.14, -0.5], [-0.14, -0.5], [-0.4, -0.78]] }, { p: [[-0.42, -0.52], [0.42, -0.52], [0.42, -0.34], [-0.42, -0.34]] },
      { p: [[-0.13, -0.4], [0.13, -0.4], [0.13, 1.32], [-0.13, 1.32]] }],
    // an imp: a square body with two small horns
    imp: IMP,
    // a throwing knife standing upright: blade, crossguard, grip, pommel
    knife: [{ p: [[0, -1.36], [0.3, -0.86], [0.24, 0.2], [-0.24, 0.2], [-0.3, -0.86]] }, { p: [[-0.6, 0.2], [0.6, 0.2], [0.6, 0.42], [-0.6, 0.42]] },
      { p: [[-0.16, 0.42], [0.16, 0.42], [0.16, 1.1], [-0.16, 1.1]] }, { c: [0, 1.16, 0.24] }],
    // a curved dagger standing upright, point up: blade, hilt, grip, pommel (the Assassin)
    dagger: [{ p: [[0.08, -1.38], [0.38, -0.9], [0.36, -0.3], [0.16, 0.18], [-0.2, 0.18], [-0.1, -0.4], [-0.12, -0.9]] }, { p: [[-0.62, 0.18], [0.58, 0.18], [0.44, 0.38], [-0.48, 0.38]] },
      { p: [[-0.15, 0.38], [0.13, 0.38], [0.13, 1.08], [-0.15, 1.08]] }, { c: [-0.01, 1.14, 0.22] }],
    // a drop of water
    drop: [{ p: [[0, -1.32], [0.74, 0.02], [-0.74, 0.02]] }, { c: [0, 0.32, 0.84] }],
    // a snowflake: six arms, each with a little V near its tip (the Frost Wizard)
    snowflake: [{ c: [0, 0, 0.38] }, ...Array.from({ length: 6 }, (_, i) => {
      const a = -Math.PI / 2 + i * Math.PI / 3, c = Math.cos(a), s = Math.sin(a), at = (d, o) => [c * d - s * o, s * d + c * o];
      return [{ p: strip([[0, 0], at(1.34, 0)], 0.13) }, { p: strip([at(0.72, -0.34), at(0.94, 0), at(0.72, 0.34)], 0.1) }];
    }).flat()],
    // an obelisk: a tall tapering stone with a pointed cap, on a wide plinth
    obelisk: [{ p: [[-0.46, 1.06], [0.46, 1.06], [0.3, -0.86], [0, -1.36], [-0.3, -0.86]] }, { p: [[-0.76, 0.96], [0.76, 0.96], [0.76, 1.32], [-0.76, 1.32]] }],
  };
  for (const parts of Object.values(FIGURES)) for (const pt of parts) if (pt.p) pt.p = clockwise(pt.p);

  // Points of a regular polygon; up = 1 points toward the top of the screen, -1 toward the bottom
  function poly(ctx, x, y, r, n, rot) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI * 2 / n;

      case 'square': ctx.beginPath(); ctx.rect(x - r * 0.88, y - r * 0.88, r * 1.76, r * 1.76); return false;
      case 'triangle': poly(ctx, x, y + (up >= 0 ? r * 0.15 : -r * 0.15), r * 1.25, 3, top); return false;
      case 'diamond': poly(ctx, x, y, r * 1.2, 4, top); return false;
      case 'pentagon': poly(ctx, x, y, r * 1.08, 5, top); return false;
      case 'hexagon': poly(ctx, x, y, r * 1.05, 6, 0); return false;
      case 'star': {
        ctx.beginPath();

          const a = top + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3;

          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);

        ctx.closePath(); return false;
      }
      case 'cross': {
        const a = r * 1.15, b = r * 0.42;
        ctx.beginPath();
        ctx.moveTo(x - b, y - a); ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y - b); ctx.lineTo(x + a, y - b);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x + b, y + b); ctx.lineTo(x + b, y + a); ctx.lineTo(x - b, y + a);

      case 'diamond': body = `<polygon points="${pts(4, r * 1.2, -Math.PI / 2)}"/>`; break;
      case 'pentagon': body = `<polygon points="${pts(5, r * 1.08, -Math.PI / 2)}"/>`; break;
      case 'hexagon': body = `<polygon points="${pts(6, r * 1.05, 0)}"/>`; break;
      case 'star': body = `<polygon points="${Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3; return `${(c + Math.cos(a) * rr).toFixed(2)},${(c + Math.sin(a) * rr).toFixed(2)}`; }).join(' ')}"/>`; break;

      case 'bar': body = `<rect x="${c - r * 1.3}" y="${c - r * 0.55}" width="${r * 2.6}" height="${r * 1.1}"/>`; break;
      case 'horse': { const rr = r * 0.95; body = `<polygon points="${HORSE.map(([px, py]) => `${(c + px * rr).toFixed(2)},${(c + py * rr).toFixed(2)}`).join(' ')}"/>`; break; }
      case 'spider': case 'sun': case 'flame': case 'spear': case 'imp': case 'knife': case 'drop': case 'dagger': case 'snowflake': case 'obelisk': { const rr = r * 0.95; body = FIGURES[shape].map(pt => pt.c
        ? `<circle cx="${(c + pt.c[0] * rr).toFixed(2)}" cy="${(c + pt.c[1] * rr).toFixed(2)}" r="${(pt.c[2] * rr).toFixed(2)}"/>`

      case 'ring': body = `<circle cx="${c}" cy="${c}" r="${r * 0.8}" fill="none" stroke="currentColor" stroke-width="${Math.max(1.5, r * 0.45)}"/>`; break;
      default: body = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
    }
    return `<svg class="shape-icon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="currentColor" aria-hidden="true">${body}</svg>`;
  }

  // A body: filled with the unit's colour, outlined in its team colour
  function body(ctx, shape, x, y, r, up, fill, team, fillAlpha = 1) {
    if (FIGURES[shape]) {

      ctx.strokeStyle = team; ctx.lineWidth = Math.max(2, Math.min(3.5, r * 0.3)); ctx.lineJoin = 'round';
      path(ctx, shape, x, y, r, up); ctx.stroke(); ctx.lineJoin = 'miter';
      ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill; draw(ctx, shape, x, y, r, up); ctx.globalAlpha = 1;

    }
    ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill;
    draw(ctx, shape, x, y, r, up);
    ctx.globalAlpha = 1; ctx.strokeStyle = team; ctx.lineWidth = Math.max(1.5, Math.min(2.5, r * 0.32));

  }

  return { IMP, LIST, tag, LABELS, PALETTE, valid, validColor, assign, draw, outline, path, svg, body };
})();

        case 'bleedHit': u.bleedHit = Math.max(u.bleedHit || 0, Math.max(0, Math.round(P('n')))); break;
        case 'bull': u.bull = { every: Math.max(1, Math.round(P('every'))), hit: Math.max(0, P('hit')), push: Math.max(0, P('push')), armor: P('armor'), run: Math.max(0, P('run')) }; break;

  // The unit with its built-in skills (slots marked in skillsInnate), resolved from a skill library
  function innateUnit(unit, lib, roster) {
    if (!unit || !Array.isArray(unit.skillsInnate) || !Array.isArray(unit.skills)) return unit;
    const defs = SLOTS.filter(k => unit.skillsInnate[k] && unit.skills[k]).map(k => {
      const base = (lib || []).find(s => s && s.id === unit.skills[k]);
      if (!base) return null;
      const mod = Array.isArray(unit.skillMods) && unit.skillMods[k] && typeof unit.skillMods[k] === 'object' ? unit.skillMods[k] : null;
      return mod ? { ...base, params: { ...base.params, ...(mod.params || {}) } } : base;

  // Gold per side for counter tables: the smallest amount that every unit's price divides evenly
  // (costs in lab units, 1 = 100 gold), so no unit is stuck with leftover gold. Falls back to the priciest unit.
  function fairBudget(costs, min = 2) {
    const top = Math.max(min, ...costs);
    const step = Math.min(...costs.filter(c => c > 0));
    for (let b = top; b <= top * 6 + 1e-9; b += step) {
      if (costs.every(c => c <= 0 || Math.abs(b / c - Math.round(b / c)) < 1e-6)) return b;
    }
    return top;
  }

  function squadsFor(unit, g) {
    return Math.max(1, Math.floor(g.budget / Math.max(0.0001, unit.cost) + 1e-9));
  }

  // Raw strength of what the budget buys: total health x total damage per second
  function rawStrength(unit, g) {
    const u = leveled(unit);
    const s = squadsFor(u, g);
    const n = s * u.bodies;
    const hp = n * u.hp;
    const cycle = 1 / Math.max(0.01, u.aps); // wind-up only happens when the unit sets up after moving, so it isn't counted per attack
    const dps = n * u.hit / cycle * Math.max(1, u.burst) * (u.flame > 0 ? 1 : Math.max(1, u.pellets));
    return { squads: s, bodies: n, hp, dps, strength: hp * dps };

  function damageAfterDefense(hit, target, g) {
    const u = target.u;

    if (u.bonusWard > 0) d = Math.min(d, u.bonusWard); // ward from a skill; works next to armor
    return d;
  }

  function makeSide(unit, side, g) {
    return makeArmy([{ unit, gold: g.budget }], side, g);
  }

  // An army of one or more unit types, listed front to back. Each entry is a unit, or { unit, gold }
  // to give that unit its own budget (default: the battle budget). Each group stands in its own rows.
  function makeArmy(list, side, g) {
    const bodies = [];
    let depth = 0, idx = 0;
    list.forEach((entry, k) => {
      const e = entry && entry.unit ? entry : { unit: entry, gold: g.budget };
      const u = leveled(e.unit);
      const s = squadsFor(u, { budget: e.gold == null ? g.budget : e.gold });
      const n = s * u.bodies;
      const cols = Math.max(1, Math.min(n, Math.ceil(Math.sqrt(n * 2.5))));
      const sp = g.spacing;
      for (let i = 0; i < n; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        const x = (c - (cols - 1) / 2) * sp;
        const y = (g.distance / 2 + depth + r * sp) * (side === 0 ? -1 : 1);
        bodies.push(newBody(u, side, x, y, list.length === 1 ? i : idx, k));
        idx++;
      }
      depth += Math.ceil(n / cols) * sp + sp; // the next group stands one gap further back
    });
    return bodies;
  }

  // `unit` must already be leveled (see leveled())
  function newBody(unit, side, x, y, i, squad) {
    const u = unit;

    return {

      spreadTo: u.spread ? spreadSpot(x, y, i, u.spread, side) : null, // Spread skill: where it runs to before anything else

  // Spread: a spot min..max metres from (x, y) in one of 12 directions, picked from the body's index (the same on every device;
  // side 1's mirrored, toward its own front, so both sides spread alike)

      // stunned after a charge (a trampler only once its run is over, see the movement loop)
      if (charged && b.u.chargeStun > 0 && !(b.trampleLeft > 0)) b.stunT = b.u.chargeStun;
      const walled = new Set(); // an enemy wall in the way takes the shot instead (a flame burns it once)
      for (const t0 of targets) {
        const wl = wallBetween(b, t0), tgt = wl || t0;
        if (wl && targets.flame) { if (walled.has(wl)) continue; walled.add(wl); }
        const dx = tgt.x - b.x, dy = tgt.y - b.y, d = hyp(dx, dy) || 1;
        const dirX = dx / d, dirY = dy / d;
        const hk = tgt.u ? hit * (1 + above(b, tgt) * heightDmg / 100) : hit; // from higher or lower ground (see HEIGHT)
        if (targets.flame || targets.stomp) {
          hurt(b, tgt, hk, b.x, b.y); // flames and stomps land at once, no splash or pierce
        } else if (b.u.projSpeed > 0) {
          projectiles.push({ owner: b, x: b.x, y: b.y, fx: b.x, fy: b.y, tx: tgt.x, ty: tgt.y, dirX, dirY, left: d, hit: hk });
        } else {
          impact(b, tgt.x, tgt.y, tgt, hk, dirX, dirY, b.x, b.y);
        }
        if (opts.record && !targets.flame) shots.push([b.x, b.y, tgt.x, tgt.y, b.side, b.u.splash, charged ? 1 : 0, 0, 0, b.u.spinUp > 0 ? b.spin : 1, b.u.chain ? 1 : 0, 0, 0, b.u.frost && !(b.u.projSpeed > 0) ? 1 : 0, b, tgt]); // [13] 1: a frost beam; [14], [15]: its shooter and target (a held beam is drawn between them)
      }
      // chain lightning: from the target on to the nearest enemy not hit yet, up to chain.jumps times
      if (b.u.chain && targets.length && !targets.flame && !(b.u.projSpeed > 0)) {
        const done = [targets[0]], k = b.u.hit > 0 ? hit / b.u.hit : 1;
        let last = targets[0], lx = last.x, ly = last.y;
        for (let j = 0; j < b.u.chain.jumps; j++) {
          let nx = null, nd = b.u.chain.reach + 0.01;
          for (const f of sides[1 - b.side]) {
            if (!f.alive || f.hidden || sheltered(f) || done.includes(f)) continue;
            const d = hyp(f.x - lx, f.y - ly);
            if (d <= nd && !wallOnLine(lx, ly, f.x, f.y)) { nd = d; nx = f; }
          }
          if (!nx) break;
          if (opts.record) shots.push([lx, ly, nx.x, nx.y, b.side, 0, 0, 0, 0, 1, 1]);
          done.push(nx);
          const fx = lx, fy = ly;
          last = nx; lx = nx.x; ly = nx.y;
          hurt(b, nx, b.u.chain.hit * k, fx, fy);
        }
      }
      // a flame is drawn once, as a wedge from the unit out to its range
      if (opts.record && targets.flame) {
        const [ax, ay, al] = targets.flame, r = reachOf(b), k = al ? r / al : 0;
        shots.push([b.x, b.y, b.x + ax * k, b.y + ay * k, b.side, 0, charged ? 1 : 0, 0, b.u.flame, 1, 0, b.u.slam ? 1 : b.u.spinBlade ? 2 : 0]); // [11]: a ground slam (1) or spinning blades (2), not fire
      }
    }

    // Death flurry: the next blow, on the same target; when the last one killed it, a leap to the nearest enemy within
    // flurry.leap metres first (none: the flurry ends)
    function flurryStep(b) {
      b.flurryT -= dt;
      if (b.flurryT > 1e-9) return;
      let tgt = b.flurryTgt;
      if (!(tgt && tgt.alive && !sheltered(tgt))) {
        tgt = null;
        let bd = b.u.flurry.leap + 0.01;
        for (const f of sides[1 - b.side]) { if (!pickable(b, f)) continue; const d = gap(f, b); if (d <= bd) { bd = d; tgt = f; } }
        if (!tgt) { b.flurryLeft = 0; return; }
        const d = dist(tgt, b), keep = Math.min(d, Math.max(0.5, R(b) * 0.6));
        if (opts.record) shots.push([b.x, b.y, tgt.x, tgt.y, b.side, 0, 1, 0, 0]);
        if (d > 1e-6) { b.hx = (tgt.x - b.x) / d; b.hy = (tgt.y - b.y) / d; b.x = tgt.x - b.hx * keep; b.y = tgt.y - b.hy * keep; }
        b.flurryTgt = tgt; b.lock = tgt;
      } else if (gap(tgt, b) > R(b) + 2) { b.flurryLeft = 0; return; }
      b.flurryLeft--; b.flurryT += b.u.flurry.gap;
      fire(b, [tgt], false);
    }

    // Extra turret skill: each body carries more copies of its weapon (turret 0 is its own attack, see the attack
    // loop). Every turret has its own reload (b.tcd[k]) and target (b.aims[k]), and none aims at another one's target.
    function turretTaken(b, k) {
      if (!b.aims) b.aims = [];
      const out = [];
      for (let j = 0; j < b.u.turrets; j++) if (j !== k && b.aims[j] && b.aims[j].alive) out.push(b.aims[j]);
      return out;
    }
    function extraTurrets(b) {
      if (!b.tcd) b.tcd = [];
      let valid = null;
      for (let k = 1; k < b.u.turrets; k++) {
        b.tcd[k] = (b.tcd[k] || 0) - dt * atkMul(b);
        if (b.tcd[k] > 0) continue;
        if (!valid) valid = validTargets(b);
        const taken = turretTaken(b, k), tgt = valid.find(f => !taken.includes(f));
        if (!tgt) { b.tcd[k] = Math.max(b.tcd[k], -dt); b.aims[k] = null; continue; }
        b.aims[k] = tgt;
        b.tcd[k] = Math.max(b.tcd[k], -dt) + 1 / Math.max(0.01, apsOf(b));
        fire(b, aim(b, tgt, valid), false);
      }
    }

    // a ram's turn: run at the enemy tower (or, once it is down, the nearest enemy); on reaching it, hit it once and fall
    function ram(b, foes) {
      let tgt = null, td = Infinity;
      for (const f of foes) if (f.alive && f.u.structure) { const d = dist(f, b); if (d < td) { td = d; tgt = f; } }
      if (!tgt) for (const f of foes) if (pickable(b, f)) { const d = dist(f, b); if (d < td) { td = d; tgt = f; } }
      if (!tgt) return;
      b.intent = tgt;
      if (td > RAM_REACH) {
        const mv = Math.min(td - RAM_REACH * 0.5, spd(b) * (b.slowT > 0 ? 1 - b.slowMove / 100 : 1) * (cripple[b.side] > 0 ? 1 - towerDown.move / 100 : 1) * dt);
        [b.hx, b.hy] = steer(b, tgt.x, tgt.y, (tgt.x - b.x) / td, (tgt.y - b.y) / td);
        b.x += b.hx * mv; b.y += b.hy * mv; b.moved += mv;
        if (dist(tgt, b) > RAM_REACH) return;
      }
      if (opts.record) shots.push([b.x, b.y, tgt.x, tgt.y, b.side, 0, 1, 0, 0]);
      b.rammed = tgt;
      hurt(b, tgt, b.u.hit, b.x, b.y);
      if (b.alive) rammed.push(b); // it falls once every body has moved, so an enemy ram reaching it this tick still finds it
    }
    const rammed = [];

    // share of its move speed a body walks at right now (slowed, or crippled by its fallen tower)
    const moveMul = (b) => (b.slowT > 0 ? 1 - b.slowMove / 100 : 1) * (cripple[b.side] > 0 ? 1 - towerDown.move / 100 : 1);

    // a roller's turn (see ROLL_START): marches like any unit until it spots an enemy, then rolls at its target
    // gathering speed, runs over every enemy body in its path (each once per pass), carries on ROLL_PAST metres past
    // the target, stops dead and rolls back
    function roll(b, foes) {
      const top = b.u.speed, start = Math.min(ROLL_START, top);
      if (b.rollV == null) b.rollV = start;
      if (!(b.rollPast > 0)) {
        let near = null, nd = Infinity, hid = null, hd = Infinity; // the nearest it sees, else the nearest it doesn't (walls)
        for (const f of foes) { if (!pickable(b, f)) continue; const d = dist(f, b); if (!inSight(b, f)) { if (d < hd) { hd = d; hid = f; } } else if (d < nd) { nd = d; near = f; } }
        const blind = !near && !!hid;
        if (blind) { near = hid; nd = hd; }
        if (!near) return;
        b.near = near;
        const [mx, my] = b.march || [0, b.side === 0 ? 1 : -1];
        if (!b.engaged) {
          let spotted = !blind && nd <= Math.max(R(b) + sight, minSight);
          if (!spotted) { // nothing left ahead to march toward: go for the nearest
            spotted = true;
            for (const f of foes) if (pickable(b, f) && (f.x - b.x) * mx + (f.y - b.y) * my > 0) { spotted = false; break; }
          }
          if (spotted) b.engaged = true;
        }
        // once engaged it stays on its target until that dies or hides, like any unit
        const tgt = b.engaged ? (b.lock && pickable(b, b.lock) ? b.lock : (b.lock = near)) : null;
        b.intent = tgt;
        let wx = mx, wy = my;
        if (tgt) { const d = dist(tgt, b) || 1; wx = (tgt.x - b.x) / d; wy = (tgt.y - b.y) / d; }
        if (terBlock) [wx, wy] = steer(b, tgt ? tgt.x : b.x + wx * 400, tgt ? tgt.y : b.y + wy * 400, wx, wy); // round walls and water
        // standing still it can set off any way; rolling, it swings round like a walking body
        if (b.hx === undefined || b.rollV <= start) { b.hx = wx; b.hy = wy; }
        else {
          const k = Math.min(1, TURN * dt);
          let hx = b.hx + (wx - b.hx) * k, hy = b.hy + (wy - b.hy) * k, hl = hyp(hx, hy);
          if (hl < 1e-6) { hx = wx; hy = wy; hl = 1; }
          b.hx = hx / hl; b.hy = hy / hl;
        }
        // about to reach the target: from here it runs straight on, through it and past it
        if (tgt) {
          const d = dist(tgt, b);
          if (d <= b.rollV * dt + TRAMPLE_WIDTH) { b.rollDir = d > 1e-6 ? [(tgt.x - b.x) / d, (tgt.y - b.y) / d] : [b.hx, b.hy]; b.rollPast = d + ROLL_PAST; }
        }
      }
      b.rollV = Math.min(top, b.rollV + (top - start) / b.u.roll * dt);
      if (b.rollPast > 0) { b.hx = b.rollDir[0]; b.hy = b.rollDir[1]; if (b.lock && b.lock.alive) b.intent = b.lock; } // running through and past its target
      const mv = b.rollV * moveMul(b) * dt;
      b.x += b.hx * mv; b.y += b.hy * mv; b.moved += mv;
      let stop = false;
      if (b.rollPast > 0) { b.rollPast -= mv; if (b.rollPast <= 1e-9) stop = true; }
      if (g.bounds) { // the edge of the board stops it too
        const x = Math.max(g.bounds.x0, Math.min(g.bounds.x1, b.x)), y = Math.max(g.bounds.y0, Math.min(g.bounds.y1, b.y));
        if (x !== b.x || y !== b.y) { b.x = x; b.y = y; stop = true; }
      }
      const seen = b.rolled || (b.rolled = []);
      for (const f of foes) {
        if (!f.alive || seen.includes(f) || hyp(f.x - b.x, f.y - b.y) > TRAMPLE_WIDTH) continue;
        seen.push(f);
        if (opts.record) shots.push([b.x, b.y, f.x, f.y, b.side, 1, 1, 0, 0]);
        hurt(b, f, b.u.hit, b.x, b.y);
      }
      if (stop && b.u.unfold && b.rolled && b.rolled.length) { b.u = { ...b.u, roll: 0, unfolded: true }; b.engaged = true; } // through its first enemy: it folds out
      if (stop) { b.rollPast = 0; b.rollV = start; b.rolled = null; }
    }

    // a healbot keeps close behind its squad (the middle of its bodies still standing); with the squad gone it stays put
    function escortMove(b) {
      let sx = 0, sy = 0, n = 0;
      for (const a of b.follow) if (a.alive) { sx += a.x; sy += a.y; n++; }
      if (!n) return;
      const dx = sx / n - b.x, dy = sy / n - b.y, d = hyp(dx, dy), keep = 2.5;
      if (d <= keep) return;
      const mv = Math.min(d - keep, spd(b) * moveMul(b) * dt);
      [b.hx, b.hy] = steer(b, sx / n, sy / n, dx / d, dy / d);
      b.x += b.hx * mv; b.y += b.hy * mv; b.moved += mv;
    }

    // a builder is done: its constructs stand where it worked, side by side across the direction of the enemy it saw
    function finishBuild(b) {
      b.buildT = 0; b.built = true;
      const bd = b.u.build, n = Math.max(1, Math.round(bd.count || 1)), [dx, dy] = b.buildDir;
      // a construct stands where it was built, unless it was made to move (Core Awoken)
      const cu = leveled(withTraits({ ...bd.unit, bodies: 1, construct: true, noCount: true, ...(bd.unit.speed > 0 ? {} : { speed: 0, anchored: true }) }), b.level);
      for (let k = 0; k < n; k++) {
        const off = (k - (n - 1) / 2) * BUILD_GAP;
        let x = b.x - dy * off, y = b.y + dx * off;
        if (g.bounds) { x = Math.max(g.bounds.x0, Math.min(g.bounds.x1, x)); y = Math.max(g.bounds.y0, Math.min(g.bounds.y1, y)); }
        const kid = newBody(cu, b.side, x, y, spawnNo[b.side]++, -1);
        kid.credit = b; // its XP and damage count for its builder's squad
        pendingKids.push(kid);
      }
    }

    // each unfinished building site gets the nearest builder that has no job yet
    for (const s of all) {
      if (!s.site || !s.alive) continue;
      s.site.start = s.site.work;
      if (s.site.work >= s.site.need) continue;
      let best = null, bd = Infinity;
      for (const b of sides[s.side]) if (b.u.build && !b.siteJob && b.alive) { const d = dist(b, s); if (d < bd) { bd = d; best = b; } }
      if (best) best.siteJob = s;
    }
    // a builder's turn while it has a site to build: walk there, then stand and build (see the builders in step())
    function siteWork(b) {
      const s = b.siteJob;
      if (!s.alive || s.site.work >= s.site.need) { b.siteJob = null; b.siteAt = false; return false; }
      const d = dist(s, b);
      b.siteAt = d <= SITE_REACH;
      if (b.siteAt) return true;
      const mv = Math.min(d - SITE_REACH * 0.8, spd(b) * moveMul(b) * dt);
      [b.hx, b.hy] = steer(b, s.x, s.y, (s.x - b.x) / d, (s.y - b.y) / d);
      b.x += b.hx * mv; b.y += b.hy * mv; b.moved += mv;
      return true;
    }

    // a drone circles its anchor (it falls with it): the offset turns by speed / r radians a tick, kept at r metres
    function orbitMove(b) {
      const o = b.orbit, a = o.anchor;
      if (!a.alive) { kill(null, b); return; }
      let ox = b.x - a.x, oy = b.y - a.y, d = hyp(ox, oy);
      if (d < 1e-6) { ox = o.r; oy = 0; d = o.r; }
      ox = ox / d * o.r; oy = oy / d * o.r;
      const c = cosDeg(Math.min(90, b.u.speed * moveMul(b) * dt / o.r * 57.29577951308232)), sn = Math.sqrt(Math.max(0, 1 - c * c));
      const nx = ox * c - oy * sn, ny = ox * sn + oy * c;
      b.hx = -ny / o.r; b.hy = nx / o.r;
      b.x = a.x + nx; b.y = a.y + ny;
    }
    // walk toward (x, y), stopping `stop` metres short; true once there
    function walkTo(b, x, y, stop) {
      const dx = x - b.x, dy = y - b.y, d = hyp(dx, dy);
      if (d <= stop + 1e-6) return true;
      const mv = Math.min(d - stop, spd(b) * moveMul(b) * dt);
      [b.hx, b.hy] = steer(b, x, y, dx / d, dy / d);
      b.x += b.hx * mv; b.y += b.hy * mv; b.moved += mv;
      return d - mv <= stop + 1e-6;
    }
    const mines = []; // { x, y, side, owner, hit, radius }
    // what a repairbot works on: the nearest of its side's buildings or tower that is damaged or not built yet
    const needsRepair = (v) => v.alive && (v.u.building || v.u.structure) && ((v.site && v.site.work < v.site.need) || v.hp < v.u.hp - 1e-9);
    function botMove(b) {
      if (b.u.bot === 'mine' && b.plant) {
        const sp = b.plant.spots[0];
        if (!sp) { b.plant = null; return; }
        if (walkTo(b, sp.x, sp.y, 0.1)) {
          const mn = b.plant.mine;
          mines.push({ x: sp.x, y: sp.y, side: b.side, owner: b, hit: mn.hit, radius: mn.radius });
          b.plant.spots.shift();
        }
        return;
      }
      if (b.u.bot === 'repair') {
        let best = null, bd = Infinity;
        for (const v of sides[b.side]) if (needsRepair(v)) { const d = dist(v, b); if (d < bd) { bd = d; best = v; } }
        b.repairing = best && walkTo(b, best.x, best.y, SITE_REACH * 0.8) ? best : null;
      }
    }

    // Grasping roots: let go of a target that is gone or in reach (it fights that one), grab the nearest free enemy
    // min..max metres away, and drag it in, hurting it
    function rootStep(b) {
      const rt = b.u.roots;
      let v = b.rootTgt;
      if (v && (!v.alive || v.turning || v.side === b.side || sheltered(v) || gap(v, b) > rt.max + 2 || gap(v, b) <= R(b))) {
        if (v.alive && v.side !== b.side && gap(v, b) <= R(b)) b.lock = v; // dragged into reach: it fights this one
        v.rootedBy = null; b.rootTgt = v = null;
      }
      if (!v) {
        let bd = Infinity;
        for (const f of sides[1 - b.side]) {
          if (!pickable(b, f) || !inSight(b, f) || f.u.structure || f.u.anchored || f.u.barrier || f.u.construct || f.u.unstoppable || (f.rootedBy && f.rootedBy.alive && f.rootedBy.rootTgt === f)) continue;
          const d = gap(f, b);
          if (d >= rt.min - 1e-9 && d <= rt.max + 1e-9 && d < bd) { bd = d; v = f; }
        }
        if (!v) return;
        b.rootTgt = v; v.rootedBy = b;
      }
      const d = dist(v, b), mv = Math.min(rt.pull * dt, Math.max(0, d - R(b) * 0.8));
      if (d > 1e-6) { v.x -= (v.x - b.x) / d * mv; v.y -= (v.y - b.y) / d * mv; }
      direct(b, v, rt.dps * dt);
    }

    let auraWas = false; // a body with an aura was standing last tick
    // Flow state: an attack made standing still adds a stack
    function flowStep(b) { if (b.u.flow && !(b.moved > 1e-6)) b.flow = Math.min(b.u.flow.max, (b.flow || 0) + 1); }
    // Waterhealing with no enemy in reach: a shot at the most wounded ally in reach (not itself); its splash heals
    function healShot(b) {
      let tgt = null, most = 1e-9;
      for (const a of sides[b.side]) {
        if (a === b || !a.alive || a.u.structure || a.u.aloft || a.boarded || a.turning || dist(a, b) > R(b) + 0.01) continue;
        if (a.u.hp - a.hp > most) { most = a.u.hp - a.hp; tgt = a; }
      }
      if (!tgt) { b.cd = Math.max(b.cd, -dt); return; }
      b.cd = Math.max(b.cd, -dt) + 1 / Math.max(0.01, apsOf(b));
      flowStep(b);
      fire(b, [tgt], false);
    }
    // Titanium spears: with armor left and an enemy in reach it spends 1 armor and forges (u.spear.forge s), then throws
    // the spear at the nearest enemy in reach (it holds a finished spear until there is one)
    function forgeSpear(b) {
      const sp = b.u.spear;
      if (b.forgeT > 0) { b.forgeT -= dt; if (b.forgeT > 1e-9) return; b.forgeT = 0; b.spearReady = true; }
      if (!b.spearReady && (b.u.defense === 'armor' ? b.u.defVal : 0) + (b.u.bonusArmor || 0) < 1 - 1e-9) return; // no armor left to forge with
      const valid = validTargets(b);
      if (!valid.length) return;
      if (b.spearReady) {
        const tgt = valid[0], dx = tgt.x - b.x, dy = tgt.y - b.y, d = hyp(dx, dy) || 1;
        b.spearReady = false;
        projectiles.push({ owner: b, x: b.x, y: b.y, fx: b.x, fy: b.y, tx: tgt.x, ty: tgt.y, dirX: dx / d, dirY: dy / d, left: d, hit: sp.hit, spear: true, speed: sp.speed, bleed: sp.bleed });
        return;
      }
      b.u = { ...b.u, bonusArmor: (b.u.bonusArmor || 0) - 1 }; // the armor goes into the spear
      b.forgeT = b.forgeFull = sp.forge;
    }

    function step() {
      if (over) return false;
      if (t >= g.timeCap || !aliveCount(A) || !aliveCount(B)) { over = true; return false; }
      shots = [];
      tick++;
      for (let k = 0; k < 2; k++) if (cripple[k] > 0) cripple[k] = Math.max(0, cripple[k] - dt);
      // map tiles under the units (checked before moving, so the tile a unit starts on always counts)
      if (tiles.length) for (const b of all) {
        if (!b.alive || b.u.structure || b.u.aloft) continue;
        for (const tl of tiles) if (b.alive && b.x >= tl.x0 && b.x < tl.x1 && b.y >= tl.y0 && b.y < tl.y1) onTile(b, tl);
      }
      // stealth: hidden until it attacks, and again after STEALTH_BACK s without attacking (roster rules can turn either off)
      for (const b of all) {
        if (!b.alive || !b.u.stealth) continue;
        if (!stealthOn) b.hidden = false;
        else if (!b.hidden && stealthBack && t - b.lastAtk >= STEALTH_BACK - 1e-9) b.hidden = true;
      }
      // a body with a start delay (deployed on a flank) can't move or attack until it runs out
      for (const b of all) if (b.delay > 0) b.delay = Math.max(0, b.delay - dt);
      // home ground (band = { y0, y1, armor, hpPct, on }): extra armor and health while the body stands between
      // y0 and y1 (its own zone); it loses both when it walks out, and gets them back if it returns
      for (const b of all) {
        if (!b.band || !b.alive) continue;
        const inside = b.y >= b.band.y0 && b.y <= b.band.y1;
