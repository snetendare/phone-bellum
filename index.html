<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phone Bellum">
<meta name="description" content="A small auto-battler. Deploy squads, counter your opponent, watch the armies fight. Play the AI or challenge a friend.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Phone Bellum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

/* Layout: one column, a war table at night. HUD on top, square board, controls under the thumb. Single dark look by choice. */
:root {
  --bg: #0D1315;
  --panel: #152125;
  --board: #13201F;
  --line: #27393D;
  --ink: #E5ECE9;
  --muted: #8DA1A1;
  --you: #5CC6DF;
  --foe: #EE6E5C;
  --gold: #E6B84A;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 28px; -webkit-tap-highlight-color: transparent; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { display: grid; gap: 4px; min-width: 0; }
.side.foe { text-align: right; }
.side .lbl { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 8px; }
.side.you .lbl { color: var(--you); }
.side.foe .lbl { color: var(--foe); flex-direction: row-reverse; }
.side .lbl .num { color: var(--ink); font-weight: 500; }
.hp { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.hp i { display: block; height: 100%; transition: width 0.6s ease; }
.side.you .hp i { background: var(--you); }
.side.foe .hp i { background: var(--foe); margin-left: auto; }
.round { text-align: center; font-family: var(--font-display); }
.round b { display: block; font-size: 22px; font-weight: 700; line-height: 1; }
.round span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Board */
.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--board); touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.tag-clock { position: absolute; top: 8px; left: 10px; font-family: var(--font-data); font-size: 12px; color: var(--muted); pointer-events: none; }
.overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: rgba(13, 19, 21, 0.86); text-align: center; }
.card { margin: auto; display: grid; gap: 10px; justify-items: center; max-width: 36ch; }
.card h2 { font-size: clamp(26px, 8vw, 38px); font-weight: 700; text-transform: uppercase; line-height: 1; }
.card h2.you { color: var(--you); }
.card h2.foe { color: var(--foe); }
.card p { margin: 0; color: var(--muted); }
.card .big { color: var(--ink); font-size: 17px; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; text-align: left; color: var(--muted); font-size: 13px; line-height: 1.35; }
.card ul li::before { content: "▸ "; color: var(--gold); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }

/* Controls */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.gold { font-family: var(--font-data); font-size: 16px; color: var(--gold); font-weight: 500; }
.deploys { font-size: 13px; color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }
.btn { border-radius: 4px; border: 1px solid var(--line); background: transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-family: var(--font-data); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--gold); }

.shop { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.uwrap { flex: 0 0 132px; scroll-snap-align: start; position: relative; display: grid; }
.ucard { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 10px 34px 9px 10px; background: var(--bg); display: grid; gap: 3px; align-content: start; }
.ucard[aria-pressed="true"] { border-color: var(--you); box-shadow: inset 0 0 0 1px var(--you); }
.ucard[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.ucard .t { font-family: var(--font-data); font-size: 12px; color: var(--you); letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 5px; }
.ucard .n { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.ucard .r { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ucard .c { font-family: var(--font-data); font-size: 12px; color: var(--gold); }
.uwrap .info { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-family: var(--font-display); font-size: 12px; display: grid; place-items: center; }

/* Unit sheet */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; align-items: end; justify-items: center; z-index: 5; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.sheet h3 { font-size: 22px; }
.sheet .role { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.stats span { color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.vs h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.vs .good h4 { color: var(--you); }
.vs .bad h4 { color: var(--foe); }
.vs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; }
.traits span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hp i { transition: none; } }

[hidden] { display: none !important; }
body { padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); margin: 0; }
.net { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: center; min-height: 18px; }
.net i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.net.ok i { background: #6FD08C; }
.net.bad { color: var(--foe); }
.net.bad i { background: var(--foe); }
.timer { font-family: var(--font-data); font-size: 20px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--foe); }
.code { font-family: var(--font-data); font-size: clamp(30px, 10vw, 44px); letter-spacing: 0.22em; color: var(--gold); padding-left: 0.22em; }
.linkbox { font-family: var(--font-data); font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; word-break: break-all; user-select: all; -webkit-user-select: all; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.joinrow { display: flex; gap: 8px; justify-content: center; }
.joinrow input { width: 9ch; font: 500 18px var(--font-data); letter-spacing: 0.16em; text-transform: uppercase; text-align: center; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.card .stack { display: grid; gap: 8px; justify-items: center; width: 100%; }
.card hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.status { font-size: 14px; color: var(--ink); }
.status.wait::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
a { color: var(--you); }
@media (prefers-reduced-motion: reduce) { .status.wait::after { animation: none; content: "…"; } }
</style>
</head>
<body>
<div class="app">
  <div class="hud" aria-label="Match status">
    <div class="side you"><div class="lbl"><span>You</span><span class="num" id="hp-you">40</span></div><div class="hp"><i id="hpbar-you" style="width:100%"></i></div></div>
    <div class="round"><b class="num" id="round">1</b><span id="phase">Deploy</span></div>
    <div class="side foe"><div class="lbl"><span id="foe-name">Enemy</span><span class="num" id="hp-foe">40</span></div><div class="hp"><i id="hpbar-foe" style="width:100%"></i></div></div>
  </div>
  <div class="net" id="net" hidden aria-live="polite"><i></i><span id="net-text"></span></div>

  <div class="board-wrap" id="wrap">
    <canvas id="board" aria-label="Battlefield. Your zone is the bottom four rows, the enemy zone the top four."></canvas>
    <span class="tag-clock" id="clock"></span>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<div class="sheet-back" id="sheet-back" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div></div>

<script src="peerjs.min.js"></script>
<script>
// ===== Unit shapes (shared by Counter Lab and the demo) =====
const Shapes = (() => {
  const LIST = ['circle', 'ring', 'square', 'triangle', 'diamond', 'pentagon', 'hexagon', 'star', 'cross', 'bar'];
  const LABELS = { circle: 'Circle', ring: 'Ring', square: 'Square', triangle: 'Triangle', diamond: 'Diamond', pentagon: 'Pentagon', hexagon: 'Hexagon', star: 'Star', cross: 'Cross', bar: 'Bar' };
  const DEFAULTS = {
    'Goblin Swarm': 'triangle', 'Skeleton Archers': 'diamond', 'Ember Imps': 'star', 'Fire Mage': 'hexagon',
    'Sniper': 'cross', 'Brute': 'square', 'Wisps': 'ring', 'Crossbow Volley': 'pentagon', 'Ballista': 'bar',
    'Boar Riders': 'circle', 'Spinning Golem': 'hexagon', 'Blunderbuss Crew': 'star', 'Ogre Smasher': 'square',
  };
  const valid = (s) => LIST.includes(s);
  // Unit colours: picked to stay clear of the team colours (blue and red), which outline every body
  const PALETTE = ['#9BD35A', '#E9E3CF', '#FFA94D', '#C77DFF', '#F7D154', '#8D99AE', '#E07A9B', '#B08155', '#3FD39A', '#B4A7F5', '#D9C49A', '#7FA650'];
  const DEFAULT_COLORS = {
    'Goblin Swarm': '#9BD35A', 'Skeleton Archers': '#E9E3CF', 'Ember Imps': '#FFA94D', 'Fire Mage': '#C77DFF',
    'Sniper': '#F7D154', 'Brute': '#8D99AE', 'Wisps': '#B4A7F5', 'Crossbow Volley': '#B08155', 'Ballista': '#D9C49A',
    'Boar Riders': '#E07A9B', 'Spinning Golem': '#7FA650', 'Blunderbuss Crew': '#3FD39A', 'Ogre Smasher': '#B08155',
  };
  const validColor = (c) => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);

  // Give every unit a shape and a colour: keep valid ones, else a known default, else the first one not used yet
  function assign(units) {
    const used = new Set(units.filter(u => valid(u.shape)).map(u => u.shape));
    const usedC = new Set(units.filter(u => validColor(u.color)).map(u => u.color.toUpperCase()));
    return units.map((u) => {
      let out = u;
      if (!valid(u.shape)) {
        let s = DEFAULTS[u.name];
        if (!s || used.has(s)) s = LIST.find(x => !used.has(x)) || LIST[used.size % LIST.length];
        used.add(s);
        out = { ...out, shape: s };
      }
      if (!validColor(u.color)) {
        let c = DEFAULT_COLORS[u.name];
        if (!c || usedC.has(c)) c = PALETTE.find(x => !usedC.has(x)) || PALETTE[usedC.size % PALETTE.length];
        usedC.add(c);
        out = { ...out, color: c };
      }
      return out;
    });
  }

  // Points of a regular polygon; up = 1 points toward the top of the screen, -1 toward the bottom
  function poly(ctx, x, y, r, n, rot) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI * 2 / n;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  // Builds the path for a shape. Returns true if the shape should be stroked instead of filled (ring).
  function path(ctx, shape, x, y, r, up = 1) {
    const top = up >= 0 ? -Math.PI / 2 : Math.PI / 2;
    switch (shape) {
      case 'square': ctx.beginPath(); ctx.rect(x - r * 0.88, y - r * 0.88, r * 1.76, r * 1.76); return false;
      case 'triangle': poly(ctx, x, y + (up >= 0 ? r * 0.15 : -r * 0.15), r * 1.25, 3, top); return false;
      case 'diamond': poly(ctx, x, y, r * 1.2, 4, top); return false;
      case 'pentagon': poly(ctx, x, y, r * 1.08, 5, top); return false;
      case 'hexagon': poly(ctx, x, y, r * 1.05, 6, 0); return false;
      case 'star': {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = top + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3;
          const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath(); return false;
      }
      case 'cross': {
        const a = r * 1.15, b = r * 0.42;
        ctx.beginPath();
        ctx.moveTo(x - b, y - a); ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y - b); ctx.lineTo(x + a, y - b);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x + b, y + b); ctx.lineTo(x + b, y + a); ctx.lineTo(x - b, y + a);
        ctx.lineTo(x - b, y + b); ctx.lineTo(x - a, y + b); ctx.lineTo(x - a, y - b); ctx.lineTo(x - b, y - b);
        ctx.closePath(); return false;
      }
      case 'bar': ctx.beginPath(); ctx.rect(x - r * 1.3, y - r * 0.55, r * 2.6, r * 1.1); return false;
      case 'ring': ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, Math.PI * 2); return true;
      default: ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); return false;
    }
  }

  // Draw a filled shape (a ring is drawn as a thick outline)
  function draw(ctx, shape, x, y, r, up = 1) {
    if (path(ctx, shape, x, y, r, up)) {
      const lw = ctx.lineWidth; ctx.lineWidth = Math.max(1.5, r * 0.45);
      ctx.strokeStyle = ctx.fillStyle; ctx.stroke(); ctx.lineWidth = lw;
    } else ctx.fill();
  }

  // Outline only, for highlights (level outline, health ring use their own arcs)
  function outline(ctx, shape, x, y, r, up = 1) { path(ctx, shape, x, y, r, up); ctx.stroke(); }

  // Small inline SVG icon in the current text colour
  function svg(shape, size = 14) {
    const c = size / 2, r = size * 0.36;
    const pts = (n, rr, rot, cy = c) => Array.from({ length: n }, (_, i) => {
      const a = rot + i * Math.PI * 2 / n; return `${(c + Math.cos(a) * rr).toFixed(2)},${(cy + Math.sin(a) * rr).toFixed(2)}`;
    }).join(' ');
    let body;
    switch (shape) {
      case 'square': body = `<rect x="${c - r * 0.88}" y="${c - r * 0.88}" width="${r * 1.76}" height="${r * 1.76}"/>`; break;
      case 'triangle': body = `<polygon points="${pts(3, r * 1.25, -Math.PI / 2, c + r * 0.15)}"/>`; break;
      case 'diamond': body = `<polygon points="${pts(4, r * 1.2, -Math.PI / 2)}"/>`; break;
      case 'pentagon': body = `<polygon points="${pts(5, r * 1.08, -Math.PI / 2)}"/>`; break;
      case 'hexagon': body = `<polygon points="${pts(6, r * 1.05, 0)}"/>`; break;
      case 'star': body = `<polygon points="${Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3; return `${(c + Math.cos(a) * rr).toFixed(2)},${(c + Math.sin(a) * rr).toFixed(2)}`; }).join(' ')}"/>`; break;
      case 'cross': { const a = r * 1.15, b = r * 0.42; body = `<polygon points="${[[-b, -a], [b, -a], [b, -b], [a, -b], [a, b], [b, b], [b, a], [-b, a], [-b, b], [-a, b], [-a, -b], [-b, -b]].map(([px, py]) => `${(c + px).toFixed(2)},${(c + py).toFixed(2)}`).join(' ')}"/>`; break; }
      case 'bar': body = `<rect x="${c - r * 1.3}" y="${c - r * 0.55}" width="${r * 2.6}" height="${r * 1.1}"/>`; break;
      case 'ring': body = `<circle cx="${c}" cy="${c}" r="${r * 0.8}" fill="none" stroke="currentColor" stroke-width="${Math.max(1.5, r * 0.45)}"/>`; break;
      default: body = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
    }
    return `<svg class="shape-icon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="currentColor" aria-hidden="true">${body}</svg>`;
  }

  // A body: filled with the unit's colour, outlined in its team colour
  function body(ctx, shape, x, y, r, up, fill, team, fillAlpha = 1) {
    ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill;
    draw(ctx, shape, x, y, r, up);
    ctx.globalAlpha = 1; ctx.strokeStyle = team; ctx.lineWidth = Math.max(1.5, Math.min(2.5, r * 0.32));
    outline(ctx, shape, x, y, shape === 'ring' ? r * 1.05 : r + 0.6, up);
  }

  return { LIST, LABELS, PALETTE, valid, validColor, assign, draw, outline, path, svg, body };
})();

// ===== Battle engine (shared by headless tests and the page) =====
const Engine = (() => {
  const TRAIT_DEFAULTS = { burst: 1, pellets: 1, spinUp: 0, pierce: 0, projSpeed: 0, minRange: 0, charge: 1, knockback: 0, windUp: 0 };
  const BURST_GAP = 0.15;      // seconds between shots in a burst
  const SHOTGUN_COS = Math.sqrt(3) / 2; // pellets spread 30 degrees to each side of the target (cos 30)
  // Only + - * / and sqrt from here on: those give identical results in every browser,
  // so two players' phones run exactly the same battle.
  const hyp = (x, y) => Math.sqrt(x * x + y * y);
  const SPIN_CAP = 3;          // spin-up tops out at 3x attack speed
  const CHARGE_RUN = 5;        // metres a unit must run before its next attack counts as a charge
  const PIERCE_DEPTH = 10;     // metres a piercing shot travels past its target
  const PIERCE_WIDTH = 1;      // half-width of the pierce corridor (m)
  const PROJ_HIT_RADIUS = 1;   // a projectile hits a body within this distance of where it lands

  const LEVEL_BONUS = 1;       // each upgrade adds +100% of starting health and hit (2x, then 3x)
  const MAX_LEVEL = 2;         // two upgrades on top of the base unit

  const withTraits = (u) => ({ ...TRAIT_DEFAULTS, defense: 'none', defVal: 0, level: 0, ...u });

  // Unit stats at a given level (defaults to the unit's own level field)
  function leveled(unit, level) {
    const u = withTraits(unit);
    const L = Math.max(0, Math.min(MAX_LEVEL, Math.round(level == null ? u.level : level)));
    if (!L) return { ...u, level: 0 };
    const k = 1 + LEVEL_BONUS * L;
    return { ...u, level: L, hp: u.hp * k, hit: u.hit * k };
  }

  function squadsFor(unit, g) {
    return Math.max(1, Math.floor(g.budget / Math.max(0.0001, unit.cost) + 1e-9));
  }

  // Raw strength of what the budget buys: total health x total damage per second
  function rawStrength(unit, g) {
    const u = leveled(unit);
    const s = squadsFor(u, g);
    const n = s * u.bodies;
    const hp = n * u.hp;
    const cycle = 1 / Math.max(0.01, u.aps); // wind-up only happens when the unit sets up after moving, so it isn't counted per attack
    const dps = n * u.hit / cycle * Math.max(1, u.burst) * Math.max(1, u.pellets);
    return { squads: s, bodies: n, hp, dps, strength: hp * dps };
  }

  function damageAfterDefense(hit, target, g) {
    if (target.u.defense === 'armor') return Math.max(hit - target.u.defVal, hit * g.minDmgPct / 100);
    if (target.u.defense === 'ward') return Math.min(hit, target.u.defVal);
    return hit;
  }

  function makeSide(unit, side, g) {
    const u = leveled(unit);
    const s = squadsFor(u, g);
    const n = s * u.bodies;
    const cols = Math.max(1, Math.min(n, Math.ceil(Math.sqrt(n * 2.5))));
    const sp = g.spacing;
    const bodies = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      const x = (c - (cols - 1) / 2) * sp;
      const y = (g.distance / 2 + r * sp) * (side === 0 ? -1 : 1);
      bodies.push(newBody(u, side, x, y, i, 0));
    }
    return bodies;
  }

  // `unit` must already be leveled (see leveled())
  function newBody(unit, side, x, y, i, squad) {
    const u = unit;
    const interval = 1 / Math.max(0.01, u.aps);
    return {
      u, side, x, y, hp: u.hp, alive: true, squad, level: u.level || 0, xp: 0,
      cd: ((i * 7) % 11) / 11 * interval, // deterministic stagger
      moved: 0, firing: -1, burstLeft: 0, burstTimer: 0, burstDir: [0, 1], windTarget: null, windT: 0, setUp: false,
    };
  }

  // Bodies of one squad placed around a point on the board (footprint about `size` metres)
  function buildSquad(unit, side, cx, cy, squad, size, startIndex = 0, level = 0) {
    const u = leveled(unit, level);
    const n = Math.max(1, Math.round(u.bodies));
    const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
    const sp = n === 1 ? 0 : Math.min(2.2, (size * 0.9) / Math.max(cols, rows));
    const out = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      out.push(newBody(u, side, cx + (c - (cols - 1) / 2) * sp, cy + (r - (rows - 1) / 2) * sp, startIndex + i, squad));
    }
    return out;
  }

  // Lab battle: one unit type per side in a standard formation
  function battle(uA, uB, g, opts = {}) {
    const bt = createBattle(makeSide(uA, 0, g), makeSide(uB, 1, g), g, opts);
    const frames = [];
    while (bt.step()) if (opts.record) frames.push(bt.frame());
    const r = bt.result();
    if (opts.record) frames.push(bt.frame(true));
    r.frames = frames;
    r.shapes = bt.bodies.map(b => b.u.shape || "circle");
    r.colors = bt.bodies.map(b => b.u.color || null);
    return r;
  }

  // A steppable battle between two lists of bodies (side 0 and side 1)
  function createBattle(A, B, g, opts = {}) {
    const all = A.concat(B);
    const sides = [A, B];
    const stats = [
      { dealt: 0, wasted: 0, blocked: 0, missed: 0, windLost: 0, winds: 0, totalHp: A.reduce((s, b) => s + b.u.hp, 0) },
      { dealt: 0, wasted: 0, blocked: 0, missed: 0, windLost: 0, winds: 0, totalHp: B.reduce((s, b) => s + b.u.hp, 0) },
    ];
    const dt = g.dt;
    let projectiles = [];
    let t = 0, shots = [], over = false;
    const dist = (a, b) => hyp(a.x - b.x, a.y - b.y);
    const aliveCount = (arr) => { let c = 0; for (const b of arr) if (b.alive) c++; return c; };

    function hurt(owner, v, hit, fromX, fromY) {
      const st = stats[owner.side];
      const dmg = damageAfterDefense(hit, v, g);
      st.blocked += hit - dmg;
      const applied = Math.min(dmg, v.hp);
      st.dealt += applied;
      st.wasted += dmg - applied;
      // experience: damage dealt, half of damage absorbed, and a bounty for killing leveled bodies
      owner.xp += applied;
      v.xp += applied * (g.absorbXp == null ? 0.5 : g.absorbXp);
      v.hp -= dmg;
      if (v.hp <= 0) { v.hp = 0; v.alive = false; owner.xp += v.u.hp * v.level; return; }
      if (owner.u.knockback > 0) {
        // big hits on small bodies push the full distance; on big bodies barely at all
        const push = owner.u.knockback * Math.min(1, hit / v.u.hp);
        const dx = v.x - fromX, dy = v.y - fromY, d = hyp(dx, dy) || 1;
        v.x += dx / d * push; v.y += dy / d * push;
      }
    }

    // Damage lands at point (px, py). direct = intended body for instant hits.
    function impact(owner, px, py, direct, hit, dirX, dirY, fromX, fromY) {
      const foes = sides[1 - owner.side];
      const hitSet = new Set();
      if (owner.u.splash > 0) {
        for (const f of foes) if (f.alive && hyp(f.x - px, f.y - py) <= owner.u.splash) hitSet.add(f);
      } else {
        let v = null;
        if (direct && direct.alive && !owner.u.projSpeed) v = direct;
        else {
          let bd = PROJ_HIT_RADIUS;
          for (const f of foes) { if (!f.alive) continue; const d = hyp(f.x - px, f.y - py); if (d <= bd) { bd = d; v = f; } }
        }
        if (v) hitSet.add(v);
      }
      if (!hitSet.size && owner.u.projSpeed > 0) stats[owner.side].missed += hit;
      // pierce: keep going along the shot line and hit the next bodies behind
      if (owner.u.pierce > 0) {
        const cand = [];
        for (const f of foes) {
          if (!f.alive || hitSet.has(f)) continue;
          const rx = f.x - px, ry = f.y - py;
          const along = rx * dirX + ry * dirY;
          const across = Math.abs(rx * dirY - ry * dirX);
          if (along > 0 && along <= PIERCE_DEPTH && across <= PIERCE_WIDTH) cand.push([along, f]);
        }
        cand.sort((a, b) => a[0] - b[0]);
        for (let k = 0; k < Math.min(owner.u.pierce, cand.length); k++) hitSet.add(cand[k][1]);
      }
      for (const v of hitSet) hurt(owner, v, hit, fromX, fromY);
    }

    // enemies the unit may attack right now, nearest first
    function validTargets(b) {
      const valid = [];
      for (const f of sides[1 - b.side]) {
        if (!f.alive) continue;
        const d = dist(f, b);
        if (d <= b.u.range + 0.01 && d >= b.u.minRange) valid.push([d, f]);
      }
      valid.sort((p, q) => p[0] - q[0]);
      return valid.map(v => v[1]);
    }

    // one shot, or a spread of shotgun pellets each at a different body in the cone
    function aim(b, primary, valid) {
      const n = Math.max(1, Math.round(b.u.pellets));
      if (n === 1) return [primary];
      const ax = primary.x - b.x, ay = primary.y - b.y, al = hyp(ax, ay);
      const cone = valid.filter(f => {
        const fx = f.x - b.x, fy = f.y - b.y, fl = hyp(fx, fy);
        if (!al || !fl) return true;
        return (ax * fx + ay * fy) / (al * fl) >= SHOTGUN_COS - 1e-12;
      });
      if (!cone.length) cone.push(primary);
      const out = [];
      for (let k = 0; k < n; k++) out.push(cone[k % cone.length]);
      return out;
    }

    function fire(b, targets, canCharge) {
      const charged = canCharge && b.u.charge > 1 && b.moved >= CHARGE_RUN;
      b.moved = 0;
      const hit = b.u.hit * (charged ? b.u.charge : 1);
      for (const tgt of targets) {
        const dx = tgt.x - b.x, dy = tgt.y - b.y, d = hyp(dx, dy) || 1;
        const dirX = dx / d, dirY = dy / d;
        if (b.u.projSpeed > 0) {
          projectiles.push({ owner: b, x: b.x, y: b.y, fx: b.x, fy: b.y, tx: tgt.x, ty: tgt.y, dirX, dirY, left: d, hit });
        } else {
          impact(b, tgt.x, tgt.y, tgt, hit, dirX, dirY, b.x, b.y);
        }
        if (opts.record) shots.push([b.x, b.y, tgt.x, tgt.y, b.side, b.u.splash, charged ? 1 : 0]);
      }
    }

    function step() {
      if (over) return false;
      if (t >= g.timeCap || !aliveCount(A) || !aliveCount(B)) { over = true; return false; }
      shots = [];
      // movement + targeting
      for (const b of all) {
        if (!b.alive) continue;
        const foes = sides[1 - b.side];
        let near = null, nd = Infinity;
        for (const f of foes) {
          if (!f.alive) continue;
          const d = dist(f, b);
          if (d < nd) { nd = d; near = f; }
        }
        b.near = near;
        if (near && nd > b.u.range) {
          const mv = Math.min(b.u.speed * dt, nd - b.u.range);
          b.x += (near.x - b.x) / nd * mv;
          b.y += (near.y - b.y) / nd * mv;
          b.moved += mv;
          // a unit with wind-up has to set up again after it moves; a charge in progress is lost
          if (b.u.windUp > 0 && mv > 0) {
            b.setUp = false;
            if (b.windTarget) { b.windTarget = null; stats[b.side].windLost++; }
          }
        }
      }
      // separation between allies
      const minSep = g.spacing * 0.7;
      for (let s = 0; s < 2; s++) {
        const arr = sides[s];
        for (let i = 0; i < arr.length; i++) {
          const a = arr[i]; if (!a.alive) continue;
          for (let j = i + 1; j < arr.length; j++) {
            const c = arr[j]; if (!c.alive) continue;
            const dx = c.x - a.x, dy = c.y - a.y;
            const d = hyp(dx, dy);
            if (d > 0 && d < minSep) {
              const push = (minSep - d) / 2;
              a.x -= dx / d * push; a.y -= dy / d * push;
              c.x += dx / d * push; c.y += dy / d * push;
            } else if (d === 0) {
              a.x -= minSep / 2; c.x += minSep / 2;
            }
          }
        }
      }
      // attacks
      for (const b of all) {
        if (!b.alive) continue;
        b.cd -= dt;
        if (b.firing >= 0) b.firing += dt;
        // follow-up shots of a running burst fly along the direction locked at the start
        // and hit the first enemy on that line; if the line is empty the shot misses
        if (b.burstLeft > 0) {
          b.burstTimer -= dt;
          if (b.burstTimer <= 0) {
            const [ux, uy] = b.burstDir;
            let first = null, fa = Infinity;
            for (const f of sides[1 - b.side]) {
              if (!f.alive) continue;
              const rx = f.x - b.x, ry = f.y - b.y;
              const along = rx * ux + ry * uy;
              const across = Math.abs(rx * uy - ry * ux);
              if (along >= b.u.minRange && along <= b.u.range + 0.01 && across <= PIERCE_WIDTH && along < fa) { fa = along; first = f; }
            }
            if (first) {
              fire(b, aim(b, first, validTargets(b)), false);
            } else {
              const end = { x: b.x + ux * b.u.range, y: b.y + uy * b.u.range };
              if (b.u.projSpeed > 0) fire(b, [end], false); // the projectile flies on and can still clip someone
              else {
                stats[b.side].missed += b.u.hit * Math.max(1, Math.round(b.u.pellets));
                if (opts.record) shots.push([b.x, b.y, end.x, end.y, b.side, 0, 0]);
              }
            }
            b.burstLeft--; b.burstTimer += BURST_GAP;
          }
        }
        let valid, primary;
        // wind-up: the unit sets up (like a sniper lying down) the first time an enemy is in range.
        // Once set up it fires normally at anything in range. It only sets up again after it has moved.
        if (b.u.windUp > 0 && !b.setUp) {
          if (b.windTarget) {
            b.windT -= dt;
            if (b.windT > 0) continue;
            b.windTarget = null; b.setUp = true;
            b.cd = 0; // reload starts with the first shot
            valid = validTargets(b);
            if (!valid.length) continue;
            primary = valid[0];
          } else {
            if (b.cd > 0) continue;
            valid = validTargets(b);
            if (!valid.length) continue;
            b.windTarget = valid[0]; b.windT = b.u.windUp; stats[b.side].winds++;
            continue;
          }
        } else {
          if (b.cd > 0) continue;
          valid = validTargets(b);
          if (!valid.length) continue;
          primary = valid[0];
        }
        if (b.firing < 0) b.firing = 0;
        const spin = b.u.spinUp > 0 ? Math.min(SPIN_CAP, 1 + b.u.spinUp / 100 * b.firing) : 1;
        // reload doesn't stack up while the unit has nothing to shoot: keep at most one step of carry-over
        b.cd = Math.max(b.cd, -dt) + 1 / Math.max(0.01, b.u.aps * spin);
        const n = Math.max(1, Math.round(b.u.burst));
        if (n > 1) {
          const dx = primary.x - b.x, dy = primary.y - b.y, d = hyp(dx, dy) || 1;
          b.burstLeft = n - 1; b.burstTimer = BURST_GAP; b.burstDir = [dx / d, dy / d];
          b.cd = Math.max(b.cd, (n - 1) * BURST_GAP + dt); // the next attack waits for the burst to finish
        }
        fire(b, aim(b, primary, valid), true);
      }
      // projectiles in flight
      if (projectiles.length) {
        // direct fire: a projectile hits the first enemy body it flies into;
        // if it reaches its aim point without touching anyone, it lands there (and may miss)
        const next = [];
        for (const p of projectiles) {
          const foes = sides[1 - p.owner.side];
          let mv = p.owner.u.projSpeed * dt, done = false;
          while (mv > 0 && !done) {
            const sub = Math.min(0.5, mv, p.left);
            p.x += p.dirX * sub; p.y += p.dirY * sub; p.left -= sub; mv -= sub;
            for (const f of foes) {
              if (f.alive && hyp(f.x - p.x, f.y - p.y) <= PROJ_HIT_RADIUS) {
                impact(p.owner, p.x, p.y, null, p.hit, p.dirX, p.dirY, p.fx, p.fy);
                done = true; break;
              }
            }
            if (!done && p.left <= 1e-6) {
              impact(p.owner, p.x, p.y, null, p.hit, p.dirX, p.dirY, p.fx, p.fy);
              done = true;
            }
          }
          if (!done) next.push(p);
        }
        projectiles = next;
      }
      t += dt;
      return true;
    }

    function frame(final) {
      return {
        t, shots: final ? [] : shots,
        p: final ? [] : projectiles.map(p => [p.x, p.y, p.owner.side]),
        b: all.map(x => [x.x, x.y, x.alive ? x.hp / x.u.hp : 0, x.side, x.windTarget && x.u.windUp > 0 ? 1 - x.windT / x.u.windUp : 0]),
      };
    }

    function result() {
      const remHp = sides.map(arr => arr.reduce((s, b) => s + (b.alive ? b.hp : 0), 0));
      const frac = [remHp[0] / stats[0].totalHp, remHp[1] / stats[1].totalHp];
      const aliveA = aliveCount(A), aliveB = aliveCount(B);
      let winner = -1, timeout = false;
      if (aliveA && !aliveB) winner = 0;
      else if (aliveB && !aliveA) winner = 1;
      else if (aliveA && aliveB) { timeout = true; winner = frac[0] > frac[1] ? 0 : frac[1] > frac[0] ? 1 : -1; }
      // survivors per squad: { squadId: { side, total, alive } }
      const squads = {};
      for (const b of all) {
        const k = b.side + ':' + b.squad;
        const s = squads[k] || (squads[k] = { side: b.side, squad: b.squad, total: 0, alive: 0, xp: 0 });
        s.total++; if (b.alive) s.alive++;
        s.xp += b.xp;
      }
      return {
        winner, timeout, time: t, frac,
        score: frac[0] - frac[1],
        survivors: [aliveA, aliveB], counts: [A.length, B.length],
        stats, squads,
      };
    }

    return { step, frame, result, bodies: all, isOver: () => over, time: () => t, lastShots: () => shots, projectiles: () => projectiles };
  }

  function matrix(units, g) {
    const n = units.length;
    const m = [];
    for (let i = 0; i < n; i++) {
      m.push([]);
      for (let j = 0; j < n; j++) {
        if (i === j) { m[i].push(null); continue; }
        if (j < i && m[j][i]) {
          const r = m[j][i];
          m[i].push({ ...r, score: -r.score, winner: r.winner === -1 ? -1 : 1 - r.winner, frac: [r.frac[1], r.frac[0]], mirrored: true });
        } else {
          m[i].push(battle(units[i], units[j], g));
        }
      }
    }
    return m;
  }

  return { battle, matrix, createBattle, buildSquad, rawStrength, squadsFor, withTraits, leveled, TRAIT_DEFAULTS, SPIN_CAP, CHARGE_RUN, LEVEL_BONUS, MAX_LEVEL };
})();
if (typeof module !== 'undefined') module.exports = Engine;

<script>
// ===== Match rules and AI (shared by headless tests and the page) =====
const Game = (() => {
  const E = (typeof Engine !== 'undefined') ? Engine : require('./engine.js');

  const COLS = 12, ROWS = 12, TILE = 6;
  const START_HP = 40, START_GOLD = 300, INCOME = 250, LOSER_BONUS = 100;
  const SQUAD_COST = 100, SQUAD_POINTS = 2;
  const SETTINGS = { dt: 0.05, timeCap: 60, spacing: 3.5, minDmgPct: 15, absorbXp: 1 };
  // XP a squad needs in total to reach level 1, 2, 3, as multiples of its own starting health.
  // XP = damage dealt + damage absorbed + bounty for killing leveled bodies.
  const XP_STEPS = [5, 12, 24];
  const xpNeeded = (unit, level) => unit.bodies * unit.hp * XP_STEPS[level];
  // deployments: how many new squads a side may place per round; extra ones can be bought for the round
  const CONFIG = { levelCostPerTier: 50, firstRoundDeploys: 3, deploysPerRound: 2, extraDeployCost: 50, deployCap: true };
  const deploysAllowed = (m, side) => CONFIG.deployCap
    ? (m.round === 1 ? CONFIG.firstRoundDeploys : CONFIG.deploysPerRound) + m.extraDeploys[side]
    : Infinity;
  const deployedThisRound = (m, side) => m.armies[side].filter(s => s.round === m.round).length;
  const deploysLeft = (m, side) => deploysAllowed(m, side) - deployedThisRound(m, side);
  // A unit's `cost` is in lab units: 1 = one standard squad (SQUAD_COST gold)
  const unitCostOf = (unit) => Math.max(10, Math.round((unit.cost || 1) * SQUAD_COST / 10) * 10);
  // Upgrades cost half the unit's price at the default setting (50 for a 100-gold squad)
  const levelCost = (unit) => Math.max(10, Math.round(CONFIG.levelCostPerTier * (unit.cost || 1) / 5) * 5);
  const AI = { levelPolicy: 'smart', maxExtraDeploys: 3 }; // levelPolicy: smart | never | all (for experiments)

  // rows 0-3: enemy zone (row 3 is its front), rows 4-7: no man's land, rows 8-11: player zone (row 8 is its front)
  const zoneRows = (side) => side === 0 ? [8, 9, 10, 11] : [3, 2, 1, 0];
  const inZone = (side, row) => side === 0 ? row >= 8 && row <= 11 : row >= 0 && row <= 3;
  const tileToWorld = (col, row) => ({ x: (col - (COLS - 1) / 2) * TILE, y: ((ROWS - 1) / 2 - row) * TILE });

  function rng(seed) { // mulberry32
    let a = seed >>> 0;
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }

  function createMatch(units, matrix, seed) {
    return {
      units, matrix, seed: seed >>> 0,
      round: 1, hp: [START_HP, START_HP], gold: [START_GOLD, START_GOLD],
      armies: [[], []], nextId: [1, 1], history: [], over: false, winner: -1,
      extraDeploys: [0, 0],
    };
  }

  function buyDeploy(m, side) {
    if (!CONFIG.deployCap || m.gold[side] < CONFIG.extraDeployCost) return false;
    m.gold[side] -= CONFIG.extraDeployCost;
    m.extraDeploys[side]++;
    return true;
  }

  // Refund an extra deployment bought this round that hasn't been used
  function refundDeploy(m, side) {
    if (m.extraDeploys[side] <= 0 || deploysLeft(m, side) <= 0) return false;
    m.extraDeploys[side]--;
    m.gold[side] += CONFIG.extraDeployCost;
    return true;
  }

  const occupied = (m, side, col, row) => m.armies[side].some(s => s.col === col && s.row === row);

  function place(m, side, unitIdx, col, row) {
    if (!inZone(side, row) || col < 0 || col >= COLS) return null;
    if (occupied(m, side, col, row)) return null;
    const cost = unitCostOf(m.units[unitIdx]);
    if (m.gold[side] < cost) return null;
    if (deploysLeft(m, side) <= 0) return null;
    const sq = { id: m.nextId[side]++, unit: unitIdx, col, row, round: m.round, xp: 0, level: 0, cost };
    m.armies[side].push(sq);
    m.gold[side] -= cost;
    return sq;
  }

  // Only squads bought this round can be taken back
  function unplace(m, side, col, row) {
    const i = m.armies[side].findIndex(s => s.col === col && s.row === row && s.round === m.round);
    if (i < 0) return false;
    const [sq] = m.armies[side].splice(i, 1);
    m.gold[side] += sq.cost;
    return true;
  }

  function bodiesFor(m, side) {
    const out = [];
    let idx = 0;
    for (const sq of m.armies[side]) {
      const w = tileToWorld(sq.col, sq.row);
      const b = E.buildSquad(m.units[sq.unit], side, w.x, w.y, sq.id, TILE, idx, sq.level);
      idx += b.length;
      out.push(...b);
    }
    return out;
  }

  function startBattle(m) {
    return E.createBattle(bodiesFor(m, 0), bodiesFor(m, 1), SETTINGS, { record: true });
  }

  // Damage a side deals = points of its squads, scaled by how much of each squad is still alive
  function survivorDamage(m, res, side) {
    let sum = 0;
    for (const k in res.squads) {
      const s = res.squads[k];
      if (s.side !== side || s.alive <= 0) continue;
      const sq = m.armies[side].find(q => q.id === s.squad);
      const value = sq ? (m.units[sq.unit].cost || 1) : 1; // pricier squads hit harder, like their price
      sum += SQUAD_POINTS * value * s.alive / s.total;
    }
    return sum > 0 ? Math.max(1, Math.round(sum)) : 0;
  }

  // Apply a finished battle to the match. Returns a summary for the results screen.
  function resolve(m, res) {
    const dmg = [0, 0]; // damage taken by each side
    let roundWinner = res.winner;
    if (res.timeout) {
      dmg[0] = survivorDamage(m, res, 1);
      dmg[1] = survivorDamage(m, res, 0);

        const r = res.squads[side + ':' + sq.id];

  function aiLevel(m, side) {

    const bought = [];

    let reserve = 0;
    if (AI.levelPolicy !== 'never') {

        if (!isReady(m, sq)) continue;

    while (m.gold[side] - reserve >= minCost && guard++ < 60) {

        if (m.extraDeploys[side] >= AI.maxExtraDeploys || m.gold[side] - reserve < minCost + CONFIG.extraDeployCost) break;
        if (!buyDeploy(m, side)) break;

    $('hp-you').textContent = hpMe; $('hp-foe').textContent = hpFoe;
    $('hpbar-you').style.width = (hpMe / Game.START_HP * 100) + '%';
    $('hpbar-foe').style.width = (hpFoe / Game.START_HP * 100) + '%';
    $('round').textContent = v ? v.round : 1;
    $('phase').textContent = { start: 'Ready', lobby: 'Lobby', deploy: 'Deploy', battle: 'Battle', result: 'Result', end: 'Match over' }[phase];
    $('foe-name').textContent = mode === 'ai' ? 'Enemy' : 'Opponent';
  }

  function setNet(text, state) {
    const n = $('net');
    if (!text) { n.hidden = true; return; }
    n.hidden = false; n.className = 'net' + (state ? ' ' + state : '');
    $('net-text').textContent = text;
  }
  function netStatus() {
    if (mode === 'ai') { setNet(''); return; }
    if (net.connected) setNet(mode === 'host' ? `Match ${net.code} · opponent connected` : `Match ${net.code} · connected`, 'ok');
    else if (phase === 'lobby') setNet('');
    else setNet(mode === 'host' ? `Opponent disconnected. Waiting for them to come back…` : 'Connection lost. Reconnecting…', 'bad');
  }

  // ---------- countdown ----------
  const fmtClock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const editable = () => phase === 'deploy' && !ready[me] && !timeUp;

  function tick() {
    const t = now();
    if (phase === 'deploy') {
      // host: the countdown waits while the opponent is away
      if (mode === 'host' && !net.connected && deadline) { pausedLeft = Math.max(5000, deadline - t); deadline = 0; panelDeploy(); }
      const el = $('timer');
      if (deadline) {
        const left = deadline - t;
        if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left <= 5000); }
        $('clock').textContent = left > 0 ? `${fmtClock(left)} to deploy` : 'Time’s up';
        if (mode !== 'guest' && left <= (mode === 'host' ? -500 : 0)) runFight();
        else if (mode === 'guest' && left <= 0 && !timeUp) { timeUp = true; selected = null; closeSheet(); sendSide(); panelDeploy(); render(); }
      } else if (el) { el.textContent = mode === 'ai' ? '' : 'paused'; el.classList.remove('low'); }
    }
    if ((phase === 'result' || phase === 'end') && resultShownAt) {
      const left = resultShownAt + NEXT_SECONDS * 1000 - t;
      const nb = $('pbtn');
      if (phase === 'result' && !nextReady[me]) {
        if (left <= 0) tapNext();
        else if (nb && mode !== 'ai') nb.textContent = `Next round · ${Math.ceil(left / 1000)}`;
      }
    }
  }
  setInterval(tick, 200);

  // ---------- panel ----------
  function panelDeploy() {
    if (phase !== 'deploy') return;
    const g = m.gold[me];
    const fresh = m.armies[me].filter(s => s.round === m.round).length;
    const readyN = m.armies[me].filter(s => Game.isReady(m, s)).length;
    const left = Game.deploysLeft(m, me), allowed = Game.deploysAllowed(m, me);
    const price = (i) => Game.unitCostOf(units[i]);
    const can = editable();
    const canBuy = (i) => can && g >= price(i) && left > 0;
    let hint;
    if (!can) hint = timeUp ? 'Time’s up. The fight is about to start.' : 'You’re ready. Tap Not ready to make changes.';
    else {
      hint = selected !== null
        ? (canBuy(selected) ? `Tap a tile in your zone to place ${esc(units[selected].name)}.` : left <= 0 ? 'No deployments left this round.' : `Not enough gold for ${esc(units[selected].name)}.`)
        : (fresh ? 'Tap a squad you placed this round to take it back.' : 'Pick a unit, then tap a tile in the bottom four rows.');
      if (left <= 0 && selected === null) hint = `No deployments left. Buy one more for ${Game.CONFIG.extraDeployCost} gold, or spend gold on upgrades.`;
      if (readyN && selected === null) hint = `${readyN} squad${readyN === 1 ? ' is' : 's are'} ready to level up. Tap ${readyN === 1 ? 'it' : 'one'} to upgrade.`;
    }
    const extraBtns = `<span style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn small" id="buy-deploy" ${can && g >= Game.CONFIG.extraDeployCost ? '' : 'disabled'}>+1 deployment · ${Game.CONFIG.extraDeployCost}</button>
        ${can && m.extraDeploys[me] > 0 && left > 0 ? `<button class="btn small" id="refund-deploy">Refund unused</button>` : ''}
      </span>`;
    let action, status;
    if (mode === 'ai') {
      status = `${m.armies[me].length} squad${m.armies[me].length === 1 ? '' : 's'} on the board`;
      action = `<button class="btn primary" id="fight" ${m.armies[me].length ? '' : 'disabled'}>${deadline ? 'Fight now' : 'Fight'}</button>`;
    } else {
      const away = mode === 'host' && !net.connected;
      status = away ? 'Opponent is away. The clock is paused.' : ready[foe()] ? 'Opponent is ready.' : 'Opponent is deploying.';
      action = `<button class="btn ${ready[me] ? '' : 'primary'}" id="ready" ${timeUp ? 'disabled' : ''}>${ready[me] ? 'Not ready' : 'Ready'}</button>`;
    }
    $('panel').innerHTML = `
      <div class="bar"><span class="gold num">${g} gold</span><span class="deploys num">${Math.max(0, left)} of ${allowed} deployments left</span><span class="timer" id="timer">${deadline ? fmtClock(deadline - now()) : ''}</span></div>
      <div class="bar"><span class="hint">${hint}</span>${extraBtns}</div>
      <div class="shop" id="shop">${units.map((u, i) => `
        <div class="uwrap">
          <button class="ucard" data-i="${i}" aria-pressed="${selected === i}" aria-disabled="${!canBuy(i)}">
            <span class="t"><span style="color:${u.color};display:inline-flex">${Shapes.svg(u.shape, 13)}</span> ${tag(u)}</span><span class="n">${esc(u.name)}</span>
            <span class="c">${price(i)} · ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'}</span>
          </button>
          <button class="info" data-info="${i}" aria-label="About ${esc(u.name)}">i</button>
        </div>`).join('')}</div>
      <div class="bar"><span class="hint">${status}</span>${action}</div>`;
    const shop = $('shop');
    shop.scrollLeft = shopScroll;
    shop.addEventListener('scroll', () => { shopScroll = shop.scrollLeft; }, { passive: true });
    shop.querySelectorAll('.ucard').forEach(b => b.addEventListener('click', () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      const i = +b.dataset.i;
      selected = selected === i ? null : i;
      panelDeploy(); render();
    }));
    shop.querySelectorAll('[data-info]').forEach(el => el.addEventListener('click', () => openSheet(+el.dataset.info)));
    if ($('fight')) $('fight').addEventListener('click', runFight);
    if ($('ready')) $('ready').addEventListener('click', toggleReady);
    $('buy-deploy').addEventListener('click', () => { if (editable() && Game.buyDeploy(m, me)) changed(); });
    if ($('refund-deploy')) $('refund-deploy').addEventListener('click', () => { if (editable() && Game.refundDeploy(m, me)) changed(); });
    tick();
  }

  // After the player changes their own side
  function changed() {
    panelDeploy(); render();
    if (mode === 'guest') sendSide();
    if (mode === 'host') saveHost();
  }

  function toggleReady() {
    if (phase !== 'deploy' || timeUp) return;
    ready[me] = !ready[me];
    if (ready[me]) { selected = null; closeSheet(); }
    if (mode === 'guest') sendSide();
    if (mode === 'host') { sendStatus(); if (ready[0] && ready[1] && net.connected) { runFight(); return; } }
    panelDeploy(); render();
  }

  function panelBattle() {
    $('panel').innerHTML = `
      <div class="bar">
        <div class="seg" role="group" aria-label="Playback speed">
          ${[1, 2, 4].map(s => `<button data-s="${s}" aria-pressed="${speed === s}">${s}×</button>`).join('')}
        </div>
        <button class="btn small" id="skip">Skip to result</button>
      </div>
      <span class="hint">Blue is you, red is the ${mode === 'ai' ? 'enemy' : 'opponent'}. Battles speed up on their own after 20 seconds.</span>`;
    $('panel').querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
      speed = +b.dataset.s;
      $('panel').querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.s === speed)));
    }));
    $('skip').addEventListener('click', () => { while (bt.step()) {} finishBattle(); });
  }

  function panelInfo(text, btnLabel, onClick, extra = '') {
    $('panel').innerHTML = `<div class="bar"><span class="hint">${text}</span><span class="btnrow">${extra}${btnLabel ? `<button class="btn primary" id="pbtn">${btnLabel}</button>` : ''}</span></div>`;
    if (btnLabel) $('pbtn').addEventListener('click', onClick);
  }

  // ---------- overlays ----------
  function overlay(html) {
    const o = $('overlay');
    if (!html) { o.hidden = true; o.innerHTML = ''; return; }
    o.hidden = false; o.innerHTML = html;
  }

  function showStart() {
    leaveNet();
    mode = 'ai'; me = 0; phase = 'start'; m = null; bt = null; battlePre = null; deadline = 0; resultShownAt = 0;
    hud(); netStatus(); $('clock').textContent = '';
    let resume = null;
    try { resume = JSON.parse(localStorage.getItem(HOST_STORE) || 'null'); } catch (e) {}
    if (resume && !(resume.m && now() - resume.ts < 6 * 3600e3)) resume = null;
    overlay(`<div class="card">
      <span class="eyebrow">A small auto-battler</span>
      <h2>Phone Bellum</h2>
      <ul>
        <li>Buy squads with gold each round. A standard squad costs ${Game.SQUAD_COST}.</li>
        <li>Place them in the bottom four rows. They stay for the whole match.</li>
        <li>You have ${DEPLOY_SECONDS} seconds to deploy, then the armies fight on their own.</li>
        <li>The loser takes damage from every enemy squad still standing.</li>
        <li>You see the enemy’s earlier squads while you deploy, so build counters.</li>
        <li>3 deployments in round 1, then 2 per round. Extra ones cost ${Game.CONFIG.extraDeployCost} gold.</li>
        <li>Squads earn experience. A gold + means you can upgrade it: level 2 doubles health and attack, level 3 triples them.</li>
      </ul>
    </div>`);
    $('panel').innerHTML = `
      ${resume ? `<button class="btn primary" id="resume">Resume match ${esc(resume.code)}</button>` : ''}
      <div class="bar">
        <button class="btn ${resume ? '' : 'primary'}" id="friend" style="flex:1">Challenge a friend</button>
        <button class="btn" id="go" style="flex:1">Play vs AI</button>
      </div>
      <div class="bar">
        <span class="hint">Got a code from a friend?</span>
        <span class="joinrow"><input id="code-in" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Match code" placeholder="CODE"><button class="btn" id="join">Join</button></span>
      </div>
      <span class="hint" id="join-msg" aria-live="polite" hidden></span>
      <div class="bar">
        <span class="hint">Playing with ${customSet ? `your ${units.length} units from Counter Lab` : `the ${units.length} built-in units`}.</span>
        <span class="btnrow"><button class="btn small" id="load-units">Load units</button><a class="btn small" href="lab.html" style="text-decoration:none;color:inherit;display:inline-block">Counter Lab</a></span>
      </div>
      <div class="bar">
        <span class="hint">Deploy timer vs AI</span>
        <div class="seg" role="group" aria-label="Deploy timer vs AI">
          <button data-tm="1" aria-pressed="${timerOn}">${DEPLOY_SECONDS} s</button><button data-tm="0" aria-pressed="${!timerOn}">Off</button>
        </div>
      </div>
      <div class="bar">
        <span class="hint">Level-up cost (test setting)</span>
        <div class="seg" role="group" aria-label="Level-up cost">
          ${[50, 75].map(c => `<button data-c="${c}" aria-pressed="${Game.CONFIG.levelCostPerTier === c}">${c} gold</button>`).join('')}
        </div>
      </div>`;
    $('friend').addEventListener('click', hostLobby);
    $('go').addEventListener('click', startAiMatch);
    if ($('resume')) $('resume').addEventListener('click', () => resumeHost(resume));
    $('load-units').addEventListener('click', openLoader);
    const joinNow = () => {
      const c = $('code-in').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length !== 5) { $('join-msg').hidden = false; $('join-msg').textContent = 'Codes are 5 letters and numbers.'; return; }
      joinMatch(c);
    };
    $('join').addEventListener('click', joinNow);
    $('code-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinNow(); });
    $('panel').querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
      Game.CONFIG.levelCostPerTier = +b.dataset.c;
      $('panel').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }));
    $('panel').querySelectorAll('[data-tm]').forEach(b => b.addEventListener('click', () => {
      timerOn = b.dataset.tm === '1';
      $('panel').querySelectorAll('[data-tm]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }));
    size(); render();
  }

  function showResult(sum) {
    const iWon = sum.winner === me && !sum.timeout, iLost = sum.winner === foe() && !sum.timeout;
    const head = sum.timeout ? 'Time ran out' : iWon ? `Round ${sum.round} won` : iLost ? `Round ${sum.round} lost` : 'Draw';
    const cls = iWon ? 'you' : iLost ? 'foe' : '';
    const them = mode === 'ai' ? 'Enemy' : 'Opponent';
    const lines = [];
    if (sum.dmg[foe()]) lines.push(`${them} takes <b class="num">${sum.dmg[foe()]}</b> damage.`);
    if (sum.dmg[me]) lines.push(`You take <b class="num">${sum.dmg[me]}</b> damage.`);
    if (!sum.dmg[0] && !sum.dmg[1]) lines.push('Nobody takes damage.');
    const lv = (list) => list.map(x => `${esc(units[x.unit].name)} (to level ${x.level + 1})`).join(', ');
    const lvLines = [];
    if (mode === 'ai' && lastAiLevels.length) lvLines.push(`<p><span style="color:var(--gold)">Enemy leveled up before the fight:</span> ${lv(lastAiLevels)}.</p>`);
    if (sum.newlyReady[me].length) lvLines.push(`<p><span style="color:var(--gold)">Ready to level up:</span> ${lv(sum.newlyReady[me])}.</p>`);
    resultShownAt = now();
    if (m.over) {
      const win = m.winner === me, loss = m.winner === foe();
      phase = 'end'; hud(); netStatus();
      const wait = mode !== 'ai' && rematch[me];
      overlay(`<div class="card">
        <span class="eyebrow">After ${m.history.length} rounds</span>
        <h2 class="${win ? 'you' : loss ? 'foe' : ''}">${win ? 'Victory' : loss ? 'Defeat' : 'Draw'}</h2>
        <p class="big">${lines.join(' ')}</p>
        ${mode !== 'ai' && rematch[foe()] && !rematch[me] ? '<p>Your opponent wants a rematch.</p>' : ''}
        <div class="btnrow">
          ${mode === 'ai' ? '<button class="btn primary" id="again">Play again</button>'
            : `<button class="btn primary" id="again" ${wait ? 'disabled' : ''}>${wait ? 'Waiting for opponent…' : 'Rematch'}</button>`}
          <button class="btn" id="menu">Main menu</button>
        </div>
      </div>`);
      if (mode === 'ai') panelInfo('The AI buys units that counter what you fielded last round.', 'Play again', startAiMatch);
      else panelInfo(wait ? 'Waiting for your opponent to accept the rematch.' : 'A rematch starts when you both tap Rematch.', wait ? '' : 'Rematch', askRematch);
      $('again').addEventListener('click', mode === 'ai' ? startAiMatch : askRematch);
      $('menu').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
      return;
    }
    phase = 'result'; hud(); netStatus();
    const bonus = sum.bonusTo === me ? ` You get ${Game.LOSER_BONUS} extra for losing the round.` : sum.bonusTo === foe() ? ` The ${them.toLowerCase()} gets ${Game.LOSER_BONUS} extra for losing the round.` : '';
    const waiting = mode !== 'ai' && nextReady[me];
    overlay(`<div class="card">
      <span class="eyebrow">${Math.round(sum.time)} s of fighting</span>
      <h2 class="${cls}">${head}</h2>
      <p class="big">${lines.join(' ')}</p>
      ${lvLines.join('')}
      <p>Next round: +${Game.INCOME} gold each.${bonus}</p>
      ${waiting ? '<p class="status wait">Waiting for your opponent</p>' : `<button class="btn primary" id="next">Next round</button>`}
    </div>`);
    if (waiting) panelInfo('The next round starts when your opponent is ready too.', '', null);
    else panelInfo('Your squads keep their tiles. Add more to counter what you just saw.', 'Next round', tapNext);
    if ($('next')) $('next').addEventListener('click', tapNext);
  }

  // ---------- flow: vs AI ----------
  function startAiMatch() {
    leaveNet();
    mode = 'ai'; me = 0;
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0);
    nextReady = [false, false]; rematch = [false, false];
    beginAiRound();
  }

  function beginAiRound() {
    Game.aiDeploy(m, 1);       // the AI commits first; its new squads stay hidden until the fight
    enterDeploy(timerOn ? DEPLOY_SECONDS * 1000 : 0);
  }

  function enterDeploy(ms) {
    phase = 'deploy'; bt = null; battlePre = null; fx = []; selected = null; timeUp = false; resultShownAt = 0;
    ready = [false, false];
    deadline = ms > 0 ? now() + ms : 0;
    $('clock').textContent = '';
    closeSheet(); overlay(null); hud(); netStatus(); panelDeploy(); size(); render();
  }

  function tapNext() {
    if (phase !== 'result') return;
    if (mode === 'ai') { beginAiRound(); return; }
    nextReady[me] = true;
    if (mode === 'guest') send({ t: 'next', round: lastSummary && lastSummary.round });
    else { sendStatus(); saveHost(); if (!checkNext()) showResult(lastSummary); return; }
    showResult(lastSummary);
  }

  function askRematch() {
    if (phase !== 'end' || mode === 'ai') return;
    rematch[me] = true;
    if (mode === 'guest') send({ t: 'rematch' });
    else { sendStatus(); if (checkRematch()) return; }
    showResult(lastSummary);
  }

  // ---------- the fight (vs AI and host) ----------
  const snapshot = (match) => JSON.parse(JSON.stringify({ ...match, units: null, matrix: null }));
  const withUnits = (s) => ({ ...s, units, matrix: M });

  function runFight() {
    if (phase !== 'deploy' || !m) return;
    if (mode === 'guest') return;
    closeSheet(); selected = null;
    lastAiLevels = mode === 'ai' ? Game.aiLevel(m, 1) : []; // the AI spends its level-ups now
    const pre = snapshot(m);
    // work out the result first; both screens then play the same battle back
    const sim = Game.startBattle(m);
    while (sim.step()) {}
    const summary = Game.resolve(m, sim.result());
    lastSummary = summary; nextReady = [false, false]; rematch = [false, false];
    if (mode === 'host') { send({ t: 'fight', pre, post: snapshot(m), summary }); saveHost(); }
    playBattle(pre);
  }

  function playBattle(pre) {
    phase = 'battle'; selected = null; deadline = 0; timeUp = false;
    battlePre = withUnits(pre);
    bt = Game.startBattle(battlePre);
    fx = []; acc = 0; lastTs = 0;
    closeSheet(); overlay(null); hud(); panelBattle(); render();
    cancelAnimationFrame(raf);
    if (reduced) { while (bt.step()) {} finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function absorb() {
    for (const s of bt.lastShots()) fx.push({ kind: 'shot', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], splash: s[5], charged: s[6], age: 0, life: 0.18 });
    for (const b of bt.bodies) if (!b.alive && !b._gone) { b._gone = true; fx.push({ kind: 'death', x: b.x, y: b.y, r: radius(b.u), side: b.side, age: 0, life: 0.5 }); }
  }

  function loop(ts) {
    if (phase !== 'battle') return;
    const dtReal = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
    const boost = bt.time() > 20 ? 2 : 1;
    acc += dtReal * speed * boost;
    while (acc >= Game.SETTINGS.dt) {
      acc -= Game.SETTINGS.dt;
      if (!bt.step()) break;
      absorb();
    }
    for (const e of fx) e.age += dtReal * speed * boost;
    fx = fx.filter(e => e.age < e.life);
    $('clock').textContent = `${bt.time().toFixed(1)} s${boost > 1 ? ' · speeding up' : ''}`;
    render();
    if (bt.isOver()) { finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function finishBattle() {
    if (phase !== 'battle') return;
    cancelAnimationFrame(raf);
    fx = [];
    const res = bt.result();
    $('clock').textContent = `${res.time.toFixed(1)} s`;
    if (lastSummary && (res.winner !== lastSummary.winner || Math.abs(res.time - lastSummary.time) > 1e-6)) {
      console.warn('Phone Bellum: this screen’s replay differs from the host’s result; the host’s result counts.');
    }
    battlePre = null;
    render();
    showResult(lastSummary);
  }

  // ---------- board input ----------
  function tileAt(ev) {
    const r = cv.getBoundingClientRect();
    const c = Math.floor((ev.clientX - r.left) / r.width * Game.COLS);
    const rw = Math.floor((ev.clientY - r.top) / r.height * Game.ROWS);
    if (c < 0 || rw < 0 || c >= Game.COLS || rw >= Game.ROWS) return null;
    return { col: scol(c), row: srow(rw) }; // screen -> model (the flip is its own inverse)
  }
  cv.addEventListener('pointermove', (ev) => {
    if (phase !== 'deploy' || ev.pointerType !== 'mouse') return;
    hoverTile = tileAt(ev); render();
  });
  cv.addEventListener('pointerleave', () => { hoverTile = null; if (phase === 'deploy') render(); });
  cv.addEventListener('click', (ev) => {
    if (phase !== 'deploy') return;
    const t = tileAt(ev); if (!t) return;
    const own = m.armies[me].find(s => s.col === t.col && s.row === t.row);
    if (own) {
      if (own.round === m.round) { if (editable() && Game.unplace(m, me, t.col, t.row)) changed(); }
      else openSheet(own.unit, own, me);
      return;
    }
    const enemy = m.armies[foe()].find(s => s.col === t.col && s.row === t.row && s.round < m.round);
    if (enemy) { openSheet(enemy.unit, enemy, foe()); return; }
    if (selected !== null && editable() && Game.inZone(me, t.row)) {
      if (Game.place(m, me, selected, t.col, t.row)) {
        if (m.gold[me] < Game.unitCostOf(units[selected]) || Game.deploysLeft(m, me) <= 0) selected = null;
        changed();
      }
    }
  });

  // ---------- unit sheet ----------
  function openSheet(i, sq, side) {
    const base = units[i];
    const u = sq ? Engine.leveled(base, sq.level) : base;
    let lvl = '';
    if (sq) {
      const next = sq.level < Engine.MAX_LEVEL ? Math.round(Game.xpNeeded(base, sq.level)) : null;
      const shown = next ? Math.min(Math.round(sq.xp), next) : 0;
      lvl = `<p style="margin:0"><span style="color:var(--gold)">Level ${sq.level + 1}${sq.level ? ` · ${sq.level + 1}× health and attack` : ''}</span> · ${next ? `${shown.toLocaleString('en-US')} / ${next.toLocaleString('en-US')} XP to level ${sq.level + 2}` : 'max level'}</p>`;
      if (side === me && phase === 'deploy') {
        const cost = Game.levelCost(base);
        const boughtNow = sq.boughtLevels && sq.boughtLevels[m.round] > 0;
        const btns = [];
        if (Game.isReady(m, sq)) btns.push(m.gold[me] >= cost && editable()
          ? `<button class="btn primary" id="lvl-up">Level up · ${cost} gold</button>`
          : `<button class="btn primary" disabled>${editable() ? `Need ${cost} gold` : `Level up · ${cost} gold`}</button>`);

    const bad = units.map((v, j) => [row[j], v.name]).filter(x => x[0] < -0.3).sort((a, b) => a[0] - b[0]).slice(0, 3);

    $('sheet').innerHTML = `
      <div class="bar"><h3 id="sheet-h"><span style="color:${u.color}">${Shapes.svg(u.shape, 18)}</span> ${esc(u.name)}</h3><button class="btn small" id="close">Close</button></div>
      <p class="role" style="margin:0">${ROLES[u.name] && !customSet ? ROLES[u.name] : customSet ? `From a Counter Lab roster · ${Game.unitCostOf(base)} gold` : ''}</p>
      ${lvl}
      ${tr.length ? `<div class="traits">${tr.map(x => `<span>${x}</span>`).join('')}</div>` : ''}

        <div><span>Hit</span>${Math.round(u.hit)}</div><div><span>Attacks/s</span>${u.aps}</div>
        <div><span>Range</span>${u.range} m</div><div><span>Speed</span>${u.speed} m/s</div>
      </div>
      <div class="vs">
        <div class="good"><h4>Strong against</h4><ul>${good.length ? good.map(x => `<li>${esc(x[1])}</li>`).join('') : '<li>No hard counters</li>'}</ul></div>
        <div class="bad"><h4>Weak against</h4><ul>${bad.length ? bad.map(x => `<li>${esc(x[1])}</li>`).join('') : '<li>No hard counters</li>'}</ul></div>
      </div>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    const after = () => { changed(); openSheet(i, sq, side); };

  }
  function closeSheet() { $('sheet-back').hidden = true; loaderRun++; }

  // ---------- load units from Counter Lab ----------
  let loaderRun = 0;
  function* matrixGen(us) {
    const n = us.length, out = us.map(() => Array(n).fill(0));
    const total = n * (n - 1) / 2;
    let done = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const r = Engine.battle(us[i], us[j], MATRIX_SETTINGS);
      out[i][j] = +r.score.toFixed(3); out[j][i] = -out[i][j];

  }

  }
  function openLoader() {
    const lab = labRoster();

      <div class="bar"><h3 id="sheet-h">Load units</h3><button class="btn small" id="close">Close</button></div>
      ${lab ? `<p class="role" style="margin:0">Counter Lab on this device has ${lab.units.length} units.</p>
      <div class="bar"><span></span><button class="btn primary" id="use-lab">Use my Counter Lab units</button></div>
      <p class="role" style="margin:0">Or paste a roster copied with Copy roster:</p>`
      : `<p class="role" style="margin:0">Open <a href="lab.html">Counter Lab</a> on this device and your units show up here. Or paste a roster copied with Copy roster:</p>`}
      <textarea id="roster-in" spellcheck="false" placeholder="Paste your roster here" aria-label="Roster text"
        style="min-height:110px;font:12px var(--font-data);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%"></textarea>
      <div class="bar">
        ${customSet ? '<button class="btn" id="builtin">Use built-in units</button>' : '<span></span>'}
        <button class="btn ${lab ? '' : 'primary'}" id="use-roster">Use pasted units</button>
      </div>
      <p class="hint" id="load-msg" aria-live="polite" style="margin:0"></p>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    if ($('builtin')) $('builtin').addEventListener('click', () => {
      try { localStorage.removeItem(STORE); } catch (e) {}
      useSet(BUILTIN, false); closeSheet(); showStart();
    });
    const msg = $('load-msg');
    const load = (p) => {
      const list = Array.isArray(p) ? p : p && p.units;
      if (!validUnits(list)) { msg.textContent = 'The roster needs 2 to 30 units, each with a name, a cost above 0 and all eight levers.'; return; }
      // Counter Lab costs are in gold (100 = one standard squad); older rosters used 1 = one squad
      const gold = (p && p.goldCosts) || list.some(u => u.cost >= 10);
      const clean = list.map(u => ({ ...u, level: 0, cost: gold ? u.cost / 100 : u.cost }));
      const prepared = clean.map(u => ({ ...Engine.withTraits(u), level: 0, bodies: Math.max(1, Math.round(u.bodies)) }));
      const id = ++loaderRun;

            closeSheet(); showStart();
            return;
          }
        }

        setTimeout(step, 0);
      })();
    };
    if ($('use-lab')) $('use-lab').addEventListener('click', () => load(lab));
    $('use-roster').addEventListener('click', () => {
      let p;
      try { p = JSON.parse($('roster-in').value); } catch (e) { msg.textContent = 'That text isn’t a roster. Copy it again with Copy roster in Counter Lab.'; return; }

    });
  }
  $('sheet-back').addEventListener('click', (e) => { if (e.target.id === 'sheet-back') closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  // =====================================================================
  // Live matches: PeerJS (WebRTC). The host runs the match and decides results;
  // the guest sends its own deployments and plays back the same battle.
  // =====================================================================
  const net = { peer: null, conn: null, code: '', connected: false, retryTimer: 0, tries: 0, alive: false };
  const peerOpts = () => {
    const o = { debug: 1 };
    if (qs.get('peerhost')) { o.host = qs.get('peerhost'); o.port = +qs.get('peerport') || 9000; o.path = qs.get('peerpath') || '/'; o.secure = qs.get('peersecure') === '1'; }
    return o;
  };
  const shareLink = () => {
    const u = new URL(location.href.split('#')[0]);

    u.searchParams.set('join', net.code);

  const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');

  }

  // ----- host -----
  function hostLobby() {
    if (!peerAvailable()) { overlayMsg('Couldn’t load the multiplayer code', 'Check your connection and reload the page.'); return; }
    leaveNet();
    mode = 'host'; me = 0; m = null; phase = 'lobby';
    net.code = newCode();
    clearHost();
    hud(); netStatus(); render();
    drawLobby();
    hostOpen(true);
  }

  function hostOpen(fresh) {
    net.alive = true;
    const peer = new Peer(PEER_PREFIX + net.code, peerOpts());
    net.peer = peer;
    peer.on('open', () => { net.tries = 0; if (phase === 'lobby') drawLobby(); });

    peer.on('error', (err) => {
      console.warn('peer', err.type, err);

      }
    });
  }

  function drawLobby(problem) {
    const link = shareLink();
    const here = net.connected;
    overlay(`<div class="card">
      <span class="eyebrow">Challenge a friend · match code</span>
      <span class="code" aria-label="Match code">${net.code}</span>
      <p class="status ${here ? '' : 'wait'}" id="lobby-status">${problem ? esc(problem) : here ? 'Your friend is here!' : (net.peer && net.peer.open ? 'Waiting for your friend to open the link' : 'Setting up the match')}</p>
      <button class="btn primary" id="start" ${here ? '' : 'disabled'}>Start match</button>
    </div>`);
    $('panel').innerHTML = `
      <span class="hint">Send your friend this link. It works in any browser and nobody needs an account. Keep this page open while they join.</span>
      <div class="linkbox" id="link">${esc(link)}</div>
      <div class="bar">
        <span class="btnrow">

  function hostBeginRound() {

  }

  // ----- guest -----
  function joinMatch(code) {

    peer.on('error', (err) => {

  function retryConnect(ms) {

  function connectToHost() {
    const peer = net.peer;

    net.tries++;

    c.on('close', () => {
      clearTimeout(giveUp);
      if (c === net.conn) { net.connected = false; net.conn = null; netStatus(); if (phase === 'deploy') panelDeploy(); retryConnect(1500); }

  function guestWaiting(text) {
    overlay(`<div class="card">
      <span class="eyebrow">Live match</span>

  function sendSide() {

  function guestRecv(d) {

      if (d.phase === 'lobby' || !d.m) { m = null; phase = 'lobby'; hud(); render(); guestWaiting('Connected. Waiting for your friend to start the match'); return; }
      const incoming = withUnits(d.m);
      const theirReady = d.ready ? !!d.ready[0] : false;
      nextReady[0] = d.nextReady ? !!d.nextReady[0] : false;
      rematch[0] = d.rematch ? !!d.rematch[0] : false;
      if (d.phase === 'deploy') {

          sendSide(); panelDeploy(); render(); hud();
        } else {
          m = incoming; lastSummary = d.summary || lastSummary;
          nextReady = [false, false]; rematch = [false, false];
          enterDeploy(d.remaining > 0 ? d.remaining - 300 : 0);
          ready[0] = theirReady; panelDeploy();
        }
        return;
      }
      // result or end
      if (phase === 'battle' && d.summary && lastSummary && d.summary.round === lastSummary.round) return; // still watching this battle
      m = incoming; lastSummary = d.summary;
      nextReady[1] = d.nextReady ? !!d.nextReady[1] : false;
      rematch[1] = d.rematch ? !!d.rematch[1] : false;
      if (lastSummary) { if (phase !== 'result' && phase !== 'end') bt = null; showResult(lastSummary); }
      render();
    } else if (d.t === 'fight') {
      if (!d.pre || !d.post || !d.summary) return;
      m = withUnits(d.post); lastSummary = d.summary;
      nextReady = [false, false]; rematch = [false, false];
      playBattle(d.pre);
    } else if (d.t === 'status') {
      if (d.ready) ready[0] = !!d.ready[0];
      if (d.nextReady) nextReady[0] = !!d.nextReady[0];
      if (d.rematch) rematch[0] = !!d.rematch[0];
      if (phase === 'deploy') panelDeploy();
      else if (phase === 'end') showResult(lastSummary);
    }
  }

  function overlayMsg(head, text) {
    overlay(`<div class="card"><h2>${esc(head)}</h2><p>${esc(text)}</p><button class="btn primary" id="ok">OK</button></div>`);
    $('ok').addEventListener('click', showStart);
  }

  // Phones pause pages in the background; reconnect when the page comes back
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !net.alive || !net.peer) return;
    if (net.peer.disconnected && !net.peer.destroyed) net.peer.reconnect();
    if (mode === 'guest' && !net.connected) retryConnect(300);
  });

  window.addEventListener('resize', () => { size(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { size(); render(); });
  const joinCode = (qs.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (joinCode.length === 5) { showStart(); joinMatch(joinCode); }
  else showStart();
})();
</script>
</body>
</html>
