<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phone Bellum">
<meta name="description" content="A small auto-battler. Deploy squads, counter your opponent, watch the armies fight. Play the AI or challenge a friend.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Phone Bellum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>

/* Layout: one column, a war table at night. HUD on top, square board, controls under the thumb. Single dark look by choice. */
:root {
  --bg: #0D1315;
  --panel: #152125;
  --board: #13201F;
  --line: #27393D;
  --ink: #E5ECE9;
  --muted: #8DA1A1;
  --you: #5CC6DF;
  --foe: #EE6E5C;
  --gold: #E6B84A;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 28px; -webkit-tap-highlight-color: transparent; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { display: grid; gap: 4px; min-width: 0; }
.side.foe { text-align: right; }
.side .lbl { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 8px; }
.side.you .lbl { color: var(--you); }
.side.foe .lbl { color: var(--foe); flex-direction: row-reverse; }
.side .lbl .num { color: var(--ink); font-weight: 500; }
.hp { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.hp i { display: block; height: 100%; transition: width 0.6s ease; }
.side.you .hp i { background: var(--you); }
.side.foe .hp i { background: var(--foe); margin-left: auto; }
.round { text-align: center; font-family: var(--font-display); }
.round b { display: block; font-size: 22px; font-weight: 700; line-height: 1; }
.round span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Board */
.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--board); touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.tag-clock { position: absolute; top: 8px; left: 10px; font-family: var(--font-data); font-size: 12px; color: var(--muted); pointer-events: none; }
.overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: rgba(13, 19, 21, 0.86); text-align: center; }
.card { margin: auto; display: grid; gap: 10px; justify-items: center; max-width: 36ch; }
.card h2 { font-size: clamp(26px, 8vw, 38px); font-weight: 700; text-transform: uppercase; line-height: 1; }
.card h2.you { color: var(--you); }
.card h2.foe { color: var(--foe); }
.card p { margin: 0; color: var(--muted); }
.card .big { color: var(--ink); font-size: 17px; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; text-align: left; color: var(--muted); font-size: 13px; line-height: 1.35; }
.card ul li::before { content: "▸ "; color: var(--gold); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }

/* Controls */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.gold { font-family: var(--font-data); font-size: 16px; color: var(--gold); font-weight: 500; }
.deploys { font-size: 13px; color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }
.btn { border-radius: 4px; border: 1px solid var(--line); background: transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-family: var(--font-data); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--gold); }

.shop { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.uwrap { flex: 0 0 132px; scroll-snap-align: start; position: relative; display: grid; }
.ucard { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 10px 34px 9px 10px; background: var(--bg); display: grid; gap: 3px; align-content: start; }
.ucard[aria-pressed="true"] { border-color: var(--you); box-shadow: inset 0 0 0 1px var(--you); }
.ucard[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.ucard .t { font-family: var(--font-data); font-size: 12px; color: var(--you); letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 5px; }
.ucard .n { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.ucard .r { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ucard .c { font-family: var(--font-data); font-size: 12px; color: var(--gold); }
.uwrap .info { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-family: var(--font-display); font-size: 12px; display: grid; place-items: center; }

/* Unit sheet */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; align-items: end; justify-items: center; z-index: 5; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.sheet h3 { font-size: 22px; }
.sheet .role { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.stats span { color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.vs h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.vs .good h4 { color: var(--you); }
.vs .bad h4 { color: var(--foe); }
.vs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; }
.traits span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hp i { transition: none; } }

[hidden] { display: none !important; }
body { padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); margin: 0; }
.net { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: center; min-height: 18px; }
.net i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.net.ok i { background: #6FD08C; }
.net.bad { color: var(--foe); }
.net.bad i { background: var(--foe); }
.timer { font-family: var(--font-data); font-size: 20px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--foe); }
.code { font-family: var(--font-data); font-size: clamp(30px, 10vw, 44px); letter-spacing: 0.22em; color: var(--gold); padding-left: 0.22em; }
.linkbox { font-family: var(--font-data); font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; word-break: break-all; user-select: all; -webkit-user-select: all; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.joinrow { display: flex; gap: 8px; justify-content: center; }
.joinrow input { width: 9ch; font: 500 18px var(--font-data); letter-spacing: 0.16em; text-transform: uppercase; text-align: center; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.card .stack { display: grid; gap: 8px; justify-items: center; width: 100%; }
.card hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.status { font-size: 14px; color: var(--ink); }
.status.wait::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
a { color: var(--you); }
/* unit shop: one tab per tier, rarity colours, locked units greyed out */
.tiers { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.tiers button { min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--muted); padding: 6px 6px; font: 600 14px var(--font-display); display: grid; gap: 1px; text-align: left; border-top: 3px solid var(--tier); }
.tiers button em { font: 600 11px var(--font-display); font-style: normal; color: var(--tier); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button small { font: 500 10px var(--font-data); letter-spacing: -0.03em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button[aria-selected="true"] { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--tier); }
.ucard { border-top: 3px solid var(--tier, var(--line)) !important; }
.ucard .tier { font: 600 10px var(--font-data); letter-spacing: 0.08em; color: var(--tier); text-transform: uppercase; }
.ucard[data-locked] { opacity: 0.55; background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(255,255,255,0.03) 8px 16px), var(--bg); }
.ucard[data-locked] .t > span:first-child { filter: grayscale(1); }
.ucard[data-locked] .n { color: var(--muted); }
.ucard .lock { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--font-data); color: var(--gold); }
/* role symbols on unit cards and in the info sheet */
.roles { display: flex; align-items: center; gap: 5px; }
.roles svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.roles .is, .roles .ex { color: var(--ink); }
.roles .beats { color: var(--you); }
.roles .rng { color: var(--muted); margin-left: auto; }
.ucard .roles { margin: 2px -26px 1px 0; }
.ucard[data-locked] .roles { filter: grayscale(1); }
.roleline { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.roleline .roles .rng { margin-left: 0; }
.confirm { display: grid; gap: 8px; border: 1px solid var(--gold); border-radius: 6px; padding: 10px; }
@media (prefers-reduced-motion: reduce) { .status.wait::after { animation: none; content: "…"; } }
</style>
</head>
<body>
<div class="app">
  <div class="hud" aria-label="Match status">
    <div class="side you"><div class="lbl"><span>You</span><span class="num" id="hp-you">50</span></div><div class="hp"><i id="hpbar-you" style="width:100%"></i></div></div>
    <div class="round"><b class="num" id="round">1</b><span id="phase">Deploy</span></div>
    <div class="side foe"><div class="lbl"><span id="foe-name">Enemy</span><span class="num" id="hp-foe">50</span></div><div class="hp"><i id="hpbar-foe" style="width:100%"></i></div></div>
  </div>
  <div class="net" id="net" hidden aria-live="polite"><i></i><span id="net-text"></span></div>

  <div class="board-wrap" id="wrap" style="aspect-ratio: 12 / 16; width: min(100%, calc((100svh - 300px) * 0.75)); margin: 0 auto;">
    <canvas id="board" aria-label="Battlefield. Your zone is the bottom six rows, the enemy zone the top six, with four rows of no man's land between."></canvas>
    <span class="tag-clock" id="clock"></span>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<div class="sheet-back" id="sheet-back" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"></div></div>

<script src="peerjs.min.js"></script>
<script>
// ===== Unit shapes (shared by Counter Lab and the demo) =====
const Shapes = (() => {
  const LIST = ['circle', 'ring', 'square', 'triangle', 'diamond', 'pentagon', 'hexagon', 'star', 'cross', 'bar'];
  const LABELS = { circle: 'Circle', ring: 'Ring', square: 'Square', triangle: 'Triangle', diamond: 'Diamond', pentagon: 'Pentagon', hexagon: 'Hexagon', star: 'Star', cross: 'Cross', bar: 'Bar' };
  const DEFAULTS = {
    'Goblin Swarm': 'triangle', 'Skeleton Archers': 'diamond', 'Ember Imps': 'star', 'Fire Mage': 'hexagon',
    'Sniper': 'cross', 'Brute': 'square', 'Wisps': 'ring', 'Crossbow Volley': 'pentagon', 'Ballista': 'bar',
    'Boar Riders': 'circle', 'Spinning Golem': 'hexagon', 'Blunderbuss Crew': 'star', 'Ogre Smasher': 'square',
  };
  const valid = (s) => LIST.includes(s);
  // Unit colours: picked to stay clear of the team colours (blue and red), which outline every body
  const PALETTE = ['#9BD35A', '#E9E3CF', '#FFA94D', '#C77DFF', '#F7D154', '#8D99AE', '#E07A9B', '#B08155', '#3FD39A', '#B4A7F5', '#D9C49A', '#7FA650'];
  const DEFAULT_COLORS = {
    'Goblin Swarm': '#9BD35A', 'Skeleton Archers': '#E9E3CF', 'Ember Imps': '#FFA94D', 'Fire Mage': '#C77DFF',
    'Sniper': '#F7D154', 'Brute': '#8D99AE', 'Wisps': '#B4A7F5', 'Crossbow Volley': '#B08155', 'Ballista': '#D9C49A',
    'Boar Riders': '#E07A9B', 'Spinning Golem': '#7FA650', 'Blunderbuss Crew': '#3FD39A', 'Ogre Smasher': '#B08155',
  };
  const validColor = (c) => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);

  // Give every unit a shape and a colour: keep valid ones, else a known default, else the first one not used yet
  function assign(units) {
    const used = new Set(units.filter(u => valid(u.shape)).map(u => u.shape));
    const usedC = new Set(units.filter(u => validColor(u.color)).map(u => u.color.toUpperCase()));
    return units.map((u) => {
      let out = u;
      if (!valid(u.shape)) {
        let s = DEFAULTS[u.name];
        if (!s || used.has(s)) s = LIST.find(x => !used.has(x)) || LIST[used.size % LIST.length];
        used.add(s);
        out = { ...out, shape: s };
      }
      if (!validColor(u.color)) {
        let c = DEFAULT_COLORS[u.name];
        if (!c || usedC.has(c)) c = PALETTE.find(x => !usedC.has(x)) || PALETTE[usedC.size % PALETTE.length];
        usedC.add(c);
        out = { ...out, color: c };
      }
      return out;
    });
  }

  // Points of a regular polygon; up = 1 points toward the top of the screen, -1 toward the bottom
  function poly(ctx, x, y, r, n, rot) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI * 2 / n;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  // Builds the path for a shape. Returns true if the shape should be stroked instead of filled (ring).
  function path(ctx, shape, x, y, r, up = 1) {
    const top = up >= 0 ? -Math.PI / 2 : Math.PI / 2;
    switch (shape) {
      case 'square': ctx.beginPath(); ctx.rect(x - r * 0.88, y - r * 0.88, r * 1.76, r * 1.76); return false;
      case 'triangle': poly(ctx, x, y + (up >= 0 ? r * 0.15 : -r * 0.15), r * 1.25, 3, top); return false;
      case 'diamond': poly(ctx, x, y, r * 1.2, 4, top); return false;
      case 'pentagon': poly(ctx, x, y, r * 1.08, 5, top); return false;
      case 'hexagon': poly(ctx, x, y, r * 1.05, 6, 0); return false;
      case 'star': {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = top + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3;
          const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath(); return false;
      }
      case 'cross': {
        const a = r * 1.15, b = r * 0.42;
        ctx.beginPath();
        ctx.moveTo(x - b, y - a); ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y - b); ctx.lineTo(x + a, y - b);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x + b, y + b); ctx.lineTo(x + b, y + a); ctx.lineTo(x - b, y + a);
        ctx.lineTo(x - b, y + b); ctx.lineTo(x - a, y + b); ctx.lineTo(x - a, y - b); ctx.lineTo(x - b, y - b);
        ctx.closePath(); return false;
      }
      case 'bar': ctx.beginPath(); ctx.rect(x - r * 1.3, y - r * 0.55, r * 2.6, r * 1.1); return false;
      case 'ring': ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, Math.PI * 2); return true;
      default: ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); return false;
    }
  }

  // Draw a filled shape (a ring is drawn as a thick outline)
  function draw(ctx, shape, x, y, r, up = 1) {
    if (path(ctx, shape, x, y, r, up)) {
      const lw = ctx.lineWidth; ctx.lineWidth = Math.max(1.5, r * 0.45);
      ctx.strokeStyle = ctx.fillStyle; ctx.stroke(); ctx.lineWidth = lw;
    } else ctx.fill();
  }

  // Outline only, for highlights (level outline, health ring use their own arcs)
  function outline(ctx, shape, x, y, r, up = 1) { path(ctx, shape, x, y, r, up); ctx.stroke(); }

  // Small inline SVG icon in the current text colour
  function svg(shape, size = 14) {
    const c = size / 2, r = size * 0.36;
    const pts = (n, rr, rot, cy = c) => Array.from({ length: n }, (_, i) => {
      const a = rot + i * Math.PI * 2 / n; return `${(c + Math.cos(a) * rr).toFixed(2)},${(cy + Math.sin(a) * rr).toFixed(2)}`;
    }).join(' ');
    let body;
    switch (shape) {
      case 'square': body = `<rect x="${c - r * 0.88}" y="${c - r * 0.88}" width="${r * 1.76}" height="${r * 1.76}"/>`; break;
      case 'triangle': body = `<polygon points="${pts(3, r * 1.25, -Math.PI / 2, c + r * 0.15)}"/>`; break;
      case 'diamond': body = `<polygon points="${pts(4, r * 1.2, -Math.PI / 2)}"/>`; break;
      case 'pentagon': body = `<polygon points="${pts(5, r * 1.08, -Math.PI / 2)}"/>`; break;
      case 'hexagon': body = `<polygon points="${pts(6, r * 1.05, 0)}"/>`; break;
      case 'star': body = `<polygon points="${Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3; return `${(c + Math.cos(a) * rr).toFixed(2)},${(c + Math.sin(a) * rr).toFixed(2)}`; }).join(' ')}"/>`; break;
      case 'cross': { const a = r * 1.15, b = r * 0.42; body = `<polygon points="${[[-b, -a], [b, -a], [b, -b], [a, -b], [a, b], [b, b], [b, a], [-b, a], [-b, b], [-a, b], [-a, -b], [-b, -b]].map(([px, py]) => `${(c + px).toFixed(2)},${(c + py).toFixed(2)}`).join(' ')}"/>`; break; }
      case 'bar': body = `<rect x="${c - r * 1.3}" y="${c - r * 0.55}" width="${r * 2.6}" height="${r * 1.1}"/>`; break;
      case 'ring': body = `<circle cx="${c}" cy="${c}" r="${r * 0.8}" fill="none" stroke="currentColor" stroke-width="${Math.max(1.5, r * 0.45)}"/>`; break;
      default: body = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
    }
    return `<svg class="shape-icon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="currentColor" aria-hidden="true">${body}</svg>`;
  }

  // A body: filled with the unit's colour, outlined in its team colour
  function body(ctx, shape, x, y, r, up, fill, team, fillAlpha = 1) {
    ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill;
    draw(ctx, shape, x, y, r, up);
    ctx.globalAlpha = 1; ctx.strokeStyle = team; ctx.lineWidth = Math.max(1.5, Math.min(2.5, r * 0.32));
    outline(ctx, shape, x, y, shape === 'ring' ? r * 1.05 : r + 0.6, up);

    }
    // structures (towers) don't count: a side is beaten when its units are gone
    const aliveCount = (arr) => { let c = 0; for (const b of arr) if (b.alive && !b.u.structure) c++; return c; };

    function hurt(owner, v, hit, fromX, fromY) {
      const st = stats[owner.side];
      if (cripple[owner.side] > 0) hit = hit * (1 - towerDown.attack / 100);
      // Shield: the whole hit is blocked, however big, and it brings no poison
      if (v.shield > 0) { v.shield--; st.blocked += hit; return; }
      let dmg = damageAfterDefense(hit, v, g);
      // damage the target's armor turned away earns it a little experience (g.armorXp per point, default 0.5)
      const armor = (v.u.defense === 'armor' ? v.u.defVal : 0) + (v.u.bonusArmor || 0);
      if (armor > 0) v.xp += (hit - Math.max(hit - armor, hit * g.minDmgPct / 100)) * (g.armorXp == null ? 0.5 : g.armorXp);
      if (cripple[v.side] > 0) dmg = dmg * (1 + towerDown.taken / 100);
      st.blocked += hit - dmg;
      const applied = Math.min(dmg, v.hp);
      st.dealt += applied;
      owner.dealt = (owner.dealt || 0) + applied;
      st.wasted += dmg - applied;
      // experience: damage dealt, half of damage absorbed, and a bounty for killing leveled bodies
      owner.xp += applied;
      v.xp += applied * (g.absorbXp == null ? 0.5 : g.absorbXp);
      v.hp -= dmg;
      if (v.hp <= 0) { v.hp = 0; v.alive = false; v.diedTick = tick; owner.xp += v.u.hp * v.level; fell(v); return; }
      if (owner.u.poisonPct > 0) {
        // poison: a share of the hit, spread over its duration. Each attacker keeps one dose on the target;
        // its next hit refreshes that dose. Doses from different attackers add up.
        const dps = hit * owner.u.poisonPct / 100 / owner.u.poisonDur;
        const list = v.poison || (v.poison = []);
        const dose = list.find(p => p.src === owner);
        if (dose) { dose.dps = dps; dose.t = owner.u.poisonDur; } else list.push({ src: owner, dps, t: owner.u.poisonDur });
      }
      if (owner.u.slowDur > 0) {
        // slow: the stronger effect counts, and the longest remaining time
        if (!(v.slowT > 0)) { v.slowMove = 0; v.slowAtk = 0; }
        v.slowMove = Math.max(v.slowMove, owner.u.slowMove || 0);
        v.slowAtk = Math.max(v.slowAtk, owner.u.slowAtk || 0);
        v.slowT = Math.max(v.slowT, owner.u.slowDur);
      }
      if (owner.u.shrinkM > 0) {
        v.shrinkM = v.shrinkT > 0 ? Math.max(v.shrinkM, owner.u.shrinkM) : owner.u.shrinkM;
        v.shrinkT = Math.max(v.shrinkT, owner.u.shrinkDur);
      }
      if (owner.u.knockback > 0 && !v.u.structure) {
        // big hits on small bodies push the full distance; on big bodies barely at all
        const push = owner.u.knockback * Math.min(1, hit / v.u.hp);
        const dx = v.x - fromX, dy = v.y - fromY, d = hyp(dx, dy) || 1;
        v.x += dx / d * push; v.y += dy / d * push;
      }
    }

    // Damage lands at point (px, py). direct = intended body for instant hits.
    function impact(owner, px, py, direct, hit, dirX, dirY, fromX, fromY) {
      const foes = sides[1 - owner.side];
      const hitSet = new Set();
      if (owner.u.splash > 0) {
        for (const f of foes) if (f.alive && hyp(f.x - px, f.y - py) <= owner.u.splash) hitSet.add(f);
      } else {
        let v = null;
        if (direct && direct.alive && !owner.u.projSpeed) v = direct;
        else {
          let bd = PROJ_HIT_RADIUS;
          for (const f of foes) { if (!f.alive) continue; const d = hyp(f.x - px, f.y - py); if (d <= bd) { bd = d; v = f; } }
        }
        if (v) hitSet.add(v);
      }
      if (!hitSet.size && owner.u.projSpeed > 0) stats[owner.side].missed += hit;
      // pierce: keep going along the shot line and hit the next bodies behind
      if (owner.u.pierce > 0) {
        const cand = [];
        for (const f of foes) {
          if (!f.alive || hitSet.has(f)) continue;
          const rx = f.x - px, ry = f.y - py;
          const along = rx * dirX + ry * dirY;
          const across = Math.abs(rx * dirY - ry * dirX);
          if (along > 0 && along <= PIERCE_DEPTH && across <= PIERCE_WIDTH) cand.push([along, f]);
        }
        cand.sort((a, b) => a[0] - b[0]);
        for (let k = 0; k < Math.min(owner.u.pierce, cand.length); k++) hitSet.add(cand[k][1]);
      }
      for (const v of hitSet) hurt(owner, v, hit, fromX, fromY);
    }

    // enemies the unit may attack right now, nearest first
    function validTargets(b) {
      const valid = [];
      for (const f of sides[1 - b.side]) {
        if (!f.alive || f.hidden) continue;
        const d = dist(f, b);
        if (d <= reachOf(b) + 0.01 && d >= b.u.minRange) valid.push([d, f]);
      }
      valid.sort((p, q) => p[0] - q[0]);
      return valid.map(v => v[1]);
    }

    // one shot, or a spread of shotgun pellets each at a different body in the cone
    function aim(b, primary, valid) {
      if (b.u.flame > 0) return flameTargets(b, primary);
      const n = Math.max(1, Math.round(b.u.pellets));
      if (n === 1 && b.u.beams > 1) {
        // split beam: the target plus the next nearest enemies in reach, each hit once
        const out = [primary];
        for (const f of valid) { if (out.length >= b.u.beams) break; if (f !== primary) out.push(f); }
        return out;
      }
      if (n === 1) return [primary];
      const ax = primary.x - b.x, ay = primary.y - b.y, al = hyp(ax, ay);
      const cone = valid.filter(f => {
        const fx = f.x - b.x, fy = f.y - b.y, fl = hyp(fx, fy);
        if (!al || !fl) return true;
        return (ax * fx + ay * fy) / (al * fl) >= SHOTGUN_COS - 1e-12;
      });
      if (!cone.length) cone.push(primary);
      const out = [];
      for (let k = 0; k < n; k++) out.push(cone[k % cone.length]);
      return out;
    }

    // flame cone: every enemy in range inside the cone toward the target, hidden ones too
    function flameTargets(b, primary) {
      const ax = primary.x - b.x, ay = primary.y - b.y, al = hyp(ax, ay);
      const c = cosDeg(b.u.flame), reach = reachOf(b) + 0.01;
      const out = [];
      for (const f of sides[1 - b.side]) {
        if (!f.alive) continue;
        const fx = f.x - b.x, fy = f.y - b.y, fl = hyp(fx, fy);
        if (fl > reach || fl < b.u.minRange) continue;
        if (f === primary || !al || !fl || (ax * fx + ay * fy) / (al * fl) >= c - 1e-12) out.push(f);
      }
      if (!out.includes(primary)) out.push(primary);
      out.flame = [ax, ay, al];
      return out;
    }

    function fire(b, targets, canCharge) {
      const charged = canCharge && b.u.charge > 1 && b.moved >= CHARGE_RUN;
      b.moved = 0;
      b.hidden = false; // stealth ends with the first attack
      if (b.u.healPct > 0) {
        // heal a random wounded ally (not itself)
        const hurtAllies = sides[b.side].filter(a => a.alive && a !== b && a.hp < a.u.hp);
        if (hurtAllies.length) {
          const a = hurtAllies[Math.min(hurtAllies.length - 1, Math.floor(rnd() * hurtAllies.length))];
          a.hp = Math.min(a.u.hp, a.hp + b.u.hit * b.u.healPct / 100 * healMul);
          if (opts.record) shots.push([b.x, b.y, a.x, a.y, b.side, 0, 0, 1]);
        }
      }
      const hit = b.u.hit * (charged ? b.u.charge : 1) * (b.u.spinHit > 0 ? Math.min(SPIN_CAP, 1 + b.u.spinHit / 100 * Math.max(0, b.firing)) : 1);
      // trample: a charged hit doesn't stop the unit; it runs on through its target and over every body in its path
      if (charged && b.u.trample > 0 && targets.length && !targets.flame) {
        const tgt = targets[0], dx = tgt.x - b.x, dy = tgt.y - b.y, d = hyp(dx, dy);
        if (d > 0) { b.trampleDir = [dx / d, dy / d]; b.trampleLeft = d + TRAMPLE_RUN; b.trampled = [tgt]; }
      }
      for (const tgt of targets) {
        const dx = tgt.x - b.x, dy = tgt.y - b.y, d = hyp(dx, dy) || 1;
        const dirX = dx / d, dirY = dy / d;
        if (targets.flame) {
          hurt(b, tgt, hit, b.x, b.y); // flames land at once, no splash or pierce
        } else if (b.u.projSpeed > 0) {
          projectiles.push({ owner: b, x: b.x, y: b.y, fx: b.x, fy: b.y, tx: tgt.x, ty: tgt.y, dirX, dirY, left: d, hit });
        } else {
          impact(b, tgt.x, tgt.y, tgt, hit, dirX, dirY, b.x, b.y);
        }
        if (opts.record && !targets.flame) shots.push([b.x, b.y, tgt.x, tgt.y, b.side, b.u.splash, charged ? 1 : 0, 0, 0, b.u.spinUp > 0 ? b.spin : 1]);
      }
      // a flame is drawn once, as a wedge from the unit out to its range
      if (opts.record && targets.flame) {
        const [ax, ay, al] = targets.flame, r = reachOf(b), k = al ? r / al : 0;
        shots.push([b.x, b.y, b.x + ax * k, b.y + ay * k, b.side, 0, charged ? 1 : 0, 0, b.u.flame]);
      }
    }

    function step() {
      if (over) return false;
      if (t >= g.timeCap || !aliveCount(A) || !aliveCount(B)) { over = true; return false; }
      shots = [];
      tick++;
      for (let k = 0; k < 2; k++) if (cripple[k] > 0) cripple[k] = Math.max(0, cripple[k] - dt);
      // a body with a start delay (deployed on a flank) can't move or attack until it runs out
      for (const b of all) if (b.delay > 0) b.delay = Math.max(0, b.delay - dt);
      // movement + targeting
      for (const b of all) {
        if (!b.alive || b.delay > 0) continue;
        const foes = sides[1 - b.side];
        if (b.trampleLeft > 0) {
          // running through after a charge: straight on, hitting each body it runs over once
          const mv = Math.min(b.trampleLeft, b.u.speed * (b.slowT > 0 ? 1 - b.slowMove / 100 : 1) * (cripple[b.side] > 0 ? 1 - towerDown.move / 100 : 1) * dt);
          const [ux, uy] = b.trampleDir;
          b.x += ux * mv; b.y += uy * mv; b.hx = ux; b.hy = uy;
          b.trampleLeft -= mv;
          const tHit = b.u.hit * b.u.trample / 100;
          for (const f of foes) {
            if (!f.alive || b.trampled.includes(f) || hyp(f.x - b.x, f.y - b.y) > TRAMPLE_WIDTH) continue;
            b.trampled.push(f);
            if (opts.record) shots.push([b.x, b.y, f.x, f.y, b.side, 1, 1, 0, 0]);
            hurt(b, f, tHit, b.x, b.y);
          }
          if (b.trampleLeft <= 1e-9) { b.trampleLeft = 0; b.trampled = null; }
          continue;
        }
        let near = null, nd = Infinity;
        for (const f of foes) {
          if (!f.alive || f.hidden) continue;
          const d = dist(f, b);
          if (d < nd) { nd = d; near = f; }
        }
        b.near = near;
        const rg = R(b);
        if (near && nd > (g.stopPct > 0 && g.stopPct < 1 && b.engaged ? stopAt(rg) : rg)) {
          const step = b.u.speed * (b.slowT > 0 ? 1 - b.slowMove / 100 : 1) * (cripple[b.side] > 0 ? 1 - towerDown.move / 100 : 1) * dt;
          let mv;
          // March straight ahead until an enemy comes within sight (range + SIGHT), or no enemy is left
          // ahead, then lock on: from then on the body goes for its own nearest enemy for the rest of the
          // fight. Each body decides for itself, so a squad can split up when its bodies spot different
          // enemies. A squad meets what stands in its own lane, an empty lane lets it walk around the side,
          // and nobody flips back and forth between marching and chasing.
          const fwd = b.side === 0 ? 1 : -1;
          if (!b.engaged) {
            let spotted = nd <= rg + sight;
            if (!spotted) { // nothing left ahead to march toward: go for the nearest
              spotted = true;
              for (const f of foes) if (f.alive && !f.hidden && (f.y - b.y) * fwd > 0) { spotted = false; break; }
            }
            if (spotted) b.engaged = true;
          }
          // where it wants to go: straight ahead, or at the nearest enemy
          let wx = 0, wy = fwd;
          if (b.engaged) { wx = (near.x - b.x) / nd; wy = (near.y - b.y) / nd; }
          // turn smoothly instead of snapping: the heading swings toward the wanted direction
          if (b.hx === undefined) { b.hx = 0; b.hy = fwd; }
          const k = Math.min(1, TURN * dt);
          let hx = b.hx + (wx - b.hx) * k, hy = b.hy + (wy - b.hy) * k, hl = hyp(hx, hy);
          if (hl < 1e-6) { hx = wx; hy = wy; hl = 1; }
          b.hx = hx / hl; b.hy = hy / hl;
          // walk a little inside max range, so being nudged by allies doesn't leave the unit just out of reach
          mv = b.engaged ? Math.min(step, nd - stopAt(rg)) : step;
          b.x += b.hx * mv;
          b.y += b.hy * mv;
          b.moved += mv;
          // a unit with wind-up has to set up again after it moves; a charge in progress is lost
          if (b.u.windUp > 0 && mv > 0) {
            b.setUp = false;
            if (b.windTarget) { b.windTarget = null; stats[b.side].windLost++; }
          }
        }
      }
      // separation between allies
      const minSep = g.spacing * 0.7;
      for (let s = 0; s < 2; s++) {
        const arr = sides[s];
        for (let i = 0; i < arr.length; i++) {
          const a = arr[i]; if (!a.alive) continue;
          for (let j = i + 1; j < arr.length; j++) {
            const c = arr[j]; if (!c.alive) continue;
            const dx = c.x - a.x, dy = c.y - a.y;
            const d = hyp(dx, dy);
            // structures and bodies still waiting to start (flank squads) don't budge: the other body moves the whole way
            const fa = a.u.structure || a.delay > 0, fc = c.u.structure || c.delay > 0;
            if (fa && fc) continue;
            const ka = fa ? 0 : fc ? 2 : 1, kc = fc ? 0 : fa ? 2 : 1;
            if (d > 0 && d < minSep) {
              const push = (minSep - d) / 2;
              a.x -= dx / d * push * ka; a.y -= dy / d * push * ka;
              c.x += dx / d * push * kc; c.y += dy / d * push * kc;
            } else if (d === 0) {
              a.x -= minSep / 2 * ka; c.x += minSep / 2 * kc;
            }
          }
        }
      }
      // ongoing effects: poison, regeneration, shortsight wearing off, spawns
      const n0 = all.length;
      for (let i = 0; i < n0; i++) {
        const b = all[i];
        if (!b.alive) continue;
        if (b.poison && b.poison.length) {
          for (const p of b.poison) {
            if (!b.alive) break;
            direct(p.src, b, p.dps * Math.min(dt, p.t));
            p.t -= dt;
          }
          b.poison = b.poison.filter(p => p.t > 0);
          if (!b.alive) continue;
        }
        if (b.u.regen > 0 && b.hp < b.u.hp) b.hp = Math.min(b.u.hp, b.hp + b.u.hp * b.u.regen / 100 * healMul * dt);
        if (b.shrinkT > 0) { b.shrinkT -= dt; if (b.shrinkT <= 0) { b.shrinkT = 0; b.shrinkM = 0; } }
        if (b.slowT > 0) { b.slowT -= dt; if (b.slowT <= 0) { b.slowT = 0; b.slowMove = 0; b.slowAtk = 0; } }
        if (b.u.spawn) {
          b.spawnT -= dt;
          if (b.spawnT <= 0 && b.u.spawn.waves > 0 && (b.waves || 0) >= b.u.spawn.waves) b.spawnT = Infinity; // used up its waves
          if (b.spawnT <= 0) {
            b.spawnT += b.u.spawn.every;
            b.waves = (b.waves || 0) + 1;
            b.kids = (b.kids || []).filter(k => k.alive);
            const n = Math.min(b.u.spawn.count, b.u.spawn.max - b.kids.length);
            for (let k = 0; k < n; k++) {
              // spots are relative to the side's forward direction, so both sides spawn in front of the summoner
              const [ox, oy] = SPAWN_SPOTS[(b.kids.length + k) % SPAWN_SPOTS.length], fwd = b.side === 0 ? 1 : -1;
              const kid = newBody(b.u.spawn.unit, b.side, b.x + ox * g.spacing * 0.7, b.y + oy * fwd * g.spacing * 0.7, spawnIdx++, -1);
              b.kids.push(kid); all.push(kid); sides[b.side].push(kid);
              stats[b.side].totalHp += kid.u.hp;
            }
          }
        }
      }
      // attacks. A body killed earlier in this same tick still gets its attack, so neither side
      // wins a trade just by being processed first (side 0 used to win one-shot duels like Sniper vs Sniper)
      for (const b of all) {
        if ((!b.alive && b.diedTick !== tick) || b.delay > 0) continue;
        b.cd -= dt * (b.slowT > 0 ? 1 - b.slowAtk / 100 : 1); // slowed units reload slower
        if (b.firing >= 0) b.firing += dt;
        // follow-up shots of a running burst fly along the direction locked at the start
        // and hit the first enemy on that line; if the line is empty the shot misses
        if (b.burstLeft > 0) {
          b.burstTimer -= dt;
          if (b.burstTimer <= 0) {
            const [ux, uy] = b.burstDir;
            let first = null, fa = Infinity;
            for (const f of sides[1 - b.side]) {
              if (!f.alive) continue;
              const rx = f.x - b.x, ry = f.y - b.y;
              const along = rx * ux + ry * uy;
              const across = Math.abs(rx * uy - ry * ux);
              if (along >= b.u.minRange && along <= R(b) + 0.01 && across <= PIERCE_WIDTH && along < fa) { fa = along; first = f; }
            }
            if (first) {
              fire(b, aim(b, first, validTargets(b)), false);
            } else {
              const end = { x: b.x + ux * R(b), y: b.y + uy * R(b) };
              if (b.u.projSpeed > 0) fire(b, [end], false); // the projectile flies on and can still clip someone
              else {
                stats[b.side].missed += b.u.hit * Math.max(1, Math.round(b.u.pellets));
                if (opts.record) shots.push([b.x, b.y, end.x, end.y, b.side, 0, 0]);
              }
            }
            b.burstLeft--; b.burstTimer += BURST_GAP;
          }
        }
        let valid, primary;
        // wind-up: the unit sets up (like a sniper lying down) the first time an enemy is in range.
        // Once set up it fires normally at anything in range. It only sets up again after it has moved.
        if (b.u.windUp > 0 && !b.setUp) {
          if (b.windTarget) {
            b.windT -= dt;
            if (b.windT > 0) continue;
            b.windTarget = null; b.setUp = true;
            b.cd = 0; // reload starts with the first shot
            valid = validTargets(b);
            if (!valid.length) continue;
            primary = valid[0];
          } else {
            if (b.cd > 0) continue;
            valid = validTargets(b);
            if (!valid.length) continue;
            b.windTarget = valid[0]; b.windT = b.u.windUp; stats[b.side].winds++;
            continue;
          }
        } else {
          if (b.cd > 0) continue;
          valid = validTargets(b);
          if (!valid.length) continue;
          primary = valid[0];
        }
        // spin-up builds while the unit keeps hitting one target: it stays on that target while it can,
        // and the ramp starts over when it has to switch
        if (b.u.spinUp > 0 || b.u.spinHit > 0) {
          if (b.spinTarget && b.spinTarget.alive && valid.includes(b.spinTarget)) primary = b.spinTarget;
          else { b.spinTarget = primary; b.firing = 0; }
        }
        if (b.firing < 0) b.firing = 0;
        const spin = b.u.spinUp > 0 ? Math.min(SPIN_CAP, 1 + b.u.spinUp / 100 * b.firing) : 1;
        b.spin = spin;
        // reload doesn't stack up while the unit has nothing to shoot: keep at most one step of carry-over
        b.cd = Math.max(b.cd, -dt) + 1 / Math.max(0.01, b.u.aps * spin);
        const n = Math.max(1, Math.round(b.u.burst));
        if (n > 1) {
          const dx = primary.x - b.x, dy = primary.y - b.y, d = hyp(dx, dy) || 1;
          b.burstLeft = n - 1; b.burstTimer = BURST_GAP; b.burstDir = [dx / d, dy / d];
          b.cd = Math.max(b.cd, (n - 1) * BURST_GAP + dt); // the next attack waits for the burst to finish
        }
        fire(b, aim(b, primary, valid), true);
      }
      // neutral towers: each shot goes at the nearest unit in range of the side whose turn it is,
      // or of the other side if that one has nobody in range, so both sides are shot at equally
      for (const n of neutrals) {
        n.cd -= dt;
        if (n.cd > 0) continue;
        let tgt = null;
        for (let k = 0; k < 2 && !tgt; k++) {
          let bd = n.u.range + 0.01;
          for (const f of sides[(n.turn + k) % 2]) {
            if (!f.alive || f.hidden || f.u.structure) continue;
            const d = hyp(f.x - n.x, f.y - n.y);
            if (d <= bd) { bd = d; tgt = f; }
          }
        }
        if (!tgt) { n.cd = Math.max(n.cd, -dt); continue; }
        n.turn = 1 - tgt.side;
        n.cd = Math.max(n.cd, -dt) + 1 / Math.max(0.01, n.u.aps);
        if (opts.record) shots.push([n.x, n.y, tgt.x, tgt.y, 2, 0, 0, 0, 0]);
        if (tgt.shield > 0) { tgt.shield--; continue; }
        let dmg = damageAfterDefense(n.u.hit, tgt, g);
        if (cripple[tgt.side] > 0) dmg = dmg * (1 + towerDown.taken / 100);
        tgt.hp -= dmg;
        if (tgt.hp <= 1e-9) { tgt.hp = 0; tgt.alive = false; tgt.diedTick = tick; fell(tgt); }
      }
      // projectiles in flight
      if (projectiles.length) {
        // direct fire: a projectile hits the first enemy body it flies into;
        // if it reaches its aim point without touching anyone, it lands there (and may miss)
        const next = [];
        for (const p of projectiles) {
          const foes = sides[1 - p.owner.side];
          let mv = p.owner.u.projSpeed * dt, done = false;
          while (mv > 0 && !done) {
            const sub = Math.min(0.5, mv, p.left);
            p.x += p.dirX * sub; p.y += p.dirY * sub; p.left -= sub; mv -= sub;
            for (const f of foes) {
              if (f.alive && hyp(f.x - p.x, f.y - p.y) <= PROJ_HIT_RADIUS) {
                impact(p.owner, p.x, p.y, null, p.hit, p.dirX, p.dirY, p.fx, p.fy);
                done = true; break;
              }
            }

  const movedId = (m, side) => (m.moved && m.moved[side] != null) ? m.moved[side] : null;
  const canMove = (m, side, sq) => !!sq && (sq.round === m.round ||
    (movedId(m, side) == null ? m.gold[side] >= CONFIG.moveCost : movedId(m, side) === sq.id));
  function moveSquad(m, side, sqId, col, row) {
    const sq = m.armies[side].find(s => s.id === sqId);
    if (!sq || (sq.col === col && sq.row === row) || !canMove(m, side, sq)) return false;
    if (!canPlaceAt(m, side, col, row, sq.unit) || occupied(m, side, col, row)) return false;
    if (sq.round !== m.round && movedId(m, side) == null) {
      if (!m.moved) m.moved = [null, null];
      m.gold[side] -= CONFIG.moveCost;
      m.moved[side] = sq.id;
      sq.from = { col: sq.col, row: sq.row };
      sq.movedRound = m.round;
    }
    sq.col = col; sq.row = row;
    if (sq.from && sq.movedRound === m.round && sq.from.col === col && sq.from.row === row) undoMove(m, side);
    return true;
  }
  // put this round's moved squad back on its old tile and refund the move
  function undoMove(m, side) {
    const id = movedId(m, side);
    const sq = id != null && m.armies[side].find(s => s.id === id);
    if (!sq || !sq.from) return false;
    if ((sq.col !== sq.from.col || sq.row !== sq.from.row) && occupied(m, side, sq.from.col, sq.from.row)) return false;
    sq.col = sq.from.col; sq.row = sq.from.row;
    delete sq.from; delete sq.movedRound;
    m.moved[side] = null;
    m.gold[side] += CONFIG.moveCost;
    return true;
  }

  const towerAt = (m, side, col, row) => !!(m.towers && m.towers[side] && m.towers[side].col === col && m.towers[side].row === row);
  const occupied = (m, side, col, row) => towerAt(m, side, col, row) || m.armies[side].some(s => s.col === col && s.row === row);
  const needsTower = (m, side) => !!(m.towers && !m.towers[side]);
  // the tower can be placed (or moved) during round 1 only
  function placeTower(m, side, col, row) {
    if (!m.towers) m.towers = [null, null];
    if (m.round !== 1 || !inZone(side, row) || !towerColOk(col) || reserved(side, col, row)) return false;
    if (m.armies[side].some(s => s.col === col && s.row === row)) return false;
    m.towers[side] = { col, row };
    return true;
  }
  // a match without a tower (saved before towers were fixed) gets the fixed one
  function ensureTower(m, side) {
    if (!m.towers) m.towers = [null, null];
    if (m.towers[side]) return;
    m.towers[side] = { ...TOWER_SPOT[side] };
  }

  function place(m, side, unitIdx, col, row) {
    if (!canPlaceAt(m, side, col, row, unitIdx)) return null;
    if (needsTower(m, side)) return null; // the tower goes down first
    if (!isUnlocked(m, side, unitIdx)) return null;
    if (occupied(m, side, col, row)) return null;
    if (freeLeft(m, side).includes(unitIdx)) { // a package squad: no gold, no deployment
      const sq = { id: m.nextId[side]++, unit: unitIdx, col, row, round: m.round, xp: 0, level: 0, cost: 0, free: true };
      m.armies[side].push(sq);
      return sq;
    }
    const cost = unitCostOf(m.units[unitIdx]);
    if (m.gold[side] < cost) return null;
    if (deploysLeft(m, side) <= 0) return null;
    const sq = { id: m.nextId[side]++, unit: unitIdx, col, row, round: m.round, xp: 0, level: 0, cost };
    m.armies[side].push(sq);
    m.gold[side] -= cost;
    return sq;
  }

  // Only squads bought this round can be taken back
  function unplace(m, side, col, row) {
    const i = m.armies[side].findIndex(s => s.col === col && s.row === row && s.round === m.round);
    if (i < 0) return false;
    const [sq] = m.armies[side].splice(i, 1);
    m.gold[side] += sq.cost;
    return true;
  }

  function bodiesFor(m, side) {
    const out = [];
    let idx = 0;
    for (const sq of m.armies[side]) {
      const w = tileToWorld(sq.col, sq.row);
      const ch = charOf(m, side), forward = isFlank(side, sq.col, sq.row) || inNoMans(sq.row);
      let u = unitFor(m, side, sq.unit);
      const mp = mapOf(m);
      if (mp && mp.stealthDmg && u.stealth) u = { ...u, hit: u.hit * (1 + mp.stealthDmg / 100) }; // the map favours stealth units
      if (ch === 'wilhelm' && forward) u = { ...u, bonusArmor: (u.bonusArmor || 0) + CHAR.wilhelmArmor };
      // Zoe: a squad that starts the fight on a buff tile keeps the bonus for the whole fight
      const zoe = onBuffTile(m, side, sq.col, sq.row);
      if (zoe) u = { ...u, hit: u.hit * (1 + CHAR.zoeDmg / 100), hp: u.hp * (1 + CHAR.zoeHp / 100), aps: u.aps * (1 + CHAR.zoeAps / 100) };
      const b = E.buildSquad(u, side, w.x, w.y, sq.id, TILE, idx, sq.level);
      if (zoe) for (const x of b) x.zoe = true; // for the rising-stars effect
      if (isFlank(side, sq.col, sq.row) && (sq.round === m.round || sq.movedRound === m.round)) for (const x of b) x.delay = FLANK.delay * (ch === 'wilhelm' ? CHAR.wilhelmDelay : 1); // only in its first fight
      idx += b.length;
      out.push(...b);
    }
    const t = m.towers && m.towers[side];
    if (t) { const w = tileToWorld(t.col, t.row); out.push(...E.buildSquad(TOWER, side, w.x, w.y, -2, TILE, idx)); }
    return out;
  }

  // ---------- Zoe's buff tiles ----------
  // Rolled at the start of every round (and when Zoe is picked): random free-standing tiles in her zone,
  // never the tower's tile. Seeded from the match, so both phones get the same tiles.
  function rollBuffTiles(m, side) {
    if (!m.buff) m.buff = [[], []];
    m.buff[side] = [];
    if (charOf(m, side) !== 'zoe') return;
    const r = rng(m.seed + m.round * 6151 + side * 3571 + 99);
    const spots = [];
    for (const row of zoneRows(side)) for (let col = 0; col < COLS; col++) if (!reserved(side, col, row) && !towerAt(m, side, col, row)) spots.push({ col, row });
    for (let k = 0; k < CHAR.zoeTiles && spots.length; k++) m.buff[side].push(spots.splice(Math.floor(r() * spots.length), 1)[0]);
  }
  const onBuffTile = (m, side, col, row) => charOf(m, side) === 'zoe' && !!(m.buff && m.buff[side] || []).some(t => t.col === col && t.row === row);

  function startBattle(m) {
    ensureTower(m, 0); ensureTower(m, 1);
    ensurePack(m, 0); ensurePack(m, 1);
    const mp = mapOf(m), elf = elfSpot(m);
    const g = mp && mp.healMul ? { ...SETTINGS, healMul: mp.healMul } : SETTINGS;
    return E.createBattle(bodiesFor(m, 0), bodiesFor(m, 1), g, { record: true, neutrals: elf ? [{ u: E.withTraits(ELF_TOWER), x: elf.x, y: elf.y }] : [] });
  }

  // Damage a side deals = points of its squads, scaled by how much of each squad is still alive
  function survivorDamage(m, res, side) {
    let sum = 0;
    for (const k in res.squads) {
      const s = res.squads[k];
      if (s.side !== side || s.alive <= 0 || s.squad < 0) continue; // spawned bodies don't count
      const sq = m.armies[side].find(q => q.id === s.squad);
      const value = sq ? (m.units[sq.unit].cost || 1) : 1; // pricier squads hit harder, like their price
      sum += SQUAD_POINTS * value * s.alive / s.total;
    }
    return sum > 0 ? Math.min(MAX_ROUND_DMG, Math.max(1, Math.round(sum))) : 0; // at most MAX_ROUND_DMG per round
  }

  // Apply a finished battle to the match. Returns a summary for the results screen.
  function resolve(m, res) {
    const dmg = [0, 0]; // damage taken by each side
    let roundWinner = res.winner;
    if (res.timeout) {
      dmg[0] = survivorDamage(m, res, 1);
      dmg[1] = survivorDamage(m, res, 0);
    } else if (res.winner === 0) dmg[1] = survivorDamage(m, res, 0);
    else if (res.winner === 1) dmg[0] = survivorDamage(m, res, 1);
    m.hp[0] = Math.max(0, m.hp[0] - dmg[0]);
    m.hp[1] = Math.max(0, m.hp[1] - dmg[1]);
    // experience carries over between rounds; squads that reach the next threshold become ready to level up
    const newlyReady = [[], []];
    for (let side = 0; side < 2; side++) {
      for (const sq of m.armies[side]) {
        const r = res.squads[side + ':' + sq.id];
        if (!r) continue;
        const was = isReady(m, sq);
        sq.xp += r.xp;
        if (!was && isReady(m, sq)) newlyReady[side].push({ id: sq.id, unit: sq.unit, level: sq.level + 1 });
      }
    }
    // how each squad did: share of bodies left and damage dealt (for reports and Claude)
    const squads = [[], []];
    for (let side = 0; side < 2; side++) for (const sq of m.armies[side]) {
      const r = res.squads[side + ':' + sq.id];
      if (r) squads[side].push({ id: sq.id, unit: sq.unit, level: sq.level, left: r.alive / r.total, dealt: Math.round(r.dealt || 0) });
    }
    const towerFell = [0, 1].map(sd => { const q = res.squads[sd + ':-2']; return !!(q && q.alive === 0); });
    const summary = { round: m.round, winner: roundWinner, timeout: res.timeout, dmg, time: res.time, newlyReady, squads, towerFell };
    m.history.push(summary);
    if (m.hp[0] <= 0 || m.hp[1] <= 0) {
      m.over = true;
      m.winner = m.hp[0] > 0 ? 0 : m.hp[1] > 0 ? 1 : -1;
      return summary;
    }
    // next round
    m.round++;
    m.extraDeploys = [0, 0];
    m.moved = [null, null];
    for (const a of m.armies) for (const sq of a) { delete sq.from; delete sq.movedRound; }
    rollBuffTiles(m, 0); rollBuffTiles(m, 1);
    const income = incomeFor(m.round);
    m.gold[0] += income; m.gold[1] += income;
    summary.income = income;
    const loser = dmg[0] > dmg[1] ? 0 : dmg[1] > dmg[0] ? 1 : -1;
    if (loser >= 0) m.gold[loser] += LOSER_BONUS;
    summary.bonusTo = loser;
    return summary;
  }

  // ---------- leveling (manual, costs gold) ----------
  const isReady = (m, sq) => sq.level < E.MAX_LEVEL && sq.xp >= xpNeeded(m.units[sq.unit], sq.level);

  function levelUp(m, side, sqId) {
    const sq = m.armies[side].find(s => s.id === sqId);
    if (!sq || !isReady(m, sq)) return false;
    const cost = levelCost(m.units[sq.unit]);
    if (m.gold[side] < cost) return false;
    m.gold[side] -= cost;
    sq.level++;
    (sq.boughtLevels = sq.boughtLevels || {})[m.round] = ((sq.boughtLevels || {})[m.round] || 0) + 1;
    return true;
  }

  // Undo a level bought this round (full refund)
  function undoLevel(m, side, sqId) {
    const sq = m.armies[side].find(s => s.id === sqId);
    if (!sq || !sq.boughtLevels || !sq.boughtLevels[m.round]) return false;
    sq.boughtLevels[m.round]--;
    sq.level--;
    m.gold[side] += levelCost(m.units[sq.unit]);
    return true;
  }

  // AI levels up at fight time, using only what it knew at the start of the round.
  // It skips chaff (8+ bodies): feeding leveled chaff to the enemy gives away XP.
  function aiLevel(m, side) {
    const done = [];
    if (AI.levelPolicy === 'never') return done;
    const ready = m.armies[side].filter(s => isReady(m, s))
      .sort((a, b) => E.withTraits(m.units[b.unit]).range - E.withTraits(m.units[a.unit]).range);
    for (const sq of ready) {
      const u = m.units[sq.unit];
      if (AI.levelPolicy === 'smart' && u.bodies >= 8) continue;
      while (isReady(m, sq) && levelUp(m, side, sq.id)) done.push({ id: sq.id, unit: sq.unit, level: sq.level });
    }
    return done;
  }

  // ---------- AI ----------
  // Buys units that counter the opponent's army as it stood at the start of the round,
  // using the counter table, with a nudge toward variety and a little randomness.
  function aiDeploy(m, side) {
    const r = rng(m.seed + m.round * 7919 + side * 104729);
    if (needsPack(m, side)) { // the package whose units do best against the whole roster
      let bk = 0, bs = -Infinity;
      m.packages[side].forEach((p, k) => {
        let s = 0;
        for (const ui of p.squads) s += m.matrix[ui].reduce((a, b) => a + b, 0) * unitCostOf(m.units[ui]);
        s += (r() - 0.5) * 50;
        if (s > bs) { bs = s; bk = k; }
      });
      choosePack(m, side, bk);
    }
    if (needsTower(m, side)) { // tower first: a back corner, left or right
      const rows = zoneRows(side);
      const col = r() < 0.5 ? 1 + Math.floor(r() * 2) : 9 + Math.floor(r() * 2);
      if (!placeTower(m, side, col, rows[3 + Math.floor(r() * 2)])) ensureTower(m, side);
    }
    const opp = 1 - side;
    const oppArmy = m.armies[opp].filter(s => s.round < m.round);
    for (const ui of freeLeft(m, side)) { const spot = aiSpot(m, side, ui, oppArmy, r); if (spot) place(m, side, ui, spot.col, spot.row); }
    const oppCount = {};
    for (const s of oppArmy) oppCount[s.unit] = (oppCount[s.unit] || 0) + 1;
    const own = {};
    for (const s of m.armies[side]) own[s.unit] = (own[s.unit] || 0) + 1;
    const bought = [];
    // keep gold back for the level-ups it will buy at fight time
    let reserve = 0;
    if (AI.levelPolicy !== 'never') {
      for (const sq of m.armies[side]) {
        if (!isReady(m, sq)) continue;
        if (AI.levelPolicy === 'smart' && m.units[sq.unit].bodies >= 8) continue;
        reserve += levelCost(m.units[sq.unit]);
      }
    }
    const minCost = Math.min(...m.units.map(unitCostOf));
    // skills: for unit types it has 2 or more squads of, sometimes buy a skill if a squad is still affordable after
    if (AI.skills) {
      const types = Object.keys(own).map(Number).filter(ui => own[ui] >= 2).sort((a, b) => own[b] - own[a]);
      for (const ui of types) for (const k of E.SLOTS) {
        if (!skillDef(m, ui, k) || hasSkill(m, side, ui, k)) continue;
        if (m.gold[side] - reserve - skillCost(m, ui, k) < minCost) continue;
        if (r() < 0.5) buySkill(m, side, ui, k);
      }
    }
    let guard = 0;
    while (m.gold[side] - reserve >= minCost && guard++ < 60) {
      if (deploysLeft(m, side) <= 0) {
        // out of deployments: buy one more only if a squad is still affordable after it
        if (m.extraDeploys[side] >= AI.maxExtraDeploys || m.gold[side] - reserve < minCost + CONFIG.extraDeployCost) break;
        if (!buyDeploy(m, side)) break;
      }
      const budget = m.gold[side] - reserve;
      let best = -1, bs = -Infinity;
      m.units.forEach((u, i) => {
        const extra = isUnlocked(m, side, i) ? 0 : unlockCost(m, i, side); // a locked unit costs its unlock on top
        if (unitCostOf(u) + extra > budget) return;
        let s = 0, tot = 0;
        for (const t in oppCount) { s += oppCount[t] * (m.matrix[i][t] || 0); tot += oppCount[t]; }
        s = tot ? s / tot : 0;
        s -= 0.2 * extra / SQUAD_COST; // unlocking is a one-off, so lean a little toward units already open
        s -= 0.12 * (own[i] || 0);
        s += (r() - 0.5) * 0.35;
        if (s > bs) { bs = s; best = i; }
      });
      if (best < 0) break;
      const spot = aiSpot(m, side, best, oppArmy, r);
      if (!spot) break;
      if (!isUnlocked(m, side, best) && !unlock(m, side, best)) break;
      const sq = place(m, side, best, spot.col, spot.row);
      if (!sq) break;
      own[best] = (own[best] || 0) + 1;
      bought.push(sq);
    }
    return bought;
  }

  function aiSpot(m, side, unitIdx, oppArmy, r) {
    const u = E.withTraits(m.units[unitIdx]);
    const rows = zoneRows(side);
    const band = u.range <= 12 ? [0, 1] : u.range <= 22 ? [1, 2] : u.range <= 30 ? [2, 3] : [3, 4]; // rows counted from the front
    // aim at the columns of the enemy squads this unit counters
    let wsum = 0, csum = 0;
    for (const s of oppArmy) {
      const w = Math.max(0, m.matrix[unitIdx][s.unit] || 0);
      wsum += w; csum += w * s.col;
    }
    const target = wsum > 0 ? csum / wsum : (COLS - 1) / 2 + (r() - 0.5) * 6;
    // fast melee units sometimes take a flank column, on the side of the enemy tower when it is known
    if (flankOpen(m) && u.range <= 5 && u.speed >= 6 && r() < 0.5) {
      const et = m.towers && m.towers[1 - side];
      const cols = et ? FLANK.cols.slice().sort((a, b) => Math.abs(a - et.col) - Math.abs(b - et.col)) : (r() < 0.5 ? FLANK.cols.slice() : FLANK.cols.slice().reverse());
      for (const col of cols) for (const row of flankRows(side)) if (!occupied(m, side, col, row) && canPlaceAt(m, side, col, row)) return { col, row };
    }
    let best = null, bc = Infinity;
    for (let zi = 0; zi < rows.length; zi++) {
      for (let col = 0; col < COLS; col++) {
        const row = rows[zi];
        if (occupied(m, side, col, row) || !canPlaceAt(m, side, col, row)) continue;
        const rowCost = band.includes(zi) ? 0 : 3 * Math.min(Math.abs(zi - band[0]), Math.abs(zi - band[1]));
        const c = Math.abs(col - target) + rowCost + r() * 0.8;
        if (c < bc) { bc = c; best = { col, row }; }
      }
    }
    return best;
  }

  return {
    MAX_ROUND_DMG, seenAt, movedId, canMove, moveSquad, undoMove,
    COLS, ROWS, TILE, ZONE, START_HP, START_GOLD, INCOME, incomeFor, LOSER_BONUS, SQUAD_COST, SQUAD_POINTS, SETTINGS, XP_STEPS, xpNeeded, unitCostOf,
    levelCost, isReady, levelUp, undoLevel, aiLevel, AI, CONFIG,
    deploysAllowed, deploysLeft, deployedThisRound, buyDeploy, refundDeploy,
    PACKAGE, allPackages, packOf, needsPack, freeLeft, choosePack, ensurePack,
    unlockCost, isUnlocked, unlockVisible, unlock, undoUnlock,
    skillDef, skillCost, isInnate, hasSkill, skillVisible, unitFor, canBuySkill, buySkill, undoSkill, sellValue, sell,
    TOWER, TOWER_MID, towerColOk, towerAt, needsTower, placeTower, ensureTower,
    FLANK, flankRows, flankOpen, isFlank, reserved, canPlaceAt, enemyHolds, inNoMans, hasSkillType,
    MAPS, ELF_TOWER, mapOf, elfSpot, rollMap,
    CHARACTERS, CHAR, charOf, charInfo, isTier1, rollBuffTiles, onBuffTile, TOWER_SPOT,
    zoneRows, inZone, tileToWorld, createMatch, place, unplace, bodiesFor, startBattle, resolve, aiDeploy, occupied,
  };
})();
if (typeof module !== 'undefined') module.exports = Game;

</script>
