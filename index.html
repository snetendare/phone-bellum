  function showResult(sum) {
    const iWon = sum.winner === me && !sum.timeout, iLost = sum.winner === foe() && !sum.timeout;
    const head = sum.timeout ? 'Time ran out' : iWon ? `Round ${sum.round} won` : iLost ? `Round ${sum.round} lost` : 'Draw';
    const cls = iWon ? 'you' : iLost ? 'foe' : '';
    const them = foeName();
    const lines = [];
    if (sum.dmg[foe()]) lines.push(`${them} takes <b class="num">${sum.dmg[foe()]}</b> damage.`);
    if (sum.dmg[me]) lines.push(`You take <b class="num">${sum.dmg[me]}</b> damage.`);
    if (!sum.dmg[0] && !sum.dmg[1]) lines.push('Nobody takes damage.');
    if (sum.towerFell && sum.towerFell[foe()]) lines.push(`You broke ${mode === 'claude' ? 'Claude’s' : 'the enemy’s'} tower.`);
    if (sum.towerFell && sum.towerFell[me]) lines.push('Your tower fell.');
    const lv = (list) => list.map(x => `${esc(units[x.unit].name)} (to level ${x.level + 1})`).join(', ');
    const lvLines = [];
    if (solo() && lastAiLevels.length) lvLines.push(`<p><span style="color:var(--gold)">${them} leveled up before the fight:</span> ${lv(lastAiLevels)}.</p>`);
    if (mode === 'claude' && claude.did.length) lvLines.push(`<p><span style="color:var(--gold)">Claude also:</span> ${esc(claude.did.join(', '))}.</p>`);
    if (mode === 'claude' && claude.say) lvLines.push(`<p class="big" style="color:var(--foe);font-style:italic">“${esc(claude.say)}”</p>`);
    if (mode === 'claude' && claude.note) lvLines.push(`<p>${esc(claude.note)}</p>`);
    if (sum.gentlemen && sum.gentlemen[me].length) lvLines.push(`<p><span style="color:${CHARM_COL}">Now Gentlemen (5 Charisma):</span> ${sum.gentlemen[me].map(x => esc(units[x.unit].name)).join(', ')}.</p>`);
    if (sum.converted && (sum.converted[me] || sum.converted[foe()])) lvLines.push(`<p><span style="color:${CHARM_COL}">Won over:</span> ${[sum.converted[me] ? `your Gentlemen charmed ${sum.converted[me]} enemy ${sum.converted[me] === 1 ? 'body' : 'bodies'}` : '', sum.converted[foe()] ? `${sum.converted[foe()]} of yours went over to ${esc(them)}` : ''].filter(Boolean).join('; ')}.</p>`);
    if (sum.newlyReady[me].length) lvLines.push(`<p><span style="color:var(--gold)">Ready to level up:</span> ${lv(sum.newlyReady[me])}.</p>`);
    resultShownAt = now();
    if (m.over) {
      const win = m.winner === me, loss = m.winner === foe();
      phase = 'end'; hud(); netStatus();
      const wait = !solo() && rematch[me];
      overlay(`<div class="card">
        <span class="eyebrow">After ${m.history.length} rounds</span>
        <h2 class="${win ? 'you' : loss ? 'foe' : ''}">${win ? 'Victory' : loss ? 'Defeat' : 'Draw'}</h2>
        <p class="big">${lines.join(' ')}</p>
        ${!solo() && rematch[foe()] && !rematch[me] ? '<p>Your opponent wants a rematch.</p>' : ''}
        <div class="btnrow">
          ${solo() ? '<button class="btn primary" id="again">Play again</button>'
            : `<button class="btn primary" id="again" ${wait ? 'disabled' : ''}>${wait ? 'Waiting for opponent…' : 'Rematch'}</button>`}
          <button class="btn" id="menu">Main menu</button>
        </div>
      </div>`);
      $('panel').innerHTML = '';
      $('again').addEventListener('click', mode === 'claude' ? startClaudeMatch : mode === 'ai' ? startAiMatch : askRematch);
      $('menu').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
      return;
    }
    phase = 'result'; hud(); netStatus();
    const gold = [`+${sum.income || Game.incomeFor(sum.round + 1)} gold`];
    if (sum.bonusTo === me) gold.push(`+${Game.LOSER_BONUS} for losing`);
    if (sum.felix && sum.felix[me]) gold.push(`+${sum.felix[me]} Felix`);
    if (sum.invest && sum.invest[me]) gold.push(`+${sum.invest[me]} investment`);
    if (sum.loan && sum.loan[me]) gold.push(`−${sum.loan[me]} loan`);
    const waiting = !solo() && nextReady[me];
    overlay(`<div class="card">
      <h2 class="${cls}">${head}</h2>
      <p class="big">${lines.join(' ')}</p>
      ${lvLines.join('')}
      <p class="num" style="color:var(--gold)">${gold.join(' · ')}</p>
      <div class="btnrow">
        ${waiting ? '<p class="status wait">Waiting for your opponent</p>' : `<button class="btn primary" id="next">Next round</button>`}
        <button class="btn" id="menu">Main menu</button>
      </div>
    </div>`);
    $('panel').innerHTML = '';
    if ($('next')) $('next').addEventListener('click', tapNext);
    // leaving mid-match takes a second tap, so it can't happen by accident
    $('menu').addEventListener('click', () => {
      const b = $('menu');
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = solo() ? 'Tap again to quit this match' : 'Tap again to leave your opponent'; return; }
      showStart();
    });
  }

  // ---------- Main menu from the in-match settings: leaving a match that is still on forfeits it ----------
  function askForfeit() {
    if (!m || phase === 'end') { quitToMenu(); return; }
    $('sheet').innerHTML = `
      <div class="bar" data-keep><h3 id="sheet-h">Main menu</h3></div>
      <p class="big" style="margin:0">You will forfeit the match. Are you sure?</p>
      <span class="btnrow"><button class="btn primary" id="forfeit-yes">Yes</button><button class="btn" id="forfeit-no">No</button></span>`;
    $('forfeit-yes').addEventListener('click', forfeit);
    $('forfeit-no').addEventListener('click', openSoundSheet);
  }
  function quitToMenu() { if (mode === 'host') clearHost(); closeSheet(true); showStart(); }
  function forfeit() {
    if (!m || phase === 'end') { quitToMenu(); return; }
    if (!solo() && net.connected) {
      send({ t: 'forfeit' });
      // showStart drops the connection: keep it a moment longer so the message gets there
      const c = net.conn, pr = net.peer;
      net.conn = null; net.peer = null; net.connected = false;
      setTimeout(() => { try { c.close(); } catch (e) {} try { pr.destroy(); } catch (e) {} }, 1500);
    }
    quitToMenu(); // the host's saved match goes too, so the link can't resume it
  }
  // the other player forfeited: this one wins
  function foeForfeited() {
    if (!m || phase === 'end') return;
    if (mode === 'host') clearHost();
    leaveNet(); cancelAnimationFrame(raf);
    m.over = true; m.winner = me; phase = 'end'; bt = null; battlePre = null; deadline = 0; selected = null; resultShownAt = 0;
    closeSheet(true); hud(); setNet(''); $('clock').textContent = ''; render();
    overlay(`<div class="card">
      <span class="eyebrow">Round ${m.round}</span>
      <h2 class="you">Victory</h2>
      <p class="big">Your opponent forfeited the match.</p>
      <div class="btnrow"><button class="btn primary" id="menu">Main menu</button></div>
    </div>`);
    $('panel').innerHTML = '';
    $('menu').addEventListener('click', showStart);
  }

  // ---------- match reports ----------
  // Inside Claude, every match on this screen is saved to the artifact's own storage (only the owner and editors
  // can read it), so Claude can look back at how matches went when asked.
  let reportDb = null, report = null, reportChain = Promise.resolve();
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') reportDb = await window.claude.use('db'); } catch (e) { reportDb = null; }
    if (reportDb && phase === 'start') showStart();
  })();
  function startReport() {
    report = null;
    if (!reportDb || mode === 'guest') return;
    const t = new Date();
    report = {
      id: 'm' + t.getTime().toString(36), mode, started: t.toISOString(), updated: t.toISOString(),
      units: units.map(u => u.name), customUnits: customSet, timer: mode === 'host' ? DEPLOY_SECONDS : (timerOn ? DEPLOY_SECONDS : 0),
      over: false, winner: null, rounds: [],
    };
  }
  function armyOf(match, side) {
    return match.armies[side].map(q => ({ unit: units[q.unit].name, col: q.col, row: q.row, level: q.level + 1, placed: q.round }));
  }
  const unlocksOf = (match, side) => units.map((u, i) => Game.unlockCost(match, i) > 0 && Game.isUnlocked(match, side, i) ? u.name : null).filter(Boolean);
  function skillsOf(match, side) {
    const out = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.hasSkill(match, side, i, k) && !Game.isInnate(match, i, k)) out.push(`${(u.skillDefs[k] || {}).name} (${u.name})`); }));
    return out;
  }
  function recordRound(pre, sum) {
    if (!report || !reportDb) return;
    const p = withUnits(pre), you = me, them = foe();
    const entry = {
      round: sum.round,
      you: { hpBefore: p.hp[you], gold: p.gold[you], army: armyOf(p, you), skills: skillsOf(p, you), tower: (p.towers && p.towers[you]) || null, unlocked: unlocksOf(p, you), character: Game.charOf(p, you), package: Game.packOf(p, you) ? Game.packOf(p, you).squads.map(ui => units[ui].name) : null },
      them: { hpBefore: p.hp[them], gold: p.gold[them], army: armyOf(p, them), skills: skillsOf(p, them), tower: (p.towers && p.towers[them]) || null, unlocked: unlocksOf(p, them), character: Game.charOf(p, them), package: Game.packOf(p, them) ? Game.packOf(p, them).squads.map(ui => units[ui].name) : null },
      result: { winner: sum.winner === you ? 'you' : sum.winner === them ? 'them' : 'draw', timeout: !!sum.timeout, seconds: Math.round(sum.time), damageToYou: sum.dmg[you], damageToThem: sum.dmg[them], yourTowerFell: !!(sum.towerFell && sum.towerFell[you]), theirTowerFell: !!(sum.towerFell && sum.towerFell[them]) },
    };
    if (mode === 'claude') entry.claude = { said: claude.say || null, alsoDid: claude.did.slice(), leveledUp: lastAiLevels.map(x => `${units[x.unit].name} to level ${x.level + 1}`), botPlayed: !!claude.bot, note: claude.note || null };
    report.rounds.push(entry);
    report.updated = new Date().toISOString();
    if (m && m.over) { report.over = true; report.winner = m.winner === you ? 'you' : m.winner === them ? 'them' : 'draw'; report.hpLeft = { you: m.hp[you], them: m.hp[them] }; }
    const body = JSON.parse(JSON.stringify(report)), ref = reportDb.doc('matches/' + report.id);
    reportChain = reportChain.then(() => ref.set(body)).catch((e) => console.warn('match report not saved', e && e.code));
  }

  // ---------- match history ----------
  // Two-player matches only: the host's phone posts each round, once, to a Google Sheet web app
  // (tools/match-history.gs). Empty URL: nothing is saved and the Match history button is hidden.
  const HISTORY_URL = '';
  function saveHistory(pre, sum) {
    if (!HISTORY_URL || mode !== 'host') return;
    const p = withUnits(pre), charName = (sd) => { const c = Game.charInfo(Game.charOf(p, sd)); return c ? c.name : ''; };
    const army = (sd) => armyOf(p, sd).map(q => `${q.unit} L${q.level}`).join(', ');
    const row = {
      code: net.code, round: sum.round, map: (Game.mapOf(p) || {}).name || '', hostChar: charName(0), guestChar: charName(1),
      winner: sum.winner === 0 ? 'host' : sum.winner === 1 ? 'guest' : 'draw', timeout: !!sum.timeout, seconds: Math.round(sum.time),
      dmgHost: sum.dmg[0], dmgGuest: sum.dmg[1], hpHost: m.hp[0], hpGuest: m.hp[1], over: !!m.over,
      matchWinner: m.over ? (m.winner === 0 ? 'host' : m.winner === 1 ? 'guest' : 'draw') : '',
      hostArmy: army(0), guestArmy: army(1), hostSkills: skillsOf(p, 0).join(', '), guestSkills: skillsOf(p, 1).join(', '),
    };
    // text/plain keeps it a simple request (no CORS preflight, which Apps Script doesn't answer)
    try { fetch(HISTORY_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(row) }).catch(() => {}); } catch (e) {}
  }
  async function openHistorySheet() {
    $('sheet').innerHTML = `<div class="bar"><h3 id="sheet-h">Match history</h3><button class="btn small" id="close">Close</button></div>
      <p class="hint" id="hist-msg" aria-live="polite" style="margin:0">Loading…</p><ul class="hist" id="hist"></ul>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    let rows;
    try { rows = (await (await fetch(HISTORY_URL + '?n=40')).json()).rows || []; } catch (e) { rows = null; }
    if (!$('hist')) return;
    if (!rows) { $('hist-msg').textContent = 'Couldn’t load the history. Check your connection and try again.'; return; }
    $('hist-msg').textContent = rows.length ? `The latest ${rows.length === 1 ? 'battle' : rows.length + ' battles'} from two-player matches.` : 'No battles saved yet. Play a match against a friend.';
    $('hist').innerHTML = rows.map(r => {
      const who = (w) => w === 'host' ? (r.hostChar || 'Host') : w === 'guest' ? (r.guestChar || 'Guest') : 'Draw';
      const when = new Date(r.time), t = isNaN(when) ? '' : when.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      return `<li>${esc(r.hostChar || 'Host')} vs ${esc(r.guestChar || 'Guest')} · round ${esc(r.round)}: ${r.winner === 'draw' ? 'draw' : esc(who(r.winner)) + ' won'}${r.timeout ? ' on time' : ''}
        <span>${esc(t)} · match ${esc(r.code)}${r.map ? ' · ' + esc(r.map) : ''} · damage ${esc(r.dmgHost)}/${esc(r.dmgGuest)}${r.over === true || r.over === 'TRUE' ? ` · match over, ${r.matchWinner === 'draw' ? 'draw' : esc(who(r.matchWinner)) + ' won'}` : ''}</span>
        <span>${esc(r.hostArmy || '–')} vs ${esc(r.guestArmy || '–')}</span></li>`;
    }).join('');
  }

  // ---------- flow: vs Claude ----------
  // Only inside Claude: the page asks Claude (on the player's own account) for its move each round.
  let sampleFn = null;
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
    if (sampleFn && phase === 'start') showStart();
  })();
  const claude = { busy: false, fightWaiting: false, bot: false, off: false, did: [], say: '', note: '', started: 0, ctl: null, history: [] };

  function startClaudeMatch() {
    if (!sampleFn) { startAiMatch(); return; }
    leaveNet();
    mode = 'claude'; me = 0; restoreSet();
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, mapPick, m && m.map ? m.map.id : null, offChars, matchOpts());
    nextReady = [false, false]; rematch = [false, false];
    claude.off = false; claude.history = [];
    startReport();
    beginAiRound();
  }

  function claudeStatus() {
    if (claude.busy) return `Claude is planning its move… ${Math.max(0, Math.round((now() - claude.started) / 1000))} s`;
    if (claude.bot) return claude.off ? 'The bot is playing for Claude.' : 'Claude had trouble this round, so the bot played it.';
    return 'Claude has made its move.';
  }
  setInterval(() => { if (mode === 'claude' && phase === 'deploy' && claude.busy) { const h = $('panel').querySelector('.bar:last-child .hint'); if (h) h.textContent = claudeStatus(); } }, 1000);

  function startClaudeTurn() {
    claude.did = []; claude.say = ''; claude.note = ''; claude.fightWaiting = false; claude.bot = false;
    if (claude.off) { Game.aiDeploy(m, 1); claude.bot = true; return; }
    const round = m.round, prompt = claudePrompt();
    claude.busy = true; claude.started = now();
    if (claude.ctl) claude.ctl.abort();
    const ctl = claude.ctl = new AbortController();
    const opts = { modelTier: 'complex', cache: false, signal: ctl.signal };
    const once = () => typeof sampleFn.json === 'function'
      ? sampleFn.json(prompt, opts)
      : sampleFn(prompt, opts).then(r => { const t = r.text, a = t.indexOf('{'), b = t.lastIndexOf('}'); return JSON.parse(t.slice(a, b + 1)); });
    const fatal = (e) => e && ['cancelled', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired', 'rate_limited'].includes(e.code);
    // one retry on a hiccup before the bot steps in
    const ask = once().catch(e => (fatal(e) || ctl !== claude.ctl || m.round !== round) ? Promise.reject(e) : once());
    ask.then((mv) => {
      if (ctl !== claude.ctl || mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      applyClaudeMove(mv && typeof mv === 'object' ? mv : {});
    }, (e) => {
      if (ctl !== claude.ctl || (e && e.code === 'cancelled')) return;
      if (mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].includes(code)) {
        claude.off = true;
        claude.note = code === 'not_granted' ? 'Claude wasn’t allowed to play, so the bot is playing for it this match.' : 'Claude isn’t available here, so the bot is playing for it this match.';
      } else claude.note = code === 'rate_limited' ? 'Claude hit a usage limit this round, so the bot played it.' : 'Claude had trouble this round, so the bot played it.';
      Game.aiDeploy(m, 1); claude.bot = true;
    }).finally(() => {
      if (ctl !== claude.ctl) return;
      claude.busy = false;
      if (mode === 'claude' && phase === 'deploy') {
        if (claude.fightWaiting) { claude.fightWaiting = false; runFight(); }
        else panelDeploy();
      }
    });
  }

  // Everything Claude needs to know, from its own (red) side of the board
  function claudePrompt() {
    const n1 = (x, d = 1) => Math.round(x * 10 ** d) / 10 ** d;
    const unitLine = (u, i) => {
      const t = [];
      if (u.splash > 0) t.push(`splash ${u.splash} m`);
      if (u.defense === 'armor') t.push(`armor ${u.defVal}`);
      if (u.defense === 'ward') t.push(`ward ${u.defVal} (max damage per hit)`);
      if (u.burst > 1) t.push(`burst ${u.burst}`);
      if (u.flame > 0) t.push(`flamethrower: every attack hits all enemies in range within ${u.flame}° to each side of its target`);
      else if (u.pellets > 1) t.push(`shotgun ${u.pellets}`);
      if (u.spinUp > 0) t.push(`spin-up ${u.spinUp}%/s on one target, up to 3x attack speed, starts over when it switches target`);
      if (u.spinHit > 0) t.push(`damage spin-up ${u.spinHit}%/s on one target, up to 3x hit size, starts over when it switches target`);
      if (u.pierce > 0) t.push(`pierce ${u.pierce}`);
      if (u.projSpeed > 0) t.push(`projectile ${u.projSpeed} m/s`);
      if (u.minRange > 0) t.push(`min range ${u.minRange} m`);
      if (u.charge > 1) t.push(`charge x${u.charge}`);
      if (u.knockback > 0) t.push(`knockback ${u.knockback} m`);
      if (u.trample > 0) t.push(`tramples ${u.trample}%`);
      if (u.chargeStun > 0) t.push(`stunned ${u.chargeStun} s after each charge (can't move or attack)`);
      if (u.pctHit > 0) t.push(`every hit also deals ${u.pctHit}% of the target's max health, ignoring armor (not to towers)`);
      if (u.deathBlast > 0) t.push(`explodes on death for ${u.deathBlast}% of max health within ${Engine.BLAST_RADIUS} m`);
      if (u.windUp > 0) t.push(`wind-up ${u.windUp} s`);
      if (u.ram) t.push(`NEVER ATTACKS: runs straight at the enemy tower (the nearest enemy once it is down) and rams it once for its hit (${n1(u.hit)}), then is destroyed`);
      if (u.carrier) t.push('CARRIES ONE SQUAD of any other unit, hidden from the opponent until it is destroyed: place a squad on its tile (price and deployment as usual) and it rides inside, then jumps out where the carrier falls');
      if (u.noFlank) t.push('can\'t be placed on flank tiles');
      const sk = (u.skillDefs || []).map((d, k) => d ? `skill ${k + 1} "${d.name}" (${Game.isInnate(m, i, k) ? 'BUILT IN: always on for both players, free' : `${Game.skillCost(m, i, k)} gold${Game.hasSkill(m, 1, i, k) ? ', YOU OWN IT' : ''}`}): ${Engine.describeSkill(d)}` : null).filter(Boolean);
      const lock = Game.isUnlocked(m, 1, i) ? (Game.unlockCost(m, i, 1) ? ' [unlocked]' : '') : ` [LOCKED: unlock once for ${Game.unlockCost(m, i, 1)} gold before you can place it]`;
      return `- ${u.name}${lock}: price ${Game.shopCost(m, 1, i)}${Game.startLevel(m, 1) ? ` (squads start at level ${Game.startLevel(m, 1) + 1})` : ''}, ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'} x ${n1(u.hp, 0)} hp each, hit ${n1(u.hit)} x ${n1(u.aps, 2)}/s, range ${u.range} m, speed ${u.speed} m/s${t.length ? ', ' + t.join(', ') : ''}. Level-up cost ${Game.levelCost(u)}.${sk.length ? '\n    ' + sk.join('\n    ') : ''}`;
    };
    const tag = (u) => u.name;
    const matrix = units.map((u, i) => `${tag(u)}: ` + units.map((v, j) => i === j ? null : `${tag(v)} ${M[i][j] > 0 ? '+' : ''}${Math.round(M[i][j] * 100)}`).filter(Boolean).join(', ')).join('\n');
    const mine = m.armies[1].map(s => {
      const u = units[s.unit], need = s.level < Engine.MAX_LEVEL ? Math.round(Game.xpNeeded(u, s.level)) : null;
      return `- id ${s.id}: ${u.name} at col ${s.col}, row ${s.row}${Game.isRider(s) ? ` (riding inside your ${units[(Game.carrierOf(m, 1, s) || s).unit].name}, id ${s.in})` : ''}, level ${s.level + 1}${need ? `, XP ${Math.round(s.xp)}/${need}` : ', max level'}${Game.isReady(m, s) ? ', READY TO LEVEL UP' : ''}${s.round < m.round ? `, sells for ${Game.sellValue(m, s)}` : ''}${Game.enzoSkill(m, 1, s) != null ? `, has skill "${u.skillDefs[Game.enzoSkill(m, 1, s)].name}" (Enzo)` : ''}${Game.charmOf(s) ? `, charisma ${Game.charmOf(s)}/${Engine.CHARM_MAX}${Game.isGentleman(s) ? ' (Gentleman)' : ''}` : ''}`;
    });
    const theirs = m.armies[0].filter(s => s.round < m.round && !Game.hiddenFromFoe(m, s)).map(s => { const p = Game.seenAt(m, s); return `- ${units[s.unit].name} at col ${p.col}, row ${p.row}, level ${s.level + 1}`; });
    const theirSkills = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.skillVisible(m, 0, i, k)) theirSkills.push(`${(u.skillDefs[k] || {}).name} on ${u.name}`); }));
    const hist = m.history.slice(-4).map(h => `- round ${h.round}: ${h.timeout ? 'time ran out' : h.winner === 1 ? 'you won' : h.winner === 0 ? 'you lost' : 'draw'}; you took ${h.dmg[1]} damage, they took ${h.dmg[0]}`);
    // how each unit type did in the last fight
    const last = m.history[m.history.length - 1];
    const howDid = (side) => {
      if (!last || !last.squads) return [];
      const by = {};
      for (const q of last.squads[side]) { const b = by[q.unit] || (by[q.unit] = { n: 0, left: 0, dealt: 0 }); b.n++; b.left += q.left; b.dealt += q.dealt; }
      return Object.keys(by).sort((a, b) => by[b].dealt - by[a].dealt).map(ui => { const b = by[ui]; return `  ${units[ui].name} x${b.n}: dealt ${b.dealt} damage, ${Math.round(b.left / b.n * 100)}% of bodies survived`; });
    };
    const lastFight = last && last.squads ? `LAST FIGHT (round ${last.round}, ${last.winner === 1 ? 'you won' : last.winner === 0 ? 'you lost' : 'draw'} in ${Math.round(last.time)} s)${last.towerFell ? (last.towerFell[1] ? '. YOUR TOWER FELL' : '') + (last.towerFell[0] ? '. THEIR TOWER FELL' : '') : ''}
Your units:
${howDid(1).join('\n') || '  none'}
Their units:
${howDid(0).join('\n') || '  none'}
` : '';
    // their army by unit type, weighted by what it's worth (price x level), and which units beat it
    const foeArmy = m.armies[0].filter(s => s.round < m.round);
    const foeW = {}; let foeTotal = 0;
    for (const s of foeArmy) { const w = Game.unitCostOf(units[s.unit]) * (s.level + 1); foeW[s.unit] = (foeW[s.unit] || 0) + w; foeTotal += w; }
    const answers = foeTotal ? units.map((u, i) => [i, Object.keys(foeW).reduce((a, j) => a + (+j === i ? 0 : M[i][j] * foeW[j]), 0) / foeTotal]).sort((a, b) => b[1] - a[1]) : [];
    const pct = (x) => `${x > 0 ? '+' : ''}${Math.round(x * 100)}`;
    const foeMix = Object.keys(foeW).sort((a, b) => foeW[b] - foeW[a]).map(j => `${units[j].name} ${Math.round(foeW[j] / foeTotal * 100)}%`).join(', ');
    const counterLines = answers.length ? `THEIR ARMY by value: ${foeMix}
Your units ranked against their whole army (counter table weighted by their army value):
${answers.slice(0, 5).map(([i, v]) => `  ${units[i].name} ${pct(v)}`).join('\n')}
Worst choices against it: ${answers.slice(-3).reverse().map(([i, v]) => `${units[i].name} ${pct(v)}`).join(', ')}
` : '';
    const placeNow = Game.deploysAllowed(m, 1);
    const cheapest = Math.min(...units.map(u => Game.unitCostOf(u)));
    return `You are playing No Mans Land, a small auto-battler, against a human player. You are the RED side. Decide your moves for round ${m.round}. The human places their new squads at the same time and can't see yours until the fight. You only see their squads from earlier rounds. Play to win: build counters to what they have, protect your damage dealers, and think about what they are likely to add next.

RULES
- Board: columns 0-${Game.COLS - 1}, rows 0-${Game.ROWS - 1}, tiles ${Game.TILE} m wide. Your zone is rows 0-${Game.ZONE - 1}; row ${Game.ZONE - 1} is your front line, nearest the enemy, and row 0 is the back. Rows ${Game.ZONE}-${Game.ROWS - Game.ZONE - 1} are no man's land. From round ${Game.FLANK.round} each player may also deploy on flank tiles: columns ${Game.FLANK.cols.join(' and ')}, on the OPPONENT's half of the board: their whole zone plus their half of no man's land (yours: rows ${Math.min(...Game.flankRows(1))}-${Math.max(...Game.flankRows(1))}; theirs: rows ${Math.min(...Game.flankRows(0))}-${Math.max(...Game.flankRows(0))})${Game.flankOpen(m) ? ', OPEN NOW' : ''}. You can't use a tile the opponent already holds with a squad or their tower. Their flank columns on YOUR half (columns ${Game.FLANK.cols.join(' and ')}, rows ${Math.min(...Game.flankRows(0))}-${Math.max(...Game.flankRows(0))}) are reserved for them for the whole match: you can never place a squad or your tower there. Squads there start inside the enemy's lines, good for hitting their tower or backline from the side, so guard your own edges against theirs. A squad placed on a flank can't move or attack for the first ${Game.FLANK.delay} s of the first fight after it was placed; from the next round on it starts normally. The enemy zone is rows ${Game.ROWS - Game.ZONE}-${Game.ROWS - 1}; row ${Game.ROWS - Game.ZONE} is their front. One squad per tile. Squads keep their tile, except: once per round you may move ONE of your squads from an earlier round to another free tile you could place on, for ${Game.CONFIG.moveCost} gold ("move"). The opponent sees it on its old tile until the fight.
- The fight is automatic. Every body marches straight ahead in its own column (a squad on a flank tile marches sideways, toward the middle of the board, instead) until an enemy comes within its range + ${Game.SETTINGS.sight} m in any direction (at least ${Game.SETTINGS.minSight} m), then turns toward the nearest enemy and attacks once in range, staying on that enemy until it dies or leaves its range. Within ${Game.SETTINGS.drift} m beyond that it already starts curving toward the nearest enemy. Once no enemy is ahead of it, it turns toward the nearest one. So columns are lanes: a squad fights what stands in or near its lane, a squad in an empty lane far from the enemy walks past and hits the enemy from the side or behind, and long-range units in the back only get attacked once the front is gone. Short-range units in front shield long-range units behind. Spreading out limits splash damage.
- The round's loser loses health: for each surviving enemy squad, 2 x (its price / 100), scaled by the share of its bodies alive. If time runs out, both sides take damage. A round costs the loser at most ${Game.MAX_ROUND_DMG} health. Health starts at ${Game.START_HP} and the match ends at 0.
- Gold: both players get ${Game.incomeFor(2)} going into round 2, and ${Game.CONFIG.incomeStep} more every round after that (next round: +${Game.incomeFor(m.round + 1)}). The round's loser gets +${Game.LOSER_BONUS} extra. Unspent gold carries over.
- This round you may place ${Game.deploysAllowed(m, 1)} new squad(s). You may buy ONE extra deployment per round for ${Game.CONFIG.extraDeployCost} gold.
- Squads earn XP by dealing and taking damage. A squad marked READY TO LEVEL UP can be upgraded for its unit's level-up cost: level 2 doubles health and hit, level 3 triples them. Leveling up chaff (many cheap bodies) gives the enemy lots of XP when they die.
${Game.needsPack(m, 1) ? `- STARTING PACKAGE (round 1, choose first): add "package": N to your reply. Each one unlocks its two units for free and gives you its squads for free (no gold, no deployment); you place them with "place" like any squad, and any you leave out are placed for you. Your options:
${m.packages[1].map((p, k) => `  ${k}: ${p.squads.map(ui => units[ui].name).join(' + ')}${p.char ? ` with character ${Game.charInfo(p.char).name} (${Game.charInfo(p.char).ability})` : ''} (counter-table average of its units: ${p.units.map(ui => `${units[ui].name} ${Math.round(M[ui].reduce((a, b) => a + b, 0) / Math.max(1, units.length - 1) * 100)}`).join(', ')})`).join('\n')}
` : Game.freeLeft(m, 1).length ? `- FREE package squads still to place (no gold, no deployment): ${Game.freeLeft(m, 1).map(ui => units[ui].name).join(', ')}.
` : ''}- Unlocks: units marked LOCKED must be unlocked once (their unlock price, on top of the squad price) before you can place them; it lasts the whole match. List them under "unlock", or just place them and they're unlocked automatically if you can afford it.${(() => { const t = units.map((u, i) => Game.unlockCost(m, i) > 0 && Game.unlockVisible(m, 0, i) ? u.name : null).filter(Boolean); return t.length ? ' The opponent has unlocked: ' + t.join(', ') + '.' : ''; })()}
- Skills: each unit has 2. Buying one (its price) gives it to ALL your squads of that unit, now and later. You need at least one squad of that unit on the board (placing one this round counts).
- You may sell squads from earlier rounds for half their worth: the unit's price plus its level-ups (their tile becomes free).

UNITS
${units.map((u, i) => Game.isOff(m, i, 1) ? null : unitLine(u, i)).filter(Boolean).join('\n')}

COUNTER TABLE (each unit vs each other with equal gold; +100 = wins easily, -100 = loses badly)
${matrix}

STATE
- Your health ${m.hp[1]}, their health ${m.hp[0]}. Your gold: ${m.gold[1]}. Their gold to spend this round: ${m.gold[0]}.
${hist.length ? 'Recent rounds:\n' + hist.join('\n') : '- This is the first round.'}

${lastFight}${counterLines}
HOW TO PLAY WELL
- Spend your gold. Gold you keep does nothing in this fight, and the human spends theirs every round. Aim to end the round with less than ${cheapest} gold left: place your ${placeNow} squad(s), level up squads that are ready (a level-up doubles a squad for half its price, the best deal in the game), buy skills for units you have several of, and buy extra deployments (${Game.CONFIG.extraDeployCost} gold each, up to 3) to place more squads when you still have gold.
- Learn from the last fight: stop adding units that died without doing damage, and add more of what worked. Counter what they have most of, using the ranking above, but keep a mix so one counter pick from them can't wipe you.
- Their squads stay where they are, so build where their army will walk into yours. Put tough, short-range units in front of your damage dealers.

YOUR SQUADS
${mine.length ? mine.join('\n') : '- none yet'}

THEIR SQUADS (from earlier rounds)
${theirs.length ? theirs.join('\n') : '- none yet'}
${theirSkills.length ? 'Their skills: ' + theirSkills.join(', ') : ''}

TOWERS
- Each player has one tower. It never moves, is rebuilt every round and doesn't count for winning a round. If a tower falls during a fight, its owner's whole army deals ${Engine.TOWER_DOWN.attack}% less damage, moves ${Engine.TOWER_DOWN.move}% slower and takes ${Engine.TOWER_DOWN.taken}% more damage for ${Engine.TOWER_DOWN.secs} s. Sending a squad down an empty lane to break their tower can turn a fight; guard the lane to yours.
- Until round ${Game.TOWER_PICK_ROUND} each tower is an Outpost (${Game.OUTPOST.unit.hp} hp, hit ${Game.OUTPOST.unit.hit} x ${Game.OUTPOST.unit.aps}/s, range ${Game.OUTPOST.unit.range} m). In round ${Game.TOWER_PICK_ROUND} each player picks a tower type that stays for the rest of the match: ${Game.towerChoices(m, 1).map(x => `"${x.id}" ${x.name}: ${x.unit.hp} hp, hit ${x.unit.hit} x ${x.unit.aps}/s, range ${x.unit.range} m${x.unit.splash ? `, ${x.unit.splash} m splash` : ''}`).join('; ')}.${Game.needsTowerPick(m, 1) ? ` ROUND ${Game.TOWER_PICK_ROUND}: pick yours now with "towerType" in your reply.` : ''}
- Tower skills (one per tower type, ${Game.TOWER_SKILL.cost} gold, bought once per match after the pick with "towerSkill": true): ${Game.TOWER_TYPES.filter(x => x.skill).map(x => `${x.name}: "${x.skill.name}", ${x.skill.text}`).join(' ')} Second tower skills (bought once per match, each for its own price, with "towerSkill2": true): ${Game.TOWER_TYPES.filter(x => x.skill2).map(x => `${x.name}: "${x.skill2.name}" (${x.skill2.cost} gold), ${x.skill2.text}`).join(' ')}${Game.towerSkill2Of(m, 1) ? ' You own yours.' : ''} Every round the Bank tower may also take a loan with "loan": true: +${Game.LOAN.gold} gold now, ${Game.LOAN.payback} less gold next round (never below nothing).${Game.loanNow(m, 1) ? ' You took one this round.' : ''} The Slime tower has no skill to buy; every skill you buy for Slime Wizards or Slimeshots also works on it. The Mage tower has no such skill; instead, every round you may call ONE mage general with "mageGeneral": "${Game.MAGE_GENERALS.filter(g => !g.extra).map(g => g.id).join('" | "')}", and/or the teleport general on top of it (e.g. "mageGeneral": ["lightning", "teleport"]), for that round's fight only: ${Game.MAGE_GENERALS.map(g => `"${g.id}" ${g.name} (${g.cost} gold): ${g.text}`).join(' ')}${Game.towerSkillOf(m, 1) ? ' You own yours.' : Game.towerPicked(m, 1) || Game.needsTowerPick(m, 1) ? ' You can buy yours this round.' : ''}
- Your tower: ${Game.towerType(m, 1).name}, col ${m.towers[1].col}, row ${m.towers[1].row} (fixed; squads can't share its tile).
- Their tower: ${m.round !== Game.TOWER_PICK_ROUND ? Game.towerType(m, 0).name + (Game.towerSkillVisible(m, 0) && Game.towerType(m, 0).skill ? ` with "${Game.towerType(m, 0).skill.name}"` : '') + (Game.towerSkill2Visible(m, 0) && Game.towerType(m, 0).skill2 ? ` with "${Game.towerType(m, 0).skill2.name}"` : '') + ', ' : 'type hidden until the fight, '}col ${m.towers[0].col}, row ${m.towers[0].row}.

MAP
${(() => { const mp = Game.mapOf(m), e = Game.elfSpot(m); return mp ? `- ${mp.name}: ${mp.text}${e ? ` The elf tower stands in column ${e.col}, on the line between rows ${Game.ROWS / 2 - 1} and ${Game.ROWS / 2}; it hits for ${Game.ELF_TOWER.hit}, ${Game.ELF_TOWER.aps} times a second, range ${Game.ELF_TOWER.range} m, and can't be attacked. Bribe-off: you can bribe any number of times per round ("bribe": number of bribes); the first bribe in a round costs ${Game.BRIBE_COST} gold and each further one that round ${Game.BRIBE_COST} more (${Game.BRIBE_COST}, ${2 * Game.BRIBE_COST}, ${3 * Game.BRIBE_COST}, ...). In every fight the tower sides with whoever has bribed it the most times (count, not gold) over the whole match: it never shoots their units, heals their wounded units near it for ${Game.ELF_TOWER.healHit} (x${mp.healMul || 1} on this map, ${Game.ELF_TOWER.healSplash} m splash) every ${Math.round(10 / Game.ELF_TOWER.healAps) / 10} s, and shoots only the other player's units. With totals level it shoots both sides. Totals are secret; you only see who was ahead after the last fight. ${Game.elfPowered(m) ? `From round ${Game.ELF_POWER.fromRound} on the elves hit and heal twice as hard (now ${Game.elfUnit(m).hit} damage, ${Game.elfUnit(m).healHit} heal).` : `After round ${Game.ELF_POWER.fromRound - 1} the elves hit and heal twice as hard.`} You have bribed ${Game.bribeCount(m, 1)} times (${Game.bribeGold(m, 1)} gold). ${Game.elfOwnOf(m, 1) ? `Your own elf tower stands at col ${Game.elfOwnOf(m, 1).col}, row ${Game.elfOwnOf(m, 1).row}.` : Game.elfOwnOffered(m, 1) ? `The elves now sell you one elf tower of your own for ${Game.elfOwnCost(m, 1)} gold ("elfTower":{"col":5,"row":2}, a free tile of your zone): permanent, can't be attacked, shoots only the opponent's units and heals yours.` : `Once ${Game.ELF_OWN.unlock} bribes have been paid in all (both players), each player who has bribed at least once (in an earlier round) can buy one elf tower of their own for ${Game.elfOwnCost(m, 1)} gold, from the next round on.${Game.elfOwnUnlocked(m) ? ' That point has been reached, but you have never bribed, so the elves sell you none until you do.' : ''}`} ${(() => { const l = Game.bribeLeader(m, true); return l < 0 ? 'After the last fight the bribe-off was level.' : l === 1 ? 'After the last fight you were ahead.' : 'After the last fight your opponent was ahead.'; })()}` : ''}${mp.ice ? ` Storm band rows now: ${Game.stormRows(m).join(', ')}.${Game.hailRound(m) ? ` Hail tiles this round: ${Game.hailTiles(m).map(h => `col ${h.col}, row ${h.row}`).join('; ')}.` : ''}${Game.altarRound(m) ? ` The altar of ice is up this round. "altar" can list any of: "walls" (${Game.altarCost(m, 1, 'walls')} gold: your tower's 4 walls each block the first ${Game.ICE.wallHits} hits from their side, this fight only), "push" (${Game.altarCost(m, 1, 'push')} gold: storm band moves ${Game.ICE.push} rows toward the opponent from the next hailstorm on; list it more than once to push further), "snowgre" (${Game.altarCost(m, 1, 'snowgre')} gold: a permanent hail-immune Ether Golem at ${Math.round(Game.ICE.snowFirst * Math.pow(2, Game.snowgres(m, 1).length) * 100)}% strength, standing in your half of no man's land each fight).` : ''} Your Snowgres: ${Game.snowgres(m, 1).length}.` : ''}${mp.shrooms ? ` Removing a mushroom tile costs ${Game.shroomCost(m, 1)} gold ("removeTiles":[{"col":3,"row":6}]); it is gone from the next fight on. Mushroom tiles still there: ${(m.map.tiles || []).filter(x => Game.shroomAt(m, x.col, x.row)).map(x => `${x.type} at col ${x.col}, row ${x.row}`).join('; ')}.` : ''}` : '- No special map.'; })()}

CHARACTERS (each package comes with one; its ability lasts the whole match)
- Yours: ${Game.charOf(m, 1) ? `${Game.charInfo(Game.charOf(m, 1)).name}: ${Game.charInfo(Game.charOf(m, 1)).ability}` : 'the one that comes with the package you pick'}${Game.charOf(m, 1) === 'zoe' ? ` Your buff tiles this round: ${(m.buff[1] || []).map(t => `col ${t.col}, row ${t.row}`).join('; ')}. A squad that starts the fight on one keeps the bonus all fight, even after it moves.` : ''}
- Theirs: ${m.round > 1 && Game.charOf(m, 0) ? `${Game.charInfo(Game.charOf(m, 0)).name}: ${Game.charInfo(Game.charOf(m, 0)).ability}` : 'hidden until the first fight'}

Reply with only a JSON object in this shape:
{${Game.needsPack(m, 1) ? '"package":0,' : ''}${Game.needsTowerPick(m, 1) ? '"towerType":"keep",' : ''}${Game.needsTowerPick(m, 1) || (Game.towerPicked(m, 1) && !Game.towerSkillOf(m, 1) && Game.towerType(m, 1).skill) ? '"towerSkill":false,' : ''}${Game.needsTowerPick(m, 1) || (Game.towerPicked(m, 1) && !Game.towerSkill2Of(m, 1) && Game.towerType(m, 1).skill2) ? '"towerSkill2":false,' : ''}${Game.needsTowerPick(m, 1) || (Game.towerPicked(m, 1) && Game.towerType(m, 1).id === 'mage') ? '"mageGeneral":null,' : ''}${Game.needsTowerPick(m, 1) || Game.canTakeLoan(m, 1) ? '"loan":false,' : ''}"unlock":["unit name"],"sell":[squad ids],"levelUp":[squad ids, list one twice to level it twice],"skills":[{"unit":"unit name","slot":1}],"extraDeployments":0,${Game.elfSpot(m) ? '"bribe":0,' : ''}${Game.elfOwnOffered(m, 1) && !Game.elfOwnOf(m, 1) ? '"elfTower":null,' : ''}${(Game.mapOf(m) || {}).shrooms ? '"removeTiles":[],' : ''}${Game.altarRound(m) ? '"altar":[],' : ''}"move":{"id":squad id,"col":5,"row":3} or null,"place":[{"unit":"unit name","col":5,"row":3}],"say":"one short playful line to your opponent, at most 15 words, shown after the fight"}
For "say": make it about what is happening in this match, and never repeat a line.${claude.history.length ? ' Lines you already used:\n' + claude.history.slice(-6).map(x => '- ' + x).join('\n') : ''}
Actions run in this order: package (round 1 only), sell, levelUp, unlock, skills, ${Game.elfSpot(m) ? 'bribe, ' : ''}${Game.elfOwnOffered(m, 1) && !Game.elfOwnOf(m, 1) ? 'elfTower, ' : ''}${(Game.mapOf(m) || {}).shrooms ? 'removeTiles, ' : ''}${Game.altarRound(m) ? 'altar, ' : ''}extraDeployments, move, place. Anything you can't afford or that breaks a rule is skipped, so keep the total cost within your gold (${m.gold[1]} plus any sales). Use exact unit names. Unspent gold isn't lost, but squads on the board win rounds.`;
  }

  function applyClaudeMove(mv) {
    const list = (x) => Array.isArray(x) ? x.slice(0, 20) : [];
    const int = (x) => Math.round(Number(x));
    const unitIdx = (name) => units.findIndex(u => u.name.toLowerCase() === String(name || '').toLowerCase().trim());
    const did = [];
    if (Game.needsPack(m, 1)) {
      if (!Game.choosePack(m, 1, int(mv.package))) Game.choosePack(m, 1, 0);
      m.armies[1] = m.armies[1].filter(s => !s.free); // Claude places its package squads itself; any it leaves out are placed at the fight
    }
    if (Game.needsTower(m, 1)) { // the tower goes down first; a bad spot falls back to the default corner
      const tw = mv.tower && typeof mv.tower === 'object' ? mv.tower : null;
      if (!(tw && Game.placeTower(m, 1, int(tw.col), int(tw.row)))) Game.ensureTower(m, 1);
    }
    if (mv.towerType) Game.setTowerType(m, 1, String(mv.towerType));
    if (mv.towerSkill === true && Game.buyTowerSkill(m, 1)) did.push('bought its tower skill');
    if (mv.towerSkill2 === true && Game.buyTowerSkill2(m, 1)) did.push(`bought ${Game.towerType(m, 1).skill2.name}`);
    if (mv.loan === true && Game.takeLoan(m, 1)) did.push('took a bank loan');
    for (const id of [].concat(mv.mageGeneral || []).slice(0, 2).map(String)) if (Game.buyMageGen(m, 1, id)) did.push(`called the ${Game.mageGenInfo(id).name}`);
    for (const id of list(mv.sell)) {
      const sq = m.armies[1].find(s => s.id === int(id));
      if (sq && Game.sell(m, 1, sq.id)) did.push(`sold ${units[sq.unit].name}`);
    }
    const levels = [];
    for (const id of list(mv.levelUp)) {
      const sq = m.armies[1].find(s => s.id === int(id));
      if (sq && Game.levelUp(m, 1, sq.id)) levels.push({ id: sq.id, unit: sq.unit, level: sq.level });
    }
    const skills = list(mv.skills);
    const trySkills = () => {
      for (const x of skills) {
        if (!x || x.done) continue;
        const ui = unitIdx(x.unit), k = int(x.slot) - 1;
        if (ui >= 0 && k >= 0 && k < Engine.SKILL_SLOTS && Game.buySkill(m, 1, ui, k)) { x.done = true; did.push(`bought ${units[ui].skillDefs[k].name} for ${units[ui].name}`); }
      }
    };
    for (const name of list(mv.unlock)) { const ui = unitIdx(name); if (ui >= 0 && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`); }
    trySkills();
    const bribes = Math.max(0, Math.min(20, mv.bribe === true ? 1 : int(mv.bribe) || 0));
    let paid = 0;
    for (let k = 0; k < bribes; k++) if (Game.bribe(m, 1)) paid++;
    if (paid) did.push(`bribed the elves ${paid} ${paid === 1 ? 'time' : 'times'}`);
    if (mv.elfTower && typeof mv.elfTower === 'object' && Game.buyElfOwn(m, 1, int(mv.elfTower.col), int(mv.elfTower.row))) did.push(`placed an elf tower at col ${int(mv.elfTower.col)}, row ${int(mv.elfTower.row)}`);
    for (const a of list(mv.altar)) if (Game.buyAltar(m, 1, String(a))) did.push({ walls: 'raised ice walls', push: 'pushed the hailstorm', snowgre: 'summoned a Snowgre' }[a]);
    for (const q of list(mv.removeTiles)) if (q && Game.removeShroom(m, 1, int(q.col), int(q.row))) did.push(`removed the ${Game.shroomTileAt(m, int(q.col), int(q.row)).type} mushroom at col ${int(q.col)}, row ${int(q.row)}`);
    const extra = Math.max(0, Math.min(Game.CONFIG.maxExtraDeploys, int(mv.extraDeployments) || 0));
    for (let k = 0; k < extra; k++) Game.buyDeploy(m, 1);
    if (mv.move && typeof mv.move === 'object') {
      const sq = m.armies[1].find(s => s.id === int(mv.move.id) && s.round < m.round);
      if (sq && Game.moveSquad(m, 1, sq.id, int(mv.move.col), int(mv.move.row))) did.push(`moved ${units[sq.unit].name}`);
    }
    for (const pl of list(mv.place)) {
      const ui = unitIdx(pl && pl.unit);
      if (ui >= 0 && !Game.isUnlocked(m, 1, ui) && m.gold[1] >= Game.unlockCost(m, ui, 1) + Game.shopCost(m, 1, ui) && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`);
      if (ui >= 0) Game.place(m, 1, ui, int(pl.col), int(pl.row));
    }
    trySkills(); // skills for units placed just now
    while (m.extraDeploys[1] > 0 && Game.deploysLeft(m, 1) > 0 && Game.refundDeploy(m, 1)) {}
    lastAiLevels = levels;
    claude.did = did;
    claude.say = String(mv.say || '').replace(/\s+/g, ' ').trim().slice(0, 140);
    if (claude.say) claude.history.push(claude.say);
  }

  // ---------- Factions gamemode: the draft ----------
  // Before a Factions match the players draft factions one at a time (Game.FACTION_MODE.order). The match is then
  // played with the drafted factions' units only (useSet swaps them in; restoreSet puts the player's own units back),
  // each player with their own two factions. Live: the host runs the draft; the guest sends its picks (dpick).
  let matchKind = 'standard'; // standard | factions: what Play vs AI / Start match / Rematch starts
  let draft = null, draftSel = null, draftTimer = 0, standardSet = null;
  const FALL = { units: FDATA.units, matrix: FDATA.matrix, skills: FDATA.skills || [] };
  const FSHAPES = Shapes.assign(FALL.units); // for showing each faction's units
  const factionsReady = () => Game.draftPossible() && FALL.units.length >= 2;
  function useFactionSet(picks) {
    if (!standardSet) standardSet = { set: rawSet, custom: customSet };
    useSet(Game.factionSet(FALL, [...picks[0], ...picks[1]]), false);
  }
  function restoreSet() { if (standardSet) { useSet(standardSet.set, standardSet.custom); standardSet = null; } }
  function startDraft() {
    restoreSet();
    m = null; bt = null; battlePre = null; deadline = 0; draftSel = null;
    draft = Game.createDraft(Math.random() < 0.5 ? 0 : 1);
    phase = 'draft'; hud(); netStatus(); render();
    draftChanged();
  }
  // after every pick or ban: the AI's turn, the guest's screen, or the match when the draft is done
  function draftChanged() {
    clearTimeout(draftTimer); draftSel = null;
    if (Game.draftDone(draft)) { finishDraft(); return; }
    const t = Game.draftTurn(draft);
    if (mode === 'ai' && t.side === 1) draftTimer = setTimeout(() => {
      if (mode !== 'ai' || phase !== 'draft' || !draft) return;
      Game.draftAct(draft, 1, Game.aiDraftChoice(draft, 1, FALL, (now() ^ (Math.random() * 1e9)) >>> 0));
      draftChanged();
    }, 900);
    if (mode === 'host') sendSync();
    drawDraft();
  }
  function finishDraft() {
    const picks = draft.picks; draft = null;
    useFactionSet(picks);
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, null, null, offChars, { factions: picks });
    lastSummary = null; nextReady = [false, false]; rematch = [false, false];
    startReport();
    if (mode === 'host') hostBeginRound(); else beginAiRound();
  }
  function draftPick(id) {
    const t = Game.draftTurn(draft);
    if (!t || t.side !== me || !Game.draftOpen(draft).includes(id)) return;
    if (mode === 'guest') { send({ t: 'dpick', id, step: draft.step }); draftSel = null; return; }
    if (Game.draftAct(draft, me, id)) draftChanged();
  }
  function drawDraft() {
    if (phase !== 'draft' || !draft) return;
    const t = Game.draftTurn(draft), mine = t && t.side === me, open = Game.draftOpen(draft);
    if (!open.includes(draftSel)) draftSel = null;
    const who = mode === 'ai' ? 'The enemy' : 'Your opponent';
    const owner = (id) => draft.picks[me].includes(id) ? 'Yours' : draft.picks[foe()].includes(id) ? (mode === 'ai' ? 'Enemy’s' : 'Theirs') : (draft.bans[0].includes(id) || draft.bans[1].includes(id)) ? 'Banned' : '';
    const names = (ids) => ids.length ? ids.map(id => { const f = Game.factionInfo(id); return `<b style="color:${f.color}">${esc(f.name)}</b>`; }).join('') : '<b>–</b>';
    overlay(`<div class="draft">
      <span class="eyebrow">Factions · draft · ${Game.FACTION_MODE.picks} each</span>
      <h2 style="font-size:clamp(20px,6vw,28px);margin:0">${!t ? 'Draft done' : mine ? (t.act === 'ban' ? 'Ban a faction' : 'Pick a faction') : `${who} is ${t.act === 'ban' ? 'banning' : 'picking'}…`}</h2>
      <div class="sides"><span>You${names(draft.picks[me])}</span><span>${mode === 'ai' ? 'Enemy' : 'Opponent'}${names(draft.picks[foe()])}</span></div>
      <div class="fgrid">${draft.pool.map(id => {
        const f = Game.factionInfo(id); if (!f) return '';
        const st = owner(id);
        return `<button class="fac" data-fac="${esc(id)}" style="--fc:${f.color}" aria-pressed="${draftSel === id}" ${st ? 'disabled' : ''}>
          <span class="nm">${esc(f.name)}</span>${f.theme ? `<span class="sub">${esc(f.theme)}</span>` : ''}${st ? `<span class="st">${st}</span>` : ''}</button>`;
      }).join('')}</div>
    </div>`);
    $('overlay').querySelectorAll('[data-fac]').forEach(b => b.addEventListener('click', () => { draftSel = b.dataset.fac; drawDraft(); }));
    const f = draftSel && Game.factionInfo(draftSel), T = f && f.tower.unit;
    const fu = f ? FSHAPES.filter(u => u.faction === f.id) : [];
    $('panel').innerHTML = `${f ? `<div style="display:grid;gap:6px;font-size:13px;line-height:1.4">
        <b style="color:${f.color};font-family:var(--font-display);font-size:16px">${esc(f.name)}</b>
        ${f.trait ? `<span><span style="color:var(--gold)">${esc(f.trait.name || 'Trait')}:</span> ${esc(f.trait.text || '')}</span>` : ''}
        <span><span style="color:var(--gold)">Tower: ${esc(f.tower.name)}</span> · ${Math.round(T.hp)} hp · hit ${T.hit} × ${T.aps}/s · ${T.range} m${f.tower.text ? `. ${esc(f.tower.text)}` : ''}</span>
        <span class="hint">${fu.map(u => `<span style="color:${u.color};display:inline-flex;vertical-align:middle;margin-right:3px">${Shapes.svg(u.shape, 12)}</span>${esc(u.name)} · ${Game.unitCostOf(u)} gold`).join('<br>') || 'No units yet.'}</span>
      </div>` : `<span class="hint">${mine ? 'Tap a faction to see its units and tower.' : 'Tap a faction to see its units and tower while you wait.'}</span>`}
      <div class="bar">
        <button class="btn" id="draft-leave">${mode === 'ai' ? 'Main menu' : 'Leave'}</button>
        ${mine ? `<button class="btn primary" id="draft-go" ${f && open.includes(f.id) ? '' : 'disabled'}>${f ? `${t.act === 'ban' ? 'Ban' : 'Pick'} ${esc(f.name)}` : (t.act === 'ban' ? 'Ban' : 'Pick')}</button>` : ''}
      </div>`;
    $('draft-leave').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
    if ($('draft-go')) $('draft-go').addEventListener('click', () => { if (draftSel) draftPick(draftSel); });
  }

  // ---------- flow: vs AI ----------
  function startAiMatch() {
    leaveNet();
    mode = 'ai'; me = 0;
    if (matchKind === 'factions' && factionsReady()) { startDraft(); return; }
    restoreSet();
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, mapPick, m && m.map ? m.map.id : null, offChars, matchOpts());
    nextReady = [false, false]; rematch = [false, false];
    startReport();
    beginAiRound();
  }

  function beginAiRound() {
    if (mode === 'claude') { startClaudeTurn(); enterDeploy(timerOn ? deployMs() : 0); return; }
    Game.aiDeploy(m, 1);       // the AI commits first; its new squads stay hidden until the fight
    enterDeploy(timerOn ? deployMs() : 0);
  }

  function enterDeploy(ms) {
    phase = 'deploy'; bt = null; battlePre = null; fx = []; selected = null; timeUp = false; resultShownAt = 0; elfPlacing = false;
    ready = [false, false];
    heldMs = ms > 0 && mode !== 'guest' && picksPending() ? ms : 0;
    deadline = ms > 0 && !heldMs ? now() + ms : 0;
    $('clock').textContent = '';
    closeSheet(); overlay(null); hud(); netStatus(); panelDeploy(); size(); render();
  }

  // the players whose tower pick holds the clock: this player, and on the host the guest too
  const picksPending = () => !!m && (Game.needsTowerPick(m, me) || (mode === 'host' && Game.needsTowerPick(m, 1)));
  function releaseClock() {
    if (mode === 'guest' || phase !== 'deploy' || !heldMs || picksPending()) return;
    if (mode === 'host' && !net.connected) { pausedLeft = heldMs; heldMs = 0; return; } // starts when they're back
    deadline = now() + heldMs; heldMs = 0;
    if (mode === 'host') { sendSync(); saveHost(); }
    panelDeploy();
  }

  function tapNext() {
    if (phase !== 'result') return;
    if (solo()) { beginAiRound(); return; }
    nextReady[me] = true;
    if (mode === 'guest') send({ t: 'next', round: lastSummary && lastSummary.round });
    else { sendStatus(); saveHost(); if (!checkNext()) showResult(lastSummary); return; }
    showResult(lastSummary);
  }

  function askRematch() {
    if (phase !== 'end' || solo()) return;
    rematch[me] = true;
    if (mode === 'guest') send({ t: 'rematch' });
    else { sendStatus(); if (checkRematch()) return; }
    showResult(lastSummary);
  }

  // ---------- the fight (vs AI and host) ----------
  const snapshot = (match) => JSON.parse(JSON.stringify({ ...match, units: null, matrix: null }));
  const withUnits = (s) => ({ ...s, units, matrix: M });

  function runFight() {
    if (phase !== 'deploy' || !m) return;
    if (mode === 'guest') return;
    if (mode === 'claude' && claude.busy) { if (!claude.fightWaiting) { claude.fightWaiting = true; selected = null; closeSheet(); panelDeploy(); } return; }
    closeSheet(); selected = null;
    if (mode === 'ai' || (mode === 'claude' && claude.bot)) lastAiLevels = Game.aiLevel(m, 1); // the AI spends its level-ups now
    else if (mode !== 'claude') lastAiLevels = [];
    Game.ensureTower(m, 0); Game.ensureTower(m, 1);
    Game.ensurePack(m, 0); Game.ensurePack(m, 1);
    Game.settleTowerPicks(m);
    const pre = snapshot(m);
    // work out the result first; both screens then play the same battle back
    const sim = Game.startBattle(m);
    while (sim.step()) {}
    const summary = Game.resolve(m, sim.result());
    recordRound(pre, summary);
    saveHistory(pre, summary);
    lastSummary = summary; nextReady = [false, false]; rematch = [false, false];
    if (mode === 'host') { send({ t: 'fight', pre, post: snapshot(m), summary }); saveHost(); }
    playBattle(pre);
  }

  function playBattle(pre) {
    phase = 'battle'; selected = null; deadline = 0; timeUp = false;
    battlePre = withUnits(pre);
    bt = Game.startBattle(battlePre);
    fx = []; acc = 0; lastTs = 0;
    closeSheet(); overlay(null); hud(); panelBattle(); render();
    cancelAnimationFrame(raf);
    if (reduced) { while (bt.step()) {} finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function absorb() {
    for (const s of bt.lastShots()) if (s[8] > 0) fx.push({ kind: 'flame', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], half: s[8], age: 0, life: 0.3 });
    else if (s[10] === 1) fx.push({ kind: 'bolt', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], age: 0, life: 0.22, seed: Math.random() });
    else fx.push({ kind: s[7] === 1 ? 'heal' : 'shot', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], splash: s[5], charged: s[6], spin: s[9] || 1, age: 0, life: s[7] === 1 ? 0.35 : 0.18 });
    for (const b of bt.bodies) if (!b.alive && !b._gone) { b._gone = true; fx.push({ kind: 'death', x: b.x, y: b.y, u: b.u, side: b.side, age: 0, life: 0.5 }); }
  }

  function loop(ts) {
    if (phase !== 'battle') return;
    const dtReal = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
    const boost = bt.time() > 20 ? 2 : 1;
    acc += dtReal * speed * boost;
    while (acc >= Game.SETTINGS.dt) {
      acc -= Game.SETTINGS.dt;
      if (!bt.step()) break;
      absorb();
    }
    for (const e of fx) e.age += dtReal * speed * boost;
    fx = fx.filter(e => e.age < e.life);
    $('clock').textContent = `${bt.time().toFixed(1)} s${boost > 1 ? ' · speeding up' : ''}`;
    render();
    if (bt.isOver()) { finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function finishBattle() {
    if (phase !== 'battle') return;
    cancelAnimationFrame(raf);
    fx = [];
    const res = bt.result();
    $('clock').textContent = `${res.time.toFixed(1)} s`;
    if (lastSummary && (res.winner !== lastSummary.winner || Math.abs(res.time - lastSummary.time) > 1e-6)) {
      console.warn('No Mans Land: this screen’s replay differs from the host’s result; the host’s result counts.');
    }
    battlePre = null;
    render();
    showResult(lastSummary);
  }

  // ---------- board input ----------
  const tileAt = (ev) => board.tileAt(ev.clientX, ev.clientY);
  // drag one of your squads: this round's squads move for free; an older one only with the Move ability
  cv.addEventListener('pointerdown', (ev) => {
    if (phase !== 'deploy' || !m || !editable() || choosingPack() || placingTower()) return;
    const t = tileAt(ev); if (!t) return;
    const sq = Game.squadAt(m, me, t.col, t.row);
    if (!sq) return;
    if (sq.round < m.round && !(moveMode || Game.movedId(m, me) === sq.id)) return;
    if (!Game.canMove(m, me, sq)) return;
    drag = { id: sq.id, from: t, over: t, moved: false };
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  cv.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved || (d.over.col === d.from.col && d.over.row === d.from.row)) { render(); return; }
    dragEndAt = performance.now(); // the click that follows a drag is not a tap
    if (Game.moveSquad(m, me, d.id, d.over.col, d.over.row) && m.armies[me].find(s => s.id === d.id).round < m.round) { moveMode = false; moving = null; }
    changed();
  });
  cv.addEventListener('pointercancel', () => { if (drag) { drag = null; render(); } });
  cv.addEventListener('pointermove', (ev) => {
    if (drag) {
      const t = tileAt(ev);
      if (t && (t.col !== drag.over.col || t.row !== drag.over.row)) { drag.over = t; drag.moved = true; render(); }
      return;
    }
    if (phase !== 'deploy' || ev.pointerType !== 'mouse') return;
    hoverTile = tileAt(ev); render();
  });
  cv.addEventListener('pointerleave', () => { hoverTile = null; if (phase === 'deploy') render(); });
  cv.addEventListener('click', (ev) => {
    if (phase !== 'deploy') return;
    const t = tileAt(ev); if (!t) return;
    if (choosingPack() || choosingTower()) return; // the package (and in round 3 the tower) comes first
    if (performance.now() - dragEndAt < 400) return;
    if (placingTower()) { if (editable() && Game.placeTower(m, me, t.col, t.row)) changed(); return; }
    if (placingElf()) { if (editable() && Game.buyElfOwn(m, me, t.col, t.row)) { elfPlacing = false; changed(); } else if (!Game.elfOwnSpotOk(m, me, t.col, t.row)) { elfPlacing = false; render(); hud(); panelDeploy(); } return; }
    if (Game.elfOwnAt(m, me, t.col, t.row)) { openMapSheet(); return; }
    if (charmMode && editable() && Game.canGiveCharm(m, me)) { // Matteo: the first Charisma stack goes to the squad tapped
      const own = Game.squadAt(m, me, t.col, t.row);
      if (own && Game.giveCharm(m, me, own.id)) { charmMode = false; changed(); }
      return;
    }
    if (moveMode && editable()) { // Move ability: pick an older squad, then a free tile
      const own = Game.squadAt(m, me, t.col, t.row), mv = moving != null && m.armies[me].find(s => s.id === moving);
      if (mv && (!own || Game.boardable(m, me, t.col, t.row, mv.unit)) && Game.moveSquad(m, me, moving, t.col, t.row)) { moveMode = false; moving = null; changed(); return; }
      if (own && own.round < m.round) { moving = moving === own.id ? null : own.id; changed(); return; }
      return;
    }
    if (Game.towerAt(m, me, t.col, t.row)) {
      openTowerSheet(me);
      return;
    }
    if (towerVisible(foe()) && Game.towerAt(m, foe(), t.col, t.row)) { openTowerSheet(foe()); return; }
    const elf = Game.elfSpot(m);
    if (elf && t.col === elf.col && (t.row === Game.ROWS / 2 - 1 || t.row === Game.ROWS / 2) && !Game.occupied(m, me, t.col, t.row)) { openMapSheet(); return; }
    const freeTile = !Game.occupied(m, me, t.col, t.row);
    if (Game.altarRound(m) && selected === null && freeTile && Math.abs(t.col - (Game.COLS - 1) / 2) < 1 && Math.abs(t.row - (Game.ROWS - 1) / 2) < 1) { openAltarSheet(); return; }
    if (Game.hailRound(m) && selected === null && freeTile && Game.hailTiles(m).some(h => h.col === t.col && h.row === t.row)) { openMapSheet(); return; }
    if ((shroomShown(m, t.col, t.row) || myRemovalNow(t.col, t.row)) && selected === null && !Game.occupied(m, me, t.col, t.row) && !m.armies[foe()].some(s => { const p = Game.seenAt(m, s); return p.col === t.col && p.row === t.row && s.round < m.round; })) { openMapSheet(t); return; }
    const own = Game.squadAt(m, me, t.col, t.row);
    // a unit selected in the shop goes inside your horse (or other carrier) with room
    if (own && selected !== null && editable() && Game.boardable(m, me, t.col, t.row, selected)) {
      if (Game.place(m, me, selected, t.col, t.row)) {
        if (!Game.freeLeft(m, me).includes(selected) && (m.gold[me] < Game.shopCost(m, me, selected) || Game.deploysLeft(m, me) <= 0)) selected = null;
        changed();
      }
      return;
    }
    if (own) {
      if (Game.riderOf(m, me, own)) openPairSheet(own, Game.riderOf(m, me, own));
      else if (own.round === m.round) { if (editable() && Game.unplace(m, me, t.col, t.row)) changed(); }
      else openSheet(own.unit, own, me);
      return;
    }
    const enemy = m.armies[foe()].find(s => { const p = Game.seenAt(m, s); return !Game.hiddenFromFoe(m, s) && p.col === t.col && p.row === t.row && s.round < m.round; });
    if (enemy) { openSheet(enemy.unit, enemy, foe()); return; }
    if (selected !== null && editable() && Game.canPlaceAt(m, me, t.col, t.row, selected)) {
      if (Game.place(m, me, selected, t.col, t.row)) {
        if (!Game.freeLeft(m, me).includes(selected) && (m.gold[me] < Game.shopCost(m, me, selected) || Game.deploysLeft(m, me) <= 0)) selected = null;
        changed();
      }
    }
  });

  // ---------- unit sheet ----------
  function unlockBlock(i, side) {
    if (!m || Game.unlockCost(m, i, me) === 0) return '';
    const cost = Game.unlockCost(m, i, me);
    if (side !== undefined && side !== me) return ''; // an enemy squad on the board is unlocked by definition
    if (Game.isUnlocked(m, me, i)) {
      const undo = phase === 'deploy' && editable() && m.unlocks[me][i] === m.round && !m.armies[me].some(q => q.unit === i);
      return `<div class="bar" style="border-top:1px solid var(--line);padding-top:8px"><span class="hint">Unlocked${m.unlocks[me][i] === m.round ? ' this round' : ''}</span>${undo ? '<button class="btn small" id="unlock-undo">Undo unlock</button>' : ''}</div>`;
    }
    const why = phase !== 'deploy' ? '' : !editable() ? '' : m.gold[me] < cost ? `Need ${cost} gold` : '';
    if (unlockAsk === i && phase === 'deploy' && editable() && !why) return `<div class="confirm" role="alertdialog" aria-label="Confirm unlock">
      <b style="font-family:var(--font-display)">Unlock ${esc(units[i].name)} for ${cost} gold?</b>
      <span class="hint">You'll have ${m.gold[me] - cost} gold left. This lasts the whole match.</span>
      <div class="btnrow" style="justify-content:flex-start"><button class="btn small primary" id="unlock-yes">Yes, unlock</button><button class="btn small" id="unlock-no">No</button></div></div>`;
    return `<div style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px">
      <div class="bar"><b style="font-family:var(--font-display);display:inline-flex;gap:6px;align-items:center">${LOCK_SVG} Locked</b>${phase === 'deploy' ? (why || !editable() ? `<button class="btn small" disabled>${why || `Unlock · ${cost} gold`}</button>` : `<button class="btn small" id="unlock">Unlock · ${cost} gold</button>`) : `<span class="hint">${cost} gold to unlock</span>`}</div>
      <span class="hint">Pay once to be able to field this unit for the rest of the match. The opponent sees it after the next fight.</span></div>`;
  }
  // sq (optional): the squad whose sheet this is, to show the skill it came with (Enzo)
  function skillBlock(i, side, sq) {
    const defs = units[i].skillDefs || [];
    if (!defs.some(Boolean) || !m) return '';
    const mine = side === undefined || side === me, owner = mine ? me : side;
    const enzo = Game.charOf(m, owner) === 'enzo' && (mine || charVisible(owner)), ek = Game.enzoSkill(m, owner, sq || { unit: i }); // the same for every squad of the unit, all match
    const rows = Engine.SLOTS.filter(k => defs[k]).map(k => {
      const d = defs[k], cost = Game.skillCost(m, i, k);
      let act = '';
      if (Game.isInnate(m, i, k)) {
        act = `<span class="chip" style="color:var(--ink);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">Built in</span>`;
      } else if (enzo) {
        act = ek === k ? `<span class="chip" style="color:${mine ? 'var(--gold)' : 'var(--foe)'};border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">✓ ${mine ? 'Yours' : 'Theirs'}, free</span>` : `<span class="hint">Not picked</span>`;
      } else if (mine) {
        if (Game.hasSkill(m, me, i, k)) {
          act = `<span class="chip" style="color:var(--gold);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">Owned</span>`;
          if (phase === 'deploy' && editable() && m.tech[me][i][k] === m.round) act += ` <button class="btn small" data-unskill="${k}">Undo</button>`;
        } else if (phase === 'deploy') {
          const why = !m.armies[me].some(q => q.unit === i) ? 'Place a squad first' : m.gold[me] < cost ? `Need ${cost} gold` : '';
          act = why || !editable() ? `<button class="btn small" disabled>${why || `Buy · ${cost} gold`}</button>` : `<button class="btn small primary" data-skill="${k}">Buy · ${cost} gold</button>`;
        } else act = `<span class="hint">${cost} gold</span>`;
      } else {
        act = Game.skillVisible(m, side, i, k) || (phase !== 'deploy' && Game.hasSkill(m, side, i, k))
          ? `<span class="chip" style="color:var(--foe);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">${foeName()} has it</span>` : `<span class="hint">Not bought</span>`;
      }
      return `<div style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px">
        <div class="bar"><b style="font-family:var(--font-display)">${esc(d.name)}</b><span>${act}</span></div>
        <span class="hint">${esc(Engine.describeSkill(d))}</span></div>`;
    });
    return `<div style="display:grid;gap:8px"><h4 style="margin:0;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)">Skills${enzo ? ' · Enzo: one random skill per unit, free' : mine ? ' · for all your squads of this unit' : ''}</h4>${rows.join('')}</div>`;
  }

  function openTowerSheet(side) {
    const D = Engine.TOWER_DOWN, shown = towerTypeVisible(side), tt = Game.towerType(m, side), T = tt.unit;
    $('sheet').innerHTML = `
      <div class="bar"><h3 id="sheet-h">${side === me ? 'Your tower' : `${esc(foeName())}'s tower`}${shown ? ` · ${esc(tt.name)}` : ''}</h3><button class="btn small" id="close">Close</button></div>
      ${shown && Game.towerPicked(m, side) ? towerSkillBlock(side, tt) + towerSkill2Block(side, tt) + mageGenBlock(side, tt) + loanBlock(side, tt) + passiveBlock(side, tt) : ''}
      <p style="margin:0">${(() => { const id = Game.charOf(m, side); return !charVisible(side) ? 'Character: hidden until the first fight.' : id ? `Character: ${charLine(id)}` : 'Character: not picked yet.'; })()}</p>
      <p class="role" style="margin:0">${shown ? (tt.id === 'outpost' ? `A small watchtower. You pick your real tower in round ${Game.TOWER_PICK_ROUND}.` : esc(tt.text)) : `Its type stays hidden until the round ${Game.TOWER_PICK_ROUND} fight.`}</p>
      <p style="margin:0"><span style="color:var(--foe)">If it falls:</span> that army is crippled for ${D.secs} s. ${MORE('fall-more')}</p>
      ${shown ? towerStats(T) : ''}
`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    if ($('fall-more')) $('fall-more').addEventListener('click', () => { $('fall-more').parentNode.innerHTML = `<span style="color:var(--foe)">If it falls:</span> that army deals ${D.attack}% less damage, moves ${D.move}% slower and takes ${D.taken}% more damage for ${D.secs} s.`; });
    if ($('tskill')) $('tskill').addEventListener('click', () => { if (editable() && Game.buyTowerSkill(m, me)) { changed(); openTowerSheet(me); } });
    if ($('tskill-undo')) $('tskill-undo').addEventListener('click', () => { if (editable() && Game.undoTowerSkill(m, me)) { changed(); openTowerSheet(me); } });
    if ($('tskill2')) $('tskill2').addEventListener('click', () => { if (editable() && Game.buyTowerSkill2(m, me)) { changed(); openTowerSheet(me); } });
    if ($('tskill2-undo')) $('tskill2-undo').addEventListener('click', () => { if (editable() && Game.undoTowerSkill2(m, me)) { changed(); openTowerSheet(me); } });
    $('sheet').querySelectorAll('[data-mgen]').forEach(b => b.addEventListener('click', () => { if (editable() && Game.buyMageGen(m, me, b.dataset.mgen)) { changed(); openTowerSheet(me); } }));
    if ($('tloan')) $('tloan').addEventListener('click', () => { if (editable() && Game.takeLoan(m, me)) { changed(); openTowerSheet(me); } });
    if ($('tloan-undo')) $('tloan-undo').addEventListener('click', () => { if (editable() && Game.undoLoan(m, me)) { changed(); openTowerSheet(me); } });
    if ($('mgen-undo')) $('mgen-undo').addEventListener('click', () => { if (editable() && Game.undoMageGen(m, me)) { changed(); openTowerSheet(me); } });
    if ($('mtp-undo')) $('mtp-undo').addEventListener('click', () => { if (editable() && Game.undoMageGen(m, me, 'teleport')) { changed(); openTowerSheet(me); } });
  }
  const abilityRow = (name, act, text) => `<div style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px">
      <div class="bar"><b style="font-family:var(--font-display)">${esc(name)}</b><span>${act}</span></div>
      <span class="hint">${text}</span></div>`;
  // the bank tower's loan: take one this round (yours), or whether they took one (theirs, once the fight is on)
  function loanBlock(side, tt) {
    if (!tt.loan) return '';
    const L = Game.LOAN, took = Game.loanNow(m, side), chip = (txt, col) => `<span class="chip" style="color:${col};border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">${txt}</span>`;
    let act;
    if (side !== me) act = took && phase !== 'deploy' ? chip('Took one', 'var(--foe)') : '';
    else if (took) act = chip('Taken', 'var(--gold)') + (phase === 'deploy' && editable() ? ` <button class="btn small" id="tloan-undo" ${m.gold[me] >= L.gold ? '' : 'disabled'}>Pay back · −${L.gold}</button>` : '');
    else if (phase === 'deploy') act = `<button class="btn small${editable() ? ' primary' : ''}" id="tloan" ${editable() ? '' : 'disabled'}>Take · +${L.gold} gold</button>`;
    else act = '';
    return abilityRow('Loan', act, esc(loanText()) + (side === me && took ? ` Next round: −${L.payback}.` : ''));
  }
  // an always-on tower ability (slime tower: the slime skills it gets)
  function passiveBlock(side, tt) {
    if (!tt.passive) return '';
    let on = '';
    if (tt.id === 'slime' && (side === me || phase !== 'deploy')) {
      const names = [];
      units.forEach((u, i) => { if (Game.SLIME_UNITS.includes(u.name)) Engine.SLOTS.forEach(k => { if (Game.hasSkill(m, side, i, k) && !Game.isInnate(m, i, k) && (side === me || Game.skillVisible(m, side, i, k))) names.push(`${u.skillDefs[k].name} (${u.name})`); }); });
      on = names.length ? ` On now: ${esc(names.join(', '))}.` : ' None bought yet.';
    }
    return abilityRow(tt.passive.name, `<span class="chip" style="color:var(--ink);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">Always on</span>`, esc(tt.passive.text) + on);
  }
  // the mage tower's generals: call one for this round (yours; calling another swaps it), plus the teleport general on top
  // if you like, or the ones they called (theirs, once the fight is on). Under each: the tower's range and attack with it.
  // Swap-type buttons (only one of those generals at a time) are purple, the teleport general's add-on button gold.
  function mageGenBlock(side, tt) {
    if (!tt.generals) return '';
    const cur = Game.mageGenOf(m, side), tp = Game.mageTpOf(m, side), chip = (txt, col) => `<span class="chip" style="color:${col};border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">${txt}</span>`;
    const r2 = (v) => Math.round(v * 100) / 100;
    const stats = (u) => u.mend > 0 ? `Heals ${r2(u.mend)} × ${r2(u.aps)}/s · range ${r2(u.range)} m`
      : `Range ${u.minRange ? `${r2(u.minRange)}–` : ''}${r2(u.range)} m · hit ${r2(u.hit)}${u.burst > 1 ? ` ×${u.burst}` : ''} × ${r2(u.aps)}/s${u.splash ? ` · ${r2(u.splash)} m splash` : ''}${u.chain ? ` · jumps ${u.chain.jumps}× for ${r2(u.chain.hit)}` : ''}${u.spinUp > 0 ? ' · hits harder and faster the longer it stays on one enemy' : ''}`;
    const rows = Game.MAGE_GENERALS.map(g => {
      const called = g.extra ? tp : cur === g.id;
      let act;
      if (side !== me) act = called && phase !== 'deploy' ? chip('Called', 'var(--foe)') : '';
      else if (called) act = chip('Called', 'var(--gold)') + (phase === 'deploy' && editable() ? ` <button class="btn small" id="${g.extra ? 'mtp-undo' : 'mgen-undo'}">Undo</button>` : '');
      else if (phase === 'deploy') { const ok = editable() && Game.canBuyMageGen(m, me, g.id); act = `<button class="btn small${ok ? (g.extra ? ' primary' : ' either') : ''}" data-mgen="${g.id}" ${ok ? '' : 'disabled'}>${g.extra ? 'Add' : cur ? 'Swap' : 'Call'} · ${g.cost} gold</button>`; }
      else act = `<span class="hint">${g.cost} gold</span>`;
      const u = Game.generalUnit(m, tt.unit, g.extra ? cur : g.id);
      return `<div style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px">
        <div class="bar"><b style="font-family:var(--font-display)">${esc(g.name)}</b><span>${act}</span></div>
        <span class="hint">${esc(g.text)}</span>
        <span class="hint" style="color:var(--ink)">${g.extra ? `With it: ${cur ? `the ${esc(Game.mageGenInfo(cur).name)}’s attack. ` : ''}` : ''}${stats(u)}</span></div>`;
    });
    return `<div style="display:grid;gap:8px"><h4 style="margin:0;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)">Mage generals · ${side === me ? 'one per round (purple buttons swap it), plus teleport if you like, for this round’s fight' : phase === 'deploy' ? 'hidden until the fight' : 'this fight'}</h4>${rows.join('')}</div>`;
  }
  // the tower's one skill: buy it (yours), or whether they have it (theirs, once it's no longer hidden)
  function towerSkillBlock(side, tt) {
    const sk = tt.skill; if (!sk) return '';
    const cost = Game.towerSkillCost(m, me), owned = Game.towerSkillOf(m, side);
    let act;
    if (side !== me) act = Game.towerSkillVisible(m, side) || (owned && phase !== 'deploy') ? `<span class="chip" style="color:var(--foe);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">${esc(foeName())} has it</span>` : '<span class="hint">Not bought</span>';
    else if (owned) act = `<span class="chip" style="color:var(--gold);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">Owned</span>${phase === 'deploy' && editable() && m.towerSkill[me] === m.round ? ' <button class="btn small" id="tskill-undo">Undo</button>' : ''}`;
    else if (phase === 'deploy') act = editable() && m.gold[me] >= cost ? `<button class="btn small primary" id="tskill">Buy · ${cost} gold</button>` : `<button class="btn small" disabled>${m.gold[me] < cost ? `Need ${cost} gold` : `Buy · ${cost} gold`}</button>`;
    else act = `<span class="hint">${cost} gold</span>`;
    return `<div style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px">
      <div class="bar"><b style="font-family:var(--font-display)">${esc(sk.name)}</b><span>${act}</span></div>
      <span class="hint">${esc(sk.text)}${side === me && !owned ? ' Once per match; your opponent sees it after the next fight.' : ''}</span></div>`;
  }
  // the tower's second skill (keep, bastion, bank), like the first
  function towerSkill2Block(side, tt) {
    const sk = tt.skill2; if (!sk) return '';
    const cost = Game.towerSkill2Cost(m, me), owned = Game.towerSkill2Of(m, side), chip = (txt, col) => `<span class="chip" style="color:${col};border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">${txt}</span>`;
    const blocked = sk.needs && !Game.towerSkillOf(m, me);
    let act;
    if (side !== me) act = Game.towerSkill2Visible(m, side) || (owned && phase !== 'deploy') ? chip(`${esc(foeName())} has it`, 'var(--foe)') : '<span class="hint">Not bought</span>';
    else if (owned) act = chip('Owned', 'var(--gold)') + (phase === 'deploy' && editable() && m.towerSkill2[me] === m.round ? ' <button class="btn small" id="tskill2-undo">Undo</button>' : '');
    else if (phase === 'deploy') act = editable() && Game.canBuyTowerSkill2(m, me) ? `<button class="btn small primary" id="tskill2">Buy · ${cost} gold</button>` : `<button class="btn small" disabled>${blocked ? `Needs ${esc(tt.skill.name)}` : m.gold[me] < cost ? `Need ${cost} gold` : `Buy · ${cost} gold`}</button>`;
    else act = `<span class="hint">${cost} gold</span>`;
