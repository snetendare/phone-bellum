<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Mans Land">
<meta name="description" content="A small auto-battler. Deploy squads, counter your opponent, watch the armies fight. Play the AI or challenge a friend.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>No Mans Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, a war table at night. HUD on top, square board, controls under the thumb. Single dark look by choice. */
:root {
  --bg: #0D1315;
  --panel: #152125;
  --board: #13201F;
  --line: #27393D;
  --ink: #E5ECE9;
  --muted: #8DA1A1;
  --you: #5CC6DF;
  --foe: #EE6E5C;
  --gold: #E6B84A;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 28px; -webkit-tap-highlight-color: transparent; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { display: grid; gap: 4px; min-width: 0; }
.side.foe { text-align: right; }
.side .lbl { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 8px; }
.side.you .lbl { color: var(--you); }
.side.foe .lbl { color: var(--foe); flex-direction: row-reverse; }
.side .lbl .num { color: var(--ink); font-weight: 500; }
.hp { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.hp i { display: block; height: 100%; transition: width 0.6s ease; }
.side.you .hp i { background: var(--you); }
.side.foe .hp i { background: var(--foe); margin-left: auto; }
.round { text-align: center; font-family: var(--font-display); }
.round b { display: block; font-size: 22px; font-weight: 700; line-height: 1; }
.round span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Board */
.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--board); touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.tag-clock { position: absolute; top: 8px; left: 10px; font-family: var(--font-data); font-size: 12px; color: var(--muted); pointer-events: none; }
.overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: rgba(13, 19, 21, 0.86); text-align: center; }
.card { margin: auto; display: grid; gap: 10px; justify-items: center; max-width: 36ch; }
.card h2 { font-size: clamp(26px, 8vw, 38px); font-weight: 700; text-transform: uppercase; line-height: 1; }
.card h2.you { color: var(--you); }
.card h2.foe { color: var(--foe); }
.card p { margin: 0; color: var(--muted); }
.card .big { color: var(--ink); font-size: 17px; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; text-align: left; color: var(--muted); font-size: 13px; line-height: 1.35; }
.card ul li::before { content: "▸ "; color: var(--gold); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }

/* Controls */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.gold { font-family: var(--font-data); font-size: 16px; color: var(--gold); font-weight: 500; }
.deploys { font-size: 13px; color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }
.btn { border-radius: 4px; border: 1px solid var(--line); background: transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-family: var(--font-data); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--gold); }

.shop { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.uwrap { flex: 0 0 132px; scroll-snap-align: start; position: relative; display: grid; }
.ucard { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 10px 34px 9px 10px; background: var(--bg); display: grid; gap: 3px; align-content: start; }
.ucard[aria-pressed="true"] { border-color: var(--you); box-shadow: inset 0 0 0 1px var(--you); }
.ucard[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.ucard .t { font-family: var(--font-data); font-size: 12px; color: var(--you); letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 5px; }
.ucard .n { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.ucard .r { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ucard .c { font-family: var(--font-data); font-size: 12px; color: var(--gold); }
.uwrap .info { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-family: var(--font-display); font-size: 12px; display: grid; place-items: center; }

/* Unit sheet */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; align-items: end; justify-items: center; z-index: 5; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.sheet h3 { font-size: 22px; }
.sheet .role { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.stats span { color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.vs h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.vs .good h4 { color: var(--you); }
.vs .bad h4 { color: var(--foe); }
.vs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; }
.traits span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hp i { transition: none; } }

[hidden] { display: none !important; }
.panel:empty { display: none; }
body { padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); margin: 0; }
.net { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: center; min-height: 18px; }
.net i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.net.ok i { background: #6FD08C; }
.net.bad { color: var(--foe); }
.net.bad i { background: var(--foe); }
.timer { font-family: var(--font-data); font-size: 20px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--foe); }
.code { font-family: var(--font-data); font-size: clamp(30px, 10vw, 44px); letter-spacing: 0.22em; color: var(--gold); padding-left: 0.22em; }
.linkbox { font-family: var(--font-data); font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; word-break: break-all; user-select: all; -webkit-user-select: all; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.joinrow { display: flex; gap: 8px; justify-content: center; }
.joinrow input { width: 9ch; font: 500 18px var(--font-data); letter-spacing: 0.16em; text-transform: uppercase; text-align: center; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.card .stack { display: grid; gap: 8px; justify-items: center; width: 100%; }
.card hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.status { font-size: 14px; color: var(--ink); }
.status.wait::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
a { color: var(--you); }
.round-sub { display: flex; align-items: center; justify-content: center; gap: 6px; }
.cog { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.cog:hover, .cog:focus-visible { color: var(--gold); border-color: var(--gold); }
.cog[aria-expanded="true"] { color: var(--gold); border-color: var(--gold); }
.dd { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); width: min(360px, calc(100vw - 32px)); max-height: 70vh; max-height: 70dvh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
.dd .ticks { display: flex; gap: 14px; font-size: 13px; }
.dd .ticks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.dd h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; }
.dd .row { display: grid; grid-template-columns: 22px 1fr; align-items: end; gap: 0 8px; }
.dd .row .ic { grid-row: span 2; display: grid; place-items: center; align-self: center; }
.dd .row .top { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
.dd .row .top b { font: 600 12px var(--font-data); }
.dd .row .top span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd .row .track { height: 8px; border-radius: 2px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; }
.dd .row .track i { display: block; height: 100%; border-radius: 2px; }
.sheet { max-height: 80dvh; } /* iPhones: vh counts the space under Safari's toolbars */
.songs { display: grid; gap: 6px; }
.songs button { text-align: left; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); padding: 10px 12px; font: 500 14px var(--font-body); display: grid; gap: 2px; }
.songs button span { font-size: 12px; color: var(--muted); }
.songs button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.hist { display: grid; gap: 6px; max-height: 60vh; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.hist li { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; display: grid; gap: 2px; font: 500 14px var(--font-body); }
.hist li span { font-size: 12px; color: var(--muted); }
.volrow { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
.volrow input { flex: 1; max-width: 220px; accent-color: var(--gold); }
.volrow .num { width: 3ch; text-align: right; font-family: var(--font-data); font-size: 13px; }
/* unit shop: one tab per tier, rarity colours, locked units greyed out */
.tiers { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.tiers button { min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--muted); padding: 6px 6px; font: 600 14px var(--font-display); display: grid; gap: 1px; text-align: left; border-top: 3px solid var(--tier); }
.tiers button em { font: 600 11px var(--font-display); font-style: normal; color: var(--tier); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button small { font: 500 10px var(--font-data); letter-spacing: -0.03em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button[aria-selected="true"] { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--tier); }
.ucard { border-top: 3px solid var(--tier, var(--line)) !important; }
.ucard .tier { font: 600 10px var(--font-data); letter-spacing: 0.08em; color: var(--tier); text-transform: uppercase; }
.ucard[data-locked] { opacity: 0.55; background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(255,255,255,0.03) 8px 16px), var(--bg); }
.ucard[data-locked] .t > span:first-child { filter: grayscale(1); }
.ucard[data-locked] .n { color: var(--muted); }
.ucard .lock { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--font-data); color: var(--gold); }
/* role symbols on unit cards and in the info sheet */
.roles { display: flex; align-items: center; gap: 5px; }
.roles svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.roles .is, .roles .ex { color: var(--ink); }
.roles .beats { color: var(--you); }
.roles .rng { color: var(--muted); margin-left: auto; }
.ucard .roles { margin: 2px -26px 1px 0; }
.ucard[data-locked] .roles { filter: grayscale(1); }
.roleline { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.roleline .roles .rng { margin-left: 0; }
.confirm { display: grid; gap: 8px; border: 1px solid var(--gold); border-radius: 6px; padding: 10px; }
/* main menu: short rules, with a tap-to-read-more section per bigger concept */
.learn { width: 100%; display: grid; gap: 6px; text-align: left; }
.learn details { border: 1px solid var(--line); border-radius: 6px; background: rgba(21, 33, 37, 0.7); }
.learn summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 8px 10px; }
.learn summary::-webkit-details-marker { display: none; }
.learn summary b { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink); }
.learn summary span { grid-column: 1; font-size: 12px; line-height: 1.35; color: var(--muted); }
.learn summary::after { content: "Read more ▾"; grid-row: 1; grid-column: 2; font-family: var(--font-data); font-size: 11px; color: var(--gold); align-self: center; }
.learn details[open] summary::after { content: "Less ▴"; }
.learn details ul { padding: 0 10px 10px; }
.learn details ul b { color: var(--ink); font-weight: 600; }
/* map picker: a small picture of each map */
.maps { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.maps button { border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 4px; display: grid; gap: 4px; justify-items: center; font-family: var(--font-data); font-size: 12px; min-width: 0; }
.maps img { width: 100%; aspect-ratio: 12 / 16; border-radius: 3px; display: block; background: var(--board); }
.chars-pick { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chars-pick button { border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 4px; display: flex; align-items: center; justify-content: center; font-family: var(--font-data); font-size: 12px; min-width: 0; color: var(--muted); opacity: 0.45; text-decoration: line-through; }
.chars-pick button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chars-pick button[aria-pressed="true"] { border-color: var(--gold); color: var(--ink); opacity: 1; text-decoration: none; }
/* Leaders and Units in the match settings: a button each, with a small menu that folds out below */
.picks { flex-wrap: wrap; }
.pick-menu { width: 100%; display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); max-height: 50vh; overflow-y: auto; }
.pick-menu .units-tier { display: grid; gap: 4px; }
.pick-menu .units-tier .chars-pick { grid-template-columns: repeat(2, 1fr); }
.pick-menu .units-tier .chars-pick button { justify-content: flex-start; }
.maps button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
/* folded match settings on the menu and in the lobby */
.settings { border: 1px solid var(--line); border-radius: 6px; }
.settings summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; font: 600 14px var(--font-display); color: var(--ink); }
.settings summary::-webkit-details-marker { display: none; }
.settings summary span { font: 400 13px var(--font-body); color: var(--muted); }
.settings summary span::after { content: " ▾"; color: var(--gold); }
.settings[open] summary span::after { content: " ▴"; }
.settings-body { display: grid; gap: 12px; padding: 0 12px 12px; }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--gold); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
/* choose one of 3 (starting package, tower): cards over the board, like a level-up pick */
.pick { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 10px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: radial-gradient(ellipse at 50% 40%, rgba(13, 19, 21, 0.72), rgba(13, 19, 21, 0.93)); text-align: center; z-index: 2; }
.pick[hidden] { display: none; }
.pick > * { flex-shrink: 0; }
.pick .ph { display: grid; gap: 2px; }
.pick .ph h2 { font-size: clamp(20px, 6vw, 26px); text-transform: uppercase; line-height: 1.05; }
.pick .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-block: auto; }
.pick .opt { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px 6px 10px; display: grid; gap: 6px; justify-items: center; align-content: start; min-width: 0;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); transition: transform 0.15s ease, border-color 0.15s ease; animation: pick-in 0.35s ease both; }
.pick .opt:nth-child(2) { animation-delay: 0.07s; }
.pick .opt:nth-child(3) { animation-delay: 0.14s; }
.pick .opt[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 22px rgba(230, 184, 74, 0.25); transform: translateY(-4px); }
.pick .opt .art { display: flex; gap: 4px; align-items: center; justify-content: center; height: 48px; }
.pick .opt .nm { font-family: var(--font-display); font-weight: 600; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
.pick .opt .sub { font-size: 11px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.pick .opt .who { font-size: 12px; color: var(--gold); font-weight: 600; }
.btn.either { background: #A493DE; border-color: #A493DE; color: var(--bg); } /* a choice that replaces another (one mage general at a time) */
.pick .det { min-height: 3.6em; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: left; background: rgba(21, 33, 37, 0.85); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.pick .det b { color: var(--ink); }
.pick .row { display: flex; gap: 8px; justify-content: center; }
.pick-peek { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); }
.pick-peek[hidden] { display: none; }
@keyframes pick-in { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pick .opt { animation: none; transition: none; } }
/* Factions draft */
.draft { margin: auto; display: grid; gap: 10px; width: 100%; max-width: 46ch; }
.draft .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); text-align: left; }
.draft .sides b { display: block; font-size: 13px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fgrid .fac { border: 1px solid var(--line); border-left: 4px solid var(--fc); border-radius: 6px; background: var(--panel); padding: 8px; text-align: left; display: grid; gap: 3px; min-width: 0; }
.fgrid .fac .nm { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--fc); overflow-wrap: anywhere; }
.fgrid .fac .sub { font-size: 11px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.fgrid .fac .st { font-size: 11px; font-weight: 600; color: var(--gold); }
.fgrid .fac[aria-pressed="true"] { border-color: var(--gold); border-left-color: var(--fc); box-shadow: 0 0 0 1px var(--gold); }

@media (prefers-reduced-motion: reduce) { .status.wait::after { animation: none; content: "…"; } }
</style>

<script src="peerjs.min.js"></script>
<script>
// ===== Unit shapes (shared by Counter Lab and the demo) =====
const Shapes = (() => {
  const LIST = ['circle', 'ring', 'square', 'triangle', 'diamond', 'pentagon', 'hexagon', 'star', 'cross', 'bar', 'horse', 'spider', 'sun', 'flame', 'spear', 'imp'];
  const LABELS = { circle: 'Circle', ring: 'Ring', square: 'Square', triangle: 'Triangle', diamond: 'Diamond', pentagon: 'Pentagon', hexagon: 'Hexagon', star: 'Star', cross: 'Cross', bar: 'Bar', horse: 'Horse', spider: 'Spider', sun: 'Sun', flame: 'Flame', spear: 'Spear', imp: 'Imp' };
  const DEFAULTS = {
    'Goblin Swarm': 'triangle', 'Skeleton Archers': 'diamond', 'Ember Imps': 'imp', 'Fire Mage': 'hexagon',
    'Sniper': 'cross', 'Brute': 'square', 'Wisps': 'ring', 'Crossbow Volley': 'pentagon', 'Ballista': 'bar',
    'Boar Riders': 'circle', 'Spinning Golem': 'hexagon', 'Blunderbuss Crew': 'star', 'Ogre Smasher': 'square',
  };
  const valid = (s) => LIST.includes(s);
  // Unit colours: picked to stay clear of the team colours (blue and red), which outline every body
  const PALETTE = ['#9BD35A', '#E9E3CF', '#FFA94D', '#C77DFF', '#F7D154', '#8D99AE', '#E07A9B', '#B08155', '#3FD39A', '#B4A7F5', '#D9C49A', '#7FA650'];
  const DEFAULT_COLORS = {
    'Goblin Swarm': '#9BD35A', 'Skeleton Archers': '#E9E3CF', 'Ember Imps': '#FFA94D', 'Fire Mage': '#C77DFF',
    'Sniper': '#F7D154', 'Brute': '#8D99AE', 'Wisps': '#B4A7F5', 'Crossbow Volley': '#B08155', 'Ballista': '#D9C49A',
    'Boar Riders': '#E07A9B', 'Spinning Golem': '#7FA650', 'Blunderbuss Crew': '#3FD39A', 'Ogre Smasher': '#B08155',
  };
  // a unit's short label on the board: the first three letters of its name
  const tag = (u) => (u.name.replace(/[^A-Za-z]/g, '').slice(0, 3) || 'UNT').toUpperCase();
  const validColor = (c) => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);

  // Give every unit a shape and a colour: keep valid ones, else a known default, else the first one not used yet
  function assign(units) {
    const used = new Set(units.filter(u => valid(u.shape)).map(u => u.shape));
    const usedC = new Set(units.filter(u => validColor(u.color)).map(u => u.color.toUpperCase()));
    return units.map((u) => {
      let out = u;
      if (!valid(u.shape)) {
        let s = DEFAULTS[u.name];
        if (!s || used.has(s)) s = LIST.find(x => !used.has(x)) || LIST[used.size % LIST.length];
        used.add(s);
        out = { ...out, shape: s };
      }
      if (!validColor(u.color)) {
        let c = DEFAULT_COLORS[u.name];
        if (!c || usedC.has(c)) c = PALETTE.find(x => !usedC.has(x)) || PALETTE[usedC.size % PALETTE.length];
        usedC.add(c);
        out = { ...out, color: c };
      }
      return out;
    });
  }

  // A horse seen from the side, facing right: rump, back, neck and head, chest, front leg, belly, hind leg, tail.
  // Points are in units of r around the centre; it always stands upright, whichever side it is on.
  const HORSE = [[-0.95, -0.3], [0.3, -0.3], [0.62, -0.95], [0.82, -0.85], [1.12, -0.5], [1.02, -0.36], [0.74, -0.46], [0.66, -0.05], [0.62, 0.3],
    [0.62, 1.05], [0.42, 1.05], [0.38, 0.32], [-0.52, 0.32], [-0.58, 1.05], [-0.78, 1.05], [-0.86, 0.22], [-1.18, 0.55], [-1.08, 0.05]];

  // Pictures made of several parts, in units of r around the centre, always upright: { c: [x, y, radius] } is a
  // disc, { p: [[x, y], ...] } a polygon. Every part runs the same way round, so overlapping parts fill as one.
  const clockwise = (pts) => pts.reduce((s, [x1, y1], i) => { const [x2, y2] = pts[(i + 1) % pts.length]; return s + x1 * y2 - x2 * y1; }, 0) > 0 ? pts : pts.slice().reverse();
  // a leg drawn as a thin strip along a bent line (w = half its thickness)
  function strip(line, w) {
    const nrm = (i) => { const [ax, ay] = line[Math.max(0, i - 1)], [bx, by] = line[Math.min(line.length - 1, i + 1)], l = Math.hypot(bx - ax, by - ay); return [-(by - ay) / l * w, (bx - ax) / l * w]; };
    const n = line.map((_, i) => nrm(i));
    return line.map(([x, y], i) => [x + n[i][0], y + n[i][1]]).concat(line.map(([x, y], i) => [x - n[i][0], y - n[i][1]]).reverse());
  }
  const SPIDER_LEGS = [[[0.15, -0.5], [0.72, -0.95], [1.02, -1.28]], [[0.22, -0.3], [0.92, -0.5], [1.3, -0.42]],
    [[0.24, -0.08], [0.92, 0.12], [1.3, 0.48]], [[0.2, 0.12], [0.72, 0.62], [0.98, 1.22]]];
  const ray = (a) => [[Math.cos(a) * 1.32, Math.sin(a) * 1.32], [Math.cos(a + 0.3) * 0.56, Math.sin(a + 0.3) * 0.56], [Math.cos(a - 0.3) * 0.56, Math.sin(a - 0.3) * 0.56]];
  const IMP = [{ p: [[-0.8, -0.6], [0.8, -0.6], [0.8, 0.95], [-0.8, 0.95]] }, { p: [[-0.8, -0.58], [-0.36, -0.58], [-0.74, -1.22]] }, { p: [[0.36, -0.58], [0.8, -0.58], [0.74, -1.22]] }];
  const FIGURES = {
    spider: [{ c: [0, 0.32, 0.56] }, { c: [0, -0.42, 0.33] }, ...SPIDER_LEGS.flatMap(l => [{ p: strip(l, 0.15) }, { p: strip(l.map(([x, y]) => [-x, y]), 0.15) }])],
    sun: [{ c: [0, 0, 0.64] }, ...Array.from({ length: 8 }, (_, i) => ({ p: ray(-Math.PI / 2 + i * Math.PI / 4) }))],
    flame: [{ p: [[0, -1.32], [0.2, -0.86], [0.42, -0.56], [0.54, -0.9], [0.74, -0.38], [0.88, 0.1], [0.82, 0.52], [0.6, 0.86], [0.26, 1.04],
      [-0.16, 1.04], [-0.52, 0.9], [-0.8, 0.6], [-0.9, 0.18], [-0.8, -0.22], [-0.6, -0.54], [-0.54, -0.24], [-0.36, -0.58], [-0.2, -0.98]] }],
    // a spear standing upright: leaf-shaped head, crossguard, shaft
    spear: [{ p: [[0, -1.36], [0.4, -0.78], [0.14, -0.5], [-0.14, -0.5], [-0.4, -0.78]] }, { p: [[-0.42, -0.52], [0.42, -0.52], [0.42, -0.34], [-0.42, -0.34]] },
      { p: [[-0.13, -0.4], [0.13, -0.4], [0.13, 1.32], [-0.13, 1.32]] }],
    // an imp: a square body with two small horns
    imp: IMP,
  };
  for (const parts of Object.values(FIGURES)) for (const pt of parts) if (pt.p) pt.p = clockwise(pt.p);

  // Points of a regular polygon; up = 1 points toward the top of the screen, -1 toward the bottom
  function poly(ctx, x, y, r, n, rot) {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = rot + i * Math.PI * 2 / n;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath();
  }

  // Builds the path for a shape. Returns true if the shape should be stroked instead of filled (ring).
  function path(ctx, shape, x, y, r, up = 1) {
    const top = up >= 0 ? -Math.PI / 2 : Math.PI / 2;
    switch (shape) {
      case 'square': ctx.beginPath(); ctx.rect(x - r * 0.88, y - r * 0.88, r * 1.76, r * 1.76); return false;
      case 'triangle': poly(ctx, x, y + (up >= 0 ? r * 0.15 : -r * 0.15), r * 1.25, 3, top); return false;
      case 'diamond': poly(ctx, x, y, r * 1.2, 4, top); return false;
      case 'pentagon': poly(ctx, x, y, r * 1.08, 5, top); return false;
      case 'hexagon': poly(ctx, x, y, r * 1.05, 6, 0); return false;
      case 'star': {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = top + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3;
          const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
          i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath(); return false;
      }
      case 'cross': {
        const a = r * 1.15, b = r * 0.42;
        ctx.beginPath();
        ctx.moveTo(x - b, y - a); ctx.lineTo(x + b, y - a); ctx.lineTo(x + b, y - b); ctx.lineTo(x + a, y - b);
        ctx.lineTo(x + a, y + b); ctx.lineTo(x + b, y + b); ctx.lineTo(x + b, y + a); ctx.lineTo(x - b, y + a);
        ctx.lineTo(x - b, y + b); ctx.lineTo(x - a, y + b); ctx.lineTo(x - a, y - b); ctx.lineTo(x - b, y - b);
        ctx.closePath(); return false;
      }
      case 'bar': ctx.beginPath(); ctx.rect(x - r * 1.3, y - r * 0.55, r * 2.6, r * 1.1); return false;
      case 'ring': ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, Math.PI * 2); return true;
      case 'spider': case 'sun': case 'flame': case 'spear': case 'imp':
        ctx.beginPath();
        for (const pt of FIGURES[shape]) {
          if (pt.c) { const [cx, cy, cr] = pt.c; ctx.moveTo(x + (cx + cr) * r, y + cy * r); ctx.arc(x + cx * r, y + cy * r, cr * r, 0, Math.PI * 2); }
          else { pt.p.forEach(([px, py], i) => i ? ctx.lineTo(x + px * r, y + py * r) : ctx.moveTo(x + px * r, y + py * r)); ctx.closePath(); }
        }
        return false;
      case 'horse': ctx.beginPath(); HORSE.forEach(([px, py], i) => i ? ctx.lineTo(x + px * r, y + py * r) : ctx.moveTo(x + px * r, y + py * r)); ctx.closePath(); return false;
      default: ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); return false;
    }
  }

  // Draw a filled shape (a ring is drawn as a thick outline)
  function draw(ctx, shape, x, y, r, up = 1) {
    if (path(ctx, shape, x, y, r, up)) {
      const lw = ctx.lineWidth; ctx.lineWidth = Math.max(1.5, r * 0.45);
      ctx.strokeStyle = ctx.fillStyle; ctx.stroke(); ctx.lineWidth = lw;
    } else ctx.fill();
  }

  // Outline only, for highlights (level outline, health ring use their own arcs)
  function outline(ctx, shape, x, y, r, up = 1) { path(ctx, shape, x, y, r, up); ctx.stroke(); }

  // Small inline SVG icon in the current text colour
  function svg(shape, size = 14) {
    const c = size / 2, r = size * 0.36;
    const pts = (n, rr, rot, cy = c) => Array.from({ length: n }, (_, i) => {
      const a = rot + i * Math.PI * 2 / n; return `${(c + Math.cos(a) * rr).toFixed(2)},${(cy + Math.sin(a) * rr).toFixed(2)}`;
    }).join(' ');
    let body;
    switch (shape) {
      case 'square': body = `<rect x="${c - r * 0.88}" y="${c - r * 0.88}" width="${r * 1.76}" height="${r * 1.76}"/>`; break;
      case 'triangle': body = `<polygon points="${pts(3, r * 1.25, -Math.PI / 2, c + r * 0.15)}"/>`; break;
      case 'diamond': body = `<polygon points="${pts(4, r * 1.2, -Math.PI / 2)}"/>`; break;
      case 'pentagon': body = `<polygon points="${pts(5, r * 1.08, -Math.PI / 2)}"/>`; break;
      case 'hexagon': body = `<polygon points="${pts(6, r * 1.05, 0)}"/>`; break;
      case 'star': body = `<polygon points="${Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.55 : r * 1.3; return `${(c + Math.cos(a) * rr).toFixed(2)},${(c + Math.sin(a) * rr).toFixed(2)}`; }).join(' ')}"/>`; break;
      case 'cross': { const a = r * 1.15, b = r * 0.42; body = `<polygon points="${[[-b, -a], [b, -a], [b, -b], [a, -b], [a, b], [b, b], [b, a], [-b, a], [-b, b], [-a, b], [-a, -b], [-b, -b]].map(([px, py]) => `${(c + px).toFixed(2)},${(c + py).toFixed(2)}`).join(' ')}"/>`; break; }
      case 'bar': body = `<rect x="${c - r * 1.3}" y="${c - r * 0.55}" width="${r * 2.6}" height="${r * 1.1}"/>`; break;
      case 'horse': { const rr = r * 0.95; body = `<polygon points="${HORSE.map(([px, py]) => `${(c + px * rr).toFixed(2)},${(c + py * rr).toFixed(2)}`).join(' ')}"/>`; break; }
      case 'spider': case 'sun': case 'flame': case 'spear': case 'imp': { const rr = r * 0.95; body = FIGURES[shape].map(pt => pt.c
        ? `<circle cx="${(c + pt.c[0] * rr).toFixed(2)}" cy="${(c + pt.c[1] * rr).toFixed(2)}" r="${(pt.c[2] * rr).toFixed(2)}"/>`
        : `<polygon points="${pt.p.map(([px, py]) => `${(c + px * rr).toFixed(2)},${(c + py * rr).toFixed(2)}`).join(' ')}"/>`).join(''); break; }
      case 'ring': body = `<circle cx="${c}" cy="${c}" r="${r * 0.8}" fill="none" stroke="currentColor" stroke-width="${Math.max(1.5, r * 0.45)}"/>`; break;
      default: body = `<circle cx="${c}" cy="${c}" r="${r}"/>`;
    }
    return `<svg class="shape-icon" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="currentColor" aria-hidden="true">${body}</svg>`;
  }

  // A body: filled with the unit's colour, outlined in its team colour
  function body(ctx, shape, x, y, r, up, fill, team, fillAlpha = 1) {
    if (FIGURES[shape]) {
      // a picture made of parts: a thick team-coloured stroke underneath, so only its outer edge shows
      ctx.strokeStyle = team; ctx.lineWidth = Math.max(2, Math.min(3.5, r * 0.3)); ctx.lineJoin = 'round';
      path(ctx, shape, x, y, r, up); ctx.stroke(); ctx.lineJoin = 'miter';
      ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill; draw(ctx, shape, x, y, r, up); ctx.globalAlpha = 1;
      return;
    }
    ctx.globalAlpha = fillAlpha; ctx.fillStyle = fill;
    draw(ctx, shape, x, y, r, up);
    ctx.globalAlpha = 1; ctx.strokeStyle = team; ctx.lineWidth = Math.max(1.5, Math.min(2.5, r * 0.32));
    outline(ctx, shape, x, y, shape === 'ring' ? r * 1.05 : r + 0.6, up);
  }

  return { IMP, LIST, tag, LABELS, PALETTE, valid, validColor, assign, draw, outline, path, svg, body };
})();

// ===== Battle engine (shared by headless tests and the page) =====
const Engine = (() => {
  const TRAIT_DEFAULTS = { burst: 1, pellets: 1, spinUp: 0, spinHit: 0, pierce: 0, projSpeed: 0, minRange: 0, charge: 1, knockback: 0, windUp: 0, flame: 0, trample: 0, chargeStun: 0, deathBlast: 0, pctHit: 0, ram: 0, noFlank: 0, carrier: 0, noPack: 0 };
  const BURST_GAP = 0.15;      // seconds between shots in a burst
  const SHOTGUN_COS = Math.sqrt(3) / 2; // pellets spread 30 degrees to each side of the target (cos 30)
  // Only + - * / and sqrt from here on: those give identical results in every browser,
  // so two players' phones run exactly the same battle.
  const hyp = (x, y) => Math.sqrt(x * x + y * y);
  // cosine of an angle in degrees from a Taylor series (Math.cos may differ between browsers)
  function cosDeg(deg) {
    const a = Math.max(0, Math.min(180, deg)) * 3.141592653589793 / 180;
    let term = 1, sum = 1;
    for (let k = 1; k <= 12; k++) { term = -term * a * a / ((2 * k - 1) * (2 * k)); sum += term; }
    return sum;
  }
  const SPIN_CAP = 3;          // spin-up tops out at 3x attack speed
  // damage spin-up (spinHit) ramps hit size the same way, also up to SPIN_CAP
  const CHARGE_RUN = 5;        // metres a unit must run before its next attack counts as a charge
  const TRAMPLE_RUN = 8;       // after a charged hit, a trampler keeps running this far past its target
  const TRAMPLE_WIDTH = 1.5;   // bodies within this distance of a trampler's path get run over
  // chargeStun: after a charged hit (and the trample run that follows it) the unit is stunned this many seconds:
  // it can't move or attack
  const STEALTH_BACK = 1.5;    // a stealth unit hides again after this many seconds without attacking
  // Roster rules (g.rules): optional mechanics a roster can switch off. Missing or true = on.
  //   vision: units march ahead until they spot an enemy (sight). Off: every unit knows where every enemy is from the start.
  //   stealth: the Stealth skill hides units. Off: stealth units can be targeted like any other.
  //   stealthBack: a stealth unit hides again after STEALTH_BACK s without attacking. Off: it stays seen once it attacks.
  //   knockback: hits with knockback push bodies. Off: nothing is pushed.
  const RULES = [
    ['vision', 'Vision', 'Units march straight ahead until an enemy comes within sight (see Sight in Battle settings), then turn to it. Off: every unit knows where every enemy is from the start and heads straight for the nearest one.'],
    ['stealth', 'Stealth', 'Units with the Stealth skill can’t be targeted while hidden. Off: the skill does nothing and they can be targeted like any other unit.'],
    ['stealthBack', 'Stealth returns', `A stealth unit hides again after ${STEALTH_BACK} s without attacking. Off: once it has attacked it stays seen for the rest of the fight.`],
    ['knockback', 'Knockback', 'Hits from units with knockback push the bodies they hit. Off: nothing is pushed.'],
  ];
  const ruleOn = (g, k) => !(g && g.rules && g.rules[k] === false);
  // ram: the unit never attacks; it heads straight for the enemy tower (the nearest enemy once the tower is down),
  // and on reaching it deals its hit to it once and is destroyed. carrier: a squad of another unit can ride inside
  // (see createBattle: bodies with `carrier` set stay out of the fight until that body dies). noFlank: can't be
  // deployed on flank tiles (the game checks it). noPack: never offered in a starting package (the game checks it)
  const RAM_REACH = 2;         // metres from its target at which a ram hits
  // chain = { jumps, hit, reach }: after each hit the attack jumps on to the nearest enemy body not hit yet within
  // reach metres of the last one, up to jumps times, dealing chain.hit each time (lightning).
  // mend: the body never attacks; each attack heals the most wounded ally in range (not structures) by this much
  // pctHit: every hit also deals this share of the target's max health (not to structures); that part ignores armor (ward still caps the hit)
  const BLAST_RADIUS = 4;      // a body with deathBlast explodes when it dies, hitting enemies within this distance
  const PIERCE_DEPTH = 10;     // metres a piercing shot travels past its target
  const PIERCE_WIDTH = 1;      // half-width of the pierce corridor (m)
  const APPROACH = 0.5;         // metres a moving unit steps inside its max range
  const PROJ_HIT_RADIUS = 1;   // a projectile hits a body within this distance of where it lands
  // A side whose tower falls is crippled for a while: it deals less damage, walks slower and takes more damage
  const TOWER_DOWN = { secs: 9, attack: 90, move: 70, taken: 50 };
  // Charisma (Matteo): opts.charm = [stacks by squad id or null, same for side 1]. A body of a squad with any
  // charisma that kills an enemy body (not a structure) gives its squad one more stack, up to CHARM_MAX, and one
  // stack to a friendly squad without any (the one with a body nearest the killer). A squad at CHARM_MAX is a
  // Gentleman: the first enemy body it would kill in a fight switches sides instead, at CONVERT_HP % of its max health.
  // A squad gains at most one stack per fight (a stack given to it counts) and gives away at most one.
  const CHARM_MAX = 5;
  const CONVERT_HP = 50;
  const CONVERT_SQUAD = -200;  // squad id of bodies that switched sides (not a squad in either army)
  const TURN = 6;              // how fast a walking body swings to a new heading (share of the turn per second)
  const SIGHT = 15;            // metres beyond its own range at which a unit notices an enemy and turns toward it
  const MIN_SIGHT = 18;        // ...but never less than this many metres from the unit (3 tiles), however short its range
  const DRIFT = 15;            // metres beyond that at which a marching unit starts to lean toward the nearest enemy

  const LEVEL_BONUS = 1;       // each upgrade adds +100% of starting health and hit (2x, then 3x)
  const MAX_LEVEL = 2;         // two upgrades on top of the base unit

  const withTraits = (u) => ({ ...TRAIT_DEFAULTS, defense: 'none', defVal: 0, level: 0, ...u });

  // Unit stats at a given level (defaults to the unit's own level field)
  function leveled(unit, level) {
    const u = withTraits(unit);
    const L = Math.max(0, Math.min(MAX_LEVEL, Math.round(level == null ? u.level : level)));
    if (!L) return { ...u, level: 0 };
    const k = 1 + LEVEL_BONUS * L;
    return { ...u, level: L, hp: u.hp * k, hit: u.hit * k };
  }

  // ---------- skills ----------
  const SKILL_SLOTS = 3; // skill slots per unit
  const SLOTS = Array.from({ length: SKILL_SLOTS }, (_, k) => k);
  // Each skill type and its settings (key, label, default, step). Shared by Counter Lab and the game.
  const SKILL_TYPES = {
    regen:   { label: 'Regeneration', params: [['pct', 'Health regained per second (% of max)', 2, 0.5], ['hp', 'Health (+%)', 20, 5]] },
    poison:  { label: 'Poison shot', params: [['pct', 'Poison damage (% of hit, in total)', 100, 10], ['duration', 'Poison lasts (s)', 4, 0.5], ['slow', 'Longer time between attacks (%)', 30, 5]] },
    stealth: { label: 'Stealth', params: [] },
    armorHp: { label: 'Armor and health', params: [['armor', 'Armor (blocked from every hit)', 8, 1], ['hp', 'Health (+%)', 25, 5]] },
    spawn:   { label: 'Spawn goblins', params: [['unit', 'Spawns (unit name)', 'Goblin Swarm', null], ['count', 'Bodies per spawn', 2, 1], ['every', 'Every (s)', 4, 0.5], ['max', 'Most alive at once', 6, 1], ['waves', 'Most waves per fight (0 = no limit)', 0, 1]] },
    rapid:   { label: 'Rapid fire', params: [['aps', 'Attack speed (+%)', 50, 5], ['range', 'Range (−%)', 30, 5]] },
    swift:   { label: 'Swift strikes', params: [['speed', 'Move speed (+%)', 30, 5], ['hit', 'Hit size (+%)', 25, 5]] },
    heavy:   { label: 'Heavy shot', params: [['slow', 'Projectile speed (−%)', 40, 5], ['instant', 'Projectile speed if the unit hits instantly (m/s)', 30, 5], ['hit', 'Hit size (+%)', 40, 5]] },
    healer:  { label: 'Healing touch', params: [['pct', 'Heal per attack (% of hit)', 50, 5]] },
    range:   { label: 'Long reach', params: [['m', 'Range (+m)', 5, 1]] },
    shrink:  { label: 'Shortsight', params: [['m', 'Enemy range (−m)', 4, 0.5], ['duration', 'Lasts (s)', 3, 0.5]] },
    ward:    { label: 'Ward', params: [['cap', 'Most damage one hit can deal', 40, 5]] },
    slow:    { label: 'Slow', params: [['move', 'Enemy move speed (−%)', 40, 5], ['attack', 'Enemy attack speed (−%)', 20, 5], ['duration', 'Lasts (s)', 3, 0.5]] },
    forward: { label: 'Forward planting', params: [] },
    split:   { label: 'Split beam', params: [['beams', 'Targets at once', 4, 1], ['range', 'Range (−%)', 30, 5], ['hit', 'Hit per target (−%)', 0, 5]] },
    deathSpawn: { label: 'Spawn on death', params: [['unit', 'Spawns (unit name)', 'Goblin Swarm', null], ['count', 'Bodies per death', 2, 1], ['strength', 'Strength of each spawn (% health and damage; 50 = half)', 100, 10]] },
    shield:  { label: 'Shield', params: [['hits', 'Hits blocked per body', 3, 1]] },
    blast:   { label: 'Death burst', params: [['radius', 'Radius (m)', 7, 0.5], ['pct', 'Damage (% of hit)', 100, 10]] },
    lifesteal: { label: 'Lifesteal', params: [['pct', 'Heals itself for (% of damage dealt)', 10, 1]] },
    turret:  { label: 'Extra turret', params: [['turrets', 'Attacks at once (each with its own target and reload)', 2, 1]] },
    frenzy:  { label: 'Frenzy', params: [['pct', 'Attack speed per hit (+% of base)', 10, 1], ['cap', 'Most attacks per second', 2, 0.1]] },
    spread:  { label: 'Spread', params: [['min', 'Least distance (m)', 1, 0.5], ['max', 'Most distance (m)', 6, 0.5]] },
    mortar:  { label: 'Mortar', params: [['range', 'Range (+m)', 15, 1], ['min', 'Minimum range (m)', 5, 0.5], ['aps', 'Attack speed (+ attacks per second)', 0.1, 0.05]] },
  };
  const skillParam = (d, k) => {
    const v = d.params && d.params[k];
    if (v !== undefined && v !== null && v !== '') return v;
    const def = (SKILL_TYPES[d.type].params.find(p => p[0] === k) || [])[2];
    return def;
  };

  // One plain sentence describing what a skill does with its current settings
  function describeSkill(d) {
    if (!d || !SKILL_TYPES[d.type]) return '';
    const P = (k) => skillParam(d, k);
    const n = (k) => { const v = +P(k); return isFinite(v) ? String(Math.round(v * 100) / 100) : '0'; };
    switch (d.type) {
      case 'regen': return `+${n('hp')}% health, and regains ${n('pct')}% of its max health every second.`;
      case 'poison': return `Hits poison the target for ${n('pct')}% of the hit over ${n('duration')} s, ignoring armor and ward. ${n('slow')}% more time between attacks.`;
      case 'stealth': return `Can’t be targeted until it attacks, and hides again after ${STEALTH_BACK} s without attacking. Splash and piercing shots can still hit it.`;
      case 'armorHp': return `+${n('armor')} armor and +${n('hp')}% health.`;
      case 'spawn': return `Every ${n('every')} s, spawns ${n('count')} ${String(P('unit'))} ${+P('count') === 1 ? 'body' : 'bodies'}, up to ${n('max')} alive at once${+P('waves') > 0 ? `, at most ${n('waves')} ${+P('waves') === 1 ? 'wave' : 'waves'} per fight` : ''}.`;
      case 'rapid': return `+${n('aps')}% attack speed, −${n('range')}% range.`;
      case 'swift': return +P('hit') ? `+${n('speed')}% move speed and +${n('hit')}% hit size.` : `+${n('speed')}% move speed.`;
      case 'heavy': return `Projectiles fly ${n('slow')}% slower (${n('instant')} m/s if it normally hits instantly), +${n('hit')}% hit size.`;
      case 'healer': return `Each attack heals a random wounded ally for ${n('pct')}% of its hit.`;
      case 'range': return `+${n('m')} m range.`;
      case 'shrink': return `Hits cut the target’s range by ${n('m')} m for ${n('duration')} s, but not below 1 m.`;
      case 'ward': return `No single hit can deal more than ${n('cap')} damage to it.`;
      case 'slow': return `Hits slow the target for ${n('duration')} s: −${n('move')}% move speed and −${n('attack')}% attack speed.`;
      case 'forward': return 'Squads of this unit can also be placed in no man’s land.';
      case 'split': return `Attacks ${n('beams')} different enemies at once${+P('hit') > 0 ? `, −${n('hit')}% hit each` : ''}. −${n('range')}% range.`;
      case 'deathSpawn': return `When a body dies, ${n('count')} ${String(P('unit'))} ${+P('count') === 1 ? 'body takes' : 'bodies take'} its place${+P('strength') !== 100 ? `, at ${n('strength')}% health and damage` : ''}. A spawn of the unit itself starts from the dead body's own stats. Spawns don’t spawn again.`;
      case 'blast': return `When a body dies it explodes, dealing ${+P('pct') === 100 ? 'the damage of its hit' : `${n('pct')}% of its hit`} (for a ram, what it deals to the tower) to every enemy within ${n('radius')} m.`;
      case 'lifesteal': return `Each body heals itself for ${n('pct')}% of the damage it deals.`;
      case 'turret': return `Each body attacks ${n('turrets')} different enemies at once, each attack with its own target and its own reload, as if it carried ${n('turrets')} copies of its weapon. They never aim at the same enemy, so with only one enemy in reach just one fires.`;
      case 'frenzy': return `Each hit it lands gives that body +${n('pct')}% attack speed for the rest of the fight, up to ${n('cap')} attacks per second.`;
      case 'spread': return `At the start of a fight the bodies scatter in all directions, ${n('min')} to ${n('max')} m from where they stand (some stay on the tile), then charge. Splash catches fewer of them.`;
      case 'mortar': return `+${n('range')} m range and +${n('aps')} attacks per second, but it can’t attack enemies ${n('min')} m away or closer.`;
      case 'shield': return `Each body fully blocks the first ${n('hits')} ${+P('hits') === 1 ? 'hit' : 'hits'} it takes in a fight, however big. Poison already on it still ticks.`;
    }
    return '';
  }

  // A unit with skills applied. defs = the skill definitions that are active; roster = all units (for spawns).
  function applySkills(unit, defs, roster) {
    const u = withTraits(unit);
    for (const d of defs || []) {
      if (!d || !SKILL_TYPES[d.type]) continue;
      const P = (k) => { const v = +skillParam(d, k); return isFinite(v) ? v : 0; };
      switch (d.type) {
        case 'regen': u.regen = (u.regen || 0) + Math.max(0, P('pct')); u.hp = u.hp * (1 + P('hp') / 100); break;
        case 'poison':
          u.poisonPct = (u.poisonPct || 0) + Math.max(0, P('pct'));
          u.poisonDur = Math.max(u.poisonDur || 0, Math.max(0.5, P('duration')));
          u.aps = u.aps / (1 + Math.max(0, P('slow')) / 100);
          break;
        case 'stealth': u.stealth = true; break;
        case 'armorHp': u.bonusArmor = (u.bonusArmor || 0) + Math.max(0, P('armor')); u.hp = u.hp * (1 + P('hp') / 100); break;
        case 'spawn': {
          const name = String(skillParam(d, 'unit'));
          const src = (roster || []).find(r => r && r.name === name);
          if (src) {
            const { skills, skillDefs, skillsOn, ...plain } = src;
            u.spawn = { unit: withTraits({ ...plain, level: 0 }), count: Math.max(1, Math.round(P('count'))), every: Math.max(0.5, P('every')), max: Math.max(1, Math.round(P('max'))), waves: Math.max(0, Math.round(P('waves'))) };
          }
          break;
        }
        case 'rapid': u.aps = u.aps * (1 + P('aps') / 100); u.range = Math.max(0.5, u.range * (1 - Math.min(90, P('range')) / 100)); break;
        case 'swift': u.speed = u.speed * (1 + P('speed') / 100); u.hit = u.hit * (1 + P('hit') / 100); break;
        case 'heavy':
          u.projSpeed = u.projSpeed > 0 ? Math.max(2, u.projSpeed * (1 - Math.min(90, P('slow')) / 100)) : Math.max(2, P('instant'));
          u.hit = u.hit * (1 + P('hit') / 100);
          break;
        case 'healer': u.healPct = (u.healPct || 0) + Math.max(0, P('pct')); break;
        case 'range': u.range = u.range + P('m'); break;
        case 'shrink': u.shrinkM = Math.max(u.shrinkM || 0, P('m')); u.shrinkDur = Math.max(u.shrinkDur || 0, Math.max(0.5, P('duration'))); break;
        case 'ward': { const c = Math.max(1, P('cap')); u.bonusWard = u.bonusWard ? Math.min(u.bonusWard, c) : c; break; }
        case 'slow':
          u.slowMove = Math.max(u.slowMove || 0, Math.min(90, P('move')));
          u.slowAtk = Math.max(u.slowAtk || 0, Math.min(90, P('attack')));
          u.slowDur = Math.max(u.slowDur || 0, Math.max(0.5, P('duration')));
          break;
        case 'deathSpawn': {
          const name = String(skillParam(d, 'unit'));
          const src = (roster || []).find(r => r && r.name === name);
          if (src) {
            const { skills, skillDefs, skillsOn, ...plain } = src;
            u.deathSpawn = { name, unit: withTraits({ ...plain, level: 0 }), count: Math.max(1, Math.round(P('count'))), strength: Math.max(1, P('strength')) / 100 };
          }
          break;
        }
        case 'lifesteal': u.lifesteal = (u.lifesteal || 0) + Math.max(0, P('pct')); break;
        case 'turret': u.turrets = Math.max(u.turrets || 1, Math.min(6, Math.round(P('turrets')))); break;
        case 'shield': u.shield = (u.shield || 0) + Math.max(0, Math.round(P('hits'))); break;
        case 'spread': u.spread = [Math.max(0, P('min')), Math.max(0, P('min'), P('max'))]; break;
        case 'mortar': u.range = u.range + P('range'); u.minRange = Math.max(u.minRange || 0, P('min')); u.aps = u.aps + Math.max(0, P('aps')); break;
        case 'frenzy': u.frenzyPct = (u.frenzyPct || 0) + Math.max(0, P('pct')); u.frenzyCap = Math.max(u.frenzyCap || 0, Math.max(0.05, P('cap'))); break;
        case 'blast': u.blastR = Math.max(u.blastR || 0, Math.max(0, P('radius'))); u.blastPct = (u.blastPct || 0) + Math.max(0, P('pct')); break;
        case 'split':
          u.beams = Math.max(u.beams || 1, Math.round(P('beams')));
          u.range = Math.max(0.5, u.range * (1 - Math.min(90, P('range')) / 100));
          u.hit = u.hit * (1 - Math.min(90, P('hit')) / 100);
          break;
      }
    }
    return u;
  }

  // The unit with its built-in skills (slots marked in skillsInnate), resolved from a skill library
  function innateUnit(unit, lib, roster) {
    if (!unit || !Array.isArray(unit.skillsInnate) || !Array.isArray(unit.skills)) return unit;
    const defs = SLOTS.filter(k => unit.skillsInnate[k] && unit.skills[k]).map(k => {
      const base = (lib || []).find(s => s && s.id === unit.skills[k]);
      if (!base) return null;
      const mod = Array.isArray(unit.skillMods) && unit.skillMods[k] && typeof unit.skillMods[k] === 'object' ? unit.skillMods[k] : null;
      return mod ? { ...base, params: { ...base.params, ...(mod.params || {}) } } : base;
    }).filter(Boolean);
    return defs.length ? applySkills(unit, defs, roster) : unit;
  }

  // Gold per side for counter tables: the smallest amount that every unit's price divides evenly
  // (costs in lab units, 1 = 100 gold), so no unit is stuck with leftover gold. Falls back to the priciest unit.
  function fairBudget(costs, min = 2) {
    const top = Math.max(min, ...costs);
    const step = Math.min(...costs.filter(c => c > 0));
    for (let b = top; b <= top * 6 + 1e-9; b += step) {
      if (costs.every(c => c <= 0 || Math.abs(b / c - Math.round(b / c)) < 1e-6)) return b;
    }
    return top;
  }

  function squadsFor(unit, g) {
    return Math.max(1, Math.floor(g.budget / Math.max(0.0001, unit.cost) + 1e-9));
  }

  // Raw strength of what the budget buys: total health x total damage per second
  function rawStrength(unit, g) {
    const u = leveled(unit);
    const s = squadsFor(u, g);
    const n = s * u.bodies;
    const hp = n * u.hp;
    const cycle = 1 / Math.max(0.01, u.aps); // wind-up only happens when the unit sets up after moving, so it isn't counted per attack
    const dps = n * u.hit / cycle * Math.max(1, u.burst) * (u.flame > 0 ? 1 : Math.max(1, u.pellets));
    return { squads: s, bodies: n, hp, dps, strength: hp * dps };
  }

  function damageAfterDefense(hit, target, g) {
    const u = target.u;
    const armor = (u.defense === 'armor' ? u.defVal : 0) + (u.bonusArmor || 0);
    let d = armor > 0 ? Math.max(hit - armor, hit * g.minDmgPct / 100) : hit;
    if (u.defense === 'ward') d = Math.min(d, u.defVal);
    if (u.bonusWard > 0) d = Math.min(d, u.bonusWard); // ward from a skill; works next to armor
    return d;
  }

  function makeSide(unit, side, g) {
    return makeArmy([{ unit, gold: g.budget }], side, g);
  }

  // An army of one or more unit types, listed front to back. Each entry is a unit, or { unit, gold }
  // to give that unit its own budget (default: the battle budget). Each group stands in its own rows.
  function makeArmy(list, side, g) {
    const bodies = [];
    let depth = 0, idx = 0;
    list.forEach((entry, k) => {
      const e = entry && entry.unit ? entry : { unit: entry, gold: g.budget };
      const u = leveled(e.unit);
      const s = squadsFor(u, { budget: e.gold == null ? g.budget : e.gold });
      const n = s * u.bodies;
      const cols = Math.max(1, Math.min(n, Math.ceil(Math.sqrt(n * 2.5))));
      const sp = g.spacing;
      for (let i = 0; i < n; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        const x = (c - (cols - 1) / 2) * sp;
        const y = (g.distance / 2 + depth + r * sp) * (side === 0 ? -1 : 1);
        bodies.push(newBody(u, side, x, y, list.length === 1 ? i : idx, k));
        idx++;
      }
      depth += Math.ceil(n / cols) * sp + sp; // the next group stands one gap further back
    });
    return bodies;
  }

  // `unit` must already be leveled (see leveled())
  function newBody(unit, side, x, y, i, squad) {
    const u = unit;
    const interval = 1 / Math.max(0.01, u.aps);
    return {
      u, side, x, y, hp: u.hp, alive: true, squad, level: u.level || 0, xp: 0,
      cd: ((i * 7) % 11) / 11 * interval, // deterministic stagger
      moved: 0, firing: -1, burstLeft: 0, burstTimer: 0, burstDir: [0, 1], windTarget: null, windT: 0, setUp: false,
      hidden: !!u.stealth || !!u.aloft, poison: null, shrinkM: 0, shrinkT: 0, slowT: 0, slowMove: 0, slowAtk: 0,
      spawnT: u.spawn ? u.spawn.every : 0, kids: null,
      shield: u.shield || 0, // hits left that the Shield skill blocks completely
      frenzy: 0, // hits landed so far (Frenzy skill)
      stunT: 0, lastAtk: 0, // seconds of stun left (chargeStun); fight time of its last attack (stealth returns)
      spreadTo: u.spread ? spreadSpot(x, y, i, u.spread) : null, // Spread skill: where it runs to before anything else
    };
  }
  // Spread: a spot min..max metres from (x, y) in one of 12 directions, picked from the body's index (the same on every device)
  const DIRS12 = [[1, 0], [0.866025, 0.5], [0.5, 0.866025], [0, 1], [-0.5, 0.866025], [-0.866025, 0.5], [-1, 0], [-0.866025, -0.5], [-0.5, -0.866025], [0, -1], [0.5, -0.866025], [0.866025, -0.5]];
  function spreadSpot(x, y, i, [min, max]) {
    const [dx, dy] = DIRS12[(i * 5) % 12], d = min + (max - min) * ((i * 7) % 12) / 11;
    return { x: x + dx * d, y: y + dy * d };
  }

  // Bodies of one squad placed around a point on the board (footprint about `size` metres)
  function buildSquad(unit, side, cx, cy, squad, size, startIndex = 0, level = 0) {
    const u = leveled(unit, level);
    const n = Math.max(1, Math.round(u.bodies));
    const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
    const sp = n === 1 ? 0 : Math.min(2.2, (size * 0.9) / Math.max(cols, rows));
    const out = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      out.push(newBody(u, side, cx + (c - (cols - 1) / 2) * sp, cy + (r - (rows - 1) / 2) * sp, startIndex + i, squad));
    }
    return out;
  }

  // Lab battle: one unit type per side in a standard formation
  // Either side may be one unit or an army list (see makeArmy)
  function battle(uA, uB, g, opts = {}) {
    const side = (x, k) => Array.isArray(x) ? makeArmy(x, k, g) : makeSide(x, k, g);
    const bt = createBattle(side(uA, 0), side(uB, 1), g, opts);
    const frames = [];
    while (bt.step()) if (opts.record) frames.push(bt.frame());
    const r = bt.result();
    if (opts.record) frames.push(bt.frame(true));
    r.frames = frames;
    r.shapes = bt.bodies.map(b => b.u.shape || "circle");
    r.colors = bt.bodies.map(b => b.u.color || null);
    return r;
  }

  // A steppable battle between two lists of bodies (side 0 and side 1)
  function createBattle(A, B, g, opts = {}) {
    const all = A.concat(B);
    const sides = [A, B];
    const stats = [
      { dealt: 0, wasted: 0, blocked: 0, missed: 0, windLost: 0, winds: 0, totalHp: A.reduce((s, b) => s + (b.u.structure || b.u.aloft ? 0 : b.u.hp), 0) },
      { dealt: 0, wasted: 0, blocked: 0, missed: 0, windLost: 0, winds: 0, totalHp: B.reduce((s, b) => s + (b.u.structure || b.u.aloft ? 0 : b.u.hp), 0) },
    ];
    const dt = g.dt;
    const stealthOn = ruleOn(g, 'stealth'), stealthBack = ruleOn(g, 'stealthBack'), knockOn = ruleOn(g, 'knockback');
    // without vision every unit sees the whole field: it locks on to the nearest enemy from the first tick
    const sight = !ruleOn(g, 'vision') ? 1e9 : g.sight == null ? SIGHT : g.sight;
    const minSight = g.minSight == null ? MIN_SIGHT : g.minSight;
    const drift = g.drift == null ? DRIFT : g.drift;
    const cripple = [0, 0];      // seconds left of the tower-down penalty for each side
    const towerDown = g.towerDown || TOWER_DOWN;
    // a body died: a fallen tower cripples its side; a body with deathBlast explodes (deathBlast % of its max health)
    const fell = (v) => {
      // a tower with teleport (Teleport mage general): instead of falling it jumps to u.teleport { x, y } with 1 health, once, and its side isn't crippled
      if (v.u.structure && v.u.teleport && !v.teleported) {
        v.teleported = true; v.alive = true; v.hp = 1; v.diedTick = undefined; v.poison = null;
        v.x = v.u.teleport.x; v.y = v.u.teleport.y;
        return;
      }
      if (v.u.structure) cripple[v.side] = towerDown.secs;
      if (v.u.deathBlast > 0) {
        const dmg = v.u.hp * v.u.deathBlast / 100;
        if (opts.record) shots.push([v.x, v.y, v.x, v.y, v.side, BLAST_RADIUS, 1, 0, 0]);
        for (const f of sides[1 - v.side]) if (f.alive && hyp(f.x - v.x, f.y - v.y) <= BLAST_RADIUS) hurt(v, f, dmg, v.x, v.y);
      }
      // Death burst: its hit to every enemy within blastR (a ram's target already took the ram itself)
      if (v.u.blastR > 0) {
        const dmg = v.u.hit * v.u.blastPct / 100;
        if (opts.record) shots.push([v.x, v.y, v.x, v.y, v.side, v.u.blastR, 1, 0, 0]);
        for (const f of sides[1 - v.side]) if (f.alive && f !== v.rammed && hyp(f.x - v.x, f.y - v.y) <= v.u.blastR) hurt(v, f, dmg, v.x, v.y);
      }
      // a carrier is gone: whoever rode inside jumps out where it fell
      if (v.u.carrier) {
        let k = 0;
        for (const r of sides[v.side]) {
          if (r.carrier !== v || !r.boarded) continue;
          const [ox, oy] = SPAWN_SPOTS[k++ % SPAWN_SPOTS.length], fwd = v.side === 0 ? 1 : -1;
