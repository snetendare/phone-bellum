<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column, a war table at night. HUD on top, square board, controls under the thumb. Single dark look by choice. */
:root {
  --bg: #0D1315;
  --panel: #152125;
  --board: #13201F;
  --line: #27393D;
  --ink: #E5ECE9;
  --muted: #8DA1A1;
  --you: #5CC6DF;
  --foe: #EE6E5C;
  --gold: #E6B84A;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; padding-inline: 16px; padding-block: 12px 28px; -webkit-tap-highlight-color: transparent; }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* HUD */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { display: grid; gap: 4px; min-width: 0; }
.side.foe { text-align: right; }
.side .lbl { font-family: var(--font-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; gap: 8px; }
.side.you .lbl { color: var(--you); }
.side.foe .lbl { color: var(--foe); flex-direction: row-reverse; }
.side .lbl .num { color: var(--ink); font-weight: 500; }
.hp { height: 8px; border-radius: 4px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; }
.hp i { display: block; height: 100%; transition: width 0.6s ease; }
.side.you .hp i { background: var(--you); }
.side.foe .hp i { background: var(--foe); margin-left: auto; }
.round { text-align: center; font-family: var(--font-display); }
.round b { display: block; font-size: 22px; font-weight: 700; line-height: 1; }
.round span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

/* Board */
.board-wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--board); touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.tag-clock { position: absolute; top: 8px; left: 10px; font-family: var(--font-data); font-size: 12px; color: var(--muted); pointer-events: none; }
.overlay { position: absolute; inset: 0; display: flex; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; background: rgba(13, 19, 21, 0.86); text-align: center; }
.card { margin: auto; display: grid; gap: 10px; justify-items: center; max-width: 36ch; }
.card h2 { font-size: clamp(26px, 8vw, 38px); font-weight: 700; text-transform: uppercase; line-height: 1; }
.card h2.you { color: var(--you); }
.card h2.foe { color: var(--foe); }
.card p { margin: 0; color: var(--muted); }
.card .big { color: var(--ink); font-size: 17px; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; text-align: left; color: var(--muted); font-size: 13px; line-height: 1.35; }
.card ul li::before { content: "▸ "; color: var(--gold); }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }

/* Controls */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.gold { font-family: var(--font-data); font-size: 16px; color: var(--gold); font-weight: 500; }
.deploys { font-size: 13px; color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: default; }
.hint { font-size: 13px; color: var(--muted); }
.btn { border-radius: 4px; border: 1px solid var(--line); background: transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.btn.primary:disabled { opacity: 0.4; cursor: default; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-family: var(--font-data); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--gold); }

.shop { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
.uwrap { flex: 0 0 132px; scroll-snap-align: start; position: relative; display: grid; }
.ucard { text-align: left; border: 1px solid var(--line); border-radius: 6px; padding: 10px 34px 9px 10px; background: var(--bg); display: grid; gap: 3px; align-content: start; }
.ucard[aria-pressed="true"] { border-color: var(--you); box-shadow: inset 0 0 0 1px var(--you); }
.ucard[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.ucard .t { font-family: var(--font-data); font-size: 12px; color: var(--you); letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 5px; }
.ucard .n { font-family: var(--font-display); font-weight: 600; font-size: 15px; line-height: 1.15; }
.ucard .r { font-size: 12px; color: var(--muted); line-height: 1.3; }
.ucard .c { font-family: var(--font-data); font-size: 12px; color: var(--gold); }
.uwrap .info { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-family: var(--font-display); font-size: 12px; display: grid; place-items: center; }

/* Unit sheet */
.sheet-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent); display: grid; align-items: end; justify-items: center; z-index: 5; }
.sheet { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; max-height: 80vh; overflow-y: auto; }
.sheet h3 { font-size: 22px; }
.sheet .role { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px 14px; font-size: 13px; }
.stats div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 4px 0; }
.stats span { color: var(--muted); }
.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; }
.vs h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.vs .good h4 { color: var(--you); }
.vs .bad h4 { color: var(--foe); }
.vs ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px; }
.traits span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .hp i { transition: none; } }
</style>

<div class="app">

    <div class="side you"><div class="lbl"><span>You</span><span class="num" id="hp-you">40</span></div><div class="hp"><i id="hpbar-you" style="width:100%"></i></div></div>
    <div class="round"><b class="num" id="round">1</b><span id="phase">Deploy</span></div>

  </div>

    <div class="overlay" id="overlay"></div>

  <div class="panel" id="panel"></div>
</div>

<script>
(() => {
  const DATA = /*DATA*/;
  const ROLES = {
    'Goblin Swarm': 'Fast melee swarm. Soaks shots and overwhelms single-target units.',
    'Skeleton Archers': 'Cheap ranged squad that deals steady damage from behind.',
    'Ember Imps': 'Short-range brawlers whose small splash eats swarms up close.',
    'Fire Mage': 'A lone caster whose medium-range splash clears clumps.',
    'Sniper': 'Huge single shots from very far away. Wasted on swarms.',
    'Brute': 'Armored melee bruiser. Small hits barely scratch it.',
    'Wisps': 'Warded spirits. No single hit can deal more than 40 to them.',
    'Crossbow Volley': 'Fires 4-bolt bursts down one line. Lined-up targets take every bolt.',
    'Ballista': 'Slow piercing bolts from long range. Can’t hit anything close.',
    'Boar Riders': 'Fast chargers whose first hit doubles and knocks small bodies back.',
  };
  // ---------- unit sets: built-in, or loaded from Counter Lab ----------
  const BUILTIN = { units: DATA.units, matrix: DATA.matrix };
  const STORE = 'phonebellum.units.v1';
  const MATRIX_SETTINGS = { budget: 2, distance: 40, spacing: 3.5, minDmgPct: 15, timeCap: 60, dt: 0.05 };
  const LEVERS = ['cost', 'bodies', 'hp', 'hit', 'aps', 'range', 'speed', 'splash'];
  let units, M, customSet = false;
  const validUnits = (list) => Array.isArray(list) && list.length >= 2 && list.length <= 30 &&
    list.every(u => u && typeof u.name === 'string' && u.name.trim() && LEVERS.every(k => typeof u[k] === 'number' && isFinite(u[k]) && u[k] >= 0) && u.bodies >= 1 && u.aps > 0 && u.cost > 0);
  const validSet = (s) => s && validUnits(s.units) && Array.isArray(s.matrix) && s.matrix.length === s.units.length;
  function useSet(set, custom) {
    units = Shapes.assign(set.units).map(u => ({ ...Engine.withTraits(u), name: String(u.name).replace(/[<>&"]/g, '').trim().slice(0, 40) || 'Unit', level: 0, bodies: Math.max(1, Math.round(u.bodies)) }));
    M = set.matrix; customSet = custom;
  }
  try {
    const raw = localStorage.getItem(STORE);
    const p = raw && JSON.parse(raw);
    if (validSet(p)) useSet(p, true); else useSet(BUILTIN, false);
  } catch (e) { useSet(BUILTIN, false); }
  const tag = (u) => (u.name.replace(/[^A-Za-z]/g, '').slice(0, 3) || 'UNT').toUpperCase();
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let m = null;             // match state
  let phase = 'start';      // start | deploy | battle | result | end
  let selected = null;      // unit index chosen in the shop
  let bt = null;            // running battle
  let speed = 2, lastTs = 0, acc = 0, raf = 0;
  let fx = [];              // short-lived effects: shots, splashes, deaths
  let lastSummary = null;
  let lastAiLevels = [];
  let hoverTile = null;

  // ---------- canvas ----------
  const cv = $('board'), ctx = cv.getContext('2d');
  let W = 0, S = 0; // css size, px per metre
  function size() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.width * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = W / (Game.COLS * Game.TILE);
  }
  const half = Game.COLS * Game.TILE / 2;
  const PX = (x) => (x + half) * S;
  const PY = (y) => (half - y) * S;
  const tilePx = () => Game.TILE * S;
  const radius = (u) => Math.max(0.6, Math.min(2.4, 0.55 + Math.sqrt(u.hp) / 30)) * S;

  function drawBoard() {
    const t = tilePx();
    ctx.fillStyle = css('--board'); ctx.fillRect(0, 0, W, W);
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = css('--foe'); ctx.fillRect(0, 0, W, t * 4);
    ctx.fillStyle = css('--you'); ctx.fillRect(0, t * 8, W, t * 4);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(200, 230, 225, 0.06)'; ctx.lineWidth = 1;
    for (let i = 1; i < Game.COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * t, 0); ctx.lineTo(i * t, W); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * t); ctx.lineTo(W, i * t); ctx.stroke();
    }
    ctx.setLineDash([5, 6]); ctx.lineWidth = 1.2;
    ctx.strokeStyle = css('--foe'); ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.moveTo(0, t * 4); ctx.lineTo(W, t * 4); ctx.stroke();
    ctx.strokeStyle = css('--you');
    ctx.beginPath(); ctx.moveTo(0, t * 8); ctx.lineTo(W, t * 8); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // Squad shown at its tile in deploy view
  function drawSquad(sq, side, fresh) {
    const u = units[sq.unit];
    const w = Game.tileToWorld(sq.col, sq.row);
    const bodies = Engine.buildSquad(u, side, w.x, w.y, sq.id, Game.TILE);
    const col = side === 0 ? css('--you') : css('--foe');
    const t = tilePx();
    if (fresh) {
      ctx.strokeStyle = col; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.strokeRect(sq.col * t + 1.5, sq.row * t + 1.5, t - 3, t - 3); ctx.setLineDash([]);
    }
    const r = radius(u);
    for (const b of bodies) Shapes.body(ctx, u.shape, PX(b.x), PY(b.y), r, side === 0 ? 1 : -1, u.color, col, 0.95);
    ctx.globalAlpha = 1;
    if (side === 0 && phase === 'deploy' && Game.isReady(m, sq)) { // ready to level up: gold plus badge
      const br = Math.max(5, t * 0.17), bx = (sq.col + 1) * t - br - 2, by = sq.row * t + br + 2;
      ctx.fillStyle = css('--gold'); ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = css('--bg'); ctx.lineWidth = Math.max(1.5, br * 0.3);
      ctx.beginPath(); ctx.moveTo(bx - br * 0.5, by); ctx.lineTo(bx + br * 0.5, by); ctx.moveTo(bx, by - br * 0.5); ctx.lineTo(bx, by + br * 0.5); ctx.stroke();
    }
    if (sq.level > 0) { // level pips along the top of the tile
      ctx.fillStyle = css('--gold');
      const pr = Math.max(2, t * 0.07);
      for (let k = 0; k < sq.level; k++) {
        ctx.beginPath(); ctx.arc(sq.col * t + pr + 3 + k * (pr * 2.6), sq.row * t + pr + 3, pr, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (t >= 26) {
      ctx.font = `500 ${Math.max(8, Math.round(t * 0.26))}px "IBM Plex Mono", monospace`;
      ctx.fillStyle = css('--ink'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.globalAlpha = 0.85; ctx.fillText(tag(u), (sq.col + 0.5) * t, (sq.row + 1) * t - 1); ctx.globalAlpha = 1;
    }
  }

  function drawDeploy() {
    drawBoard();
    const t = tilePx();
    if (selected !== null && phase === 'deploy') {
      ctx.strokeStyle = css('--you'); ctx.globalAlpha = 0.25; ctx.lineWidth = 1;
      for (const row of Game.zoneRows(0)) for (let c = 0; c < Game.COLS; c++) {
        if (!Game.occupied(m, 0, c, row)) ctx.strokeRect(c * t + 3, row * t + 3, t - 6, t - 6);
      }
      ctx.globalAlpha = 1;
    }
    if (hoverTile && selected !== null && Game.inZone(0, hoverTile.row) && !Game.occupied(m, 0, hoverTile.col, hoverTile.row)) {
      ctx.fillStyle = css('--you'); ctx.globalAlpha = 0.18;
      ctx.fillRect(hoverTile.col * t, hoverTile.row * t, t, t); ctx.globalAlpha = 1;
    }
    for (const sq of m.armies[1]) if (sq.round < m.round || phase !== 'deploy') drawSquad(sq, 1, false);
    for (const sq of m.armies[0]) drawSquad(sq, 0, sq.round === m.round && phase === 'deploy');
  }

  function drawBattle() {
    drawBoard();
    const colY = css('--you'), colF = css('--foe'), muted = css('--muted'), gold = css('--gold');
    // effects under bodies
    for (const e of fx) {
      const a = 1 - e.age / e.life;
      if (e.kind === 'death') {
        ctx.strokeStyle = e.side === 0 ? colY : colF; ctx.globalAlpha = 0.5 * a; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(PX(e.x), PY(e.y), e.r * (1 + e.age / e.life), 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    for (const b of bt.bodies) {
      if (b.alive) continue;
      ctx.fillStyle = muted; ctx.globalAlpha = 0.18;
      ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), Math.max(1.5, radius(b.u) * 0.45), 0, Math.PI * 2); ctx.fill();
    }
    for (const b of bt.bodies) {
      if (!b.alive) continue;
      const c = b.side === 0 ? colY : colF, r = radius(b.u), hpr = b.hp / b.u.hp;
      Shapes.body(ctx, b.u.shape, PX(b.x), PY(b.y), r, b.side === 0 ? 1 : -1, b.u.color, c, 0.35 + 0.65 * hpr);
      if (b.u.hp >= 500 && hpr < 1) { // health ring on big units
        ctx.strokeStyle = c; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), r + 2.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hpr); ctx.stroke();
      }
      if (b.windTarget && b.u.windUp > 0) { // charging a wind-up attack: ring fills clockwise
        ctx.strokeStyle = c; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - b.windT / b.u.windUp)); ctx.stroke();
      }
      if (b.level > 0) { // gold outline marks leveled bodies
        ctx.strokeStyle = gold; ctx.lineWidth = Math.min(2.5, 0.8 + b.level * 0.5);
        Shapes.outline(ctx, b.u.shape, PX(b.x), PY(b.y), r + 3.5, b.side === 0 ? 1 : -1);
      }
    }
    // shots and splashes over bodies
    for (const e of fx) {
      const a = 1 - e.age / e.life;
      const c = e.side === 0 ? colY : colF;
      if (e.kind === 'shot') {
        ctx.strokeStyle = c; ctx.globalAlpha = 0.7 * a; ctx.lineWidth = e.charged ? 3 : 1;
        ctx.beginPath(); ctx.moveTo(PX(e.x1), PY(e.y1)); ctx.lineTo(PX(e.x2), PY(e.y2)); ctx.stroke();
        if (e.splash > 0) { ctx.globalAlpha = 0.4 * a; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(PX(e.x2), PY(e.y2), e.splash * S, 0, Math.PI * 2); ctx.stroke(); }
      }
    }
    ctx.globalAlpha = 1;
    for (const p of bt.projectiles()) {
      ctx.fillStyle = p.owner.side === 0 ? colY : colF;
      ctx.fillRect(PX(p.x) - 2.5, PY(p.y) - 2.5, 5, 5);
    }
  }

  function render() {
    if (!m) { drawBoard(); return; }
    if (phase === 'battle' || (phase === 'result' && bt)) drawBattle();
    else drawDeploy();
  }

  // ---------- HUD / panel ----------
  function hud() {
    const hp0 = m ? m.hp[0] : Game.START_HP, hp1 = m ? m.hp[1] : Game.START_HP;
    $('hp-you').textContent = hp0; $('hp-foe').textContent = hp1;
    $('hpbar-you').style.width = (hp0 / Game.START_HP * 100) + '%';
    $('hpbar-foe').style.width = (hp1 / Game.START_HP * 100) + '%';
    $('round').textContent = m ? m.round : 1;
    $('phase').textContent = { start: 'Ready', deploy: 'Deploy', battle: 'Battle', result: 'Result', end: 'Match over' }[phase];
  }

  function panelDeploy() {
    const g = m.gold[0];
    const fresh = m.armies[0].filter(s => s.round === m.round).length;
    const ready = m.armies[0].filter(s => Game.isReady(m, s)).length;
    const left = Game.deploysLeft(m, 0), allowed = Game.deploysAllowed(m, 0);
    const price = (i) => Game.unitCostOf(units[i]);
    const canBuy = (i) => g >= price(i) && left > 0;
    let hint = selected !== null
      ? (canBuy(selected) ? `Tap a tile in your zone to place ${esc(units[selected].name)}.` : left <= 0 ? 'No deployments left this round.' : `Not enough gold for ${esc(units[selected].name)}.`)
      : (fresh ? 'Tap a squad you placed this round to take it back.' : 'Pick a unit, then tap a tile in the bottom four rows.');
    if (left <= 0 && selected === null) hint = `No deployments left. Buy one more for ${Game.CONFIG.extraDeployCost} gold, or spend gold on upgrades.`;
    if (ready && selected === null) hint = `${ready} squad${ready === 1 ? ' is' : 's are'} ready to level up. Tap ${ready === 1 ? 'it' : 'one'} to upgrade.`;
    const extraBtns = `<span class="row" style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn small" id="buy-deploy" ${g >= Game.CONFIG.extraDeployCost ? '' : 'disabled'}>+1 deployment · ${Game.CONFIG.extraDeployCost}</button>
        ${m.extraDeploys[0] > 0 && left > 0 ? `<button class="btn small" id="refund-deploy">Refund unused</button>` : ''}
      </span>`;
    $('panel').innerHTML = `
      <div class="bar"><span class="gold num">${g} gold</span><span class="deploys num">${Math.max(0, left)} of ${allowed} deployments left</span></div>
      <div class="bar"><span class="hint">${hint}</span>${extraBtns}</div>
      <div class="shop" id="shop">${units.map((u, i) => `
        <div class="uwrap">
          <button class="ucard" data-i="${i}" aria-pressed="${selected === i}" aria-disabled="${!canBuy(i)}">
            <span class="t"><span style="color:${u.color};display:inline-flex">${Shapes.svg(u.shape, 13)}</span> ${tag(u)}</span><span class="n">${esc(u.name)}</span>
            <span class="c">${price(i)} · ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'}</span>
          </button>
          <button class="info" data-info="${i}" aria-label="About ${esc(u.name)}">i</button>
        </div>`).join('')}</div>
      <div class="bar">
        <span class="hint">${m.armies[0].length} squad${m.armies[0].length === 1 ? '' : 's'} on the board</span>
        <button class="btn primary" id="fight" ${m.armies[0].length ? '' : 'disabled'}>Fight</button>
      </div>`;
    const shop = $('shop');
    shop.scrollLeft = shopScroll;
    shop.addEventListener('scroll', () => { shopScroll = shop.scrollLeft; }, { passive: true });
    shop.querySelectorAll('.ucard').forEach(b => b.addEventListener('click', () => {
      if (b.getAttribute('aria-disabled') === 'true') return;
      const i = +b.dataset.i;
      selected = selected === i ? null : i;
      panelDeploy(); render();
    }));
    shop.querySelectorAll('[data-info]').forEach(el => el.addEventListener('click', () => openSheet(+el.dataset.info)));
    $('fight').addEventListener('click', startFight);
    $('buy-deploy').addEventListener('click', () => { Game.buyDeploy(m, 0); panelDeploy(); render(); });
    if ($('refund-deploy')) $('refund-deploy').addEventListener('click', () => { Game.refundDeploy(m, 0); panelDeploy(); render(); });
  }
  let shopScroll = 0;

  function panelBattle() {
    $('panel').innerHTML = `
      <div class="bar">
        <div class="seg" role="group" aria-label="Playback speed">
          ${[1, 2, 4].map(s => `<button data-s="${s}" aria-pressed="${speed === s}">${s}×</button>`).join('')}
        </div>
        <button class="btn small" id="skip">Skip to result</button>
      </div>
      <span class="hint" id="bhint">Blue is you, red is the enemy. Battles speed up on their own after 20 seconds.</span>`;
    $('panel').querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
      speed = +b.dataset.s;
      $('panel').querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.s === speed)));
    }));
    $('skip').addEventListener('click', () => { while (bt.step()) {} finishBattle(); });
  }

  function panelInfo(text, btnLabel, onClick) {
    $('panel').innerHTML = `<div class="bar"><span class="hint">${text}</span>${btnLabel ? `<button class="btn primary" id="pbtn">${btnLabel}</button>` : ''}</div>`;
    if (btnLabel) $('pbtn').addEventListener('click', onClick);
  }

  // ---------- overlays ----------
  function overlay(html) {
    const o = $('overlay');
    if (!html) { o.hidden = true; o.innerHTML = ''; return; }
    o.hidden = false; o.innerHTML = html;
  }

  function showStart() {
    phase = 'start'; m = null; bt = null; hud();
    overlay(`<div class="card">
      <span class="eyebrow">Demo · you vs AI</span>
      <h2>No Mans Land</h2>
      <ul>
        <li>Each round you get gold to buy squads. A standard squad costs ${Game.SQUAD_COST}.</li>
        <li>Place squads in the bottom four rows. They stay put for the rest of the match.</li>
        <li>Armies fight on their own. The loser takes damage from every enemy squad still standing.</li>
        <li>You see the enemy's earlier squads while you deploy, so build counters.</li>
        <li>Place up to 3 squads in round 1 and 2 per round after that. Extra deployments cost ${Game.CONFIG.extraDeployCost} gold each.</li>
        <li>Squads earn experience. When one shows a gold +, tap it to upgrade: level 2 doubles its health and attack, level 3 triples them.</li>
      </ul>
      <div style="display:grid;gap:6px;justify-items:center">
        <span class="hint">Level-up cost (test setting)</span>
        <div class="seg" role="group" aria-label="Level-up cost">
          ${[50, 75].map(c => `<button data-c="${c}" aria-pressed="${Game.CONFIG.levelCostPerTier === c}">${c} gold</button>`).join('')}
        </div>
      </div>
      <button class="btn primary" id="go">Start match</button>
    </div>`);
    $('panel').innerHTML = `
      <div class="bar"><span class="hint">Playing with ${customSet ? `your ${units.length} units from Counter Lab` : `the ${units.length} built-in units`}.</span></div>
      <div class="bar">
        <button class="btn" id="load-units">Load units</button>
        <button class="btn primary" id="pbtn">Start match</button>
      </div>`;
    $('pbtn').addEventListener('click', startMatch);
    $('load-units').addEventListener('click', openLoader);
    $('overlay').querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
      Game.CONFIG.levelCostPerTier = +b.dataset.c;
      $('overlay').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }));
    $('go').addEventListener('click', startMatch);
    size(); render();
  }

  function showResult(sum) {
    const youWon = sum.winner === 0 && !sum.timeout, youLost = sum.winner === 1 && !sum.timeout;
    const head = sum.timeout ? 'Time ran out' : youWon ? `Round ${sum.round} won` : youLost ? `Round ${sum.round} lost` : 'Draw';
    const cls = youWon ? 'you' : youLost ? 'foe' : '';
    const lines = [];
    if (sum.dmg[1]) lines.push(`Enemy takes <b class="num">${sum.dmg[1]}</b> damage.`);
    if (sum.dmg[0]) lines.push(`You take <b class="num">${sum.dmg[0]}</b> damage.`);
    if (!sum.dmg[0] && !sum.dmg[1]) lines.push('Nobody takes damage.');
    const lv = (list) => list.map(x => `${esc(units[x.unit].name)} (to level ${x.level + 1})`).join(', ');
    const lvLines = [];
    if (lastAiLevels.length) lvLines.push(`<p><span style="color:var(--gold)">Enemy leveled up before the fight:</span> ${lv(lastAiLevels)}.</p>`);
    if (sum.newlyReady[0].length) lvLines.push(`<p><span style="color:var(--gold)">Ready to level up:</span> ${lv(sum.newlyReady[0])}.</p>`);
    if (m.over) {
      const win = m.winner === 0;
      phase = 'end'; hud();
      overlay(`<div class="card">
        <span class="eyebrow">After ${m.history.length} rounds</span>
        <h2 class="${win ? 'you' : 'foe'}">${win ? 'Victory' : m.winner === 1 ? 'Defeat' : 'Draw'}</h2>
        <p class="big">${lines.join(' ')}</p>
        <button class="btn primary" id="again">Play again</button>
      </div>`);
      panelInfo('The AI buys units that counter what you fielded last round.', 'Play again', startMatch);
      $('again').addEventListener('click', startMatch);
      return;
    }
    phase = 'result'; hud();
    const bonus = sum.bonusTo === 0 ? ` You get ${Game.LOSER_BONUS} extra for losing the round.` : sum.bonusTo === 1 ? ` The enemy gets ${Game.LOSER_BONUS} extra for losing the round.` : '';
    overlay(`<div class="card">
      <span class="eyebrow">${fmtTime(sum.time)} of fighting</span>
      <h2 class="${cls}">${head}</h2>
      <p class="big">${lines.join(' ')}</p>
      ${lvLines.join('')}
      <p>Next round: +${Game.INCOME} gold each.${bonus}</p>
      <button class="btn primary" id="next">Next round</button>
    </div>`);
    panelInfo('Your squads keep their tiles. Add more to counter what you just saw.', 'Next round', beginRound);
    $('next').addEventListener('click', beginRound);
  }
  const fmtTime = (s) => `${Math.round(s)} s`;

  // ---------- flow ----------
  function startMatch() {
    m = Game.createMatch(units, M, (Date.now() ^ (Math.random() * 1e9)) >>> 0);
    beginRound();
  }

  function beginRound() {
    Game.aiDeploy(m, 1);       // the AI commits first; its new squads stay hidden until the fight
    phase = 'deploy'; bt = null; fx = []; selected = null; $('clock').textContent = '';
    overlay(null); hud(); panelDeploy(); size(); render();
  }

  function startFight() {
    if (!m.armies[0].length) return;
    phase = 'battle'; selected = null; hud();
    lastAiLevels = Game.aiLevel(m, 1); // the AI spends its level-ups now, using what it knew at the start of the round
    bt = Game.startBattle(m);
    fx = []; acc = 0; lastTs = 0;
    panelBattle();
    cancelAnimationFrame(raf);
    if (reduced) { while (bt.step()) {} finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function absorb() { // turn the last step's shots and deaths into short-lived effects
    for (const s of bt.lastShots()) fx.push({ kind: 'shot', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], splash: s[5], charged: s[6], age: 0, life: 0.18 });
    for (const b of bt.bodies) if (!b.alive && !b._gone) { b._gone = true; fx.push({ kind: 'death', x: b.x, y: b.y, r: radius(b.u), side: b.side, age: 0, life: 0.5 }); }
  }

  function loop(ts) {
    if (phase !== 'battle') return;
    const dtReal = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
    const boost = bt.time() > 20 ? 2 : 1;
    acc += dtReal * speed * boost;
    while (acc >= Game.SETTINGS.dt) {
      acc -= Game.SETTINGS.dt;
      if (!bt.step()) break;
      absorb();
    }
    for (const e of fx) e.age += dtReal * speed * boost;
    fx = fx.filter(e => e.age < e.life);
    $('clock').textContent = `${bt.time().toFixed(1)} s${boost > 1 ? ' · speeding up' : ''}`;
    render();
    if (bt.isOver()) { finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function finishBattle() {
    cancelAnimationFrame(raf);
    fx = [];
    const res = bt.result();
    $('clock').textContent = `${res.time.toFixed(1)} s`;
    lastSummary = Game.resolve(m, res);
    render();
    showResult(lastSummary);
  }

  // ---------- board input ----------
  function tileAt(ev) {
    const r = cv.getBoundingClientRect();
    const col = Math.floor((ev.clientX - r.left) / r.width * Game.COLS);
    const row = Math.floor((ev.clientY - r.top) / r.height * Game.ROWS);
    if (col < 0 || row < 0 || col >= Game.COLS || row >= Game.ROWS) return null;
    return { col, row };
  }
  cv.addEventListener('pointermove', (ev) => {
    if (phase !== 'deploy' || ev.pointerType !== 'mouse') return;
    hoverTile = tileAt(ev); render();
  });
  cv.addEventListener('pointerleave', () => { hoverTile = null; if (phase === 'deploy') render(); });
  cv.addEventListener('click', (ev) => {
    if (phase !== 'deploy') return;
    const t = tileAt(ev); if (!t) return;
    const own = m.armies[0].find(s => s.col === t.col && s.row === t.row);
    if (own) {
      if (own.round === m.round) Game.unplace(m, 0, t.col, t.row);
      else openSheet(own.unit, own, 0);
      panelDeploy(); render(); return;
    }
    const foe = m.armies[1].find(s => s.col === t.col && s.row === t.row && s.round < m.round);
    if (foe) { openSheet(foe.unit, foe, 1); return; }
    if (selected !== null && Game.inZone(0, t.row)) {
      Game.place(m, 0, selected, t.col, t.row);
      if (m.gold[0] < Game.unitCostOf(units[selected]) || Game.deploysLeft(m, 0) <= 0) selected = null;
      panelDeploy(); render();
    }
  });

  // ---------- unit sheet ----------
  function openSheet(i, sq, side) {
    const base = units[i];
    const u = sq ? Engine.leveled(base, sq.level) : base;
    let lvl = '';
    if (sq) {
      const next = sq.level < Engine.MAX_LEVEL ? Math.round(Game.xpNeeded(base, sq.level)) : null;
      const shown = next ? Math.min(Math.round(sq.xp), next) : 0;
      lvl = `<p style="margin:0"><span style="color:var(--gold)">Level ${sq.level + 1}${sq.level ? ` · ${sq.level + 1}× health and attack` : ''}</span> · ${next ? `${shown.toLocaleString('en-US')} / ${next.toLocaleString('en-US')} XP to level ${sq.level + 2}` : 'max level'}</p>`;
      if (side === 0 && phase === 'deploy') {
        const cost = Game.levelCost(base);
        const boughtNow = sq.boughtLevels && sq.boughtLevels[m.round] > 0;
        const btns = [];
        if (Game.isReady(m, sq)) btns.push(m.gold[0] >= cost
          ? `<button class="btn primary" id="lvl-up">Level up · ${cost} gold</button>`
          : `<button class="btn primary" disabled>Need ${cost} gold</button>`);
        if (boughtNow) btns.push(`<button class="btn" id="lvl-undo">Undo level-up</button>`);
        if (btns.length) lvl += `<div class="row" style="display:flex;gap:8px;flex-wrap:wrap">${btns.join('')}</div>`;
        else if (next) lvl += `<p class="hint" style="margin:0">Earns XP from damage it deals and takes. Killing leveled enemies pays extra.</p>`;
      }
    }
    const row = M[i];
    const good = units.map((v, j) => [row[j], v.name]).filter(x => x[0] > 0.3).sort((a, b) => b[0] - a[0]).slice(0, 3);
    const bad = units.map((v, j) => [row[j], v.name]).filter(x => x[0] < -0.3).sort((a, b) => a[0] - b[0]).slice(0, 3);
    const tr = [];
    if (u.burst > 1) tr.push(`Burst ${u.burst}`);
    if (u.pellets > 1) tr.push(`Shotgun ${u.pellets}`);
    if (u.spinUp > 0) tr.push(`Spin-up ${u.spinUp}%/s`);
    if (u.pierce > 0) tr.push(`Pierce ${u.pierce}`);
    if (u.projSpeed > 0) tr.push(`Bolts ${u.projSpeed} m/s`);
    if (u.minRange > 0) tr.push(`Min range ${u.minRange} m`);
    if (u.charge > 1) tr.push(`Charge ×${u.charge}`);
    if (u.knockback > 0) tr.push(`Knockback ${u.knockback} m`);
    if (u.windUp > 0) tr.push(`Wind-up ${u.windUp} s`);
    if (u.defense === 'armor') tr.push(`Armor ${u.defVal}`);
    if (u.defense === 'ward') tr.push(`Ward ${u.defVal}`);
    if (u.splash > 0) tr.push(`Splash ${u.splash} m`);
    $('sheet').innerHTML = `
      <div class="bar"><h3 id="sheet-h"><span style="color:${u.color}">${Shapes.svg(u.shape, 18)}</span> ${esc(u.name)}</h3><button class="btn small" id="close">Close</button></div>
      <p class="role" style="margin:0">${ROLES[u.name] && !customSet ? ROLES[u.name] : customSet ? `From your Counter Lab roster · ${Game.unitCostOf(base)} gold` : ''}</p>
      ${lvl}
      ${tr.length ? `<div class="traits">${tr.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
      <div class="stats num">
        <div><span>Bodies</span>${u.bodies}</div><div><span>Health</span>${Math.round(u.hp)}</div>
        <div><span>Hit</span>${Math.round(u.hit)}</div><div><span>Attacks/s</span>${u.aps}</div>
        <div><span>Range</span>${u.range} m</div><div><span>Speed</span>${u.speed} m/s</div>
      </div>
      <div class="vs">
        <div class="good"><h4>Strong against</h4><ul>${good.length ? good.map(x => `<li>${x[1]}</li>`).join('') : '<li>No hard counters</li>'}</ul></div>
        <div class="bad"><h4>Weak against</h4><ul>${bad.length ? bad.map(x => `<li>${x[1]}</li>`).join('') : '<li>No hard counters</li>'}</ul></div>
      </div>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    const after = () => { panelDeploy(); render(); openSheet(i, sq, side); };
    if ($('lvl-up')) $('lvl-up').addEventListener('click', () => { Game.levelUp(m, 0, sq.id); after(); });
    if ($('lvl-undo')) $('lvl-undo').addEventListener('click', () => { Game.undoLevel(m, 0, sq.id); after(); });
    ($('lvl-up') || $('close')).focus();
  }
  function closeSheet() { $('sheet-back').hidden = true; loaderRun++; }

  // ---------- load units from Counter Lab ----------
  let loaderRun = 0;
  function* matrixGen(us) {
    const n = us.length, out = us.map(() => Array(n).fill(0));
    const total = n * (n - 1) / 2;
    let done = 0;
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const r = Engine.battle(us[i], us[j], MATRIX_SETTINGS);
      out[i][j] = +r.score.toFixed(3); out[j][i] = -out[i][j];
      yield [++done, total];
    }
    return out;
  }
  function openLoader() {
    $('sheet').innerHTML = `
      <div class="bar"><h3 id="sheet-h">Load units</h3><button class="btn small" id="close">Close</button></div>
      <p class="role" style="margin:0">In Counter Lab, scroll to Save and share and tap Copy roster. Then paste it here.</p>
      <textarea id="roster-in" spellcheck="false" placeholder="Paste your roster here" aria-label="Roster text"
        style="min-height:130px;font:12px var(--font-data);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px;width:100%"></textarea>
      <div class="bar">
        ${customSet ? '<button class="btn" id="builtin">Use built-in units</button>' : '<span></span>'}
        <button class="btn primary" id="use-roster">Use these units</button>
      </div>
      <p class="hint" id="load-msg" aria-live="polite" style="margin:0"></p>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    $('roster-in').focus();
    if ($('builtin')) $('builtin').addEventListener('click', () => {
      try { localStorage.removeItem(STORE); } catch (e) {}
      useSet(BUILTIN, false); closeSheet(); showStart();
    });
    $('use-roster').addEventListener('click', () => {
      const msg = $('load-msg');
      let p;
      try { p = JSON.parse($('roster-in').value); } catch (e) { msg.textContent = 'That text isn’t a roster. Copy it again with Copy roster in Counter Lab.'; return; }
      const list = Array.isArray(p) ? p : p && p.units;
      if (!validUnits(list)) { msg.textContent = 'The roster needs 2 to 30 units, each with a name, a cost above 0 and all eight levers.'; return; }
      // Counter Lab costs are in gold (100 = one standard squad); older rosters used 1 = one squad
      const gold = (p && p.goldCosts) || list.some(u => u.cost >= 10);
      const clean = list.map(u => ({ ...u, level: 0, cost: gold ? u.cost / 100 : u.cost }));
      const prepared = clean.map(u => ({ ...Engine.withTraits(u), level: 0, bodies: Math.max(1, Math.round(u.bodies)) }));
      const id = ++loaderRun;
      $('use-roster').disabled = true;
      const gen = matrixGen(prepared);
      (function tick() {
        if (id !== loaderRun) return;
        const t0 = performance.now();
        let r;
        while (performance.now() - t0 < 30) {
          r = gen.next();
          if (r.done) {
            const set = { units: clean, matrix: r.value };
            try { localStorage.setItem(STORE, JSON.stringify(set)); } catch (e) {}
            useSet(set, true);
            closeSheet(); showStart();
            return;
          }
        }
        msg.textContent = `Building the AI’s counter table: ${r.value[0]} of ${r.value[1]} matchups…`;
        setTimeout(tick, 0);
      })();
    });
  }
  $('sheet-back').addEventListener('click', (e) => { if (e.target.id === 'sheet-back') closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

  window.addEventListener('resize', () => { size(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { size(); render(); });
  showStart();
})();
</script>
