<style>
/*BASECSS*/
[hidden] { display: none !important; }
body { padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); margin: 0; }
.net { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: center; min-height: 18px; }
.net i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.net.ok i { background: #6FD08C; }
.net.bad { color: var(--foe); }
.net.bad i { background: var(--foe); }
.timer { font-family: var(--font-data); font-size: 20px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--foe); }
.code { font-family: var(--font-data); font-size: clamp(30px, 10vw, 44px); letter-spacing: 0.22em; color: var(--gold); padding-left: 0.22em; }
.linkbox { font-family: var(--font-data); font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; word-break: break-all; user-select: all; -webkit-user-select: all; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.joinrow { display: flex; gap: 8px; justify-content: center; }
.joinrow input { width: 9ch; font: 500 18px var(--font-data); letter-spacing: 0.16em; text-transform: uppercase; text-align: center; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.card .stack { display: grid; gap: 8px; justify-items: center; width: 100%; }
.card hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.status { font-size: 14px; color: var(--ink); }
.status.wait::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
a { color: var(--you); }
/* unit shop: one tab per tier, rarity colours, locked units greyed out */
.tiers { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 6px; }
.tiers button { min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--muted); padding: 6px 6px; font: 600 14px var(--font-display); display: grid; gap: 1px; text-align: left; border-top: 3px solid var(--tier); }
.tiers button em { font: 600 11px var(--font-display); font-style: normal; color: var(--tier); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button small { font: 500 10px var(--font-data); letter-spacing: -0.03em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button[aria-selected="true"] { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--tier); }
.ucard { border-top: 3px solid var(--tier, var(--line)) !important; }
.ucard .tier { font: 600 10px var(--font-data); letter-spacing: 0.08em; color: var(--tier); text-transform: uppercase; }
.ucard[data-locked] { opacity: 0.55; background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(255,255,255,0.03) 8px 16px), var(--bg); }
.ucard[data-locked] .t > span:first-child { filter: grayscale(1); }
.ucard[data-locked] .n { color: var(--muted); }
.ucard .lock { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; font: 600 12px var(--font-data); color: var(--gold); }
/* role symbols on unit cards and in the info sheet */
.roles { display: flex; align-items: center; gap: 5px; }
.roles svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.roles .is, .roles .ex { color: var(--ink); }
.roles .beats { color: var(--you); }
.roles .rng { color: var(--muted); margin-left: auto; }
.ucard .roles { margin: 2px -26px 1px 0; }
.ucard[data-locked] .roles { filter: grayscale(1); }
.roleline { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.roleline .roles .rng { margin-left: 0; }
.confirm { display: grid; gap: 8px; border: 1px solid var(--gold); border-radius: 6px; padding: 10px; }
@media (prefers-reduced-motion: reduce) { .status.wait::after { animation: none; content: "…"; } }
</style>

<script>
(() => {
  const DATA = /*DATA*/;
  const ROLES = {
    'Goblin Swarm': 'Fast melee swarm. Soaks shots and overwhelms single-target units.',
    'Skeleton Archers': 'Cheap ranged squad that deals steady damage from behind.',
    'Ember Imps': 'Short-range brawlers whose small splash eats swarms up close.',
    'Fire Mage': 'A lone caster whose medium-range splash clears clumps.',
    'Sniper': 'Huge single shots from very far away. Sets up before it fires. Wasted on swarms.',
    'Brute': 'Armored melee bruiser landing quick, heavy blows on one target at a time.',
    'Leaf Wizard': 'Fast caster that fires six-shot volleys of twin leaves.',
    'Earth Wizard': 'Slow, crushing boulders that roll through every enemy in their path.',
    'Flame Wizard': 'A slow fortress that sprays fire across everything in front of it.',
    'Steel Wizard': 'Heavy caster that hammers everything in reach.',
    'Slime Wizard': 'Lobs huge, slow globs of slime that splash over a wide area.',
    'Ether Golem': 'A walking wall. Heavy armor shrugs off small hits while it holds its lane.',
    'Slimeshots': 'A pack of slime spitters lobbing small splashing globs. Shreds packed swarms.',
    'Ent': 'Slow tree guardians sweeping a wide arc in front. Each one explodes when it falls, hurting everything around it.',
    'Sun Priest': 'Channels a beam that burns hotter the longer it holds one target. Melts giants.',
    'Meteor Caller': 'Drops slow meteors from far behind the lines. Helpless once something reaches it.',
    'War Mammoth': 'Charges straight through the enemy line, trampling every body in its path, then turns to charge again.',
    'Necromancer': 'Keeps raising skeletons to screen its army from big hits.',
    'Wisps': 'Spirits firing slow, hard-hitting bolts from range. Fragile up close.',
    'Crossbow Volley': 'Fires 4-bolt bursts down one line. Lined-up targets take every bolt.',
    'Ballista': 'Slow piercing bolts from long range. Can’t hit anything close.',
    'Boar Riders': 'Fast chargers whose first hit doubles and knocks small bodies back.',
  };
  // ---------- role symbols: what a unit is, what it beats, one extra trait, and its range ----------
  // [is, beats, extra] for the built-in units. Units from Counter Lab get theirs from their stats (autoRole).
  const ROLE_SET = {
    'Goblin Swarm': ['swarm', 'giants'], 'Skeleton Archers': ['swarm', 'giants'],
    'Ember Imps': ['group', 'crowds'],
    'Fire Mage': ['single', 'crowds'], 'Leaf Wizard': ['single', 'crowds'], 'Slime Wizard': ['single', 'crowds'], 'Meteor Caller': ['single', 'crowds', 'artillery'],
    'Sniper': ['single', 'giants'], 'Wisps': ['single', 'giants'],
    'Brute': ['giant', 'giants'], 'Flame Wizard': ['giant', 'crowds'], 'Ether Golem': ['giant', 'crowds', 'tank'],
    'Ent': ['group', 'crowds'], 'Slimeshots': ['swarm', 'crowds'],
    'Sun Priest': ['giant', 'giants'],
    'Steel Wizard': ['giant', 'both'], 'Earth Wizard': ['giant', 'both'],
    'War Mammoth': ['giant', null, 'charger'], 'Necromancer': ['giant', null, 'summoner'],
  };
  const IS_TXT = { swarm: 'Swarm', group: 'Small group', single: 'Single', giant: 'Giant' };
  const BEATS_TXT = { crowds: 'beats crowds', giants: 'beats giants', both: 'beats crowds and giants' };
  const EXTRA_TXT = { tank: 'tank', artillery: 'artillery', summoner: 'summoner', charger: 'charger', ward: 'ward' };
  const RANGE_TXT = ['melee', 'mid range', 'long range'];
  const ico = (body, cls) => `<svg class="${cls}" viewBox="0 0 16 16" aria-hidden="true">${body}</svg>`;
  const dots = (pts, r) => pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
  const IS_SVG = { // more, smaller dots = more bodies
    swarm: dots([[3, 4], [8.5, 3], [13.5, 5], [4, 9.5], [10, 9], [6.5, 14], [12.5, 13.5]], 1.6),
    group: dots([[8, 4], [3.8, 11.5], [12.2, 11.5]], 2.6),
    single: dots([[8, 8]], 3.6),
    giant: dots([[8, 8]], 7),
  };
  const SIGHT = '<path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4" fill="none" stroke="currentColor" stroke-width="1.6"/>';
  const BEATS_SVG = { // the same dots as above, inside a target sight
    crowds: SIGHT + dots([[5.5, 5.5], [10.5, 5.5], [5.5, 10.5], [10.5, 10.5]], 1.5),
    giants: SIGHT + dots([[8, 8]], 4),
    both: SIGHT + dots([[5, 5], [5, 9], [9, 4.6]], 1.2) + dots([[10, 10]], 2.9),
  };
  const EXTRA_SVG = {
    tank: '<path d="M8 1.5 14 4v4c0 3.5-3 6-6 7.2C5 14 2 11.5 2 8V4z"/>',
    ward: '<circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 1.6"/><circle cx="8" cy="8" r="2.4"/>',
    artillery: '<path d="M2 14Q6 -2 13 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.2 1.6"/><circle cx="13" cy="12.6" r="2.2"/>',
    charger: '<path d="M2 3l5.5 5L2 13M8.5 3 14 8l-5.5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>',
    summoner: '<circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5v7M4.5 8h7" stroke="currentColor" stroke-width="2"/>',
  };
  const rangeSvg = (n) => ico(`<circle cx="1.8" cy="8" r="1.6"/>${[4, 7.5, 11].map((r, k) => {
    const a = 0.7, x = (1.8 + r * Math.cos(a)).toFixed(2), y1 = (8 - r * Math.sin(a)).toFixed(2), y2 = (8 + r * Math.sin(a)).toFixed(2);
    return `<path d="M${x} ${y1}A${r} ${r} 0 0 1 ${x} ${y2}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity="${k < n ? 1 : 0.22}"/>`;
  }).join('')}`, 'rng');
  function autoRole(u) {
    const is = u.bodies >= 6 ? 'swarm' : u.bodies >= 2 ? 'group' : u.hp >= 1000 ? 'giant' : 'single';
    const aoe = u.splash >= 2 || u.pellets > 1 || u.flame > 0 || u.pierce > 0;
    const big = u.hit >= 100 || u.spinUp > 0 || u.bodies >= 6;
    const beats = aoe && big ? 'both' : aoe ? 'crowds' : big ? 'giants' : null;
    const extra = u.charge > 1 ? 'charger' : u.spawn ? 'summoner' : u.defense === 'ward' ? 'ward'
      : u.defense === 'armor' && u.defVal >= 10 ? 'tank' : u.minRange > 0 || u.range >= 40 ? 'artillery' : null;
    return [is, beats, extra];
  }
  // role of unit i for a side (your bought skills count for range, e.g. Long reach)
  function roleOf(i, side) {
    const u = m && side !== null ? Game.unitFor(m, side === undefined ? me : side, i) : units[i]; // null = base unit (enemy skills stay hidden)
    const [is, beats, extra] = (!customSet && ROLE_SET[units[i].name]) || autoRole(u);
    const range = u.range <= 5 ? 1 : u.range < 20 ? 2 : 3;
    const text = [IS_TXT[is], beats && BEATS_TXT[beats], extra && EXTRA_TXT[extra], RANGE_TXT[range - 1]].filter(Boolean).join(', ');
    return { is, beats, extra, range, text };
  }
  const roleIcons = (r) => ico(IS_SVG[r.is], 'is') + (r.beats ? ico(BEATS_SVG[r.beats], 'beats') : '') + (r.extra ? ico(EXTRA_SVG[r.extra], 'ex') : '');
  const roleRow = (i) => { const r = roleOf(i); return `<span class="roles" title="${r.text}">${roleIcons(r)}${rangeSvg(r.range)}</span>`; };
  const DEPLOY_SECONDS = 60;   // deploy countdown each round
  const FIRST_DEPLOY_SECONDS = 60;   // round 1: package and squads
  const deployMs = () => (m && m.round === 1 ? FIRST_DEPLOY_SECONDS : DEPLOY_SECONDS) * 1000;
  const NEXT_SECONDS = 20;     // results screen moves on by itself after this long
  const PEER_PREFIX = 'phonebellum-v1-';
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const HOST_STORE = 'phonebellum.host.v1';
  const LAB_STORE = 'counterlab.v1';
  const qs = new URLSearchParams(location.search);

  // ---------- unit sets: built-in, or loaded from Counter Lab ----------
  const BUILTIN = { units: DATA.units, matrix: DATA.matrix, skills: DATA.skills || [] };
  const STORE = 'phonebellum.units.v1';
  const MATRIX_SETTINGS = { budget: 2, distance: 42, spacing: 3.5, minDmgPct: 15, timeCap: 60, dt: 0.05, sight: 12, flameReach: Game.SETTINGS.flameReach }; // distance = gap between the front rows on the board
  const LEVERS = ['cost', 'bodies', 'hp', 'hit', 'aps', 'range', 'speed', 'splash'];
  let units, M, customSet = false, rawSet = BUILTIN;
  const validUnits = (list) => Array.isArray(list) && list.length >= 2 && list.length <= 30 &&
    list.every(u => u && typeof u.name === 'string' && u.name.trim() && LEVERS.every(k => typeof u[k] === 'number' && isFinite(u[k]) && u[k] >= 0) && u.bodies >= 1 && u.aps > 0 && u.cost > 0);
  const validSet = (s) => s && validUnits(s.units) && Array.isArray(s.matrix) && s.matrix.length === s.units.length;
  function useSet(set, custom) {
    const skills = Array.isArray(set.skills) ? set.skills.filter(sk => sk && typeof sk.id === 'string' && Engine.SKILL_TYPES[sk.type])
      .map(sk => ({ ...sk, name: String(sk.name || Engine.SKILL_TYPES[sk.type].label).replace(/[<>&"]/g, '').slice(0, 40) })) : [];
    // each unit's skill slots, resolved to skill definitions
    units = Shapes.assign(set.units).map(u => ({ ...Engine.withTraits(u), name: String(u.name).replace(/[<>&"]/g, '').trim().slice(0, 40) || 'Unit', level: 0, bodies: Math.max(1, Math.round(u.bodies)),
      skillDefs: Engine.SLOTS.map(k => {
        const base = Array.isArray(u.skills) && skills.find(sk => sk.id === u.skills[k]);
        if (!base) return null;
        const mod = Array.isArray(u.skillMods) && u.skillMods[k] && typeof u.skillMods[k] === 'object' ? u.skillMods[k] : null; // the unit's own adjustments
        return mod ? { ...base, cost: isFinite(+mod.cost) && mod.cost !== null ? +mod.cost : base.cost, params: { ...base.params, ...(mod.params || {}) } } : base;
      }) }));
    M = set.matrix; customSet = custom; rawSet = set;
  }
  try {
    const raw = localStorage.getItem(STORE);
    const p = raw && JSON.parse(raw);
    if (validSet(p)) useSet(p, true); else useSet(BUILTIN, false);
  } catch (e) { useSet(BUILTIN, false); }
  const tag = (u) => (u.name.replace(/[^A-Za-z]/g, '').slice(0, 3) || 'UNT').toUpperCase();
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const now = () => Date.now();

  // ---------- state ----------
  let mode = 'ai';          // ai | claude | host | guest
  const solo = () => mode === 'ai' || mode === 'claude'; // playing against the computer on this screen
  const foeName = () => mode === 'ai' ? 'Enemy' : mode === 'claude' ? 'Claude' : 'Opponent';
  let me = 0;               // which side of the match this screen plays (the guest is side 1)
  const foe = () => 1 - me;
  let m = null;             // match state (on the guest: a copy kept in step by the host)
  let phase = 'start';      // start | lobby | deploy | battle | result | end
  try { if (/[?&]test\b/.test(location.search)) window.__pb = () => ({ m, me }); } catch (e) {} // read-only peek for UI tests
  let selected = null;      // unit index chosen in the shop
  let bt = null;            // battle being played back
  let battlePre = null;     // match as it stood when the running battle began (for the HUD)
  let speed = 2, lastTs = 0, acc = 0, raf = 0;
  let fx = [];
  let lastSummary = null;
  let lastAiLevels = [];
  let hoverTile = null;
  let moveMode = false;     // the Move ability is active: tap an older squad, then a tile
  let moving = null;        // id of the older squad picked to move
  // the unit being placed or moved right now (some units may use extra tiles, e.g. Forward planting)
  function placingUnit() {
    if (selected !== null) return selected;
    const id = moving != null ? moving : drag && drag.moved ? drag.id : null;
    const sq = id != null && m && m.armies[me].find(s => s.id === id);
    return sq ? sq.unit : null;
  }
  let drag = null, dragEndAt = 0; // dragging one of your squads to another tile
  let timerOn = true;       // vs AI: deploy countdown on or off
  let deadline = 0;         // local time the deploy phase ends (0 = no countdown running)
  let pausedLeft = 0;       // host: countdown time left while the opponent is away
  let timeUp = false;       // guest: countdown ran out, waiting for the host to start the fight
  let ready = [false, false];
  let nextReady = [false, false];
  let rematch = [false, false];
  let resultShownAt = 0;
  let shopScroll = 0;

  // ---------- canvas ----------
  const cv = $('board'), ctx = cv.getContext('2d');
  let W = 0, H = 0, S = 0;
  function size() {
    const r = cv.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = W * Game.ROWS / Game.COLS;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    S = W / (Game.COLS * Game.TILE);
  }
  const half = Game.COLS * Game.TILE / 2, halfY = Game.ROWS * Game.TILE / 2;
  // The board is turned around for side 1, so both players see their own zone at the bottom
  const flip = () => me === 1 ? -1 : 1;
  const PX = (x) => (half + x * flip()) * S;
  const PY = (y) => (halfY - y * flip()) * S;
  const scol = (c) => me === 1 ? Game.COLS - 1 - c : c;   // model column -> screen column (and back)
  const srow = (r) => me === 1 ? Game.ROWS - 1 - r : r;
  const tilePx = () => Game.TILE * S;
  const radius = (u) => Math.max(0.6, Math.min(2.4, 0.55 + Math.sqrt(u.hp) / 30)) * S;
  const ELF_COL = '#D8E68C'; // the neutral elf tower and its arrows
  const teamCol = (side) => side === 2 ? ELF_COL : side === me ? css('--you') : css('--foe');
  const upOf = (side) => side === me ? 1 : -1;

  // ---------- map backgrounds ----------
  // Forest Clearing: an open, faded green glade in the middle, with the edge of a dense forest
  // closing in on both flanks. Kept dark and muted so the squads stand out. Drawn once per board size.
  let mapBg = null;
  function forestBg() {
    const key = 'forest' + W + 'x' + H;
    if (mapBg && mapBg.key === key) return mapBg.cv;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const oc = document.createElement('canvas'); oc.width = Math.round(W * dpr); oc.height = Math.round(H * dpr);
    const c = oc.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    let sd = 1234567; const rr = () => { sd = (sd * 1103515245 + 12345) % 2147483648; return sd / 2147483648; };
    const t = tilePx();
    // the clearing: a soft lighter patch in the middle of a dark green floor
    c.fillStyle = '#132219'; c.fillRect(0, 0, W, H);
    const gl = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.62);
    gl.addColorStop(0, '#1F3923'); gl.addColorStop(0.55, '#1A301F'); gl.addColorStop(1, '#13241A');
    c.fillStyle = gl; c.fillRect(0, 0, W, H);
    // patches of slightly different greens and faint grass tufts
    const tints = ['#223D27', '#1B321F', '#26392A', '#182C1C'];
    for (let k = 0; k < 26; k++) {
      c.globalAlpha = 0.35; c.fillStyle = tints[k % tints.length];
      c.beginPath(); c.ellipse(t + rr() * (W - 2 * t), rr() * H, t * (0.6 + rr() * 1.4), t * (0.4 + rr() * 0.9), rr() * 3, 0, Math.PI * 2); c.fill();
    }
    c.strokeStyle = '#3E5E40'; c.lineWidth = 1;
    for (let k = 0; k < 260; k++) {
      const x = rr() * W, y = rr() * H, h = 2 + rr() * 3;

        const cx = PX(e.x1), cy = PY(e.y1), ex = PX(e.x2), ey = PY(e.y2);
        const ang = Math.atan2(ey - cy, ex - cx), half = e.half * Math.PI / 180, rr = Math.hypot(ex - cx, ey - cy);
        const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
        grd.addColorStop(0, 'rgba(255,210,90,0.6)'); grd.addColorStop(0.6, 'rgba(255,120,40,0.35)'); grd.addColorStop(1, 'rgba(255,70,20,0.05)');
        ctx.fillStyle = grd; ctx.globalAlpha = 0.4 + 0.6 * a;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, rr, ang - half, ang + half); ctx.closePath(); ctx.fill();
      }
      if (e.kind === 'death') {
        ctx.strokeStyle = teamCol(e.side); ctx.globalAlpha = 0.5 * a; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(PX(e.x), PY(e.y), e.r * (1 + e.age / e.life), 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    for (const b of bt.bodies) {
      if (b.alive) continue;
      ctx.fillStyle = muted; ctx.globalAlpha = 0.18;
      ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), Math.max(1.5, radius(b.u) * 0.45), 0, Math.PI * 2); ctx.fill();
    }
    for (const b of bt.bodies) {
      if (!b.alive || !b.u.structure) continue;
      const hpr = b.hp / b.u.hp, t = tilePx();
      drawKeep(PX(b.x), PY(b.y), t, b.side, hpr);
      ctx.strokeStyle = teamCol(b.side); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), t * 0.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hpr); ctx.stroke();
    }
    drawElfTower(battlePre || m, false);
    for (const b of bt.bodies) {
      if (!b.alive || b.u.structure) continue;
      const c = teamCol(b.side), r = radius(b.u), hpr = b.hp / b.u.hp;
      if (b.hidden) { // stealthed: a dashed ghost until it attacks (fainter for the enemy's)
        ctx.globalAlpha = b.side === me ? 0.6 : 0.3; ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.setLineDash([2, 2]);
        Shapes.outline(ctx, b.u.shape, PX(b.x), PY(b.y), r, upOf(b.side));
        ctx.setLineDash([]); ctx.globalAlpha = 1;
        continue;
      }
      Shapes.body(ctx, b.u.shape, PX(b.x), PY(b.y), r, upOf(b.side), b.u.color, c, (0.35 + 0.65 * hpr) * (b.delay > 0 ? 0.45 : 1));
      if (b.delay > 0) { // flank squads arrive a few seconds late: a shrinking ring shows the wait
        ctx.strokeStyle = css('--gold'); ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), r + 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * b.delay / Game.FLANK.delay); ctx.stroke();
      }
      if (b.poison && b.poison.length) { ctx.fillStyle = '#6FD08C'; ctx.beginPath(); ctx.arc(PX(b.x) + r * 0.9, PY(b.y) - r * 0.9, Math.max(2, r * 0.3), 0, Math.PI * 2); ctx.fill(); }
      if (b.slowT > 0) { ctx.fillStyle = '#9BD0FF'; ctx.beginPath(); ctx.arc(PX(b.x) - r * 0.9, PY(b.y) - r * 0.9, Math.max(2, r * 0.3), 0, Math.PI * 2); ctx.fill(); } // slowed
      if (b.u.hp >= 500 && hpr < 1) {
        ctx.strokeStyle = c; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), r + 2.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * hpr); ctx.stroke();
      }
      if (b.windTarget && b.u.windUp > 0) {
        ctx.strokeStyle = c; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), r + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - b.windT / b.u.windUp)); ctx.stroke();
      }
      if (b.level > 0) {
        ctx.strokeStyle = gold; ctx.lineWidth = Math.min(2.5, 0.8 + b.level * 0.5);
        Shapes.outline(ctx, b.u.shape, PX(b.x), PY(b.y), r + 3.5, upOf(b.side));
      }
      if (b.shroom) { // purple mushroom buff: faint purple spores drifting up, looping
        ctx.fillStyle = SHROOM_COL.purple;
        for (let k = 0; k < 2; k++) {
          const s0 = (b.squad * 0.29 + b.x * 0.11 + k * 0.5) % 1, p = (bt.time() * 0.6 + s0) % 1;
          ctx.globalAlpha = 0.5 * Math.sin(p * Math.PI);
          ctx.beginPath(); ctx.arc(PX(b.x) + (k ? 1 : -1) * r * (0.3 + 0.3 * Math.sin((p + s0) * 6)), PY(b.y) - r * (0.4 + 1.6 * p), Math.max(1.2, r * 0.16), 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (b.fast) { // yellow mushroom: a short speed streak behind the body
        ctx.strokeStyle = SHROOM_COL.yellow; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2;
        const hx = (b.hx || 0) * flip(), hy = -(b.hy || 0) * flip();
        for (const o of [-0.4, 0.4]) { ctx.beginPath(); ctx.moveTo(PX(b.x) - hx * r * 1.2 + hy * r * o, PY(b.y) - hy * r * 1.2 - hx * r * o); ctx.lineTo(PX(b.x) - hx * r * 2.2 + hy * r * o, PY(b.y) - hy * r * 2.2 - hx * r * o); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
      if (b.zoe) { // Zoe buff: two faint stars drifting up from the body, looping
        ctx.fillStyle = gold; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `${Math.max(7, Math.round(r * 0.7))}px sans-serif`;
        for (let k = 0; k < 2; k++) {
          const s = (b.squad * 0.37 + b.x * 0.13 + k * 0.5) % 1, p = (bt.time() * 0.7 + s) % 1;
          ctx.globalAlpha = 0.55 * Math.sin(p * Math.PI);
          ctx.fillText('★', PX(b.x) + (k ? 1 : -1) * r * (0.35 + 0.25 * Math.sin((p + s) * 6)), PY(b.y) - r * (0.4 + 1.8 * p));
        }
        ctx.globalAlpha = 1;
      }
    }
    for (const e of fx) {
      const a = 1 - e.age / e.life;
      if (e.kind === 'heal') {
        ctx.strokeStyle = '#6FD08C'; ctx.globalAlpha = 0.8 * a; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]);
        ctx.beginPath(); ctx.moveTo(PX(e.x1), PY(e.y1)); ctx.lineTo(PX(e.x2), PY(e.y2)); ctx.stroke(); ctx.setLineDash([]);
        if (e.splash > 0) { ctx.globalAlpha = 0.5 * a; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(PX(e.x2), PY(e.y2), e.splash * S, 0, Math.PI * 2); ctx.stroke(); } // the elves' splash heal
      }
      if (e.kind === 'shot') {
        ctx.strokeStyle = teamCol(e.side); ctx.globalAlpha = 0.7 * a; ctx.lineWidth = Math.max(e.charged ? 3 : 1, 1 + (e.spin - 1) * 1.5); // spun-up beams get thicker
        ctx.beginPath(); ctx.moveTo(PX(e.x1), PY(e.y1)); ctx.lineTo(PX(e.x2), PY(e.y2)); ctx.stroke();
        if (e.splash > 0) { ctx.globalAlpha = 0.4 * a; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(PX(e.x2), PY(e.y2), e.splash * S, 0, Math.PI * 2); ctx.stroke(); }
      }
    }
    ctx.globalAlpha = 1;
    for (const p of bt.projectiles()) {
      ctx.fillStyle = teamCol(p.owner.side);
      ctx.fillRect(PX(p.x) - 2.5, PY(p.y) - 2.5, 5, 5);
    }
    // a fallen tower cripples its army for a few seconds
    const crip = [me, foe()].filter(sd => bt.crippled(sd) > 0);
    crip.forEach((sd, k) => {
      const txt = sd === me ? `Your tower fell · crippled ${Math.ceil(bt.crippled(sd))} s` : `${mode === 'claude' ? 'Claude’s' : 'Enemy'} tower fell · crippled ${Math.ceil(bt.crippled(sd))} s`;
      ctx.font = `600 ${Math.max(11, Math.round(W * 0.035))}px "IBM Plex Mono", monospace`;
      const tw = ctx.measureText(txt).width + 16, th = Math.max(20, W * 0.06), x = (W - tw) / 2, y = H * (sd === me ? 0.62 : 0.32) + k * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y, tw, th);
      ctx.fillStyle = teamCol(sd); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, W / 2, y + th / 2);
    });
  }

  function render() {
    cv.style.touchAction = phase === 'deploy' ? 'none' : ''; // so a finger can drag squads without scrolling the page
    if (!m) { drawBoard(); return; }
    if (bt && (phase === 'battle' || phase === 'result' || phase === 'end')) drawBattle();
    else drawDeploy();
  }

  // ---------- HUD ----------
  function hud() {
    const v = phase === 'battle' && battlePre ? battlePre : m;
    const hpMe = v ? v.hp[me] : Game.START_HP, hpFoe = v ? v.hp[foe()] : Game.START_HP;
    $('hp-you').textContent = hpMe; $('hp-foe').textContent = hpFoe;
    $('hpbar-you').style.width = (hpMe / Game.START_HP * 100) + '%';
    $('hpbar-foe').style.width = (hpFoe / Game.START_HP * 100) + '%';
    $('round').textContent = v ? v.round : 1;
    $('phase').textContent = { start: 'Ready', lobby: 'Lobby', deploy: 'Deploy', battle: 'Battle', result: 'Result', end: 'Match over' }[phase];
    $('foe-name').textContent = foeName();
  }

  function setNet(text, state) {
    const n = $('net');
    if (!text) { n.hidden = true; return; }
    n.hidden = false; n.className = 'net' + (state ? ' ' + state : '');
    $('net-text').textContent = text;
  }
  function netStatus() {
    if (solo()) { setNet(''); return; }
    if (net.connected) setNet(mode === 'host' ? `Match ${net.code} · opponent connected` : `Match ${net.code} · connected`, 'ok');
    else if (phase === 'lobby') setNet('');
    else setNet(mode === 'host' ? `Opponent disconnected. Waiting for them to come back…` : 'Connection lost. Reconnecting…', 'bad');
  }

  // ---------- countdown ----------
  const fmtClock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const editable = () => phase === 'deploy' && !ready[me] && !timeUp && !(mode === 'claude' && claude.fightWaiting);

  function tick() {
    const t = now();
    if (phase === 'deploy') {
      // host: the countdown waits while the opponent is away
      if (mode === 'host' && !net.connected && deadline) { pausedLeft = Math.max(5000, deadline - t); deadline = 0; panelDeploy(); }
      const el = $('timer');
      if (deadline) {
        const left = deadline - t;
        if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left <= 5000); }
        $('clock').textContent = left > 0 ? `${fmtClock(left)} to deploy` : 'Time’s up';
        if (mode !== 'guest' && left <= (mode === 'host' ? -500 : 0)) runFight();
        else if (mode === 'guest' && left <= 0 && !timeUp) { timeUp = true; selected = null; closeSheet(); sendSide(); panelDeploy(); render(); }
      } else if (el) { el.textContent = solo() ? '' : 'paused'; el.classList.remove('low'); }
    }
    if ((phase === 'result' || phase === 'end') && resultShownAt) {
      const left = resultShownAt + NEXT_SECONDS * 1000 - t;
      const nb = $('pbtn');
      if (phase === 'result' && !nextReady[me]) {
        if (left <= 0) tapNext();
        else if (nb && !solo()) nb.textContent = `Next round · ${Math.ceil(left / 1000)}`;
      }
    }
  }
  setInterval(tick, 200);

  // ---------- panel ----------
  function panelDeploy() {
    if (phase !== 'deploy') return;
    const g = m.gold[me];
    const fresh = m.armies[me].filter(s => s.round === m.round).length;
    const readyN = m.armies[me].filter(s => Game.isReady(m, s)).length;
    const left = Game.deploysLeft(m, me), allowed = Game.deploysAllowed(m, me);
    const price = (i) => Game.unitCostOf(units[i]);
    const can = editable();
    const locked = (i) => !Game.isUnlocked(m, me, i);
    const freeN = (i) => Game.freeLeft(m, me).filter(x => x === i).length;
    const canBuy = (i) => can && !choosingPack() && !placingTower() && (freeN(i) > 0 || (!locked(i) && g >= price(i) && left > 0));
    let hint;
    if (!can) hint = mode === 'claude' && claude.fightWaiting ? 'Waiting for Claude to finish its move. The fight starts as soon as it does.' : timeUp ? 'Time’s up. The fight is about to start.' : 'You’re ready. Tap Not ready to make changes.';
    else {
      hint = selected !== null
        ? (canBuy(selected) ? `Tap a tile in your zone${Game.flankOpen(m) ? ' or a flank tile in theirs' : ''} to place ${esc(units[selected].name)}.` : left <= 0 ? 'No deployments left this round.' : `Not enough gold for ${esc(units[selected].name)}.`)
        : (fresh ? 'Drag a squad you placed this round to move it, or tap it to take it back.' : 'Pick a unit, then tap a tile in the bottom six rows.');
      if (left <= 0 && selected === null) hint = `No deployments left. Buy one more for ${Game.CONFIG.extraDeployCost} gold, or spend gold on upgrades.`;
      if (readyN && selected === null) hint = `${readyN} squad${readyN === 1 ? ' is' : 's are'} ready to level up. Tap ${readyN === 1 ? 'it' : 'one'} to upgrade.`;
      if (Game.charOf(m, me) === 'zoe' && selected === null && (m.buff && m.buff[me] || []).length) hint += ` Starred tiles are your buff tiles this round: +${Game.CHAR.zoeDmg}% damage, +${Game.CHAR.zoeHp}% health and +${Game.CHAR.zoeAps}% attack speed for a squad that starts the fight there.`;
      if (m.round === Game.FLANK.round && selected === null && !fresh) hint = `Flank columns are open: you can now also deploy on the blue edge columns on the enemy's half, and they can on the red ones on yours. A squad placed there can't move or attack for the first ${Game.FLANK.delay} s of its first fight; after that it starts like any other.`;
      if (m.round === 1 && selected === null && m.armies[me].some(s => s.free)) hint = 'Your package squads are already on the board. Drag them where you want them, or tap one to take it back.';
      if (moveMode) hint = moving == null ? `Tap one of your squads from an earlier round to move it (${Game.CONFIG.moveCost} gold, once per round).` : `Tap a free tile to move ${esc(units[m.armies[me].find(s => s.id === moving).unit].name)} there, or drag it.`;
      const freeL = Game.freeLeft(m, me);
      if (freeL.length && !placingTower() && selected === null) hint = `Place your free package squads: ${[...new Set(freeL)].map(ui => `${freeL.filter(x => x === ui).length}× ${esc(units[ui].name)}`).join(', ')}. They cost no gold and no deployments.`;
      if (choosingPack()) hint = `Pick your starting package and character. Both units are unlocked for you and you get their squads for free, plus ${m.gold[me]} gold to spend. The character’s ability lasts the whole match. Your opponent picks from their own packages.${(() => { const mp = Game.mapOf(m); return mp ? ` Map: <b>${esc(mp.name)}</b>. ${esc(mp.text)}` : ''; })()}`;
      if (placingTower()) hint = 'Next, place your tower: tap a gold tile on the left or right side of your zone. If it falls in a fight, your army is crippled for a few seconds.';
    }
    const extraBtns = `<span style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn small" id="buy-deploy" ${can && g >= Game.CONFIG.extraDeployCost ? '' : 'disabled'}>+1 deployment · ${Game.CONFIG.extraDeployCost}</button>
        ${can && m.extraDeploys[me] > 0 && left > 0 ? `<button class="btn small" id="refund-deploy">Refund unused</button>` : ''}
        ${Game.movedId(m, me) != null
          ? `<button class="btn small" id="undo-move" ${can ? '' : 'disabled'}>Undo move · +${Game.CONFIG.moveCost}</button>`
          : `<button class="btn small" id="move-btn" aria-pressed="${moveMode}" ${(can && m.armies[me].some(s => s.round < m.round) && (moveMode || g >= Game.CONFIG.moveCost)) ? '' : 'disabled'}>${moveMode ? 'Cancel move' : `Move a squad · ${Game.CONFIG.moveCost}`}</button>`}
      </span>`;
    let action, status;
    if (solo()) {
      status = `${m.armies[me].length} squad${m.armies[me].length === 1 ? '' : 's'} on the board`;
      if (mode === 'claude') status = claudeStatus();
      action = `<button class="btn primary" id="fight" ${m.armies[me].length ? '' : 'disabled'}>${deadline ? 'Fight now' : 'Fight'}</button>`;
    } else {
      const away = mode === 'host' && !net.connected;
      status = away ? 'Opponent is away. The clock is paused.' : ready[foe()] ? 'Opponent is ready.' : 'Opponent is deploying.';
      action = `<button class="btn ${ready[me] ? '' : 'primary'}" id="ready" ${timeUp ? 'disabled' : ''}>${ready[me] ? 'Not ready' : 'Ready'}</button>`;
    }
    $('panel').innerHTML = `
      <div class="bar"><span class="gold num">${g} gold</span><span class="deploys num">${Math.max(0, left)} of ${allowed} deployments left</span><span class="timer" id="timer">${deadline ? fmtClock(deadline - now()) : ''}</span></div>
      <div class="bar"><span class="hint">${hint}</span>${extraBtns}</div>
      ${choosingPack() && can ? '' : (() => {
        const tiers = [...new Set(units.map((u, i) => tierOf(i)))].sort((a, b) => a - b);
        if (!tiers.includes(shopTier)) shopTier = tiers[0];
        return `<div class="tiers" role="tablist" aria-label="Unit tiers, higher is stronger" style="--n:${tiers.length}">${tiers.map(t => {
          const idx = units.map((u, i) => i).filter(i => tierOf(i) === t), open = idx.filter(i => !locked(i)).length, free = idx.some(i => freeN(i) > 0);
          return `<button role="tab" data-tier="${t}" aria-selected="${t === shopTier}" aria-label="Tier ${t}, ${tierName(t)}, ${Game.unitCostOf(units[idx[0]])} gold, ${open} of ${idx.length} unlocked${free ? ', has free squads' : ''}" style="--tier:${tierColor(t)}">Tier ${t}<em>${tierName(t)}</em><small>${Game.unitCostOf(units[idx[0]])}g · ${open}/${idx.length}</small></button>`;
        }).join('')}</div>`;
      })()}
      ${choosingPack() && can ? `<div class="packs" style="display:grid;gap:8px">${m.packages[me].map((p, k) => `
        <button class="btn pack" data-pack="${k}" style="display:grid;gap:4px;text-align:left;padding:10px 12px">
          <span style="display:flex;gap:8px;align-items:center">${p.units.map(ui => `<span style="color:${units[ui].color};display:inline-flex">${Shapes.svg(units[ui].shape, 16)}</span>`).join('')}<b>${packText(p)}</b></span>
          ${p.char ? `<span style="white-space:normal;color:var(--gold)">${charLine(p.char)}</span>` : ''}
          <span class="hint" style="white-space:normal">${p.units.map(ui => ROLES[units[ui].name] && !customSet ? esc(ROLES[units[ui].name]) : '').filter(Boolean).join(' ')}</span>
        </button>`).join('')}</div>` : `<div class="shop" id="shop">${units.map((u, i) => tierOf(i) !== shopTier ? '' : `
        <div class="uwrap" style="--tier:${tierColor(tierOf(i))}">
          <button class="ucard" data-i="${i}" aria-pressed="${selected === i}" aria-disabled="${!canBuy(i) && !(locked(i) && can)}" ${locked(i) ? `data-locked="1" style="border-style:dashed" aria-label="${esc(u.name)}, locked, unlock for ${Game.unlockCost(m, i, me)} gold"` : ''}>
            <span class="t"><span style="color:${u.color};display:inline-flex">${Shapes.svg(u.shape, 13)}</span> ${tag(u)} <span class="tier">T${tierOf(i)}</span></span><span class="n">${esc(u.name)}</span>
            ${roleRow(i)}
            ${locked(i) ? `<span class="lock">${LOCK_SVG} Locked · ${Game.unlockCost(m, i, me)}g</span>` : ''}
            ${freeN(i) ? `<span class="c" style="color:var(--win, #6FD08C)">Free ×${freeN(i)}</span>` : ''}
            <span class="c">${price(i)} · ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'}${Engine.SLOTS.filter(k => Game.hasSkill(m, me, i, k)).length ? ` · ${Engine.SLOTS.filter(k => Game.hasSkill(m, me, i, k)).length}★` : ''}</span>
          </button>
          <button class="info" data-info="${i}" aria-label="About ${esc(u.name)}">i</button>
        </div>`).join('')}</div>`}
      <div class="bar"><span class="hint">${status}</span>${action}</div>`;
    $('panel').querySelectorAll('[data-pack]').forEach(b => b.addEventListener('click', () => {
      if (!editable() || !Game.choosePack(m, me, +b.dataset.pack)) return;
      const f = Game.freeLeft(m, me); if (f.length) shopTier = tierOf(f[0]); // show the tier of the first free squad
      changed();
    }));
    $('panel').querySelectorAll('[data-tier]').forEach(b => b.addEventListener('click', () => { shopTier = +b.dataset.tier; shopScroll = 0; panelDeploy(); }));
    const shop = $('shop') || document.createElement('div');
    shop.scrollLeft = shopScroll;
    shop.addEventListener('scroll', () => { shopScroll = shop.scrollLeft; }, { passive: true });
    shop.querySelectorAll('.ucard').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.locked) { openSheet(+b.dataset.i); return; } // a locked unit opens its sheet, where it can be unlocked
      if (b.getAttribute('aria-disabled') === 'true') return;
      const i = +b.dataset.i;
      selected = selected === i ? null : i;
      panelDeploy(); render();
    }));
    shop.querySelectorAll('[data-info]').forEach(el => el.addEventListener('click', () => openSheet(+el.dataset.info)));
    if ($('fight')) $('fight').addEventListener('click', runFight);
    if ($('ready')) $('ready').addEventListener('click', toggleReady);
    $('buy-deploy').addEventListener('click', () => { if (editable() && Game.buyDeploy(m, me)) changed(); });
    if ($('refund-deploy')) $('refund-deploy').addEventListener('click', () => { if (editable() && Game.refundDeploy(m, me)) changed(); });
    if ($('move-btn')) $('move-btn').addEventListener('click', () => { if (!editable()) return; moveMode = !moveMode; moving = null; if (moveMode) selected = null; changed(); });
    if ($('undo-move')) $('undo-move').addEventListener('click', () => { if (editable() && Game.undoMove(m, me)) changed(); });
    tick();
  }

  // After the player changes their own side
  function changed() {
    panelDeploy(); render();
    if (mode === 'guest') sendSide();
    if (mode === 'host') saveHost();
  }

  function toggleReady() {
    if (phase !== 'deploy' || timeUp) return;
    ready[me] = !ready[me];
    if (ready[me]) { selected = null; closeSheet(); }
    if (mode === 'guest') sendSide();
    if (mode === 'host') { sendStatus(); if (ready[0] && ready[1] && net.connected) { runFight(); return; } }
    panelDeploy(); render();
  }

  function panelBattle() {
    $('panel').innerHTML = `
      <div class="bar">
        <div class="seg" role="group" aria-label="Playback speed">
          ${[1, 2, 4].map(s => `<button data-s="${s}" aria-pressed="${speed === s}">${s}×</button>`).join('')}
        </div>
        <button class="btn small" id="skip">Skip to result</button>
      </div>

  function showResult(sum) {
    const iWon = sum.winner === me && !sum.timeout, iLost = sum.winner === foe() && !sum.timeout;
    const head = sum.timeout ? 'Time ran out' : iWon ? `Round ${sum.round} won` : iLost ? `Round ${sum.round} lost` : 'Draw';
    const cls = iWon ? 'you' : iLost ? 'foe' : '';
    const them = foeName();
    const lines = [];
    if (sum.dmg[foe()]) lines.push(`${them} takes <b class="num">${sum.dmg[foe()]}</b> damage.`);
    if (sum.dmg[me]) lines.push(`You take <b class="num">${sum.dmg[me]}</b> damage.`);
    if (!sum.dmg[0] && !sum.dmg[1]) lines.push('Nobody takes damage.');
    if (sum.towerFell && sum.towerFell[foe()]) lines.push(`You broke ${mode === 'claude' ? 'Claude’s' : 'the enemy’s'} tower.`);
    if (sum.towerFell && sum.towerFell[me]) lines.push('Your tower fell.');
    const lv = (list) => list.map(x => `${esc(units[x.unit].name)} (to level ${x.level + 1})`).join(', ');
    const lvLines = [];
    if (solo() && lastAiLevels.length) lvLines.push(`<p><span style="color:var(--gold)">${them} leveled up before the fight:</span> ${lv(lastAiLevels)}.</p>`);
    if (mode === 'claude' && claude.did.length) lvLines.push(`<p><span style="color:var(--gold)">Claude also:</span> ${esc(claude.did.join(', '))}.</p>`);
    if (mode === 'claude' && claude.say) lvLines.push(`<p class="big" style="color:var(--foe);font-style:italic">“${esc(claude.say)}”</p>`);
    if (mode === 'claude' && claude.note) lvLines.push(`<p>${esc(claude.note)}</p>`);
    if (sum.newlyReady[me].length) lvLines.push(`<p><span style="color:var(--gold)">Ready to level up:</span> ${lv(sum.newlyReady[me])}.</p>`);
    resultShownAt = now();
    if (m.over) {
      const win = m.winner === me, loss = m.winner === foe();
      phase = 'end'; hud(); netStatus();
      const wait = !solo() && rematch[me];
      overlay(`<div class="card">
        <span class="eyebrow">After ${m.history.length} rounds</span>
        <h2 class="${win ? 'you' : loss ? 'foe' : ''}">${win ? 'Victory' : loss ? 'Defeat' : 'Draw'}</h2>
        <p class="big">${lines.join(' ')}</p>
        ${!solo() && rematch[foe()] && !rematch[me] ? '<p>Your opponent wants a rematch.</p>' : ''}
        <div class="btnrow">
          ${solo() ? '<button class="btn primary" id="again">Play again</button>'
            : `<button class="btn primary" id="again" ${wait ? 'disabled' : ''}>${wait ? 'Waiting for opponent…' : 'Rematch'}</button>`}
          <button class="btn" id="menu">Main menu</button>
        </div>
      </div>`);
      if (solo()) panelInfo(mode === 'claude' ? 'Claude plans each round from what it has seen of your army.' : 'The AI buys units that counter what you fielded last round.', 'Play again', mode === 'claude' ? startClaudeMatch : startAiMatch);
      else panelInfo(wait ? 'Waiting for your opponent to accept the rematch.' : 'A rematch starts when you both tap Rematch.', wait ? '' : 'Rematch', askRematch);
      $('again').addEventListener('click', mode === 'claude' ? startClaudeMatch : mode === 'ai' ? startAiMatch : askRematch);
      $('menu').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
      return;
    }
    phase = 'result'; hud(); netStatus();
    const bonus = sum.bonusTo === me ? ` You get ${Game.LOSER_BONUS} extra for losing the round.` : sum.bonusTo === foe() ? ` ${mode === 'claude' ? 'Claude gets' : `The ${them.toLowerCase()} gets`} ${Game.LOSER_BONUS} extra for losing the round.` : '';
    const waiting = !solo() && nextReady[me];
    overlay(`<div class="card">
      <span class="eyebrow">${Math.round(sum.time)} s of fighting</span>
      <h2 class="${cls}">${head}</h2>
      <p class="big">${lines.join(' ')}</p>

      <div class="btnrow">

        <button class="btn" id="menu">Main menu</button>

    </div>`);
    if (waiting) panelInfo('The next round starts when your opponent is ready too.', '', null);
    else panelInfo('Your squads keep their tiles. Add more to counter what you just saw.', 'Next round', tapNext);
    if ($('next')) $('next').addEventListener('click', tapNext);

    $('menu').addEventListener('click', () => {

  // ---------- match reports ----------
  // Inside Claude, every match on this screen is saved to the artifact's own storage (only the owner and editors
  // can read it), so Claude can look back at how matches went when asked.
  let reportDb = null, report = null, reportChain = Promise.resolve();
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') reportDb = await window.claude.use('db'); } catch (e) { reportDb = null; }
    if (reportDb && phase === 'start') showStart();
  })();
  function startReport() {
    report = null;
    if (!reportDb || mode === 'guest') return;
    const t = new Date();
    report = {
      id: 'm' + t.getTime().toString(36), mode, started: t.toISOString(), updated: t.toISOString(),
      units: units.map(u => u.name), customUnits: customSet, timer: mode === 'host' ? DEPLOY_SECONDS : (timerOn ? DEPLOY_SECONDS : 0),
      over: false, winner: null, rounds: [],
    };
  }
  function armyOf(match, side) {
    return match.armies[side].map(q => ({ unit: units[q.unit].name, col: q.col, row: q.row, level: q.level + 1, placed: q.round }));
  }
  const unlocksOf = (match, side) => units.map((u, i) => Game.unlockCost(match, i) > 0 && Game.isUnlocked(match, side, i) ? u.name : null).filter(Boolean);
  function skillsOf(match, side) {
    const out = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.hasSkill(match, side, i, k) && !Game.isInnate(match, i, k)) out.push(`${(u.skillDefs[k] || {}).name} (${u.name})`); }));
    return out;
  }
  function recordRound(pre, sum) {
    if (!report || !reportDb) return;
    const p = withUnits(pre), you = me, them = foe();
    const entry = {
      round: sum.round,
      you: { hpBefore: p.hp[you], gold: p.gold[you], army: armyOf(p, you), skills: skillsOf(p, you), tower: (p.towers && p.towers[you]) || null, unlocked: unlocksOf(p, you), character: Game.charOf(p, you), package: Game.packOf(p, you) ? Game.packOf(p, you).squads.map(ui => units[ui].name) : null },
      them: { hpBefore: p.hp[them], gold: p.gold[them], army: armyOf(p, them), skills: skillsOf(p, them), tower: (p.towers && p.towers[them]) || null, unlocked: unlocksOf(p, them), character: Game.charOf(p, them), package: Game.packOf(p, them) ? Game.packOf(p, them).squads.map(ui => units[ui].name) : null },
      result: { winner: sum.winner === you ? 'you' : sum.winner === them ? 'them' : 'draw', timeout: !!sum.timeout, seconds: Math.round(sum.time), damageToYou: sum.dmg[you], damageToThem: sum.dmg[them], yourTowerFell: !!(sum.towerFell && sum.towerFell[you]), theirTowerFell: !!(sum.towerFell && sum.towerFell[them]) },
    };
    if (mode === 'claude') entry.claude = { said: claude.say || null, alsoDid: claude.did.slice(), leveledUp: lastAiLevels.map(x => `${units[x.unit].name} to level ${x.level + 1}`), botPlayed: !!claude.bot, note: claude.note || null };
    report.rounds.push(entry);
    report.updated = new Date().toISOString();
    if (m && m.over) { report.over = true; report.winner = m.winner === you ? 'you' : m.winner === them ? 'them' : 'draw'; report.hpLeft = { you: m.hp[you], them: m.hp[them] }; }
    const body = JSON.parse(JSON.stringify(report)), ref = reportDb.doc('matches/' + report.id);
    reportChain = reportChain.then(() => ref.set(body)).catch((e) => console.warn('match report not saved', e && e.code));
  }

  // ---------- flow: vs Claude ----------
  // Only inside Claude: the page asks Claude (on the player's own account) for its move each round.
  let sampleFn = null;
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
    if (sampleFn && phase === 'start') showStart();
  })();
  const claude = { busy: false, fightWaiting: false, bot: false, off: false, did: [], say: '', note: '', started: 0, ctl: null, history: [] };

  function startClaudeMatch() {
    if (!sampleFn) { startAiMatch(); return; }
    leaveNet();
    mode = 'claude'; me = 0;
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0);
    nextReady = [false, false]; rematch = [false, false];
    claude.off = false; claude.history = [];
    startReport();
    beginAiRound();
  }

  function claudeStatus() {
    if (claude.busy) return `Claude is planning its move… ${Math.max(0, Math.round((now() - claude.started) / 1000))} s`;
    if (claude.bot) return claude.off ? 'The bot is playing for Claude.' : 'Claude had trouble this round, so the bot played it.';
    return 'Claude has made its move.';
  }
  setInterval(() => { if (mode === 'claude' && phase === 'deploy' && claude.busy) { const h = $('panel').querySelector('.bar:last-child .hint'); if (h) h.textContent = claudeStatus(); } }, 1000);

  function startClaudeTurn() {
    claude.did = []; claude.say = ''; claude.note = ''; claude.fightWaiting = false; claude.bot = false;
    if (claude.off) { Game.aiDeploy(m, 1); claude.bot = true; return; }
    const round = m.round, prompt = claudePrompt();
    claude.busy = true; claude.started = now();
    if (claude.ctl) claude.ctl.abort();
    const ctl = claude.ctl = new AbortController();
    const opts = { modelTier: 'complex', cache: false, signal: ctl.signal };
    const once = () => typeof sampleFn.json === 'function'
      ? sampleFn.json(prompt, opts)
      : sampleFn(prompt, opts).then(r => { const t = r.text, a = t.indexOf('{'), b = t.lastIndexOf('}'); return JSON.parse(t.slice(a, b + 1)); });
    const fatal = (e) => e && ['cancelled', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired', 'rate_limited'].includes(e.code);
    // one retry on a hiccup before the bot steps in
    const ask = once().catch(e => (fatal(e) || ctl !== claude.ctl || m.round !== round) ? Promise.reject(e) : once());
    ask.then((mv) => {
      if (ctl !== claude.ctl || mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      applyClaudeMove(mv && typeof mv === 'object' ? mv : {});
    }, (e) => {
      if (ctl !== claude.ctl || (e && e.code === 'cancelled')) return;
      if (mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].includes(code)) {
        claude.off = true;
        claude.note = code === 'not_granted' ? 'Claude wasn’t allowed to play, so the bot is playing for it this match.' : 'Claude isn’t available here, so the bot is playing for it this match.';
      } else claude.note = code === 'rate_limited' ? 'Claude hit a usage limit this round, so the bot played it.' : 'Claude had trouble this round, so the bot played it.';
      Game.aiDeploy(m, 1); claude.bot = true;
    }).finally(() => {
      if (ctl !== claude.ctl) return;
      claude.busy = false;
      if (mode === 'claude' && phase === 'deploy') {
        if (claude.fightWaiting) { claude.fightWaiting = false; runFight(); }
        else panelDeploy();
      }
    });
  }

  // Everything Claude needs to know, from its own (red) side of the board
  function claudePrompt() {
    const n1 = (x, d = 1) => Math.round(x * 10 ** d) / 10 ** d;
    const unitLine = (u, i) => {
      const t = [];
      if (u.splash > 0) t.push(`splash ${u.splash} m`);
      if (u.defense === 'armor') t.push(`armor ${u.defVal}`);
      if (u.defense === 'ward') t.push(`ward ${u.defVal} (max damage per hit)`);
      if (u.burst > 1) t.push(`burst ${u.burst}`);
      if (u.flame > 0) t.push(`flamethrower: every attack hits all enemies in range within ${u.flame}° to each side of its target`);
      else if (u.pellets > 1) t.push(`shotgun ${u.pellets}`);
      if (u.spinUp > 0) t.push(`spin-up ${u.spinUp}%/s on one target, up to 3x attack speed, starts over when it switches target`);
      if (u.spinHit > 0) t.push(`damage spin-up ${u.spinHit}%/s on one target, up to 3x hit size, starts over when it switches target`);
      if (u.pierce > 0) t.push(`pierce ${u.pierce}`);
      if (u.projSpeed > 0) t.push(`projectile ${u.projSpeed} m/s`);
      if (u.minRange > 0) t.push(`min range ${u.minRange} m`);
      if (u.charge > 1) t.push(`charge x${u.charge}`);
      if (u.knockback > 0) t.push(`knockback ${u.knockback} m`);
      if (u.trample > 0) t.push(`tramples ${u.trample}%`);
      if (u.deathBlast > 0) t.push(`explodes on death for ${u.deathBlast}% of max health within ${Engine.BLAST_RADIUS} m`);
      if (u.windUp > 0) t.push(`wind-up ${u.windUp} s`);
      const sk = (u.skillDefs || []).map((d, k) => d ? `skill ${k + 1} "${d.name}" (${Game.isInnate(m, i, k) ? 'BUILT IN: always on for both players, free' : `${Game.skillCost(m, i, k)} gold${Game.hasSkill(m, 1, i, k) ? ', YOU OWN IT' : ''}`}): ${Engine.describeSkill(d)}` : null).filter(Boolean);
      const lock = Game.isUnlocked(m, 1, i) ? (Game.unlockCost(m, i, 1) ? ' [unlocked]' : '') : ` [LOCKED: unlock once for ${Game.unlockCost(m, i, 1)} gold before you can place it]`;
      return `- ${u.name}${lock}: price ${Game.unitCostOf(u)}, ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'} x ${n1(u.hp, 0)} hp each, hit ${n1(u.hit)} x ${n1(u.aps, 2)}/s, range ${u.range} m, speed ${u.speed} m/s${t.length ? ', ' + t.join(', ') : ''}. Level-up cost ${Game.levelCost(u)}.${sk.length ? '\n    ' + sk.join('\n    ') : ''}`;
    };
    const tag = (u) => u.name;
    const matrix = units.map((u, i) => `${tag(u)}: ` + units.map((v, j) => i === j ? null : `${tag(v)} ${M[i][j] > 0 ? '+' : ''}${Math.round(M[i][j] * 100)}`).filter(Boolean).join(', ')).join('\n');
    const mine = m.armies[1].map(s => {
      const u = units[s.unit], need = s.level < Engine.MAX_LEVEL ? Math.round(Game.xpNeeded(u, s.level)) : null;
      return `- id ${s.id}: ${u.name} at col ${s.col}, row ${s.row}, level ${s.level + 1}${need ? `, XP ${Math.round(s.xp)}/${need}` : ', max level'}${Game.isReady(m, s) ? ', READY TO LEVEL UP' : ''}${s.round < m.round ? `, sells for ${Game.sellValue(m, s)}` : ''}`;
    });
    const theirs = m.armies[0].filter(s => s.round < m.round).map(s => { const p = Game.seenAt(m, s); return `- ${units[s.unit].name} at col ${p.col}, row ${p.row}, level ${s.level + 1}`; });
    const theirSkills = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.skillVisible(m, 0, i, k)) theirSkills.push(`${(u.skillDefs[k] || {}).name} on ${u.name}`); }));
    const hist = m.history.slice(-4).map(h => `- round ${h.round}: ${h.timeout ? 'time ran out' : h.winner === 1 ? 'you won' : h.winner === 0 ? 'you lost' : 'draw'}; you took ${h.dmg[1]} damage, they took ${h.dmg[0]}`);
    // how each unit type did in the last fight
    const last = m.history[m.history.length - 1];
    const howDid = (side) => {
      if (!last || !last.squads) return [];
      const by = {};
      for (const q of last.squads[side]) { const b = by[q.unit] || (by[q.unit] = { n: 0, left: 0, dealt: 0 }); b.n++; b.left += q.left; b.dealt += q.dealt; }
      return Object.keys(by).sort((a, b) => by[b].dealt - by[a].dealt).map(ui => { const b = by[ui]; return `  ${units[ui].name} x${b.n}: dealt ${b.dealt} damage, ${Math.round(b.left / b.n * 100)}% of bodies survived`; });
    };
    const lastFight = last && last.squads ? `LAST FIGHT (round ${last.round}, ${last.winner === 1 ? 'you won' : last.winner === 0 ? 'you lost' : 'draw'} in ${Math.round(last.time)} s)${last.towerFell ? (last.towerFell[1] ? '. YOUR TOWER FELL' : '') + (last.towerFell[0] ? '. THEIR TOWER FELL' : '') : ''}
Your units:
${howDid(1).join('\n') || '  none'}
Their units:
${howDid(0).join('\n') || '  none'}
` : '';
    // their army by unit type, weighted by what it's worth (price x level), and which units beat it
    const foeArmy = m.armies[0].filter(s => s.round < m.round);
    const foeW = {}; let foeTotal = 0;
    for (const s of foeArmy) { const w = Game.unitCostOf(units[s.unit]) * (s.level + 1); foeW[s.unit] = (foeW[s.unit] || 0) + w; foeTotal += w; }
    const answers = foeTotal ? units.map((u, i) => [i, Object.keys(foeW).reduce((a, j) => a + (+j === i ? 0 : M[i][j] * foeW[j]), 0) / foeTotal]).sort((a, b) => b[1] - a[1]) : [];
    const pct = (x) => `${x > 0 ? '+' : ''}${Math.round(x * 100)}`;
    const foeMix = Object.keys(foeW).sort((a, b) => foeW[b] - foeW[a]).map(j => `${units[j].name} ${Math.round(foeW[j] / foeTotal * 100)}%`).join(', ');
    const counterLines = answers.length ? `THEIR ARMY by value: ${foeMix}
Your units ranked against their whole army (counter table weighted by their army value):
${answers.slice(0, 5).map(([i, v]) => `  ${units[i].name} ${pct(v)}`).join('\n')}
Worst choices against it: ${answers.slice(-3).reverse().map(([i, v]) => `${units[i].name} ${pct(v)}`).join(', ')}
` : '';
    const placeNow = Game.deploysAllowed(m, 1);
    const cheapest = Math.min(...units.map(u => Game.unitCostOf(u)));
    return `You are playing Phone Bellum, a small auto-battler, against a human player. You are the RED side. Decide your moves for round ${m.round}. The human places their new squads at the same time and can't see yours until the fight. You only see their squads from earlier rounds. Play to win: build counters to what they have, protect your damage dealers, and think about what they are likely to add next.

RULES
- Board: columns 0-${Game.COLS - 1}, rows 0-${Game.ROWS - 1}, tiles ${Game.TILE} m wide. Your zone is rows 0-${Game.ZONE - 1}; row ${Game.ZONE - 1} is your front line, nearest the enemy, and row 0 is the back. Rows ${Game.ZONE}-${Game.ROWS - Game.ZONE - 1} are no man's land. From round ${Game.FLANK.round} each player may also deploy on flank tiles: columns ${Game.FLANK.cols.join(' and ')}, on the OPPONENT's half of the board: their whole zone plus their half of no man's land (yours: rows ${Math.min(...Game.flankRows(1))}-${Math.max(...Game.flankRows(1))}; theirs: rows ${Math.min(...Game.flankRows(0))}-${Math.max(...Game.flankRows(0))})${Game.flankOpen(m) ? ', OPEN NOW' : ''}. You can't use a tile the opponent already holds with a squad or their tower. Their flank columns on YOUR half (columns ${Game.FLANK.cols.join(' and ')}, rows ${Math.min(...Game.flankRows(0))}-${Math.max(...Game.flankRows(0))}) are reserved for them for the whole match: you can never place a squad or your tower there. Squads there start inside the enemy's lines, good for hitting their tower or backline from the side, so guard your own edges against theirs. A squad placed on a flank can't move or attack for the first ${Game.FLANK.delay} s of the first fight after it was placed; from the next round on it starts normally. The enemy zone is rows ${Game.ROWS - Game.ZONE}-${Game.ROWS - 1}; row ${Game.ROWS - Game.ZONE} is their front. One squad per tile. Squads keep their tile, except: once per round you may move ONE of your squads from an earlier round to another free tile you could place on, for ${Game.CONFIG.moveCost} gold ("move"). The opponent sees it on its old tile until the fight.
- The fight is automatic. Every body marches straight ahead in its own column until an enemy comes within its range + ${Game.SETTINGS.sight} m, then turns toward the nearest enemy and attacks once in range. Once no enemy is ahead of it, it turns toward the nearest one. So columns are lanes: a squad fights what stands in its lane, a squad in an empty lane walks past and hits the enemy from the side or behind, and long-range units in the back only get attacked once the front is gone. Short-range units in front shield long-range units behind. Spreading out limits splash damage.
- The round's loser loses health: for each surviving enemy squad, 2 x (its price / 100), scaled by the share of its bodies alive. If time runs out, both sides take damage. A round costs the loser at most ${Game.MAX_ROUND_DMG} health. Health starts at ${Game.START_HP} and the match ends at 0.
- Gold: both players get ${Game.incomeFor(2)} going into round 2, and ${Game.CONFIG.incomeStep} more every round after that (next round: +${Game.incomeFor(m.round + 1)}). The round's loser gets +${Game.LOSER_BONUS} extra. Unspent gold carries over.

- Squads earn XP by dealing and taking damage. A squad marked READY TO LEVEL UP can be upgraded for its unit's level-up cost: level 2 doubles health and hit, level 3 triples them. Leveling up chaff (many cheap bodies) gives the enemy lots of XP when they die.
${Game.needsPack(m, 1) ? `- STARTING PACKAGE (round 1, choose first): add "package": N to your reply. Each one unlocks its two units for free and gives you its squads for free (no gold, no deployment); you place them with "place" like any squad, and any you leave out are placed for you. Your options:
${m.packages[1].map((p, k) => `  ${k}: ${p.squads.map(ui => units[ui].name).join(' + ')}${p.char ? ` with character ${Game.charInfo(p.char).name} (${Game.charInfo(p.char).ability})` : ''} (counter-table average of its units: ${p.units.map(ui => `${units[ui].name} ${Math.round(M[ui].reduce((a, b) => a + b, 0) / Math.max(1, units.length - 1) * 100)}`).join(', ')})`).join('\n')}
` : Game.freeLeft(m, 1).length ? `- FREE package squads still to place (no gold, no deployment): ${Game.freeLeft(m, 1).map(ui => units[ui].name).join(', ')}.
` : ''}- Unlocks: units marked LOCKED must be unlocked once (their unlock price, on top of the squad price) before you can place them; it lasts the whole match. List them under "unlock", or just place them and they're unlocked automatically if you can afford it.${(() => { const t = units.map((u, i) => Game.unlockCost(m, i) > 0 && Game.unlockVisible(m, 0, i) ? u.name : null).filter(Boolean); return t.length ? ' The opponent has unlocked: ' + t.join(', ') + '.' : ''; })()}
- Skills: each unit has 2. Buying one (its price) gives it to ALL your squads of that unit, now and later. You need at least one squad of that unit on the board (placing one this round counts).
- You may sell squads from earlier rounds for half their price (their tile becomes free).

UNITS
${units.map(unitLine).join('\n')}

COUNTER TABLE (each unit vs each other with equal gold; +100 = wins easily, -100 = loses badly)
${matrix}

STATE
- Your health ${m.hp[1]}, their health ${m.hp[0]}. Your gold: ${m.gold[1]}. Their gold to spend this round: ${m.gold[0]}.
${hist.length ? 'Recent rounds:\n' + hist.join('\n') : '- This is the first round.'}

${lastFight}${counterLines}
HOW TO PLAY WELL
- Spend your gold. Gold you keep does nothing in this fight, and the human spends theirs every round. Aim to end the round with less than ${cheapest} gold left: place your ${placeNow} squad(s), level up squads that are ready (a level-up doubles a squad for half its price, the best deal in the game), buy skills for units you have several of, and buy extra deployments (${Game.CONFIG.extraDeployCost} gold each, up to 3) to place more squads when you still have gold.
- Learn from the last fight: stop adding units that died without doing damage, and add more of what worked. Counter what they have most of, using the ranking above, but keep a mix so one counter pick from them can't wipe you.
- Their squads stay where they are, so build where their army will walk into yours. Put tough, short-range units in front of your damage dealers.

YOUR SQUADS
${mine.length ? mine.join('\n') : '- none yet'}

THEIR SQUADS (from earlier rounds)
${theirs.length ? theirs.join('\n') : '- none yet'}
${theirSkills.length ? 'Their skills: ' + theirSkills.join(', ') : ''}

TOWERS
- Each player has one tower (${Game.TOWER.hp} hp, hit ${Game.TOWER.hit} x ${Game.TOWER.aps}/s, range ${Game.TOWER.range} m). It never moves, is rebuilt every round and doesn't count for winning a round. If a tower falls during a fight, its owner's whole army deals ${Engine.TOWER_DOWN.attack}% less damage, moves ${Engine.TOWER_DOWN.move}% slower and takes ${Engine.TOWER_DOWN.taken}% more damage for ${Engine.TOWER_DOWN.secs} s. Sending a squad down an empty lane to break their tower can turn a fight; guard the lane to yours.
- Your tower: col ${m.towers[1].col}, row ${m.towers[1].row} (fixed; squads can't share its tile).
- Their tower: col ${m.towers[0].col}, row ${m.towers[0].row}.

MAP
${(() => { const mp = Game.mapOf(m), e = Game.elfSpot(m); return mp ? `- ${mp.name}: ${mp.text}${e ? ` The elf tower stands in column ${e.col}, on the line between rows ${Game.ROWS / 2 - 1} and ${Game.ROWS / 2}; it hits for ${Game.ELF_TOWER.hit}, ${Game.ELF_TOWER.aps} times a second, range ${Game.ELF_TOWER.range} m, and can't be attacked. Bribing the elves costs ${Game.BRIBE_COST} gold once per match ("bribe": true): from then on it never shoots your units and instead heals your wounded units near it for ${Game.ELF_TOWER.healHit} (x${mp.healMul || 1} on this map, ${Game.ELF_TOWER.healSplash} m splash) every ${Math.round(10 / Game.ELF_TOWER.healAps) / 10} s. You ${Game.bribed(m, 1) ? 'have' : "haven't"} bribed; they ${Game.bribeVisible(m, 0) ? 'have' : "haven't, as far as you know"}.` : ''}${mp.shrooms ? ` Mushroom tiles: ${(m.map.tiles || []).map(x => `${x.type} at col ${x.col}, row ${x.row}`).join('; ')}.` : ''}` : '- No special map.'; })()}

CHARACTERS (each package comes with one; its ability lasts the whole match)
- Yours: ${Game.charOf(m, 1) ? `${Game.charInfo(Game.charOf(m, 1)).name}: ${Game.charInfo(Game.charOf(m, 1)).ability}` : 'the one that comes with the package you pick'}${Game.charOf(m, 1) === 'zoe' ? ` Your buff tiles this round: ${(m.buff[1] || []).map(t => `col ${t.col}, row ${t.row}`).join('; ')}. A squad that starts the fight on one keeps the bonus all fight, even after it moves.` : ''}
- Theirs: ${m.round > 1 && Game.charOf(m, 0) ? `${Game.charInfo(Game.charOf(m, 0)).name}: ${Game.charInfo(Game.charOf(m, 0)).ability}` : 'hidden until the first fight'}

Reply with only a JSON object in this shape:
{${Game.needsPack(m, 1) ? '"package":0,' : ''}"unlock":["unit name"],"sell":[squad ids],"levelUp":[squad ids, list one twice to level it twice],"skills":[{"unit":"unit name","slot":1}],"extraDeployments":0,${Game.elfSpot(m) ? '"bribe":false,' : ''}"move":{"id":squad id,"col":5,"row":3} or null,"place":[{"unit":"unit name","col":5,"row":3}],"say":"one short playful line to your opponent, at most 15 words, shown after the fight"}
For "say": make it about what is happening in this match, and never repeat a line.${claude.history.length ? ' Lines you already used:\n' + claude.history.slice(-6).map(x => '- ' + x).join('\n') : ''}
Actions run in this order: package (round 1 only), sell, levelUp, unlock, skills, ${Game.elfSpot(m) ? 'bribe, ' : ''}extraDeployments, move, place. Anything you can't afford or that breaks a rule is skipped, so keep the total cost within your gold (${m.gold[1]} plus any sales). Use exact unit names. Unspent gold isn't lost, but squads on the board win rounds.`;
  }

  function applyClaudeMove(mv) {
    const list = (x) => Array.isArray(x) ? x.slice(0, 20) : [];
    const int = (x) => Math.round(Number(x));
    const unitIdx = (name) => units.findIndex(u => u.name.toLowerCase() === String(name || '').toLowerCase().trim());
    const did = [];
    if (Game.needsPack(m, 1)) {
      if (!Game.choosePack(m, 1, int(mv.package))) Game.choosePack(m, 1, 0);
      m.armies[1] = m.armies[1].filter(s => !s.free); // Claude places its package squads itself; any it leaves out are placed at the fight
    }
    if (Game.needsTower(m, 1)) { // the tower goes down first; a bad spot falls back to the default corner
      const tw = mv.tower && typeof mv.tower === 'object' ? mv.tower : null;
      if (!(tw && Game.placeTower(m, 1, int(tw.col), int(tw.row)))) Game.ensureTower(m, 1);
    }
    for (const id of list(mv.sell)) {
      const sq = m.armies[1].find(s => s.id === int(id));
      if (sq && Game.sell(m, 1, sq.id)) did.push(`sold ${units[sq.unit].name}`);
    }
    const levels = [];
    for (const id of list(mv.levelUp)) {
      const sq = m.armies[1].find(s => s.id === int(id));
      if (sq && Game.levelUp(m, 1, sq.id)) levels.push({ id: sq.id, unit: sq.unit, level: sq.level });
    }
    const skills = list(mv.skills);
    const trySkills = () => {
      for (const x of skills) {
        if (!x || x.done) continue;
        const ui = unitIdx(x.unit), k = int(x.slot) - 1;
        if (ui >= 0 && k >= 0 && k < Engine.SKILL_SLOTS && Game.buySkill(m, 1, ui, k)) { x.done = true; did.push(`bought ${units[ui].skillDefs[k].name} for ${units[ui].name}`); }
      }
    };
    for (const name of list(mv.unlock)) { const ui = unitIdx(name); if (ui >= 0 && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`); }
    trySkills();
    if (mv.bribe === true && Game.bribe(m, 1)) did.push('bribed the elves');
    const extra = Math.max(0, Math.min(3, int(mv.extraDeployments) || 0));
    for (let k = 0; k < extra; k++) Game.buyDeploy(m, 1);
    if (mv.move && typeof mv.move === 'object') {
      const sq = m.armies[1].find(s => s.id === int(mv.move.id) && s.round < m.round);
      if (sq && Game.moveSquad(m, 1, sq.id, int(mv.move.col), int(mv.move.row))) did.push(`moved ${units[sq.unit].name}`);
    }
    for (const pl of list(mv.place)) {
      const ui = unitIdx(pl && pl.unit);
      if (ui >= 0 && !Game.isUnlocked(m, 1, ui) && m.gold[1] >= Game.unlockCost(m, ui, 1) + Game.unitCostOf(units[ui]) && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`);
      if (ui >= 0) Game.place(m, 1, ui, int(pl.col), int(pl.row));
    }
    trySkills(); // skills for units placed just now
    while (m.extraDeploys[1] > 0 && Game.deploysLeft(m, 1) > 0 && Game.refundDeploy(m, 1)) {}
    lastAiLevels = levels;
    claude.did = did;
    claude.say = String(mv.say || '').replace(/\s+/g, ' ').trim().slice(0, 140);
    if (claude.say) claude.history.push(claude.say);
  }

  // ---------- flow: vs AI ----------
  function startAiMatch() {
    leaveNet();
    mode = 'ai'; me = 0;
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0);
    nextReady = [false, false]; rematch = [false, false];
    startReport();
    beginAiRound();
  }

  function beginAiRound() {
    if (mode === 'claude') { startClaudeTurn(); enterDeploy(timerOn ? deployMs() : 0); return; }
    Game.aiDeploy(m, 1);       // the AI commits first; its new squads stay hidden until the fight
    enterDeploy(timerOn ? deployMs() : 0);
  }

  function enterDeploy(ms) {
    phase = 'deploy'; bt = null; battlePre = null; fx = []; selected = null; timeUp = false; resultShownAt = 0;
    ready = [false, false];
    deadline = ms > 0 ? now() + ms : 0;
    $('clock').textContent = '';
    closeSheet(); overlay(null); hud(); netStatus(); panelDeploy(); size(); render();
  }

  function tapNext() {
    if (phase !== 'result') return;
    if (solo()) { beginAiRound(); return; }
    nextReady[me] = true;
    if (mode === 'guest') send({ t: 'next', round: lastSummary && lastSummary.round });
    else { sendStatus(); saveHost(); if (!checkNext()) showResult(lastSummary); return; }
    showResult(lastSummary);
  }

  function askRematch() {
    if (phase !== 'end' || solo()) return;
    rematch[me] = true;
    if (mode === 'guest') send({ t: 'rematch' });
    else { sendStatus(); if (checkRematch()) return; }
    showResult(lastSummary);
  }

  // ---------- the fight (vs AI and host) ----------
  const snapshot = (match) => JSON.parse(JSON.stringify({ ...match, units: null, matrix: null }));
  const withUnits = (s) => ({ ...s, units, matrix: M });

  function runFight() {
    if (phase !== 'deploy' || !m) return;
    if (mode === 'guest') return;
    if (mode === 'claude' && claude.busy) { if (!claude.fightWaiting) { claude.fightWaiting = true; selected = null; closeSheet(); panelDeploy(); } return; }
    closeSheet(); selected = null;
    if (mode === 'ai' || (mode === 'claude' && claude.bot)) lastAiLevels = Game.aiLevel(m, 1); // the AI spends its level-ups now
    else if (mode !== 'claude') lastAiLevels = [];
    Game.ensureTower(m, 0); Game.ensureTower(m, 1);
    Game.ensurePack(m, 0); Game.ensurePack(m, 1);
    const pre = snapshot(m);
    // work out the result first; both screens then play the same battle back
    const sim = Game.startBattle(m);
    while (sim.step()) {}
    const summary = Game.resolve(m, sim.result());
    recordRound(pre, summary);
    lastSummary = summary; nextReady = [false, false]; rematch = [false, false];
    if (mode === 'host') { send({ t: 'fight', pre, post: snapshot(m), summary }); saveHost(); }
    playBattle(pre);
  }

  function playBattle(pre) {
    phase = 'battle'; selected = null; deadline = 0; timeUp = false;
    battlePre = withUnits(pre);
    bt = Game.startBattle(battlePre);
    fx = []; acc = 0; lastTs = 0;
    closeSheet(); overlay(null); hud(); panelBattle(); render();
    cancelAnimationFrame(raf);
    if (reduced) { while (bt.step()) {} finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function absorb() {
    for (const s of bt.lastShots()) if (s[8] > 0) fx.push({ kind: 'flame', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], half: s[8], age: 0, life: 0.3 });
    else fx.push({ kind: s[7] === 1 ? 'heal' : 'shot', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], splash: s[5], charged: s[6], spin: s[9] || 1, age: 0, life: s[7] === 1 ? 0.35 : 0.18 });
    for (const b of bt.bodies) if (!b.alive && !b._gone) { b._gone = true; fx.push({ kind: 'death', x: b.x, y: b.y, r: radius(b.u), side: b.side, age: 0, life: 0.5 }); }
  }

  function loop(ts) {
    if (phase !== 'battle') return;
    const dtReal = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
    const boost = bt.time() > 20 ? 2 : 1;
    acc += dtReal * speed * boost;
    while (acc >= Game.SETTINGS.dt) {
      acc -= Game.SETTINGS.dt;
      if (!bt.step()) break;
      absorb();
    }
    for (const e of fx) e.age += dtReal * speed * boost;
    fx = fx.filter(e => e.age < e.life);
    $('clock').textContent = `${bt.time().toFixed(1)} s${boost > 1 ? ' · speeding up' : ''}`;
    render();
    if (bt.isOver()) { finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function finishBattle() {
    if (phase !== 'battle') return;
    cancelAnimationFrame(raf);
    fx = [];
    const res = bt.result();
    $('clock').textContent = `${res.time.toFixed(1)} s`;
    if (lastSummary && (res.winner !== lastSummary.winner || Math.abs(res.time - lastSummary.time) > 1e-6)) {
      console.warn('Phone Bellum: this screen’s replay differs from the host’s result; the host’s result counts.');
    }
    battlePre = null;
    render();
    showResult(lastSummary);
  }

  // ---------- board input ----------
  function tileAt(ev) {
    const r = cv.getBoundingClientRect();
    const c = Math.floor((ev.clientX - r.left) / r.width * Game.COLS);
    const rw = Math.floor((ev.clientY - r.top) / r.height * Game.ROWS);
    if (c < 0 || rw < 0 || c >= Game.COLS || rw >= Game.ROWS) return null;
    return { col: scol(c), row: srow(rw) }; // screen -> model (the flip is its own inverse)
  }
  // drag one of your squads: this round's squads move for free; an older one only with the Move ability
  cv.addEventListener('pointerdown', (ev) => {
    if (phase !== 'deploy' || !m || !editable() || choosingPack() || placingTower()) return;
    const t = tileAt(ev); if (!t) return;
    const sq = m.armies[me].find(s => s.col === t.col && s.row === t.row);
    if (!sq) return;
    if (sq.round < m.round && !(moveMode || Game.movedId(m, me) === sq.id)) return;
    if (!Game.canMove(m, me, sq)) return;
    drag = { id: sq.id, from: t, over: t, moved: false };
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  cv.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved || (d.over.col === d.from.col && d.over.row === d.from.row)) { render(); return; }
    dragEndAt = performance.now(); // the click that follows a drag is not a tap
    if (Game.moveSquad(m, me, d.id, d.over.col, d.over.row) && m.armies[me].find(s => s.id === d.id).round < m.round) { moveMode = false; moving = null; }
    changed();
  });
  cv.addEventListener('pointercancel', () => { if (drag) { drag = null; render(); } });
  cv.addEventListener('pointermove', (ev) => {
    if (drag) {
      const t = tileAt(ev);
      if (t && (t.col !== drag.over.col || t.row !== drag.over.row)) { drag.over = t; drag.moved = true; render(); }
      return;
    }
    if (phase !== 'deploy' || ev.pointerType !== 'mouse') return;
    hoverTile = tileAt(ev); render();
  });
  cv.addEventListener('pointerleave', () => { hoverTile = null; if (phase === 'deploy') render(); });
  cv.addEventListener('click', (ev) => {
    if (phase !== 'deploy') return;
    const t = tileAt(ev); if (!t) return;
    if (choosingPack()) return; // the package comes first
    if (performance.now() - dragEndAt < 400) return;
    if (placingTower()) { if (editable() && Game.placeTower(m, me, t.col, t.row)) changed(); return; }
    if (moveMode && editable()) { // Move ability: pick an older squad, then a free tile
      const own = m.armies[me].find(s => s.col === t.col && s.row === t.row);
      if (own && own.round < m.round) { moving = moving === own.id ? null : own.id; changed(); return; }
      if (!own && moving != null && Game.moveSquad(m, me, moving, t.col, t.row)) { moveMode = false; moving = null; changed(); }
      return;
    }
    if (Game.towerAt(m, me, t.col, t.row)) {
      openTowerSheet(me);
      return;
    }
    if (towerVisible(foe()) && Game.towerAt(m, foe(), t.col, t.row)) { openTowerSheet(foe()); return; }

    const g = { ...MATRIX_SETTINGS, budget: Engine.fairBudget(us.map(u => u.cost), MATRIX_SETTINGS.budget) };
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const r = Engine.battle(us[i], us[j], g);

      yield [++done, total];
