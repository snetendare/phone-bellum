      else if (ch > 0) { ctx.fillStyle = CHARM_COL; ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y) - r * 1.1, Math.max(1.5, r * 0.25), 0, Math.PI * 2); ctx.fill(); }
      if (b.convert) { // won over by a Gentleman: a pink ring
        ctx.strokeStyle = CHARM_COL; ctx.lineWidth = 1.5; ctx.setLineDash([2, 2]);
        ctx.beginPath(); ctx.arc(PX(b.x), PY(b.y), r + 3, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
      if (b.level > 0) {
        ctx.strokeStyle = gold; ctx.lineWidth = Math.min(2.5, 0.8 + b.level * 0.5);
        Shapes.outline(ctx, b.u.shape, PX(b.x), PY(b.y), r + 3.5, upOf(b.side));
      }
      if (b.shroom) { // purple mushroom buff: faint purple spores drifting up, looping
        ctx.fillStyle = SHROOM_COL.purple;
        for (let k = 0; k < 2; k++) {
          const s0 = (b.squad * 0.29 + b.x * 0.11 + k * 0.5) % 1, p = (bt.time() * 0.6 + s0) % 1;
          ctx.globalAlpha = 0.5 * Math.sin(p * Math.PI);
          ctx.beginPath(); ctx.arc(PX(b.x) + (k ? 1 : -1) * r * (0.3 + 0.3 * Math.sin((p + s0) * 6)), PY(b.y) - r * (0.4 + 1.6 * p), Math.max(1.2, r * 0.16), 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (b.fast) { // yellow mushroom: a short speed streak behind the body
        ctx.strokeStyle = SHROOM_COL.yellow; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.2;
        const hx = (b.hx || 0) * flip(), hy = -(b.hy || 0) * flip();
        for (const o of [-0.4, 0.4]) { ctx.beginPath(); ctx.moveTo(PX(b.x) - hx * r * 1.2 + hy * r * o, PY(b.y) - hy * r * 1.2 - hx * r * o); ctx.lineTo(PX(b.x) - hx * r * 2.2 + hy * r * o, PY(b.y) - hy * r * 2.2 - hx * r * o); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
      if (b.zoe) { // Zoe buff: two faint stars drifting up from the body, looping
        ctx.fillStyle = gold; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = `${Math.max(7, Math.round(r * 0.7))}px sans-serif`;
        for (let k = 0; k < 2; k++) {
          const s = (b.squad * 0.37 + b.x * 0.13 + k * 0.5) % 1, p = (bt.time() * 0.7 + s) % 1;
          ctx.globalAlpha = 0.55 * Math.sin(p * Math.PI);
          ctx.fillText('★', PX(b.x) + (k ? 1 : -1) * r * (0.35 + 0.25 * Math.sin((p + s) * 6)), PY(b.y) - r * (0.4 + 1.8 * p));
        }
        ctx.globalAlpha = 1;
      }
    }
    for (const b of bt.bodies) if (b.alive && b.u.aloft) drawAirship(b, tilePx()); // airships fly over everything
    for (const e of fx) {
      const a = 1 - e.age / e.life;
      if (e.kind === 'heal') {
        ctx.strokeStyle = '#6FD08C'; ctx.globalAlpha = 0.8 * a; ctx.lineWidth = 1.5; ctx.setLineDash([2, 3]);
        ctx.beginPath(); ctx.moveTo(PX(e.x1), PY(e.y1)); ctx.lineTo(PX(e.x2), PY(e.y2)); ctx.stroke(); ctx.setLineDash([]);
        if (e.splash > 0) { ctx.globalAlpha = 0.5 * a; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(PX(e.x2), PY(e.y2), e.splash * S, 0, Math.PI * 2); ctx.stroke(); } // the elves' splash heal
      }
      if (e.kind === 'bolt') { // lightning: a jagged white-blue line with a glow in the team colour
        const x1 = PX(e.x1), y1 = PY(e.y1), x2 = PX(e.x2), y2 = PY(e.y2), dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, n = Math.max(3, Math.round(L / 8));
        const pts = [[x1, y1]];
        for (let k = 1; k < n; k++) { const o = (Math.sin((e.seed * 97 + k) * 12.9898) * 43758.5453 % 1) * Math.min(6, L * 0.12); pts.push([x1 + dx * k / n - dy / L * o, y1 + dy * k / n + dx / L * o]); }
        pts.push([x2, y2]);
        for (const [col, lw, al] of [[teamCol(e.side), 4, 0.35], ['#E8F1FF', 1.5, 0.95]]) {
          ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.globalAlpha = al * a; ctx.beginPath(); pts.forEach(([px, py], k) => k ? ctx.lineTo(px, py) : ctx.moveTo(px, py)); ctx.stroke();
        }
      }
      if (e.kind === 'shot') {
        ctx.strokeStyle = teamCol(e.side); ctx.globalAlpha = 0.7 * a; ctx.lineWidth = Math.max(e.charged ? 3 : 1, 1 + (e.spin - 1) * 1.5); // spun-up beams get thicker
        ctx.beginPath(); ctx.moveTo(PX(e.x1), PY(e.y1)); ctx.lineTo(PX(e.x2), PY(e.y2)); ctx.stroke();
        if (e.splash > 0) { ctx.globalAlpha = 0.4 * a; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(PX(e.x2), PY(e.y2), e.splash * S, 0, Math.PI * 2); ctx.stroke(); }
      }
    }
    ctx.globalAlpha = 1;
    for (const p of bt.projectiles()) {
      if (p.owner.u.shape === 'spear') { // a thrown spear: shaft and head along its flight, in the unit's colour
        const L = Math.max(12, 3 * S), dx = p.dirX * flip(), dy = -p.dirY * flip(), hx = PX(p.x), hy = PY(p.y), tx = hx - dx * L, ty = hy - dy * L;
        ctx.strokeStyle = teamCol(p.owner.side); ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.strokeStyle = p.owner.u.color; ctx.lineWidth = 1.5; ctx.stroke();
        const hl = L * 0.32, hw = L * 0.14;
        ctx.fillStyle = p.owner.u.color; ctx.strokeStyle = teamCol(p.owner.side); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(hx + dx * hl * 0.6, hy + dy * hl * 0.6); ctx.lineTo(hx - dx * hl * 0.4 - dy * hw, hy - dy * hl * 0.4 + dx * hw); ctx.lineTo(hx - dx * hl * 0.4 + dy * hw, hy - dy * hl * 0.4 - dx * hw); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.lineCap = 'butt';
        continue;
      }
      ctx.fillStyle = teamCol(p.owner.side);
      ctx.fillRect(PX(p.x) - 2.5, PY(p.y) - 2.5, 5, 5);
    }
    // a fallen tower cripples its army for a few seconds
    const crip = [me, foe()].filter(sd => bt.crippled(sd) > 0);
    crip.forEach((sd, k) => {
      const txt = sd === me ? `Your tower fell · crippled ${Math.ceil(bt.crippled(sd))} s` : `${mode === 'claude' ? 'Claude’s' : 'Enemy'} tower fell · crippled ${Math.ceil(bt.crippled(sd))} s`;
      ctx.font = `600 ${Math.max(11, Math.round(W * 0.035))}px "IBM Plex Mono", monospace`;
      const tw = ctx.measureText(txt).width + 16, th = Math.max(20, W * 0.06), x = (W - tw) / 2, y = H * (sd === me ? 0.62 : 0.32) + k * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y, tw, th);
      ctx.fillStyle = teamCol(sd); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, W / 2, y + th / 2);
    });
  }

  function render() {
    syncMusic();
    cv.style.touchAction = phase === 'deploy' ? 'none' : ''; // so a finger can drag squads without scrolling the page
    if (!m) { drawBoard(); return; }
    if (bt && phase === 'battle' && cam && cam.k > 0) { // the battle cam, zoomed in around its focus
      const z = 1 + (CAM.zoom - 1) * cam.k, fx0 = PX(cam.x), fy0 = PY(cam.y);
      ctx.save(); ctx.translate(fx0, fy0); ctx.scale(z, z); ctx.translate(-fx0, -fy0);
      drawBattle();
      ctx.restore();
    } else if (bt && (phase === 'battle' || phase === 'result' || phase === 'end')) drawBattle();
    else drawDeploy();
  }

  // ---------- HUD ----------
  function hud() {
    const v = phase === 'battle' && battlePre ? battlePre : m;
    const hpMe = v ? v.hp[me] : Game.START_HP, hpFoe = v ? v.hp[foe()] : Game.START_HP;
    $('hp-you').textContent = hpMe; $('hp-foe').textContent = hpFoe;
    $('hpbar-you').style.width = (hpMe / Game.START_HP * 100) + '%';
    $('hpbar-foe').style.width = (hpFoe / Game.START_HP * 100) + '%';
    $('round').textContent = v ? v.round : 1;
    $('phase').textContent = { start: 'Ready', lobby: 'Lobby', draft: 'Draft', deploy: 'Deploy', battle: 'Battle', result: 'Result', end: 'Match over' }[phase];
    $('foe-name').textContent = foeName();
    document.querySelector('.hud').hidden = phase === 'start' || phase === 'lobby' || phase === 'draft'; // no match yet: nothing to show
    syncPick(); syncMusic();
  }

  function setNet(text, state) {
    const n = $('net');
    if (!text) { n.hidden = true; return; }
    n.hidden = false; n.className = 'net' + (state ? ' ' + state : '');
    $('net-text').textContent = text;
  }
  function netStatus() {
    if (solo()) { setNet(''); return; }
    if (net.connected) setNet(mode === 'host' ? `Match ${net.code} · opponent connected` : `Match ${net.code} · connected`, 'ok');
    else if (phase === 'lobby') setNet('');
    else if (phase === 'draft' && mode === 'guest') setNet('Connection lost. Reconnecting…', 'bad');
    else setNet(mode === 'host' ? `Opponent disconnected. Waiting for them to come back…` : 'Connection lost. Reconnecting…', 'bad');
  }

  // ---------- countdown ----------
  const fmtClock = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const editable = () => phase === 'deploy' && !ready[me] && !timeUp && !(mode === 'claude' && claude.fightWaiting);

  function tick() {
    const t = now();
    if (phase === 'deploy') {
      // host: the countdown waits while the opponent is away
      if (mode === 'host' && !net.connected && deadline) { pausedLeft = Math.max(5000, deadline - t); deadline = 0; panelDeploy(); }
      const el = $('timer');
      if (deadline) {
        const left = deadline - t;
        if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left <= 5000); }
        $('clock').textContent = left > 0 ? `${fmtClock(left)} to deploy` : 'Time’s up';
        if (mode !== 'guest' && left <= (mode === 'host' ? -500 : 0)) runFight();
        else if (mode === 'guest' && left <= 0 && !timeUp) { timeUp = true; selected = null; closeSheet(); sendSide(); panelDeploy(); render(); }
      } else if (el) { el.textContent = heldMs || (mode === 'guest' && net.connected && m && m.round === Game.TOWER_PICK_ROUND) ? 'picking towers' : solo() ? '' : 'paused'; el.classList.remove('low'); }
    }
    if ((phase === 'result' || phase === 'end') && resultShownAt) {
      const left = resultShownAt + NEXT_SECONDS * 1000 - t;
      const nb = $('next');
      if (phase === 'result' && !nextReady[me]) {
        if (left <= 0) tapNext();
        else if (nb && !solo()) nb.textContent = `Next round · ${Math.ceil(left / 1000)}`;
      }
    }
  }
  setInterval(tick, 200);

  // ---------- choose one of 3 (starting package, tower): cards over the board, like a level-up pick ----------
  // Tap a card to see what it does, then tap it again (or Choose). Hide shows the board under it for a moment.
  function pickOptions() {
    if (!m || !editable()) return null;
    if (choosingPack()) return {
      kind: 'pack', eyebrow: `Round 1 · ${esc((Game.mapOf(m) || { name: 'Standard' }).name)}`, title: 'Choose your start',
      sub: `Free squads and a character, plus ${m.gold[me]} gold.`,
      items: m.packages[me].map((p, k) => {
        const n = {}; p.squads.forEach(ui => { n[ui] = (n[ui] || 0) + 1; });
        const c = p.char && Game.charInfo(p.char);
        return {
          key: String(k),
          art: p.units.map(ui => `<span style="color:${units[ui].color};display:inline-flex">${Shapes.svg(units[ui].shape, 30)}</span>`).join(''),
          name: p.units.map(ui => `${n[ui]}× ${esc(units[ui].name)}`).join('<br>'),
          who: c ? armsImg(c.id) + esc(c.name) : '',
          det: `${c ? `<span style="color:var(--gold)">${charLine(p.char)}</span><br>` : ''}${p.units.map(ui => `<b>${esc(units[ui].name)}</b>${ROLES[units[ui].name] && !customSet ? ` · ${esc(ROLES[units[ui].name])}` : ` · ${Game.unitCostOf(units[ui])} gold`}`).join('<br>')}`,
        };
      }),
    };
    if (choosingTower()) return {
      kind: 'tower', eyebrow: `Round ${m.round}`, title: 'Choose your tower',
      sub: 'It stays for the rest of the match.',
      items: Game.towerChoices(m, me).map(x => ({
        key: x.id,
        art: `<canvas data-ticon="${x.id}" width="96" height="96" style="width:48px;height:48px" aria-hidden="true"></canvas>`,
        name: esc(x.name), who: '', sub: `${x.unit.hp} hp · ${x.unit.range} m`,
        det: `<b>${esc(x.name)}</b> · ${x.unit.hp} hp · hit ${x.unit.hit} × ${x.unit.aps}/s · ${x.unit.range} m${x.unit.splash ? ` · ${x.unit.splash} m splash` : ''}<br>${esc(x.text)}${x.skill ? `<br><span style="color:var(--gold)">Skill, bought separately for ${Game.TOWER_SKILL.cost} gold: ${esc(x.skill.name)}.</span> ${esc(x.skill.text)}` : ''}${x.skill2 ? `<br><span style="color:var(--gold)">Skill, bought separately for ${x.skill2.cost} gold: ${esc(x.skill2.name)}.</span> ${esc(x.skill2.text)}` : ''}${x.loan ? `<br><span style="color:var(--gold)">Loan, every round:</span> ${esc(loanText())}` : ''}${x.passive ? `<br><span style="color:var(--gold)">${esc(x.passive.name)} (always on):</span> ${esc(x.passive.text)}` : ''}${x.generals ? `<br><span style="color:var(--gold)">Mage generals, one per round, for that round's fight:</span> ${Game.MAGE_GENERALS.map(g => `<b>${esc(g.name)}</b> (${g.cost} gold): ${esc(g.text)}`).join(' ')}` : ''}`,
      })),
    };
    return null;
  }
  function choosePick(o, key) {
    if (!editable()) return;
    if (o.kind === 'pack') {
      if (!Game.choosePack(m, me, +key)) return;
      const f = Game.freeLeft(m, me); if (f.length) shopTier = tierOf(f[0]); // show the tier of the first free squad
      changed();
    } else if (Game.setTowerType(m, me, key)) { changed(); releaseClock(); }
  }
  function syncPick() {
    const o = phase === 'deploy' ? pickOptions() : null, el = $('pick'), peek = $('pick-peek');
    const id = o ? `${o.kind}:${m.round}:${o.items.map(x => x.key).join(',')}` : '';
    if (id !== pickFor) { pickFor = id; pickSel = null; pickPeek = false; }
    if (!o) { el.hidden = true; peek.hidden = true; pickHtml = ''; return; }
    el.hidden = pickPeek; peek.hidden = !pickPeek;
    peek.textContent = o.kind === 'pack' ? 'Choose your start' : 'Choose your tower';
    const html = `<div class="ph"><span class="eyebrow">${o.eyebrow}</span><h2 id="pick-h">${o.title}</h2><span class="hint">${o.sub}</span></div>
      <div class="opts">${o.items.map(x => `<button class="opt" data-opt="${x.key}"${o.kind === 'pack' ? ` data-pack="${x.key}"` : ` data-ttype="${x.key}"`} aria-pressed="false">
        <span class="art">${x.art}</span><span class="nm">${x.name}</span>${x.who ? `<span class="who">${x.who}</span>` : ''}${x.sub ? `<span class="sub">${x.sub}</span>` : ''}
      </button>`).join('')}</div>
      <div class="det" id="pick-det" aria-live="polite"></div>
      <div class="row"><button class="btn small" id="pick-hide">Hide</button><button class="btn primary" id="pick-go" disabled>Choose</button></div>`;
    if (html !== pickHtml) { // only redraw when the options change, so the cards don't fly in again
      pickHtml = html; el.innerHTML = html;
      el.querySelectorAll('[data-ticon]').forEach(c => drawKeep(48, 54, 92, me, null, c.dataset.ticon, c.getContext('2d')));
      el.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => {
        const cur = pickOptions(); if (!cur) return;
        if (pickSel === b.dataset.opt) choosePick(cur, pickSel); else { pickSel = b.dataset.opt; syncPick(); }
      }));
      $('pick-go').addEventListener('click', () => { const cur = pickOptions(); if (cur && pickSel != null) choosePick(cur, pickSel); });
      $('pick-hide').addEventListener('click', () => { pickPeek = true; syncPick(); });
    }
    el.querySelectorAll('[data-opt]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.opt === pickSel)));
    const sel = o.items.find(x => x.key === pickSel);
    $('pick-det').innerHTML = sel ? sel.det : ''; $('pick-det').style.visibility = sel ? '' : 'hidden'; // keeps its space, so the cards don't jump
    $('pick-go').disabled = !sel;
  }

  $('pick-peek').addEventListener('click', () => { pickPeek = false; syncPick(); });

  // ---------- panel ----------
  // the picked tower's skill, not bought yet: offered as a button in the deploy panel
  const MORE = (id) => `<button class="linkbtn" id="${id}">More</button>`; // opens the full rules in a sheet
  function overlayMsgSheet(head, text) {
    $('sheet').innerHTML = `<div class="bar"><h3 id="sheet-h">${esc(head)}</h3><button class="btn small" id="close">Close</button></div><p style="margin:0">${esc(text)}</p>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
  }
  const loanText = () => `Take ${Game.LOAN.gold} gold right away; next round you get ${Game.LOAN.payback} gold less (never less than nothing). Once a round.`;
  const loanOffer = () => !!m && Game.towerPicked(m, me) && !Game.needsTowerPick(m, me) && Game.towerType(m, me).id === 'bank';
  const mageOffer = () => !!m && Game.towerPicked(m, me) && !Game.needsTowerPick(m, me) && Game.towerType(m, me).id === 'mage';
  const tskillOffer = () => !!m && Game.towerPicked(m, me) && !Game.needsTowerPick(m, me) && !Game.towerSkillOf(m, me) && !!Game.towerType(m, me).skill;
  function panelDeploy() {
    if (phase !== 'deploy') return;
    const g = m.gold[me];
    const fresh = m.armies[me].filter(s => s.round === m.round).length;
    const readyN = m.armies[me].filter(s => Game.isReady(m, s)).length;
    const left = Game.deploysLeft(m, me), allowed = Game.deploysAllowed(m, me);
    const price = (i) => Game.shopCost(m, me, i);
    const can = editable();
    const locked = (i) => !Game.isUnlocked(m, me, i);
    const freeN = (i) => Game.freeLeft(m, me).filter(x => x === i).length;
    const canBuy = (i) => can && !choosingPack() && !choosingTower() && !placingTower() && (freeN(i) > 0 || (!locked(i) && g >= price(i) && left > 0));
    let hint;
    if (!can) hint = mode === 'claude' && claude.fightWaiting ? 'Waiting for Claude to finish its move. The fight starts as soon as it does.' : timeUp ? 'Time’s up. The fight is about to start.' : 'You’re ready. Tap Not ready to make changes.';
    else {
      hint = selected !== null
        ? (canBuy(selected) ? `Tap a tile in your zone${Game.flankOpen(m) ? ' or a flank tile in theirs' : ''} to place ${esc(units[selected].name)}.` : left <= 0 ? 'No deployments left this round.' : `Not enough gold for ${esc(units[selected].name)}.`)
        : (fresh ? 'Drag a squad you placed this round to move it, or tap it to take it back.' : 'Pick a unit, then tap a tile in the bottom six rows.');
      if (left <= 0 && selected === null) hint = Game.canBuyDeploy(m, me) || m.extraDeploys[me] < Game.CONFIG.maxExtraDeploys ? `No deployments left. Buy one more for ${Game.CONFIG.extraDeployCost} gold (once per round), or spend gold on upgrades.` : 'No deployments left this round. Spend gold on upgrades.';
      if (readyN && selected === null) hint = `${readyN} squad${readyN === 1 ? ' is' : 's are'} ready to level up. Tap ${readyN === 1 ? 'it' : 'one'} to upgrade.`;
      if (Game.charOf(m, me) === 'zoe' && selected === null && (m.buff && m.buff[me] || []).length) hint += ` Starred tiles are your buff tiles this round: +${Game.CHAR.zoeDmg}% damage, +${Game.CHAR.zoeHp}% health and +${Game.CHAR.zoeAps}% attack speed for a squad that starts the fight there.`;
      if (Game.hailRound(m) && selected === null && !fresh) hint = `Hail this round: ${Game.ICE.hailDps} damage a second on hail tiles. ${MORE('map-more')}`;
      if (Game.altarRound(m) && selected === null && !fresh) hint = `${Game.hailRound(m) ? 'Hail this round, and the' : 'The'} altar of ice has risen: tap it for ice walls, a push of the hail or a Snowgre. ${MORE('map-more')}`;
      if (m.round === Game.FLANK.round && selected === null && !fresh) hint = `Flanks are open: you can deploy on the blue edge columns in their half. ${MORE('flank-more')}`;
      if (m.round === 1 && selected === null && m.armies[me].some(s => s.free)) hint = 'Your package squads are already on the board. Drag them where you want them, or tap one to take it back.';
      if (charmMode && Game.canGiveCharm(m, me)) hint = 'Tap one of your squads to give it a stack of Charisma.';
      if (moveMode) hint = moving == null ? `Tap one of your squads from an earlier round to move it (${Game.CONFIG.moveCost} gold, once per round).` : `Tap a free tile to move ${esc(units[m.armies[me].find(s => s.id === moving).unit].name)} there, or drag it.`;
      if (selected !== null && !moveMode && m.armies[me].some(q => Game.boardable(m, me, q.col, q.row, selected))) hint += ` Or tap your ${esc(units[m.armies[me].find(q => Game.boardable(m, me, q.col, q.row, selected)).unit].name)} (gold outline) to hide this squad inside it.`;
      if (selected !== null && Game.isCarrier(m, selected)) hint += ` It carries one squad of any other unit, hidden from your opponent: place one on its tile.`;
      const freeL = Game.freeLeft(m, me);
      if (freeL.length && !placingTower() && selected === null) hint = `Place your free package squads: ${[...new Set(freeL)].map(ui => `${freeL.filter(x => x === ui).length}× ${esc(units[ui].name)}`).join(', ')}. They cost no gold and no deployments.`;
      if (choosingPack()) hint = (() => { const mp = Game.mapOf(m); return mp ? `<b>${esc(mp.name)}</b> · ${esc(mp.short || '')} ${mp.plain ? '' : MORE('map-more')}` : 'Choose your start.'; })();
      if (tskillOffer() && m.round === Game.TOWER_PICK_ROUND && selected === null && !fresh) hint = `Your ${esc(Game.towerType(m, me).name)} has a skill: ${esc(Game.towerType(m, me).skill.name)}. ${esc(Game.towerType(m, me).skill.text)} It isn’t on until you buy it (${Game.towerSkillCost(m, me)} gold, once per match).`;
      if (choosingTower()) hint = `Choose your tower on the board. The clock starts once ${solo() ? 'you have' : 'both players have'} picked.`;
      if (placingElf()) hint = 'Tap a free tile in your zone to place your elf tower. Tap anywhere else to cancel.';
      if (placingTower()) hint = 'Next, place your tower: tap a gold tile on the left or right side of your zone. If it falls in a fight, your army is crippled for a few seconds.';
    }
    const extraBtns = `<span style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn small" id="buy-deploy" ${can && Game.canBuyDeploy(m, me) ? '' : 'disabled'}>+1 deployment · ${Game.CONFIG.extraDeployCost}</button>
        ${loanOffer() ? (Game.loanNow(m, me) ? `<button class="btn small" id="loan-undo" ${can && m.gold[me] >= Game.LOAN.gold ? '' : 'disabled'}>Pay back loan · −${Game.LOAN.gold}</button>` : `<button class="btn small" id="loan" ${can ? '' : 'disabled'}>Loan · +${Game.LOAN.gold}</button>`) : ''}
        ${mageOffer() ? `<button class="btn small" id="mage-gen" ${can ? '' : 'disabled'}>${Game.mageGenOf(m, me) || Game.mageTpOf(m, me) ? [Game.mageGenOf(m, me), Game.mageTpOf(m, me) && 'teleport'].filter(Boolean).map(id => esc(Game.mageGenInfo(id).name)).join(' + ') : 'Mage general'}…</button>` : ''}
        ${tskillOffer() ? `<button class="btn small" id="buy-tskill" ${can && Game.canBuyTowerSkill(m, me) ? '' : 'disabled'}>${esc(Game.towerType(m, me).skill.name)} · ${Game.towerSkillCost(m, me)}</button>` : ''}
        ${can && m.extraDeploys[me] > 0 && left > 0 ? `<button class="btn small" id="refund-deploy">Refund unused</button>` : ''}
        ${Game.charOf(m, me) !== 'matteo' ? '' : charmGivenNow() ? `<button class="btn small" id="charm-undo" ${can ? '' : 'disabled'}>Take back Charisma</button>`
          : Game.canGiveCharm(m, me) ? `<button class="btn small" id="charm-btn" aria-pressed="${charmMode}" ${can && m.armies[me].length ? '' : 'disabled'}>${charmMode ? 'Cancel' : 'Give Charisma'}</button>` : ''}
        ${Game.movedId(m, me) != null
          ? `<button class="btn small" id="undo-move" ${can ? '' : 'disabled'}>Undo move · +${Game.CONFIG.moveCost}</button>`
          : `<button class="btn small" id="move-btn" aria-pressed="${moveMode}" ${(can && m.armies[me].some(s => s.round < m.round) && (moveMode || g >= Game.CONFIG.moveCost)) ? '' : 'disabled'}>${moveMode ? 'Cancel move' : `Move a squad · ${Game.CONFIG.moveCost}`}</button>`}
      </span>`;
    let action, status;
    if (solo()) {
      status = `${m.armies[me].length} squad${m.armies[me].length === 1 ? '' : 's'} on the board`;
      if (mode === 'claude') status = claudeStatus();
      action = `<button class="btn primary" id="fight" ${m.armies[me].length && !choosingTower() ? '' : 'disabled'}>${deadline ? 'Fight now' : 'Fight'}</button>`;
    } else {
      const away = mode === 'host' && !net.connected;
      status = away ? 'Opponent is away. The clock is paused.' : ready[foe()] ? 'Opponent is ready.' : mode === 'host' && Game.needsTowerPick(m, 1) ? 'Opponent is picking their tower.' : 'Opponent is deploying.';
      action = `<button class="btn ${ready[me] ? '' : 'primary'}" id="ready" ${timeUp || choosingTower() ? 'disabled' : ''}>${ready[me] ? 'Not ready' : 'Ready'}</button>`;
    }
    $('panel').innerHTML = `
      <div class="bar"><span class="gold num">${g} gold</span><span class="deploys num">${Math.max(0, left)} of ${allowed} deployments left</span><span class="timer" id="timer">${deadline ? fmtClock(deadline - now()) : ''}</span></div>
      <div class="bar"><span class="hint">${hint}</span>${(choosingPack() || choosingTower()) && can ? '' : extraBtns}</div>
      ${(choosingPack() || choosingTower()) && can ? '' : (() => {
        const tiers = [...new Set(units.map((u, i) => Game.isOff(m, i, me) ? 0 : tierOf(i)))].filter(t => t > 0).sort((a, b) => a - b); // units left out of the match aren't in the shop
        if (!tiers.includes(shopTier)) shopTier = tiers[0];
        return `<div class="tiers" role="tablist" aria-label="Unit tiers, higher is stronger" style="--n:${tiers.length}">${tiers.map(t => {
          const idx = units.map((u, i) => i).filter(i => tierOf(i) === t && !Game.isOff(m, i, me)), open = idx.filter(i => !locked(i)).length, free = idx.some(i => freeN(i) > 0);
          return `<button role="tab" data-tier="${t}" aria-selected="${t === shopTier}" aria-label="Tier ${t}, ${tierName(t)}, ${price(idx[0])} gold, ${open} of ${idx.length} unlocked${free ? ', has free squads' : ''}" style="--tier:${tierColor(t)}">Tier ${t}<em>${tierName(t)}</em><small>${price(idx[0])}g · ${open}/${idx.length}</small></button>`;
        }).join('')}</div>`;
      })()}
      ${(choosingPack() || choosingTower()) && can ? '' : `<div class="shop" id="shop">${units.map((u, i) => tierOf(i) !== shopTier || Game.isOff(m, i, me) ? '' : `
        <div class="uwrap" style="--tier:${tierColor(tierOf(i))}">
          <button class="ucard" data-i="${i}" aria-pressed="${selected === i}" aria-disabled="${!canBuy(i) && !(locked(i) && can)}" ${locked(i) ? `data-locked="1" style="border-style:dashed" aria-label="${esc(u.name)}, locked, unlock for ${Game.unlockCost(m, i, me)} gold"` : ''}>
            <span class="t"><span style="color:${u.color};display:inline-flex">${Shapes.svg(u.shape, 13)}</span> ${tag(u)} <span class="tier">T${tierOf(i)}</span></span><span class="n">${esc(u.name)}</span>
            ${roleRow(i)}
            ${locked(i) ? `<span class="lock">${LOCK_SVG} Locked · ${Game.unlockCost(m, i, me)}g</span>` : ''}
            ${freeN(i) ? `<span class="c" style="color:var(--win, #6FD08C)">Free ×${freeN(i)}</span>` : ''}
            <span class="c">${price(i)} · ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'}${Engine.SLOTS.filter(k => Game.hasSkill(m, me, i, k)).length ? ` · ${Engine.SLOTS.filter(k => Game.hasSkill(m, me, i, k)).length}★` : ''}</span>
          </button>
          <button class="info" data-info="${i}" aria-label="About ${esc(u.name)}">i</button>
        </div>`).join('')}</div>`}
      <div class="bar"><span class="hint">${status}</span>${action}</div>`;
    syncPick();
    $('panel').querySelectorAll('[data-tier]').forEach(b => b.addEventListener('click', () => { shopTier = +b.dataset.tier; shopScroll = 0; panelDeploy(); }));
    const shop = $('shop') || document.createElement('div');
    shop.scrollLeft = shopScroll;
    shop.addEventListener('scroll', () => { shopScroll = shop.scrollLeft; }, { passive: true });
    shop.querySelectorAll('.ucard').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.locked) { openSheet(+b.dataset.i); return; } // a locked unit opens its sheet, where it can be unlocked
      if (b.getAttribute('aria-disabled') === 'true') return;
      const i = +b.dataset.i;
      selected = selected === i ? null : i;
      panelDeploy(); render();
    }));
    shop.querySelectorAll('[data-info]').forEach(el => el.addEventListener('click', () => openSheet(+el.dataset.info)));
    if ($('fight')) $('fight').addEventListener('click', runFight);
    if ($('ready')) $('ready').addEventListener('click', toggleReady);
    if ($('buy-deploy')) $('buy-deploy').addEventListener('click', () => { if (editable() && Game.buyDeploy(m, me)) changed(); });
    if ($('map-more')) $('map-more').addEventListener('click', () => openMapSheet());
    if ($('flank-more')) $('flank-more').addEventListener('click', () => overlayMsgSheet('Flanks', `From round ${Game.FLANK.round}, the blue edge columns on the enemy’s half are yours to deploy on too, and the red ones on your half are theirs. A squad placed on a flank can’t move or attack for the first ${Game.FLANK.delay} s of its first fight. Flank squads march in sideways, toward the middle of the board, until they spot an enemy.`));
    if ($('mage-gen')) $('mage-gen').addEventListener('click', () => openTowerSheet(me));
    if ($('loan')) $('loan').addEventListener('click', () => { if (editable() && Game.takeLoan(m, me)) changed(); });
    if ($('loan-undo')) $('loan-undo').addEventListener('click', () => { if (editable() && Game.undoLoan(m, me)) changed(); });
    if ($('buy-tskill')) $('buy-tskill').addEventListener('click', () => { if (editable() && Game.buyTowerSkill(m, me)) changed(); });
    if ($('refund-deploy')) $('refund-deploy').addEventListener('click', () => { if (editable() && Game.refundDeploy(m, me)) changed(); });
    if ($('charm-btn')) $('charm-btn').addEventListener('click', () => { if (!editable()) return; charmMode = !charmMode; if (charmMode) { selected = null; moveMode = false; moving = null; } changed(); });
    if ($('charm-undo')) $('charm-undo').addEventListener('click', () => { const q = charmGivenNow(); if (editable() && q && Game.undoCharm(m, me, q.id)) changed(); });
    if ($('move-btn')) $('move-btn').addEventListener('click', () => { if (!editable()) return; moveMode = !moveMode; moving = null; if (moveMode) selected = null; changed(); });
    if ($('undo-move')) $('undo-move').addEventListener('click', () => { if (editable() && Game.undoMove(m, me)) changed(); });
    tick();
  }

  // After the player changes their own side
  function changed() {
    panelDeploy(); render();
    if (mode === 'guest') sendSide();
    if (mode === 'host') saveHost();
  }

  function toggleReady() {
    if (phase !== 'deploy' || timeUp) return;
    ready[me] = !ready[me];
    if (ready[me]) { selected = null; closeSheet(); }
    if (mode === 'guest') sendSide();
    if (mode === 'host') { sendStatus(); if (ready[0] && ready[1] && net.connected) { runFight(); return; } }
    panelDeploy(); render();
  }

  function panelBattle() {
    $('panel').innerHTML = `
      <div class="bar">
        <div class="seg" role="group" aria-label="Playback speed">
          ${[1, 2, 4].map(s => `<button data-s="${s}" aria-pressed="${speed === s}">${s}×</button>`).join('')}
        </div>
        <button class="btn small" id="skip">Skip to result</button>
      </div>`;
    $('panel').querySelectorAll('[data-s]').forEach(b => b.addEventListener('click', () => {
      speed = +b.dataset.s;
      $('panel').querySelectorAll('[data-s]').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.s === speed)));
    }));
    $('skip').addEventListener('click', () => { while (bt.step()) {} finishBattle(); });
  }

  function panelInfo(text, btnLabel, onClick, extra = '') {
    $('panel').innerHTML = `<div class="bar"><span class="hint">${text}</span><span class="btnrow">${extra}${btnLabel ? `<button class="btn primary" id="pbtn">${btnLabel}</button>` : ''}</span></div>`;
    if (btnLabel) $('pbtn').addEventListener('click', onClick);
  }

  // ---------- overlays ----------
  function overlay(html) {
    const o = $('overlay');
    if (!html) { o.hidden = true; o.innerHTML = ''; return; }
    o.hidden = false; o.innerHTML = html;
  }

  function showStart() {
    leaveNet();
    if (claude.ctl) { claude.ctl.abort(); claude.ctl = null; } claude.busy = false;
    mode = 'ai'; me = 0; phase = 'start'; m = null; bt = null; battlePre = null; deadline = 0; resultShownAt = 0;
    draft = null; clearTimeout(draftTimer); restoreSet();
    hud(); netStatus(); $('clock').textContent = '';
    let resume = null;
    try { resume = JSON.parse(localStorage.getItem(HOST_STORE) || 'null'); } catch (e) {}
    if (resume && !(resume.m && now() - resume.ts < 6 * 3600e3)) resume = null;
    overlay(`<div class="card">
      <h2>No Mans Land</h2>
      <p class="big">Build an army. Watch it fight. Last one standing wins.</p>
      <span class="btnrow"><button class="btn small" id="how">How to play</button><button class="btn small" id="music-open">Music</button>${HISTORY_URL ? `<button class="btn small" id="hist-open">Match history</button>` : ''}</span>
    </div>`);
    $('music-open').addEventListener('click', openSoundSheet);
    if ($('hist-open')) $('hist-open').addEventListener('click', openHistorySheet);
    $('panel').innerHTML = `
      ${resume ? `<button class="btn primary" id="resume">Resume match ${esc(resume.code)}</button>` : ''}
      <div class="bar">
        <button class="btn ${resume ? '' : 'primary'}" id="friend" style="flex:1">Challenge a friend</button>
        <button class="btn" id="go" style="flex:1">Play vs AI</button>
      </div>
      ${sampleFn ? `<button class="btn primary" id="vs-claude">Play vs Claude</button>` : ''}
      <div class="bar">
        <span class="hint">${factionsReady() ? 'Factions: draft two factions each, then fight with their units and towers.' : 'Factions mode: coming soon.'}</span>
        <button class="btn small" id="factions-ai" ${factionsReady() ? '' : 'disabled'}>Factions vs AI</button>
      </div>
      <div class="bar">
        <span class="hint">Have a code?</span>
        <span class="joinrow"><input id="code-in" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Match code" placeholder="CODE"><button class="btn" id="join">Join</button></span>
      </div>
      <span class="hint" id="join-msg" aria-live="polite" hidden></span>
      ${settingsBox(`
        ${mapSeg()}
        ${charSeg()}
        <div class="bar">
          <span class="hint">Deploy timer vs AI</span>
          <div class="seg" role="group" aria-label="Deploy timer vs AI">
            <button data-tm="1" aria-pressed="${timerOn}">On</button><button data-tm="0" aria-pressed="${!timerOn}">Off</button>
          </div>
        </div>
        ${TEST ? `<div class="bar">
          <span class="hint">Level-up cost (test setting)</span>
          <div class="seg" role="group" aria-label="Level-up cost">
            ${[50, 75].map(c => `<button data-c="${c}" aria-pressed="${Game.CONFIG.levelCostPerTier === c}">${c} gold</button>`).join('')}
          </div>
        </div>` : ''}
        <div class="bar">
          <span class="hint">${customSet ? `Your ${units.length} Counter Lab units` : `${units.length} built-in units`}${reportDb ? '. Matches are saved for Claude to review.' : ''}</span>
          <span class="btnrow"><button class="btn small" id="load-units">Load units</button><a class="btn small" id="lab-link" href="lab.html" style="text-decoration:none;color:inherit;display:inline-block">Counter Lab</a></span>
        </div>`)}`;
    $('how').addEventListener('click', openHowTo);
    $('friend').addEventListener('click', hostLobby);
    $('go').addEventListener('click', () => { matchKind = 'standard'; startAiMatch(); });
    $('factions-ai').addEventListener('click', () => { matchKind = 'factions'; startAiMatch(); });
    if ($('vs-claude')) $('vs-claude').addEventListener('click', startClaudeMatch);
    if ($('resume')) $('resume').addEventListener('click', () => resumeHost(resume));
    $('load-units').addEventListener('click', openLoader);
    const joinNow = () => {
      const c = $('code-in').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (c.length !== 5) { $('join-msg').hidden = false; $('join-msg').textContent = 'Codes are 5 letters and numbers.'; return; }
      joinMatch(c);
    };
    $('join').addEventListener('click', joinNow);
    $('code-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinNow(); });
    $('panel').querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {
      Game.CONFIG.levelCostPerTier = +b.dataset.c;
      $('panel').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }));
    wireMapSeg(); wireCharSeg(); wireSettings();
    $('panel').querySelectorAll('[data-tm]').forEach(b => b.addEventListener('click', () => {
      timerOn = b.dataset.tm === '1';
      $('panel').querySelectorAll('[data-tm]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }));
    size(); render();
  }

  // the rules, kept out of the way: the menu only has a one-line pitch and this button
  function openHowTo() {
    $('sheet').innerHTML = `
      <div class="bar"><h3 id="sheet-h">How to play</h3><button class="btn small" id="close">Close</button></div>
      <div class="card" style="max-width:none;justify-items:stretch">
      <ul>
        <li>Each round you buy squads with gold and place them in your bottom six rows. Then the armies fight on their own.</li>
        <li>Squads stay all match, and you see the enemy’s earlier ones while you deploy. Build counters.</li>
        <li>The loser of a fight takes damage from every enemy squad still standing. Run out of health and you lose.</li>
        <li>A squad costs ${Game.SQUAD_COST}, income grows by ${Game.CONFIG.incomeStep} a round, and you have ${DEPLOY_SECONDS} s and 2 deployments a round (3 in round 1).</li>
      </ul>
      <div class="learn">
        ${[
          ['Starting package', 'Round 1: pick one of three, each with free squads and a character.', `
            <li>Each package unlocks two units for free and gives you free squads of them worth ${Game.PACKAGE.value}, plus ${Game.START_GOLD} gold to spend.</li>
            <li>Each comes with a random character (never two the same) whose ability lasts the whole match. Tap the enemy tower after the first fight to see theirs.</li>
            ${Game.CHARACTERS.map(c => `<li>${armsImg(c.id)}<b>${esc(c.name)}</b>: ${esc(c.ability)}</li>`).join('')}`],
          ['Towers', `If yours falls, your army is crippled for a few seconds. Pick your real one in round ${Game.TOWER_PICK_ROUND}.`, `
            <li>Your tower stands in the back of your zone. Until round ${Game.TOWER_PICK_ROUND} it is a small outpost; then, before the clock runs, you pick one for the rest of the match.</li>
            ${Game.TOWER_TYPES.map(x => `<li><b>${esc(x.name)}</b>: ${esc(x.text)} ${x.skill ? `Skill: <i>${esc(x.skill.name)}</i> (${Game.TOWER_SKILL.cost} gold, tap your tower). ${esc(x.skill.text)} ` : ''}${x.skill2 ? `Skill: <i>${esc(x.skill2.name)}</i> (${x.skill2.cost} gold, tap your tower). ${esc(x.skill2.text)} ` : ''}${x.loan ? `Loan, every round (tap your tower): ${esc(loanText())} ` : ''}${x.passive ? `<i>${esc(x.passive.name)}</i> (always on): ${esc(x.passive.text)} ` : ''}${x.generals ? `Every round you may call one mage general (tap your tower); it changes the attack for that round's fight only. ${Game.MAGE_GENERALS.map(g => `<i>${esc(g.name)}</i> (${g.cost} gold): ${esc(g.text)}`).join(' ')}` : ''}</li>`).join('')}`],
          ['Maps', 'Every map changes the rules of the fight.', `
            <li>The host picks the map before the packages, or leaves it random (never Standard, and never the same map twice in a row).</li>
            ${Game.MAPS.map(mp => `<li><b>${esc(mp.name)}</b>: ${esc(mp.text)}</li>`).join('')}`],
          ['Lanes and flanks', `Columns are lanes. From round ${Game.FLANK.round} you can deploy on the enemy’s edges.`, `
            <li>Squads march straight ahead and fight what they meet, curving toward any enemy within a few tiles, so an empty lane lets a squad walk around the side.</li>
            <li>From round ${Game.FLANK.round}, the blue edge columns on the enemy’s half open up for you. The red ones on your half are theirs, never yours.</li>
            <li>A squad placed on a flank waits ${Game.FLANK.delay} s before it moves or attacks, in its first fight only. Then it marches in sideways, toward the middle of the board, until it spots an enemy.</li>`],
          ['Growing your army', 'Level up squads, unlock units, buy skills, sell what you don’t need.', `
            <li>Squads earn experience. A gold + means you can upgrade one: level 2 doubles health and attack, level 3 triples them.</li>
            <li>Some units start unlocked. The rest cost gold once to unlock for the match; tap a locked card.</li>
            <li>Each unit has three skills. Buy one and all your squads of that unit get it.</li>
            <li>You can buy one extra deployment per round for ${Game.CONFIG.extraDeployCost} gold. Tap a squad from an earlier round to sell it for half its worth: its price plus the upgrades it has.</li>`],
        ].map(([h, gist, body]) => `<details><summary><b>${h}</b><span>${gist}</span></summary><ul>${body}</ul></details>`).join('')}
      </div>
      </div>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
  }

  function showResult(sum) {
    const iWon = sum.winner === me && !sum.timeout, iLost = sum.winner === foe() && !sum.timeout;
    const head = sum.timeout ? 'Time ran out' : iWon ? `Round ${sum.round} won` : iLost ? `Round ${sum.round} lost` : 'Draw';
    const cls = iWon ? 'you' : iLost ? 'foe' : '';
    const them = foeName();
    const lines = [];
    if (sum.dmg[foe()]) lines.push(`${them} takes <b class="num">${sum.dmg[foe()]}</b> damage.`);
    if (sum.dmg[me]) lines.push(`You take <b class="num">${sum.dmg[me]}</b> damage.`);
    if (!sum.dmg[0] && !sum.dmg[1]) lines.push('Nobody takes damage.');
    if (sum.towerFell && sum.towerFell[foe()]) lines.push(`You broke ${mode === 'claude' ? 'Claude’s' : 'the enemy’s'} tower.`);
    if (sum.towerFell && sum.towerFell[me]) lines.push('Your tower fell.');
    const lv = (list) => list.map(x => `${esc(units[x.unit].name)} (to level ${x.level + 1})`).join(', ');
    const lvLines = [];
    if (solo() && lastAiLevels.length) lvLines.push(`<p><span style="color:var(--gold)">${them} leveled up before the fight:</span> ${lv(lastAiLevels)}.</p>`);
    if (mode === 'claude' && claude.did.length) lvLines.push(`<p><span style="color:var(--gold)">Claude also:</span> ${esc(claude.did.join(', '))}.</p>`);
    if (mode === 'claude' && claude.say) lvLines.push(`<p class="big" style="color:var(--foe);font-style:italic">“${esc(claude.say)}”</p>`);
    if (mode === 'claude' && claude.note) lvLines.push(`<p>${esc(claude.note)}</p>`);
    if (sum.gentlemen && sum.gentlemen[me].length) lvLines.push(`<p><span style="color:${CHARM_COL}">Now Gentlemen (5 Charisma):</span> ${sum.gentlemen[me].map(x => esc(units[x.unit].name)).join(', ')}.</p>`);
    if (sum.converted && (sum.converted[me] || sum.converted[foe()])) lvLines.push(`<p><span style="color:${CHARM_COL}">Won over:</span> ${[sum.converted[me] ? `your Gentlemen charmed ${sum.converted[me]} enemy ${sum.converted[me] === 1 ? 'body' : 'bodies'}` : '', sum.converted[foe()] ? `${sum.converted[foe()]} of yours went over to ${esc(them)}` : ''].filter(Boolean).join('; ')}.</p>`);
    if (sum.newlyReady[me].length) lvLines.push(`<p><span style="color:var(--gold)">Ready to level up:</span> ${lv(sum.newlyReady[me])}.</p>`);
    resultShownAt = now();
    if (m.over) {
      const win = m.winner === me, loss = m.winner === foe();
      phase = 'end'; hud(); netStatus();
      const wait = !solo() && rematch[me];
      overlay(`<div class="card">
        <span class="eyebrow">After ${m.history.length} rounds</span>
        <h2 class="${win ? 'you' : loss ? 'foe' : ''}">${win ? 'Victory' : loss ? 'Defeat' : 'Draw'}</h2>
        <p class="big">${lines.join(' ')}</p>
        ${!solo() && rematch[foe()] && !rematch[me] ? '<p>Your opponent wants a rematch.</p>' : ''}
        <div class="btnrow">
          ${solo() ? '<button class="btn primary" id="again">Play again</button>'
            : `<button class="btn primary" id="again" ${wait ? 'disabled' : ''}>${wait ? 'Waiting for opponent…' : 'Rematch'}</button>`}
          <button class="btn" id="menu">Main menu</button>
        </div>
      </div>`);
      $('panel').innerHTML = '';
      $('again').addEventListener('click', mode === 'claude' ? startClaudeMatch : mode === 'ai' ? startAiMatch : askRematch);
      $('menu').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
      return;
    }
    phase = 'result'; hud(); netStatus();
    const gold = [`+${sum.income || Game.incomeFor(sum.round + 1)} gold`];
    if (sum.bonusTo === me) gold.push(`+${Game.LOSER_BONUS} for losing`);
    if (sum.felix && sum.felix[me]) gold.push(`+${sum.felix[me]} Felix`);
    if (sum.invest && sum.invest[me]) gold.push(`+${sum.invest[me]} investment`);
    if (sum.loan && sum.loan[me]) gold.push(`−${sum.loan[me]} loan`);
    const waiting = !solo() && nextReady[me];
    overlay(`<div class="card">
      <h2 class="${cls}">${head}</h2>
      <p class="big">${lines.join(' ')}</p>
      ${lvLines.join('')}
      <p class="num" style="color:var(--gold)">${gold.join(' · ')}</p>
      <div class="btnrow">
        ${waiting ? '<p class="status wait">Waiting for your opponent</p>' : `<button class="btn primary" id="next">Next round</button>`}
        <button class="btn" id="menu">Main menu</button>
      </div>
    </div>`);
    $('panel').innerHTML = '';
    if ($('next')) $('next').addEventListener('click', tapNext);
    // leaving mid-match takes a second tap, so it can't happen by accident
    $('menu').addEventListener('click', () => {
      const b = $('menu');
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = solo() ? 'Tap again to quit this match' : 'Tap again to leave your opponent'; return; }
      showStart();
    });
  }

  // ---------- Main menu from the in-match settings: leaving a match that is still on forfeits it ----------
  function askForfeit() {
    if (!m || phase === 'end') { quitToMenu(); return; }
    $('sheet').innerHTML = `
      <div class="bar" data-keep><h3 id="sheet-h">Main menu</h3></div>
      <p class="big" style="margin:0">You will forfeit the match. Are you sure?</p>
      <span class="btnrow"><button class="btn primary" id="forfeit-yes">Yes</button><button class="btn" id="forfeit-no">No</button></span>`;
    $('forfeit-yes').addEventListener('click', forfeit);
    $('forfeit-no').addEventListener('click', openSoundSheet);
  }
  function quitToMenu() { if (mode === 'host') clearHost(); closeSheet(true); showStart(); }
  function forfeit() {
    if (!m || phase === 'end') { quitToMenu(); return; }
    if (!solo() && net.connected) {
      send({ t: 'forfeit' });
      // showStart drops the connection: keep it a moment longer so the message gets there
      const c = net.conn, pr = net.peer;
      net.conn = null; net.peer = null; net.connected = false;
      setTimeout(() => { try { c.close(); } catch (e) {} try { pr.destroy(); } catch (e) {} }, 1500);
    }
    quitToMenu(); // the host's saved match goes too, so the link can't resume it
  }
  // the other player forfeited: this one wins
  function foeForfeited() {
    if (!m || phase === 'end') return;
    if (mode === 'host') clearHost();
    leaveNet(); cancelAnimationFrame(raf);
    m.over = true; m.winner = me; phase = 'end'; bt = null; battlePre = null; deadline = 0; selected = null; resultShownAt = 0;
    closeSheet(true); hud(); setNet(''); $('clock').textContent = ''; render();
    overlay(`<div class="card">
      <span class="eyebrow">Round ${m.round}</span>
      <h2 class="you">Victory</h2>
      <p class="big">Your opponent forfeited the match.</p>
      <div class="btnrow"><button class="btn primary" id="menu">Main menu</button></div>
    </div>`);
    $('panel').innerHTML = '';
    $('menu').addEventListener('click', showStart);
  }

  // ---------- match reports ----------
  // Inside Claude, every match on this screen is saved to the artifact's own storage (only the owner and editors
  // can read it), so Claude can look back at how matches went when asked.
  let reportDb = null, report = null, reportChain = Promise.resolve();
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') reportDb = await window.claude.use('db'); } catch (e) { reportDb = null; }
    if (reportDb && phase === 'start') showStart();
  })();
  function startReport() {
    report = null;
    if (!reportDb || mode === 'guest') return;
    const t = new Date();
    report = {
      id: 'm' + t.getTime().toString(36), mode, started: t.toISOString(), updated: t.toISOString(),
      units: units.map(u => u.name), customUnits: customSet, timer: mode === 'host' ? DEPLOY_SECONDS : (timerOn ? DEPLOY_SECONDS : 0),
      over: false, winner: null, rounds: [],
    };
  }
  function armyOf(match, side) {
    return match.armies[side].map(q => ({ unit: units[q.unit].name, col: q.col, row: q.row, level: q.level + 1, placed: q.round }));
  }
  const unlocksOf = (match, side) => units.map((u, i) => Game.unlockCost(match, i) > 0 && Game.isUnlocked(match, side, i) ? u.name : null).filter(Boolean);
  function skillsOf(match, side) {
    const out = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.hasSkill(match, side, i, k) && !Game.isInnate(match, i, k)) out.push(`${(u.skillDefs[k] || {}).name} (${u.name})`); }));
    return out;
  }
  function recordRound(pre, sum) {
    if (!report || !reportDb) return;
    const p = withUnits(pre), you = me, them = foe();
    const entry = {
      round: sum.round,
      you: { hpBefore: p.hp[you], gold: p.gold[you], army: armyOf(p, you), skills: skillsOf(p, you), tower: (p.towers && p.towers[you]) || null, unlocked: unlocksOf(p, you), character: Game.charOf(p, you), package: Game.packOf(p, you) ? Game.packOf(p, you).squads.map(ui => units[ui].name) : null },
      them: { hpBefore: p.hp[them], gold: p.gold[them], army: armyOf(p, them), skills: skillsOf(p, them), tower: (p.towers && p.towers[them]) || null, unlocked: unlocksOf(p, them), character: Game.charOf(p, them), package: Game.packOf(p, them) ? Game.packOf(p, them).squads.map(ui => units[ui].name) : null },
      result: { winner: sum.winner === you ? 'you' : sum.winner === them ? 'them' : 'draw', timeout: !!sum.timeout, seconds: Math.round(sum.time), damageToYou: sum.dmg[you], damageToThem: sum.dmg[them], yourTowerFell: !!(sum.towerFell && sum.towerFell[you]), theirTowerFell: !!(sum.towerFell && sum.towerFell[them]) },
    };
    if (mode === 'claude') entry.claude = { said: claude.say || null, alsoDid: claude.did.slice(), leveledUp: lastAiLevels.map(x => `${units[x.unit].name} to level ${x.level + 1}`), botPlayed: !!claude.bot, note: claude.note || null };
    report.rounds.push(entry);
    report.updated = new Date().toISOString();
    if (m && m.over) { report.over = true; report.winner = m.winner === you ? 'you' : m.winner === them ? 'them' : 'draw'; report.hpLeft = { you: m.hp[you], them: m.hp[them] }; }
    const body = JSON.parse(JSON.stringify(report)), ref = reportDb.doc('matches/' + report.id);
    reportChain = reportChain.then(() => ref.set(body)).catch((e) => console.warn('match report not saved', e && e.code));
  }

  // ---------- match history ----------
  // Two-player matches only: the host's phone posts each round, once, to a Google Sheet web app
  // (tools/match-history.gs, deployed from the sheet). Empty URL: nothing is saved and the Match history button is hidden.
  const HISTORY_URL = 'https://script.google.com/macros/s/AKfycbzEXvAprmkKnWLvx0RhqIwjW90EAuL4GSeeRN1vvN5kz6VxZEJQ9Xx_vcwSbDBNi3rI/exec';
  function saveHistory(pre, sum) {
    if (!HISTORY_URL || mode !== 'host') return;
    const p = withUnits(pre), charName = (sd) => { const c = Game.charInfo(Game.charOf(p, sd)); return c ? c.name : ''; };
    const army = (sd) => armyOf(p, sd).map(q => `${q.unit} L${q.level}`).join(', ');
    const row = {
      code: net.code, round: sum.round, map: (Game.mapOf(p) || {}).name || '', hostChar: charName(0), guestChar: charName(1),
      winner: sum.winner === 0 ? 'host' : sum.winner === 1 ? 'guest' : 'draw', timeout: !!sum.timeout, seconds: Math.round(sum.time),
      dmgHost: sum.dmg[0], dmgGuest: sum.dmg[1], hpHost: m.hp[0], hpGuest: m.hp[1], over: !!m.over,
      matchWinner: m.over ? (m.winner === 0 ? 'host' : m.winner === 1 ? 'guest' : 'draw') : '',
      hostArmy: army(0), guestArmy: army(1), hostSkills: skillsOf(p, 0).join(', '), guestSkills: skillsOf(p, 1).join(', '),
    };
    // text/plain keeps it a simple request (no CORS preflight, which Apps Script doesn't answer)
    try { fetch(HISTORY_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(row) }).catch(() => {}); } catch (e) {}
  }
  async function openHistorySheet() {
    $('sheet').innerHTML = `<div class="bar"><h3 id="sheet-h">Match history</h3><button class="btn small" id="close">Close</button></div>
      <p class="hint" id="hist-msg" aria-live="polite" style="margin:0">Loading…</p><ul class="hist" id="hist"></ul>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    let rows;
    try { rows = (await (await fetch(HISTORY_URL + '?n=40')).json()).rows || []; } catch (e) { rows = null; }
    if (!$('hist')) return;
    if (!rows) { $('hist-msg').textContent = 'Couldn’t load the history. Check your connection and try again.'; return; }
    $('hist-msg').textContent = rows.length ? `The latest ${rows.length === 1 ? 'battle' : rows.length + ' battles'} from two-player matches.` : 'No battles saved yet. Play a match against a friend.';
    $('hist').innerHTML = rows.map(r => {
      const who = (w) => w === 'host' ? (r.hostChar || 'Host') : w === 'guest' ? (r.guestChar || 'Guest') : 'Draw';
      const when = new Date(r.time), t = isNaN(when) ? '' : when.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      return `<li>${esc(r.hostChar || 'Host')} vs ${esc(r.guestChar || 'Guest')} · round ${esc(r.round)}: ${r.winner === 'draw' ? 'draw' : esc(who(r.winner)) + ' won'}${r.timeout ? ' on time' : ''}
        <span>${esc(t)} · match ${esc(r.code)}${r.map ? ' · ' + esc(r.map) : ''} · damage ${esc(r.dmgHost)}/${esc(r.dmgGuest)}${r.over === true || r.over === 'TRUE' ? ` · match over, ${r.matchWinner === 'draw' ? 'draw' : esc(who(r.matchWinner)) + ' won'}` : ''}</span>
        <span>${esc(r.hostArmy || '–')} vs ${esc(r.guestArmy || '–')}</span></li>`;
    }).join('');
  }

  // ---------- flow: vs Claude ----------
  // Only inside Claude: the page asks Claude (on the player's own account) for its move each round.
  let sampleFn = null;
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
    if (sampleFn && phase === 'start') showStart();
  })();
  const claude = { busy: false, fightWaiting: false, bot: false, off: false, did: [], say: '', note: '', started: 0, ctl: null, history: [] };

  function startClaudeMatch() {
    if (!sampleFn) { startAiMatch(); return; }
    leaveNet();
    mode = 'claude'; me = 0; restoreSet();
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, mapPick, m && m.map ? m.map.id : null, offChars, matchOpts());
    nextReady = [false, false]; rematch = [false, false];
    claude.off = false; claude.history = [];
    startReport();
    beginAiRound();
  }

  function claudeStatus() {
    if (claude.busy) return `Claude is planning its move… ${Math.max(0, Math.round((now() - claude.started) / 1000))} s`;
    if (claude.bot) return claude.off ? 'The bot is playing for Claude.' : 'Claude had trouble this round, so the bot played it.';
    return 'Claude has made its move.';
  }
  setInterval(() => { if (mode === 'claude' && phase === 'deploy' && claude.busy) { const h = $('panel').querySelector('.bar:last-child .hint'); if (h) h.textContent = claudeStatus(); } }, 1000);

  function startClaudeTurn() {
    claude.did = []; claude.say = ''; claude.note = ''; claude.fightWaiting = false; claude.bot = false;
    if (claude.off) { Game.aiDeploy(m, 1); claude.bot = true; return; }
    const round = m.round, prompt = claudePrompt();
    claude.busy = true; claude.started = now();
    if (claude.ctl) claude.ctl.abort();
    const ctl = claude.ctl = new AbortController();
    const opts = { modelTier: 'complex', cache: false, signal: ctl.signal };
    const once = () => typeof sampleFn.json === 'function'
      ? sampleFn.json(prompt, opts)
      : sampleFn(prompt, opts).then(r => { const t = r.text, a = t.indexOf('{'), b = t.lastIndexOf('}'); return JSON.parse(t.slice(a, b + 1)); });
    const fatal = (e) => e && ['cancelled', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired', 'rate_limited'].includes(e.code);
    // one retry on a hiccup before the bot steps in
    const ask = once().catch(e => (fatal(e) || ctl !== claude.ctl || m.round !== round) ? Promise.reject(e) : once());
    ask.then((mv) => {
      if (ctl !== claude.ctl || mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      applyClaudeMove(mv && typeof mv === 'object' ? mv : {});
    }, (e) => {
      if (ctl !== claude.ctl || (e && e.code === 'cancelled')) return;
      if (mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].includes(code)) {
        claude.off = true;
        claude.note = code === 'not_granted' ? 'Claude wasn’t allowed to play, so the bot is playing for it this match.' : 'Claude isn’t available here, so the bot is playing for it this match.';
      } else claude.note = code === 'rate_limited' ? 'Claude hit a usage limit this round, so the bot played it.' : 'Claude had trouble this round, so the bot played it.';
      Game.aiDeploy(m, 1); claude.bot = true;
    }).finally(() => {
      if (ctl !== claude.ctl) return;
      claude.busy = false;
      if (mode === 'claude' && phase === 'deploy') {
        if (claude.fightWaiting) { claude.fightWaiting = false; runFight(); }
        else panelDeploy();
      }
    });
  }

  // Everything Claude needs to know, from its own (red) side of the board
  function claudePrompt() {
    const n1 = (x, d = 1) => Math.round(x * 10 ** d) / 10 ** d;
    const unitLine = (u, i) => {
      const t = [];
      if (u.splash > 0) t.push(`splash ${u.splash} m`);
      if (u.defense === 'armor') t.push(`armor ${u.defVal}`);
      if (u.defense === 'ward') t.push(`ward ${u.defVal} (max damage per hit)`);
      if (u.burst > 1) t.push(`burst ${u.burst}`);
      if (u.flame > 0) t.push(`flamethrower: every attack hits all enemies in range within ${u.flame}° to each side of its target`);
      else if (u.pellets > 1) t.push(`shotgun ${u.pellets}`);
      if (u.spinUp > 0) t.push(`spin-up ${u.spinUp}%/s on one target, up to 3x attack speed, starts over when it switches target`);
      if (u.spinHit > 0) t.push(`damage spin-up ${u.spinHit}%/s on one target, up to 3x hit size, starts over when it switches target`);
      if (u.pierce > 0) t.push(`pierce ${u.pierce}`);
      if (u.projSpeed > 0) t.push(`projectile ${u.projSpeed} m/s`);
      if (u.minRange > 0) t.push(`min range ${u.minRange} m`);
      if (u.charge > 1) t.push(`charge x${u.charge}`);
      if (u.knockback > 0) t.push(`knockback ${u.knockback} m`);
      if (u.trample > 0) t.push(`tramples ${u.trample}%`);
      if (u.chargeStun > 0) t.push(`stunned ${u.chargeStun} s after each charge (can't move or attack)`);
      if (u.pctHit > 0) t.push(`every hit also deals ${u.pctHit}% of the target's max health, ignoring armor (not to towers)`);
      if (u.deathBlast > 0) t.push(`explodes on death for ${u.deathBlast}% of max health within ${Engine.BLAST_RADIUS} m`);
      if (u.windUp > 0) t.push(`wind-up ${u.windUp} s`);
      if (u.ram) t.push(`NEVER ATTACKS: runs straight at the enemy tower (the nearest enemy once it is down) and rams it once for its hit (${n1(u.hit)}), then is destroyed`);
      if (u.carrier) t.push('CARRIES ONE SQUAD of any other unit, hidden from the opponent until it is destroyed: place a squad on its tile (price and deployment as usual) and it rides inside, then jumps out where the carrier falls');
      if (u.noFlank) t.push('can\'t be placed on flank tiles');
      const sk = (u.skillDefs || []).map((d, k) => d ? `skill ${k + 1} "${d.name}" (${Game.isInnate(m, i, k) ? 'BUILT IN: always on for both players, free' : `${Game.skillCost(m, i, k)} gold${Game.hasSkill(m, 1, i, k) ? ', YOU OWN IT' : ''}`}): ${Engine.describeSkill(d)}` : null).filter(Boolean);
      const lock = Game.isUnlocked(m, 1, i) ? (Game.unlockCost(m, i, 1) ? ' [unlocked]' : '') : ` [LOCKED: unlock once for ${Game.unlockCost(m, i, 1)} gold before you can place it]`;
      return `- ${u.name}${lock}: price ${Game.shopCost(m, 1, i)}${Game.startLevel(m, 1) ? ` (squads start at level ${Game.startLevel(m, 1) + 1})` : ''}, ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'} x ${n1(u.hp, 0)} hp each, hit ${n1(u.hit)} x ${n1(u.aps, 2)}/s, range ${u.range} m, speed ${u.speed} m/s${t.length ? ', ' + t.join(', ') : ''}. Level-up cost ${Game.levelCost(u)}.${sk.length ? '\n    ' + sk.join('\n    ') : ''}`;
    };
    const tag = (u) => u.name;
    const matrix = units.map((u, i) => `${tag(u)}: ` + units.map((v, j) => i === j ? null : `${tag(v)} ${M[i][j] > 0 ? '+' : ''}${Math.round(M[i][j] * 100)}`).filter(Boolean).join(', ')).join('\n');
    const mine = m.armies[1].map(s => {
      const u = units[s.unit], need = s.level < Engine.MAX_LEVEL ? Math.round(Game.xpNeeded(u, s.level)) : null;
      return `- id ${s.id}: ${u.name} at col ${s.col}, row ${s.row}${Game.isRider(s) ? ` (riding inside your ${units[(Game.carrierOf(m, 1, s) || s).unit].name}, id ${s.in})` : ''}, level ${s.level + 1}${need ? `, XP ${Math.round(s.xp)}/${need}` : ', max level'}${Game.isReady(m, s) ? ', READY TO LEVEL UP' : ''}${s.round < m.round ? `, sells for ${Game.sellValue(m, s)}` : ''}${Game.enzoSkill(m, 1, s) != null ? `, has skill "${u.skillDefs[Game.enzoSkill(m, 1, s)].name}" (Enzo)` : ''}${Game.charmOf(s) ? `, charisma ${Game.charmOf(s)}/${Engine.CHARM_MAX}${Game.isGentleman(s) ? ' (Gentleman)' : ''}` : ''}`;
    });
    const theirs = m.armies[0].filter(s => s.round < m.round && !Game.hiddenFromFoe(m, s)).map(s => { const p = Game.seenAt(m, s); return `- ${units[s.unit].name} at col ${p.col}, row ${p.row}, level ${s.level + 1}`; });
    const theirSkills = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.skillVisible(m, 0, i, k)) theirSkills.push(`${(u.skillDefs[k] || {}).name} on ${u.name}`); }));
    const hist = m.history.slice(-4).map(h => `- round ${h.round}: ${h.timeout ? 'time ran out' : h.winner === 1 ? 'you won' : h.winner === 0 ? 'you lost' : 'draw'}; you took ${h.dmg[1]} damage, they took ${h.dmg[0]}`);
    // how each unit type did in the last fight
    const last = m.history[m.history.length - 1];
    const howDid = (side) => {
      if (!last || !last.squads) return [];
      const by = {};
      for (const q of last.squads[side]) { const b = by[q.unit] || (by[q.unit] = { n: 0, left: 0, dealt: 0 }); b.n++; b.left += q.left; b.dealt += q.dealt; }
      return Object.keys(by).sort((a, b) => by[b].dealt - by[a].dealt).map(ui => { const b = by[ui]; return `  ${units[ui].name} x${b.n}: dealt ${b.dealt} damage, ${Math.round(b.left / b.n * 100)}% of bodies survived`; });
    };
    const lastFight = last && last.squads ? `LAST FIGHT (round ${last.round}, ${last.winner === 1 ? 'you won' : last.winner === 0 ? 'you lost' : 'draw'} in ${Math.round(last.time)} s)${last.towerFell ? (last.towerFell[1] ? '. YOUR TOWER FELL' : '') + (last.towerFell[0] ? '. THEIR TOWER FELL' : '') : ''}
Your units:
${howDid(1).join('\n') || '  none'}
Their units:
${howDid(0).join('\n') || '  none'}
` : '';
    // their army by unit type, weighted by what it's worth (price x level), and which units beat it
    const foeArmy = m.armies[0].filter(s => s.round < m.round);
    const foeW = {}; let foeTotal = 0;
    for (const s of foeArmy) { const w = Game.unitCostOf(units[s.unit]) * (s.level + 1); foeW[s.unit] = (foeW[s.unit] || 0) + w; foeTotal += w; }
    const answers = foeTotal ? units.map((u, i) => [i, Object.keys(foeW).reduce((a, j) => a + (+j === i ? 0 : M[i][j] * foeW[j]), 0) / foeTotal]).sort((a, b) => b[1] - a[1]) : [];
    const pct = (x) => `${x > 0 ? '+' : ''}${Math.round(x * 100)}`;
    const foeMix = Object.keys(foeW).sort((a, b) => foeW[b] - foeW[a]).map(j => `${units[j].name} ${Math.round(foeW[j] / foeTotal * 100)}%`).join(', ');
    const counterLines = answers.length ? `THEIR ARMY by value: ${foeMix}
Your units ranked against their whole army (counter table weighted by their army value):
${answers.slice(0, 5).map(([i, v]) => `  ${units[i].name} ${pct(v)}`).join('\n')}
Worst choices against it: ${answers.slice(-3).reverse().map(([i, v]) => `${units[i].name} ${pct(v)}`).join(', ')}
` : '';
    const placeNow = Game.deploysAllowed(m, 1);
    const cheapest = Math.min(...units.map(u => Game.unitCostOf(u)));
    return `You are playing No Mans Land, a small auto-battler, against a human player. You are the RED side. Decide your moves for round ${m.round}. The human places their new squads at the same time and can't see yours until the fight. You only see their squads from earlier rounds. Play to win: build counters to what they have, protect your damage dealers, and think about what they are likely to add next.

RULES

  function applyClaudeMove(mv) {
    const list = (x) => Array.isArray(x) ? x.slice(0, 20) : [];
    const int = (x) => Math.round(Number(x));
    const unitIdx = (name) => units.findIndex(u => u.name.toLowerCase() === String(name || '').toLowerCase().trim());
    const did = [];
    if (Game.needsPack(m, 1)) {
      if (!Game.choosePack(m, 1, int(mv.package))) Game.choosePack(m, 1, 0);
      m.armies[1] = m.armies[1].filter(s => !s.free); // Claude places its package squads itself; any it leaves out are placed at the fight
    }
    if (Game.needsTower(m, 1)) { // the tower goes down first; a bad spot falls back to the default corner
      const tw = mv.tower && typeof mv.tower === 'object' ? mv.tower : null;
      if (!(tw && Game.placeTower(m, 1, int(tw.col), int(tw.row)))) Game.ensureTower(m, 1);
    }
    if (mv.towerType) Game.setTowerType(m, 1, String(mv.towerType));
    if (mv.towerSkill === true && Game.buyTowerSkill(m, 1)) did.push('bought its tower skill');
    if (mv.towerSkill2 === true && Game.buyTowerSkill2(m, 1)) did.push(`bought ${Game.towerType(m, 1).skill2.name}`);
    if (mv.loan === true && Game.takeLoan(m, 1)) did.push('took a bank loan');
    for (const id of [].concat(mv.mageGeneral || []).slice(0, 2).map(String)) if (Game.buyMageGen(m, 1, id)) did.push(`called the ${Game.mageGenInfo(id).name}`);
    for (const id of list(mv.sell)) {
      const sq = m.armies[1].find(s => s.id === int(id));
      if (sq && Game.sell(m, 1, sq.id)) did.push(`sold ${units[sq.unit].name}`);
    }
    const levels = [];
    for (const id of list(mv.levelUp)) {
      const sq = m.armies[1].find(s => s.id === int(id));
      if (sq && Game.levelUp(m, 1, sq.id)) levels.push({ id: sq.id, unit: sq.unit, level: sq.level });
    }
    const skills = list(mv.skills);
    const trySkills = () => {
      for (const x of skills) {
        if (!x || x.done) continue;
        const ui = unitIdx(x.unit), k = int(x.slot) - 1;
        if (ui >= 0 && k >= 0 && k < Engine.SKILL_SLOTS && Game.buySkill(m, 1, ui, k)) { x.done = true; did.push(`bought ${units[ui].skillDefs[k].name} for ${units[ui].name}`); }
      }
    };
    for (const name of list(mv.unlock)) { const ui = unitIdx(name); if (ui >= 0 && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`); }
    trySkills();
    const bribes = Math.max(0, Math.min(20, mv.bribe === true ? 1 : int(mv.bribe) || 0));
    let paid = 0;
    for (let k = 0; k < bribes; k++) if (Game.bribe(m, 1)) paid++;
    if (paid) did.push(`bribed the elves ${paid} ${paid === 1 ? 'time' : 'times'}`);
    if (mv.elfTower && typeof mv.elfTower === 'object' && Game.buyElfOwn(m, 1, int(mv.elfTower.col), int(mv.elfTower.row))) did.push(`placed an elf tower at col ${int(mv.elfTower.col)}, row ${int(mv.elfTower.row)}`);
    for (const a of list(mv.altar)) if (Game.buyAltar(m, 1, String(a))) did.push({ walls: 'raised ice walls', push: 'pushed the hailstorm', snowgre: 'summoned a Snowgre' }[a]);
    for (const q of list(mv.removeTiles)) if (q && Game.removeShroom(m, 1, int(q.col), int(q.row))) did.push(`removed the ${Game.shroomTileAt(m, int(q.col), int(q.row)).type} mushroom at col ${int(q.col)}, row ${int(q.row)}`);
    const extra = Math.max(0, Math.min(Game.CONFIG.maxExtraDeploys, int(mv.extraDeployments) || 0));
    for (let k = 0; k < extra; k++) Game.buyDeploy(m, 1);
    if (mv.move && typeof mv.move === 'object') {
      const sq = m.armies[1].find(s => s.id === int(mv.move.id) && s.round < m.round);
      if (sq && Game.moveSquad(m, 1, sq.id, int(mv.move.col), int(mv.move.row))) did.push(`moved ${units[sq.unit].name}`);
    }
    for (const pl of list(mv.place)) {
      const ui = unitIdx(pl && pl.unit);
      if (ui >= 0 && !Game.isUnlocked(m, 1, ui) && m.gold[1] >= Game.unlockCost(m, ui, 1) + Game.shopCost(m, 1, ui) && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`);
      if (ui >= 0) Game.place(m, 1, ui, int(pl.col), int(pl.row));
    }
    trySkills(); // skills for units placed just now
    while (m.extraDeploys[1] > 0 && Game.deploysLeft(m, 1) > 0 && Game.refundDeploy(m, 1)) {}
    lastAiLevels = levels;
    claude.did = did;
    claude.say = String(mv.say || '').replace(/\s+/g, ' ').trim().slice(0, 140);
    if (claude.say) claude.history.push(claude.say);
  }

  // Before a Factions match the players draft factions one at a time (Game.FACTION_MODE.order). The match is then
  // played with the drafted factions' units only (useSet swaps them in; restoreSet puts the player's own units back),
  // each player with their own two factions. Live: the host runs the draft; the guest sends its picks (dpick).
  let matchKind = 'standard'; // standard | factions: what Play vs AI / Start match / Rematch starts
  let draft = null, draftSel = null, draftTimer = 0, standardSet = null;
