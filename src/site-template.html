  function tourLeave(keep) {
    const was = tour.role, conns = [...tour.conns], conn = tour.conn, peer = tour.peer;
    tour.alive = false; clearTimeout(tour.timer);
    if (was === 'org' && !keep) for (const c of conns) { try { c.send({ t: 'ended' }); } catch (e) {} }
    setTimeout(() => { for (const c of conns) { try { c.close(); } catch (e) {} } try { if (conn) conn.close(); } catch (e) {} try { if (peer) peer.destroy(); } catch (e) {} }, was === 'org' && !keep ? 800 : 0);
    if (!keep) { try { localStorage.removeItem(was === 'org' ? TOUR_ORG : TOUR_ME); } catch (e) {} }
    Object.assign(tour, { role: null, code: '', peer: null, conns: new Set(), conn: null, connected: false, t: null, online: [], myId: '', alive: false, tries: 0, menu: false, pending: null, problem: '', tabSetDone: false });
    const u = new URLSearchParams(location.search);
    if (u.has('tour') || u.has('watch')) { u.delete('tour'); u.delete('watch'); qs.delete('tour'); qs.delete('watch'); history.replaceState(null, '', location.pathname + (u.toString() ? '?' + u : '')); }
  }

  // ----- the tournament screen -----
  const tourRoundName = (r) => {
    if (!r) return '';
    if (r.stage === 'playoff') { const b = Tour.bracket(tour.t).find(x => x.round === r); return b ? b.name : 'Playoffs'; }
    return `Round ${r.n} of ${Tour.swissRounds(tour.t)}`;
  };
  const mapName = (id) => { const mp = Game.MAPS.find(x => x.id === id); return mp ? mp.name : 'Random map'; };
  const tourOn = (id) => tourOrg() ? tourOnline().includes(id) : tour.online.includes(id);
  const dot = (id) => id ? `<i class="tdot ${tourOn(id) ? 'on' : ''}" title="${tourOn(id) ? 'online' : 'offline'}"></i>` : '';
  const pname = (id) => id == null ? '<i>Bye</i>' : `${dot(id)}${esc(Tour.nameOf(tour.t, id))}${id === tour.myId ? ' <small>(you)</small>' : ''}`;
  function tourResultText(mt) {
    if (mt.b == null) return `${esc(Tour.nameOf(tour.t, mt.a))} has a bye`;
    if (!mt.result) return mt.conflict ? 'Results disagree' : 'Playing';
    if (mt.result.winner === 'draw') return `Draw${mt.result.hp ? ` (${mt.result.hp[0]}–${mt.result.hp[1]})` : ''}`;
    return `${esc(Tour.nameOf(tour.t, mt[mt.result.winner]))} won${mt.result.hp ? ` (${mt.result.hp[0]}–${mt.result.hp[1]})` : ''}${mt.result.by === 'org' ? ' · set by organizer' : ''}`;
  }
  // redraw the tournament screen when it's showing (never over a match), and the start screen's tournament button
  function tourRedraw() {
    if (phase === 'lobby' && tourLive() && mode === 'host') { drawTourLobby(tourLive()); return; }
    if (phase !== 'start') return;
    if (!$('tour-root')) return;
    const a = document.activeElement;
    if (a && a.tagName === 'INPUT' && $('tour-root').contains(a)) { tour.dirty = true; return; } // don't wipe what they type
    showTour();
  }

  function showTour() {
    if (!tour.role) { showStart(); return; }
    const t = tour.t, org = tourOrg();
    phase = 'start'; render();
    if (!t) {
      overlay(`<div class="card" id="tour-root"><span class="eyebrow">Tournament</span><span class="code">${esc(tour.code)}</span>
        <p class="status wait">${esc(tour.problem || 'Connecting…')}</p><button class="btn" id="tour-leave">Leave</button></div>`);
      $('panel').innerHTML = '<span class="hint">Keep this page open.</span>';
      $('tour-leave').addEventListener('click', () => { tourLeave(false); showStart(); });
      return;
    }
    const x = tourMine(), r = Tour.current(t), me0 = Tour.player(t, tour.myId);
    let head = '', body = '', btns = '';
    if (t.status === 'lobby') {
      head = `${t.players.length} player${t.players.length === 1 ? '' : 's'} in`;
      body = org ? 'Send the invite link. Start when everyone is in.' : 'Waiting for the organizer to start.';
    } else if (t.status === 'done') {
      head = `🏆 ${esc(Tour.nameOf(t, t.champion))}`;
      body = t.champion === tour.myId ? 'You won the tournament!' : 'Tournament champion.';
    } else if (tour.role === 'watch') {
      head = esc(tourRoundName(r)); body = `${esc(mapName(r.map))} · ${r.matches.filter(mt => mt.b == null || mt.result).length} of ${r.matches.length} matches done`;
    } else if (!me0 || me0.dropped) {
      head = esc(tourRoundName(r)); body = me0 ? 'You are out of the tournament.' : 'You are watching.';
    } else if (!x) {
      head = esc(tourRoundName(r)); body = 'You have no match this round.';
    } else if (x.bye) {
      head = esc(tourRoundName(r)); body = 'You have a bye this round: it counts as a win.';
    } else {
      const foe = x.match[x.side === 'a' ? 'b' : 'a'];
      head = `vs ${esc(Tour.nameOf(t, foe))}`;
      if (x.match.result) {
        const o = Tour.outcome(x.match, tour.myId);
        body = `${o === 'win' ? 'You won' : o === 'loss' ? 'You lost' : 'Draw'}. ${Tour.roundDone(r) ? 'Waiting for the next round.' : 'Waiting for the other matches.'}`;
      } else {
        const host = tourIsHost(x);
        let saved = null; try { saved = JSON.parse(localStorage.getItem(HOST_STORE) || 'null'); } catch (e) {}
        const resume = host && saved && saved.code === x.match.code && saved.m;
        body = `${esc(tourRoundName(r))} · ${esc(mapName(r.map))} · ${host ? 'you host' : `${esc(Tour.nameOf(t, foe))} hosts`}${tourOn(foe) ? '' : ' · opponent offline'}`;
        btns = resume ? `<button class="btn primary" id="tour-resume">Resume match</button>` : `<button class="btn primary" id="tour-play">${host ? 'Start match' : 'Join match'}</button>`;
        if (x.match.conflict) body += ' · the results disagree: the organizer decides';
      }
    }
    overlay(`<div class="card" id="tour-root">
      <span class="eyebrow">${esc(t.name)} · ${esc(tour.code)}${org ? ' · organizer' : ''}</span>
      <h2>${head}</h2>
      <p class="big">${body}</p>
      ${tour.problem ? `<p class="status wait">${esc(tour.problem)}</p>` : ''}
      ${tour.role === 'player' && t.status === 'lobby' ? `<span class="hint">Your gamertag</span><span class="joinrow"><input class="tour-in" id="tour-name" maxlength="18" autocomplete="nickname" spellcheck="false" aria-label="Your gamertag" placeholder="Your gamertag" value="${esc(me0 ? me0.name : tour.myName)}"><button class="btn" id="tour-name-ok">Save</button></span>` : ''}
      ${btns ? `<div class="btnrow">${btns}</div>` : ''}
    </div>`);
    // the panel: tabs
    const tabs = [];
    if (org) tabs.push(['players', 'Players']);
    if (t.status !== 'lobby') tabs.push(['matches', 'Matches']);
    tabs.push(['standings', t.settings.format === 'elim' ? 'Results' : 'Standings']);
    if (t.rounds.some(x => x.stage === 'playoff') || (t.status === 'lobby' && t.settings.format === 'elim')) tabs.push(['bracket', 'Bracket']);
    if (!org) tabs.push(['rules', 'Rules']);
    if (org) tabs.push(['settings', 'Settings']);
    if (!tabs.some(([k]) => k === tour.tab)) tour.tab = tabs[0][0];
    $('panel').innerHTML = `<div class="tour" id="tour-panel">
      <div class="seg tour-tabs" role="tablist">${tabs.map(([k, n]) => `<button data-ttab="${k}" aria-pressed="${tour.tab === k}">${n}</button>`).join('')}</div>
      <div class="tour-body">${tourTab(tour.tab)}</div>
      <div class="bar">
        <span class="btnrow"><button class="btn small" id="tour-menu">Main menu</button>${org ? `<button class="btn small" id="tour-end">End tournament</button>` : `<button class="btn small" id="tour-leave">Leave tournament</button>`}</span>
      </div>
    </div>`;
    $('panel').querySelectorAll('[data-ttab]').forEach(b => b.addEventListener('click', () => { tour.tab = b.dataset.ttab; showTour(); }));
    if ($('tour-play')) $('tour-play').addEventListener('click', tourPlay);
    if ($('tour-resume')) $('tour-resume').addEventListener('click', () => { let s = null; try { s = JSON.parse(localStorage.getItem(HOST_STORE) || 'null'); } catch (e) {} tour.menu = false; if (s) resumeHost(s); });
    if ($('tour-name')) {
      const save = () => {
        const n = Tour.cleanName($('tour-name').value); if (!n) return;
        tour.myName = n; try { localStorage.setItem('pb-tour-name', n); } catch (e) {}
        tourSend({ t: 'name', name: n }); $('tour-name-ok').textContent = 'Saved';
      };
      $('tour-name-ok').addEventListener('click', save);
      $('tour-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { save(); $('tour-name').blur(); } });
      $('tour-name').addEventListener('blur', () => { if (tour.dirty) { tour.dirty = false; setTimeout(showTour, 0); } });
    }
    $('tour-menu').addEventListener('click', () => { tour.menu = true; showStart(); });
    if ($('tour-leave')) $('tour-leave').addEventListener('click', () => {
      const b = $('tour-leave'); if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tap again to leave'; return; }
      tourSend({ t: 'leave' }); tourLeave(false); showStart();
    });
    if ($('tour-end')) $('tour-end').addEventListener('click', () => {
      const b = $('tour-end'); if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tap again to end it for everyone'; return; }
      tourLeave(false); showStart();
    });
    wireTourTab();
  }

  function tourTab(k) {
    const t = tour.t, org = tourOrg(), s = { ...TOUR_DEFAULTS, ...t.settings };
    if (k === 'players') {
      const list = t.players.map(p => `<li class="prow"><span>${pname(p.id)}${p.dropped ? ' <small>(dropped)</small>' : ''}${p.id === t.org ? ' <small>· organizer</small>' : ''}</span>
        <span class="btnrow"><button class="btn small" data-rename="${p.id}">Rename</button>${p.dropped ? '' : `<button class="btn small" data-drop="${p.id}">${t.status === 'lobby' ? 'Remove' : 'Drop'}</button>`}</span></li>`).join('');
      return `${t.status === 'lobby' ? `<span class="hint">Invite link (players open it and pick a gamertag):</span>
        <div class="linkbox" id="tour-link">${esc(tourLink())}</div>
        <span class="btnrow">${navigator.share ? '<button class="btn primary small" id="tour-share">Share invite</button>' : ''}<button class="btn small" id="tour-copy">Copy invite</button><button class="btn small" id="tour-copy-watch">Copy big-screen link</button></span>` : ''}
        <ul class="tour-list">${list}</ul>
        ${t.status === 'lobby' ? `<div class="bar"><span class="hint">You play too</span><div class="seg"><button data-orgplays="1" aria-pressed="${!!Tour.player(t, t.org)}">Yes</button><button data-orgplays="0" aria-pressed="${!Tour.player(t, t.org)}">No, just organize</button></div></div>
        <span class="hint">${tourPlan()}</span>
        <button class="btn primary" id="tour-start" ${Tour.active(t).length >= 2 ? '' : 'disabled'}>Start tournament</button>` : ''}
        ${tour.problem ? `<span class="hint">${esc(tour.problem)}</span>` : ''}`;
    }
    if (k === 'matches') {
      const r = Tour.current(t);
      if (!r) return '<span class="hint">No matches yet.</span>';
      const rows = r.matches.map(mt => {
        const ctl = org && mt.b != null ? `<span class="btnrow tour-ctl">
          <button class="btn small" data-res="${mt.id}:a">${esc(Tour.nameOf(t, mt.a))} won</button><button class="btn small" data-res="${mt.id}:b">${esc(Tour.nameOf(t, mt.b))} won</button>${r.stage === 'playoff' ? '' : `<button class="btn small" data-res="${mt.id}:draw">Draw</button>`}
          <button class="btn small" data-replay="${mt.id}">Replay</button>${mt.result ? '' : `<button class="btn small" data-swap="${mt.id}">Swap host</button>`}</span>` : '';
        return `<li class="${mt.conflict ? 'warn' : ''}"><span>${pname(mt.a)} <small>vs</small> ${pname(mt.b)}</span>
          <small>${mt.b != null ? `host: ${esc(Tour.nameOf(t, mt[tourHostKey(mt)]))} · ` : ''}${tourResultText(mt)}</small>${ctl}</li>`;
      }).join('');
      const done = Tour.roundDone(r), last = Tour.nextPlan(t);
      return `<span class="hint">${esc(tourRoundName(r))} · ${esc(mapName(r.map))}</span><ul class="tour-list">${rows}</ul>
        ${org && t.status === 'running' ? `<div class="bar"><span class="hint">${done ? (last.done ? 'All matches are done.' : 'All matches are done.') : r.stage === 'playoff' && r.matches.some(mt => mt.result && mt.result.winner === 'draw') ? 'A playoff draw needs a replay or a winner.' : 'Waiting for results.'}</span>
          <span class="btnrow">${r.matches.some(mt => mt.b != null && mt.result) ? '' : '<button class="btn small" id="tour-undo">Undo pairings</button>'}<button class="btn primary small" id="tour-next" ${done ? '' : 'disabled'}>${done && last.done ? 'Finish tournament' : 'Next round'}</button></span></div>` : ''}
        ${t.rounds.length > 1 ? `<details class="tour-old"><summary>Earlier rounds</summary>${t.rounds.slice(0, -1).reverse().map(x => `<span class="hint">${esc(tourRoundName(x))} · ${esc(mapName(x.map))}</span><ul class="tour-list">${x.matches.map(mt => `<li><span>${pname(mt.a)} <small>vs</small> ${pname(mt.b)}</span><small>${tourResultText(mt)}</small></li>`).join('')}</ul>`).join('')}</details>` : ''}`;
    }
    if (k === 'standings') {
      const rows = (t.status === 'done' ? Tour.placings(t) : Tour.standings(t)).map((x, i) => `<tr class="${x.id === tour.myId ? 'me' : ''}${x.dropped ? ' out' : ''}"><td class="num">${i + 1}</td><td>${x.id === t.champion ? '🏆 ' : ''}${pname(x.id)}</td><td class="num">${x.wins}-${x.draws}-${x.losses}</td><td class="num">${x.points}</td><td class="num">${x.buchholz}</td><td class="num">${x.hpDiff > 0 ? '+' : ''}${x.hpDiff}</td></tr>`).join('');
      return `<table class="tour-tbl"><thead><tr><th>#</th><th>Player</th><th>W-D-L</th><th>Pts</th><th title="Buchholz: the opponents' points added up">Opp</th><th title="Health left minus the opponents' health left, over all games">HP±</th></tr></thead><tbody>${rows}</tbody></table>
        <span class="hint">${t.settings.format === 'elim' ? 'Knockout: the bracket decides; this table counts all games.' : `Win 1 point, draw ½, bye 1. Ties: opponents' points (Opp), then health difference (HP±).${Tour.cutSize(t) >= 2 ? ` After ${Tour.swissRounds(t)} rounds the top ${Tour.cutSize(t)} play off.` : ''}`}</span>`;
    }
    if (k === 'bracket') {
      const b = Tour.bracket(t);
      if (!b.length) return `<span class="hint">${t.settings.format === 'elim' ? 'The bracket is drawn when the tournament starts.' : `The top ${Tour.cutSize(t)} play off after the Swiss rounds.`}</span>`;
      return `<div class="tour-bracket">${b.map(x => `<div class="tour-col"><span class="eyebrow">${esc(x.name)}</span>${x.round.matches.map(mt => {
        const w = Tour.winnerOf(mt), cell = (id) => `<span class="${w && w === id ? 'w' : w ? 'l' : ''}">${id == null ? '<i>Bye</i>' : esc(Tour.nameOf(t, id))}</span>`;
        return `<div class="tour-pair">${cell(mt.a)}${cell(mt.b)}</div>`;
      }).join('')}</div>`).join('')}${t.champion ? `<div class="tour-col"><span class="eyebrow">Champion</span><div class="tour-pair"><span class="w">🏆 ${esc(Tour.nameOf(t, t.champion))}</span></div></div>` : ''}</div>`;
    }
    if (k === 'rules') return `<ul class="tour-rules">${tourRules().map(x => `<li>${x}</li>`).join('')}</ul>`;
    if (k === 'settings') {
      const lobby = t.status === 'lobby', segOf = (key, opts, label) => `<div class="bar"><span class="hint">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v, n]) => `<button data-tset="${key}" data-v="${v}" aria-pressed="${String(s[key]) === String(v)}">${n}</button>`).join('')}</div></div>`;
      const n = Tour.active(t).length;
      return `${lobby ? `<div class="bar"><span class="hint">Name</span><span class="joinrow"><input class="tour-in" id="tour-tname" maxlength="18" value="${esc(t.name)}" aria-label="Tournament name"><button class="btn small" id="tour-tname-ok">Save</button></span></div>
        ${segOf('format', [['swiss', 'Swiss + playoffs'], ['elim', 'Knockout']], 'Format')}
        ${s.format === 'swiss' ? segOf('swissRounds', [[0, `Auto (${Tour.suggestRounds(n)})`], [2, 2], [3, 3], [4, 4], [5, 5]], 'Swiss rounds') + segOf('cut', [[-1, `Auto (${Tour.suggestCut(n) ? 'top ' + Tour.suggestCut(n) : 'none'})`], [0, 'None'], [2, 'Top 2'], [4, 'Top 4'], [8, 'Top 8']], 'Playoffs') : ''}` : '<span class="hint">Format and players are set once it has started. The rest counts from the next match on.</span>'}
        ${segOf('packOptions', [[2, 2], [3, 3], [4, 4], [5, 5]], 'Leader choices')}
        ${segOf('mirror', [[true, 'Same for both'], [false, 'Own rolls']], 'Leaders, units, towers')}
        ${segOf('deploy1', [[60, '60 s'], [90, '90 s'], [120, '120 s'], [150, '150 s']], 'Deploy timer, round 1')}
        ${segOf('deploy', [[45, '45 s'], [60, '60 s'], [90, '90 s'], [120, '120 s']], 'Deploy timer, later rounds')}
        ${segOf('next', [[10, '10 s'], [20, '20 s'], [30, '30 s']], 'Results screen')}
        <span class="hint">Map and look below: Random means a new map each round, the same for every match in it.</span>
        ${mapSeg()}
        ${packSeg()}
        ${charSeg()}`;
    }
    return '';
  }
  function tourPlan() {
    const t = tour.t, n = Tour.active(t).length;
    if (n < 2) return 'At least 2 players are needed.';
    if (t.settings.format === 'elim') { let k = 0; while ((1 << k) < n) k++; return `${n} players: a knockout of ${k} rounds, seeded at random.`; }
    const c = Tour.cutSize(t);
    return `${n} players: ${Tour.swissRounds(t)} Swiss rounds${c >= 2 ? `, then the top ${c} play off (${Math.log2(c) | 0} more round${c > 2 ? 's' : ''})` : ''}.`;
  }
  function tourRules() {
    const t = tour.t, s = { ...TOUR_DEFAULTS, ...t.settings };
    const pack = s.pack === 'standard' ? 'Standard pack' : `All units${s.offUnits.length ? ` (minus ${s.offUnits.length})` : ''}`;
    return [
      tourPlan(),
      `Map: ${s.map ? esc(mapName(s.map)) : 'a random one each round, the same in every match'}.`,
      `${esc(pack)}. Pick from ${s.packOptions} leaders${s.mirror ? ', and both players get the same leaders, starting units and tower choices' : ''}.`,
      `Deploy timer: ${s.deploy1} s in round 1, then ${s.deploy} s.`,
      'Your match shows on this screen. Tap Start match (if you host) or Join match. The result is sent by itself.',
    ];
  }
  function wireTourTab() {
    const P = $('panel'), t = tour.t;
    const on = (sel, f) => P.querySelectorAll(sel).forEach(b => b.addEventListener('click', () => f(b)));
    if ($('tour-copy')) $('tour-copy').addEventListener('click', () => { const l = tourLink(); if (navigator.clipboard) navigator.clipboard.writeText(l).then(() => { $('tour-copy').textContent = 'Copied'; }, () => {}); });
    if ($('tour-copy-watch')) $('tour-copy-watch').addEventListener('click', () => { const l = tourLink(true); if (navigator.clipboard) navigator.clipboard.writeText(l).then(() => { $('tour-copy-watch').textContent = 'Copied'; }, () => {}); });
    if ($('tour-share')) $('tour-share').addEventListener('click', () => navigator.share({ title: t.name, text: `Join ${t.name} in No Mans Land! Pick a gamertag when you're in.`, url: tourLink() }).catch(() => {}));
    if (!tourOrg()) return;
    on('[data-rename]', (b) => { const p = Tour.player(t, b.dataset.rename); const n = p && prompt('New gamertag', p.name); if (n && Tour.rename(t, p.id, n)) tourChanged(); });
    on('[data-drop]', (b) => {
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Sure?'; return; }
      const id = b.dataset.drop;
      for (const c of tour.conns) if (c.tourId === id && t.status === 'lobby') { try { c.send({ t: 'kicked' }); } catch (e) {} }
      Tour.remove(t, id);
      tourChanged();
    });
    on('[data-orgplays]', (b) => {
      if (b.dataset.orgplays === '1') { let n = ''; try { n = localStorage.getItem('pb-tour-name') || ''; } catch (e) {} Tour.join(t, t.org, n || 'Organizer'); }
      else Tour.remove(t, t.org);
      tourChanged();
    });
    if ($('tour-start')) $('tour-start').addEventListener('click', () => { tourCapture(); tourAdvance(); });
    if ($('tour-next')) $('tour-next').addEventListener('click', tourAdvance);
    if ($('tour-undo')) $('tour-undo').addEventListener('click', () => { if (Tour.undoRound(t)) { tour.tab = t.status === 'lobby' ? 'players' : 'matches'; tourChanged(); } });
    on('[data-res]', (b) => {
      const [id, w] = b.dataset.res.split(':'), f = Tour.findMatch(t, id); if (!f) return;
      const old = f.match.result && f.match.result.hp;
      if (Tour.report(t, id, w, old || [0, 0], (f.match.result && f.match.result.rounds) || 0, 'org')) tourChanged();
    });
    on('[data-replay]', (b) => { if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Sure?'; return; } if (Tour.replay(t, b.dataset.replay, Math.random)) tourChanged(); });
    on('[data-swap]', (b) => { if (Tour.swapHost(t, b.dataset.swap)) tourChanged(); });
    on('[data-tset]', (b) => {
      const k = b.dataset.tset, v = b.dataset.v;
      t.settings[k] = v === 'true' ? true : v === 'false' ? false : /^-?\d+$/.test(v) ? +v : v;
      tourChanged();
    });
    if ($('tour-tname-ok')) {
      const save = () => { const n = Tour.cleanName($('tour-tname').value); if (n) { t.name = n; tourChanged(); } };
      $('tour-tname-ok').addEventListener('click', save);
      $('tour-tname').addEventListener('keydown', (e) => { if (e.key === 'Enter') { $('tour-tname').blur(); save(); } });
    }
    if (tour.tab === 'settings') {
      // the menu's own pickers (map, look, unit pack, leaders, units): they keep working as on the menu; what they
      // pick is copied into the tournament after each tap
      wireMapSeg(); wireCharSeg(); wirePackSeg();
      const body = P.querySelector('.tour-body');
      body.addEventListener('click', (e) => {
        if (!e.target.closest('[data-map],[data-skin],[data-pack],[data-char],[data-unit],#pick-chars,#pick-units,.pick-menu')) return;
        setTimeout(() => { tourCapture(); tourSave(); tourBroadcast(); }, 0);
      });
    }
  }

  // The fight in the background: a hidden page gets no animation frames, so the replay simply stops where it is (the
  // playback clock only moves in loop(), and each frame counts at most 0.1 s) and goes on from there when the page is
  // back. Nothing in the match waits on it but the next round: in a live match the host starts that once both phones
  // have seen the result (Next round on both, or NEXT_SECONDS on the results screen), so the other player waits on the
  // results screen meanwhile and no deploy clock runs. So that they don't wait for long, a live fight left in the
  // background for LIVE_AWAY seconds plays out to its result: at once on return, or then if the browser still runs timers.
  function awayStart() {
    if (away.at) return;
    away.at = now();
    clearTimeout(away.timer);
    if (!solo()) away.timer = setTimeout(() => { if (document.hidden && phase === 'battle' && bt) { while (bt.step()) {} finishBattle(); } }, LIVE_AWAY * 1000);
  }

  // Phones pause pages in the background; reconnect when the page comes back
  document.addEventListener('visibilitychange', () => {
    // the fight replay pauses with the page and goes on from where it was when it is back (see awayStart)
    if (phase === 'battle' && bt) {
      if (document.hidden) { cancelAnimationFrame(raf); awayStart(); }
      else {
        const long = !solo() && away.at && now() - away.at >= LIVE_AWAY * 1000;
        clearTimeout(away.timer); away.at = 0;
        if (long) { while (bt.step()) {} finishBattle(); }
        else { lastTs = 0; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); } // lastTs: no catching up on the time away
      }
    }
    if (document.hidden || !net.alive || !net.peer) return;
    if (net.peer.disconnected && !net.peer.destroyed) net.peer.reconnect();
    if (mode === 'guest' && !net.connected) retryConnect(300);
  });

  window.addEventListener('resize', () => { size(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { size(); render(); });
  const joinCode = (qs.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  { // a tournament: the invite link, or the one this device was in (the organizer's comes back with its hub)
    const tc = (qs.get('tour') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    let org = null, mine = null;
    try { org = JSON.parse(localStorage.getItem(TOUR_ORG) || 'null'); mine = JSON.parse(localStorage.getItem(TOUR_ME) || 'null'); } catch (e) {}
    const fresh = (x) => x && now() - (x.ts || 0) < 24 * 3600e3;
    if (tc.length === 4 && !(fresh(org) && org.t && org.t.code === tc)) tourJoin(tc, qs.has('watch'));
    else if (fresh(org) && org.t) tourResumeOrg(org);
    else if (fresh(mine) && mine.code) tourJoin(mine.code, false);
    if (joinCode.length === 5) tour.menu = false;
  }
  if (joinCode.length === 5) { showStart(); joinMatch(joinCode); }
  else showStart();
})();
</script>
</body>
