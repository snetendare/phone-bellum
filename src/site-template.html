  const factionsReady = () => Game.draftPossible() && FALL.units.length >= 2;
  function useFactionSet(picks) {
    if (!standardSet) standardSet = { set: rawSet, custom: customSet };
    useSet(Game.factionSet(FALL, [...picks[0], ...picks[1]]), false);
  }
  function restoreSet() { if (standardSet) { useSet(standardSet.set, standardSet.custom); standardSet = null; } }
  function startDraft() {
    restoreSet();
    m = null; bt = null; battlePre = null; deadline = 0; draftSel = null;
    draft = Game.createDraft(Math.random() < 0.5 ? 0 : 1);
    phase = 'draft'; hud(); netStatus(); render();
    draftChanged();
  }
  // after every pick or ban: the AI's turn, the guest's screen, or the match when the draft is done
  function draftChanged() {
    clearTimeout(draftTimer); draftSel = null;
    if (Game.draftDone(draft)) { finishDraft(); return; }
    const t = Game.draftTurn(draft);
    if (mode === 'ai' && t.side === 1) draftTimer = setTimeout(() => {
      if (mode !== 'ai' || phase !== 'draft' || !draft) return;
      Game.draftAct(draft, 1, Game.aiDraftChoice(draft, 1, FALL, (now() ^ (Math.random() * 1e9)) >>> 0));
      draftChanged();
    }, 900);
    if (mode === 'host') sendSync();
    drawDraft();
  }
  function finishDraft() {
    const picks = draft.picks; draft = null;
    useFactionSet(picks);
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, null, null, offChars, { factions: picks });
    lastSummary = null; nextReady = [false, false]; rematch = [false, false];
    startReport();
    if (mode === 'host') hostBeginRound(); else beginAiRound();
  }
  function draftPick(id) {
    const t = Game.draftTurn(draft);
    if (!t || t.side !== me || !Game.draftOpen(draft).includes(id)) return;
    if (mode === 'guest') { send({ t: 'dpick', id, step: draft.step }); draftSel = null; return; }
    if (Game.draftAct(draft, me, id)) draftChanged();
  }
  function drawDraft() {
    if (phase !== 'draft' || !draft) return;
    const t = Game.draftTurn(draft), mine = t && t.side === me, open = Game.draftOpen(draft);
    if (!open.includes(draftSel)) draftSel = null;
    const who = mode === 'ai' ? 'The enemy' : 'Your opponent';
    const owner = (id) => draft.picks[me].includes(id) ? 'Yours' : draft.picks[foe()].includes(id) ? (mode === 'ai' ? 'Enemy’s' : 'Theirs') : (draft.bans[0].includes(id) || draft.bans[1].includes(id)) ? 'Banned' : '';
    const names = (ids) => ids.length ? ids.map(id => { const f = Game.factionInfo(id); return `<b style="color:${f.color}">${esc(f.name)}</b>`; }).join('') : '<b>–</b>';
    overlay(`<div class="draft">
      <span class="eyebrow">Factions · draft · ${Game.FACTION_MODE.picks} each</span>
      <h2 style="font-size:clamp(20px,6vw,28px);margin:0">${!t ? 'Draft done' : mine ? (t.act === 'ban' ? 'Ban a faction' : 'Pick a faction') : `${who} is ${t.act === 'ban' ? 'banning' : 'picking'}…`}</h2>
      <div class="sides"><span>You${names(draft.picks[me])}</span><span>${mode === 'ai' ? 'Enemy' : 'Opponent'}${names(draft.picks[foe()])}</span></div>
      <div class="fgrid">${draft.pool.map(id => {
        const f = Game.factionInfo(id); if (!f) return '';
        const st = owner(id);
        return `<button class="fac" data-fac="${esc(id)}" style="--fc:${f.color}" aria-pressed="${draftSel === id}" ${st ? 'disabled' : ''}>
          <span class="nm">${esc(f.name)}</span>${f.theme ? `<span class="sub">${esc(f.theme)}</span>` : ''}${st ? `<span class="st">${st}</span>` : ''}</button>`;
      }).join('')}</div>
    </div>`);
    $('overlay').querySelectorAll('[data-fac]').forEach(b => b.addEventListener('click', () => { draftSel = b.dataset.fac; drawDraft(); }));
    const f = draftSel && Game.factionInfo(draftSel), T = f && f.tower.unit;
    const fu = f ? FSHAPES.filter(u => u.faction === f.id) : [];
    $('panel').innerHTML = `${f ? `<div style="display:grid;gap:6px;font-size:13px;line-height:1.4">
        <b style="color:${f.color};font-family:var(--font-display);font-size:16px">${esc(f.name)}</b>
        ${f.trait ? `<span><span style="color:var(--gold)">${esc(f.trait.name || 'Trait')}:</span> ${esc(f.trait.text || '')}</span>` : ''}
        <span><span style="color:var(--gold)">Tower: ${esc(f.tower.name)}</span> · ${Math.round(T.hp)} hp · hit ${T.hit} × ${T.aps}/s · ${T.range} m${f.tower.text ? `. ${esc(f.tower.text)}` : ''}</span>
        <span class="hint">${fu.map(u => `<span style="color:${u.color};display:inline-flex;vertical-align:middle;margin-right:3px">${Shapes.svg(u.shape, 12)}</span>${esc(u.name)} · ${Game.unitCostOf(u)} gold`).join('<br>') || 'No units yet.'}</span>
      </div>` : `<span class="hint">${mine ? 'Tap a faction to see its units and tower.' : 'Tap a faction to see its units and tower while you wait.'}</span>`}
      <div class="bar">
        <button class="btn" id="draft-leave">${mode === 'ai' ? 'Main menu' : 'Leave'}</button>
        ${mine ? `<button class="btn primary" id="draft-go" ${f && open.includes(f.id) ? '' : 'disabled'}>${f ? `${t.act === 'ban' ? 'Ban' : 'Pick'} ${esc(f.name)}` : (t.act === 'ban' ? 'Ban' : 'Pick')}</button>` : ''}
      </div>`;
    $('draft-leave').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
    if ($('draft-go')) $('draft-go').addEventListener('click', () => { if (draftSel) draftPick(draftSel); });
  }

  // ---------- flow: vs AI ----------
  function startAiMatch() {
    leaveNet();
    mode = 'ai'; me = 0;
    if (matchKind === 'factions' && factionsReady()) { startDraft(); return; }
    restoreSet();
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, mapPick, m && m.map ? m.map.id : null, offChars, matchOpts());
    nextReady = [false, false]; rematch = [false, false];
    startReport();
    beginAiRound();
  }

  function beginAiRound() {
    if (mode === 'claude') { startClaudeTurn(); enterDeploy(timerOn ? deployMs() : 0); return; }
    Game.aiDeploy(m, 1);       // the AI commits first; its new squads stay hidden until the fight
    enterDeploy(timerOn ? deployMs() : 0);
  }

  function enterDeploy(ms) {
    phase = 'deploy'; bt = null; battlePre = null; fx = []; selected = null; timeUp = false; resultShownAt = 0; elfPlacing = false;
    ready = [false, false];
    heldMs = ms > 0 && mode !== 'guest' && picksPending() ? ms : 0;
    deadline = ms > 0 && !heldMs ? now() + ms : 0;
    $('clock').textContent = '';
    closeSheet(); overlay(null); hud(); netStatus(); panelDeploy(); size(); render();
  }

  // the players whose tower pick holds the clock: this player, and on the host the guest too
  const picksPending = () => !!m && (Game.needsTowerPick(m, me) || (mode === 'host' && Game.needsTowerPick(m, 1)));
  function releaseClock() {
    if (mode === 'guest' || phase !== 'deploy' || !heldMs || picksPending()) return;
    if (mode === 'host' && !net.connected) { pausedLeft = heldMs; heldMs = 0; return; } // starts when they're back
    deadline = now() + heldMs; heldMs = 0;
    if (mode === 'host') { sendSync(); saveHost(); }
    panelDeploy();
  }

  function tapNext() {
    if (phase !== 'result') return;
    if (solo()) { beginAiRound(); return; }
    nextReady[me] = true;
    if (mode === 'guest') send({ t: 'next', round: lastSummary && lastSummary.round });
    else { sendStatus(); saveHost(); if (!checkNext()) showResult(lastSummary); return; }
    showResult(lastSummary);
  }

  function askRematch() {
    if (phase !== 'end' || solo()) return;
    rematch[me] = true;
    if (mode === 'guest') send({ t: 'rematch' });
    else { sendStatus(); if (checkRematch()) return; }
    showResult(lastSummary);
  }

  // ---------- the fight (vs AI and host) ----------
  const snapshot = (match) => JSON.parse(JSON.stringify({ ...match, units: null, matrix: null }));
  const withUnits = (s) => ({ ...s, units, matrix: M });

  function runFight() {
    if (phase !== 'deploy' || !m) return;
    if (mode === 'guest') return;
    if (mode === 'claude' && claude.busy) { if (!claude.fightWaiting) { claude.fightWaiting = true; selected = null; closeSheet(); panelDeploy(); } return; }
    closeSheet(); selected = null;
    if (mode === 'ai' || (mode === 'claude' && claude.bot)) lastAiLevels = Game.aiLevel(m, 1); // the AI spends its level-ups now
    else if (mode !== 'claude') lastAiLevels = [];
    Game.ensureTower(m, 0); Game.ensureTower(m, 1);
    Game.ensurePack(m, 0); Game.ensurePack(m, 1);
    Game.settleTowerPicks(m);
    const pre = snapshot(m);
    // work out the result first; both screens then play the same battle back
    const sim = Game.startBattle(m);
    while (sim.step()) {}
    const summary = Game.resolve(m, sim.result());
    recordRound(pre, summary);
    saveHistory(pre, summary);
    lastSummary = summary; nextReady = [false, false]; rematch = [false, false];
    if (mode === 'host') { send({ t: 'fight', pre, post: snapshot(m), summary }); saveHost(); }
    playBattle(pre);
  }

  function playBattle(pre) {
    phase = 'battle'; selected = null; deadline = 0; timeUp = false;
    battlePre = withUnits(pre);
    bt = Game.startBattle(battlePre);
    fx = []; acc = 0; lastTs = 0;
    cam = { end: lastSummary && lastSummary.round === pre.round ? lastSummary.time : null, decided: false, on: false, k: 0, x: 0, y: 0 };
    closeSheet(); overlay(null); hud(); panelBattle(); render();
    cancelAnimationFrame(raf);
    if (reduced) { while (bt.step()) {} finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function absorb() {
    for (const s of bt.lastShots()) if (s[8] > 0) fx.push({ kind: 'flame', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], half: s[8], age: 0, life: 0.3 });
    else if (s[10] === 1) fx.push({ kind: 'bolt', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], age: 0, life: 0.22, seed: Math.random() });
    else fx.push({ kind: s[7] === 1 ? 'heal' : 'shot', x1: s[0], y1: s[1], x2: s[2], y2: s[3], side: s[4], splash: s[5], charged: s[6], spin: s[9] || 1, age: 0, life: s[7] === 1 ? 0.35 : 0.18 });
    for (const b of bt.bodies) if (!b.alive && !b._gone) { b._gone = true; fx.push({ kind: 'death', x: b.x, y: b.y, r: radius(b.u), side: b.side, age: 0, life: 0.5 }); }
  }

  const fighters = (side) => bt.bodies.filter(b => b.alive && b.side === side && !b.u.structure && !b.u.aloft);
  function highStakes() {
    const f = [fighters(0), fighters(1)];
    if (!f[0].length || !f[1].length) return false;
    const lethal = [0, 1].some(i => battlePre.hp[i] - (lastSummary.dmg[i] || 0) <= 0);
    const hp = f.map(a => a.reduce((t, b) => t + b.hp, 0));
    return lethal || (battlePre.round >= CAM.round && Math.min(hp[0], hp[1]) >= Math.max(hp[0], hp[1]) * CAM.close);
  }
  // the battle cam's focus: the middle of everything still fighting, followed smoothly
  function camFollow(dtReal, snap) {
    const all = fighters(0).concat(fighters(1));
    if (!all.length) return;
    const x = all.reduce((t, b) => t + b.x, 0) / all.length, y = all.reduce((t, b) => t + b.y, 0) / all.length;
    const a = snap ? 1 : Math.min(1, dtReal * 3);
    cam.x += (x - cam.x) * a; cam.y += (y - cam.y) * a;
  }

  function loop(ts) {
    if (phase !== 'battle') return;
    const dtReal = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0.016; lastTs = ts;
    if (cam && !cam.decided && cam.end != null && bt.time() >= cam.end - CAM.secs) {
      cam.decided = true; cam.on = cam.end > CAM.secs + 1 && highStakes();
      if (cam.on) camFollow(dtReal, true);
    }
    if (cam && cam.on) { cam.k = Math.min(1, cam.k + dtReal / CAM.ease); camFollow(dtReal); }
    const boost = (bt.time() > 20 ? 2 : 1) * (cam && cam.on ? 1 - (1 - CAM.slow) * cam.k : 1);
    acc += dtReal * speed * boost;
    while (acc >= Game.SETTINGS.dt) {
      acc -= Game.SETTINGS.dt;
      if (!bt.step()) break;
      absorb();
    }
    for (const e of fx) e.age += dtReal * speed * boost;
    fx = fx.filter(e => e.age < e.life);
    $('clock').textContent = `${bt.time().toFixed(1)} s${cam && cam.on ? ' · final seconds' : boost > 1 ? ' · speeding up' : ''}`;
    render();
    if (bt.isOver()) { finishBattle(); return; }
    raf = requestAnimationFrame(loop);
  }

  function finishBattle() {
    if (phase !== 'battle') return;
    cancelAnimationFrame(raf);
    fx = []; cam = null;
    const res = bt.result();
    $('clock').textContent = `${res.time.toFixed(1)} s`;
    if (lastSummary && (res.winner !== lastSummary.winner || Math.abs(res.time - lastSummary.time) > 1e-6)) {
      console.warn('No Mans Land: this screen’s replay differs from the host’s result; the host’s result counts.');
    }
    battlePre = null;
    render();
    showResult(lastSummary);
  }

  // ---------- board input ----------
  function tileAt(ev) {
    const r = cv.getBoundingClientRect();
    const c = Math.floor((ev.clientX - r.left) / r.width * Game.COLS);
    const rw = Math.floor((ev.clientY - r.top) / r.height * Game.ROWS);
    if (c < 0 || rw < 0 || c >= Game.COLS || rw >= Game.ROWS) return null;
    return { col: scol(c), row: srow(rw) }; // screen -> model (the flip is its own inverse)
  }
  // drag one of your squads: this round's squads move for free; an older one only with the Move ability
  cv.addEventListener('pointerdown', (ev) => {
    if (phase !== 'deploy' || !m || !editable() || choosingPack() || placingTower()) return;
    const t = tileAt(ev); if (!t) return;
    const sq = Game.squadAt(m, me, t.col, t.row);
    if (!sq) return;
    if (sq.round < m.round && !(moveMode || Game.movedId(m, me) === sq.id)) return;
    if (!Game.canMove(m, me, sq)) return;
    drag = { id: sq.id, from: t, over: t, moved: false };
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  cv.addEventListener('pointerup', () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved || (d.over.col === d.from.col && d.over.row === d.from.row)) { render(); return; }
    dragEndAt = performance.now(); // the click that follows a drag is not a tap
    if (Game.moveSquad(m, me, d.id, d.over.col, d.over.row) && m.armies[me].find(s => s.id === d.id).round < m.round) { moveMode = false; moving = null; }
    changed();
  });
  cv.addEventListener('pointercancel', () => { if (drag) { drag = null; render(); } });
  cv.addEventListener('pointermove', (ev) => {
    if (drag) {
      const t = tileAt(ev);
      if (t && (t.col !== drag.over.col || t.row !== drag.over.row)) { drag.over = t; drag.moved = true; render(); }
      return;
    }
    if (phase !== 'deploy' || ev.pointerType !== 'mouse') return;
    hoverTile = tileAt(ev); render();
  });
  cv.addEventListener('pointerleave', () => { hoverTile = null; if (phase === 'deploy') render(); });
  cv.addEventListener('click', (ev) => {
    if (phase !== 'deploy') return;
    const t = tileAt(ev); if (!t) return;
    if (choosingPack() || choosingTower()) return; // the package (and in round 3 the tower) comes first
    if (performance.now() - dragEndAt < 400) return;
    if (placingTower()) { if (editable() && Game.placeTower(m, me, t.col, t.row)) changed(); return; }
    if (placingElf()) { if (editable() && Game.buyElfOwn(m, me, t.col, t.row)) { elfPlacing = false; changed(); } else if (!Game.elfOwnSpotOk(m, me, t.col, t.row)) { elfPlacing = false; render(); hud(); panelDeploy(); } return; }
    if (Game.elfOwnAt(m, me, t.col, t.row)) { openMapSheet(); return; }
    if (charmMode && editable() && Game.canGiveCharm(m, me)) { // Matteo: the first Charisma stack goes to the squad tapped
      const own = Game.squadAt(m, me, t.col, t.row);
      if (own && Game.giveCharm(m, me, own.id)) { charmMode = false; changed(); }
      return;
    }
    if (moveMode && editable()) { // Move ability: pick an older squad, then a free tile
      const own = Game.squadAt(m, me, t.col, t.row), mv = moving != null && m.armies[me].find(s => s.id === moving);
      if (mv && (!own || Game.boardable(m, me, t.col, t.row, mv.unit)) && Game.moveSquad(m, me, moving, t.col, t.row)) { moveMode = false; moving = null; changed(); return; }
      if (own && own.round < m.round) { moving = moving === own.id ? null : own.id; changed(); return; }
      return;
    }
    if (Game.towerAt(m, me, t.col, t.row)) {
      openTowerSheet(me);
      return;
    }
    if (towerVisible(foe()) && Game.towerAt(m, foe(), t.col, t.row)) { openTowerSheet(foe()); return; }
    const elf = Game.elfSpot(m);
    if (elf && t.col === elf.col && (t.row === Game.ROWS / 2 - 1 || t.row === Game.ROWS / 2) && !Game.occupied(m, me, t.col, t.row)) { openMapSheet(); return; }
    const freeTile = !Game.occupied(m, me, t.col, t.row);
    if (Game.altarRound(m) && selected === null && freeTile && Math.abs(t.col - (Game.COLS - 1) / 2) < 1 && Math.abs(t.row - (Game.ROWS - 1) / 2) < 1) { openAltarSheet(); return; }
    if (Game.hailRound(m) && selected === null && freeTile && Game.hailTiles(m).some(h => h.col === t.col && h.row === t.row)) { openMapSheet(); return; }
    if ((shroomShown(m, t.col, t.row) || myRemovalNow(t.col, t.row)) && selected === null && !Game.occupied(m, me, t.col, t.row) && !m.armies[foe()].some(s => { const p = Game.seenAt(m, s); return p.col === t.col && p.row === t.row && s.round < m.round; })) { openMapSheet(t); return; }
    const own = Game.squadAt(m, me, t.col, t.row);
    // a unit selected in the shop goes inside your horse (or other carrier) with room
    if (own && selected !== null && editable() && Game.boardable(m, me, t.col, t.row, selected)) {
      if (Game.place(m, me, selected, t.col, t.row)) {
        if (!Game.freeLeft(m, me).includes(selected) && (m.gold[me] < Game.shopCost(m, me, selected) || Game.deploysLeft(m, me) <= 0)) selected = null;
        changed();
      }
      return;
    }
    if (own) {
      if (Game.riderOf(m, me, own)) openPairSheet(own, Game.riderOf(m, me, own));
      else if (own.round === m.round) { if (editable() && Game.unplace(m, me, t.col, t.row)) changed(); }
      else openSheet(own.unit, own, me);
      return;
    }
    const enemy = m.armies[foe()].find(s => { const p = Game.seenAt(m, s); return !Game.hiddenFromFoe(m, s) && p.col === t.col && p.row === t.row && s.round < m.round; });
    if (enemy) { openSheet(enemy.unit, enemy, foe()); return; }
    if (selected !== null && editable() && Game.canPlaceAt(m, me, t.col, t.row, selected)) {
      if (Game.place(m, me, selected, t.col, t.row)) {
        if (!Game.freeLeft(m, me).includes(selected) && (m.gold[me] < Game.shopCost(m, me, selected) || Game.deploysLeft(m, me) <= 0)) selected = null;
        changed();
      }
    }
  });

  // ---------- unit sheet ----------
  function unlockBlock(i, side) {
    if (!m || Game.unlockCost(m, i, me) === 0) return '';
    const cost = Game.unlockCost(m, i, me);
    if (side !== undefined && side !== me) return ''; // an enemy squad on the board is unlocked by definition
    if (Game.isUnlocked(m, me, i)) {
      const undo = phase === 'deploy' && editable() && m.unlocks[me][i] === m.round && !m.armies[me].some(q => q.unit === i);
      return `<div class="bar" style="border-top:1px solid var(--line);padding-top:8px"><span class="hint">Unlocked${m.unlocks[me][i] === m.round ? ' this round' : ''}</span>${undo ? '<button class="btn small" id="unlock-undo">Undo unlock</button>' : ''}</div>`;
    }
    const why = phase !== 'deploy' ? '' : !editable() ? '' : m.gold[me] < cost ? `Need ${cost} gold` : '';
    if (unlockAsk === i && phase === 'deploy' && editable() && !why) return `<div class="confirm" role="alertdialog" aria-label="Confirm unlock">
      <b style="font-family:var(--font-display)">Unlock ${esc(units[i].name)} for ${cost} gold?</b>
      <span class="hint">You'll have ${m.gold[me] - cost} gold left. This lasts the whole match.</span>
      <div class="btnrow" style="justify-content:flex-start"><button class="btn small primary" id="unlock-yes">Yes, unlock</button><button class="btn small" id="unlock-no">No</button></div></div>`;
    return `<div style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px">
      <div class="bar"><b style="font-family:var(--font-display);display:inline-flex;gap:6px;align-items:center">${LOCK_SVG} Locked</b>${phase === 'deploy' ? (why || !editable() ? `<button class="btn small" disabled>${why || `Unlock · ${cost} gold`}</button>` : `<button class="btn small" id="unlock">Unlock · ${cost} gold</button>`) : `<span class="hint">${cost} gold to unlock</span>`}</div>
      <span class="hint">Pay once to be able to field this unit for the rest of the match. The opponent sees it after the next fight.</span></div>`;
  }
  // sq (optional): the squad whose sheet this is, to show the skill it came with (Enzo)
  function skillBlock(i, side, sq) {
    const defs = units[i].skillDefs || [];
    if (!defs.some(Boolean) || !m) return '';
    const mine = side === undefined || side === me, owner = mine ? me : side;
    const enzo = Game.charOf(m, owner) === 'enzo' && (mine || charVisible(owner)), ek = Game.enzoSkill(m, owner, sq || { unit: i }); // the same for every squad of the unit, all match
    const rows = Engine.SLOTS.filter(k => defs[k]).map(k => {
      const d = defs[k], cost = Game.skillCost(m, i, k);
      let act = '';
      if (Game.isInnate(m, i, k)) {
        act = `<span class="chip" style="color:var(--ink);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">Built in</span>`;
      } else if (enzo) {
        act = ek === k ? `<span class="chip" style="color:${mine ? 'var(--gold)' : 'var(--foe)'};border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">✓ ${mine ? 'Yours' : 'Theirs'}, free</span>` : `<span class="hint">Not picked</span>`;
      } else if (mine) {
        if (Game.hasSkill(m, me, i, k)) {
          act = `<span class="chip" style="color:var(--gold);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">Owned</span>`;
          if (phase === 'deploy' && editable() && m.tech[me][i][k] === m.round) act += ` <button class="btn small" data-unskill="${k}">Undo</button>`;
        } else if (phase === 'deploy') {
          const why = !m.armies[me].some(q => q.unit === i) ? 'Place a squad first' : m.gold[me] < cost ? `Need ${cost} gold` : '';
          act = why || !editable() ? `<button class="btn small" disabled>${why || `Buy · ${cost} gold`}</button>` : `<button class="btn small primary" data-skill="${k}">Buy · ${cost} gold</button>`;
        } else act = `<span class="hint">${cost} gold</span>`;
      } else {
        act = Game.skillVisible(m, side, i, k) || (phase !== 'deploy' && Game.hasSkill(m, side, i, k))
          ? `<span class="chip" style="color:var(--foe);border:1px solid currentColor;border-radius:99px;padding:1px 8px;font-size:12px">${foeName()} has it</span>` : `<span class="hint">Not bought</span>`;
      }
      return `<div style="display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px">
        <div class="bar"><b style="font-family:var(--font-display)">${esc(d.name)}</b><span>${act}</span></div>
        <span class="hint">${esc(Engine.describeSkill(d))}</span></div>`;
    });
    return `<div style="display:grid;gap:8px"><h4 style="margin:0;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)">Skills${enzo ? ' · Enzo: one random skill per unit, free' : mine ? ' · for all your squads of this unit' : ''}</h4>${rows.join('')}</div>`;
  }

  function openTowerSheet(side) {
    const D = Engine.TOWER_DOWN, shown = towerTypeVisible(side), tt = Game.towerType(m, side), T = tt.unit;
    $('sheet').innerHTML = `

    net.alive = true;

    net.peer = peer;
    peer.on('open', () => { net.tries = 0; if (phase === 'lobby') drawLobby(); });
    peer.on('connection', (c) => {
      c.on('open', () => {
        if (net.peer !== peer) { try { c.close(); } catch (e) {} return; } // this host has left (a forfeit closing down)
        if (net.conn && net.conn !== c) { const old = net.conn; net.conn = null; try { old.close(); } catch (e) {} }
        net.conn = c; net.connected = true;
        onFriendConnected();
      });
      c.on('data', (d) => { if (c === net.conn) hostRecv(d); });
      c.on('close', () => { if (c === net.conn) { net.connected = false; onFriendLost(); } });
      c.on('error', (e) => console.warn('connection', e));
    });
    peer.on('disconnected', () => { if (net.alive && !peer.destroyed) setTimeout(() => { if (net.alive && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500); });
    peer.on('error', (err) => {
      console.warn('peer', err.type, err);
      if (!net.alive) return;
      if (err.type === 'unavailable-id') {
        // fresh lobby: pick another code. Resumed match: the old page may still hold the code for a moment
        try { peer.destroy(); } catch (e) {}
        if (fresh && phase === 'lobby' && !m) { net.code = newCode(); drawLobby(); hostOpen(true); }
        else if (net.tries++ < 40) net.retryTimer = setTimeout(() => hostOpen(false), 3000);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        if (phase === 'lobby') drawLobby('Can’t reach the match server. Retrying…');
        clearTimeout(net.retryTimer);
        net.retryTimer = setTimeout(() => { if (!net.alive) return; if (peer.destroyed) hostOpen(fresh); else if (peer.disconnected) peer.reconnect(); }, 3000);
      }
    });
  }

  function drawLobby(problem) {
    const link = shareLink();
    const here = net.connected;
    overlay(`<div class="card">
      <span class="eyebrow">Match code</span>
      <span class="code" aria-label="Match code">${net.code}</span>
      <p class="status ${here ? '' : 'wait'}" id="lobby-status">${problem ? esc(problem) : here ? 'Your friend is here!' : (net.peer && net.peer.open ? 'Waiting for your friend to open the link' : 'Setting up the match')}</p>
      ${factionsReady() ? `<div class="seg" role="group" aria-label="Gamemode"><button data-kind="standard" aria-pressed="${matchKind !== 'factions'}">Standard</button><button data-kind="factions" aria-pressed="${matchKind === 'factions'}">Factions</button></div>` : ''}
      <button class="btn primary" id="start" ${here ? '' : 'disabled'}>Start match</button>
    </div>`);
    $('panel').innerHTML = `
      <span class="hint">Send this link to a friend and keep this page open.</span>
      <div class="linkbox" id="link">${esc(link)}</div>
      <div class="bar">
        <span class="btnrow">
          ${navigator.share ? '<button class="btn primary" id="share">Share link</button>' : ''}
          <button class="btn ${navigator.share ? '' : 'primary'}" id="copy">Copy link</button>
        </span>
        <button class="btn" id="cancel">Cancel</button>
      </div>
      ${settingsBox(`
        ${mapSeg()}
        ${charSeg()}
        <span class="hint">You both play with the units on this device: ${customSet ? `your ${units.length} Counter Lab units` : `the ${units.length} built-in units`}.</span>`)}`;
    if ($('share')) $('share').addEventListener('click', () => { navigator.share({ title: 'No Mans Land', text: `Fight me in No Mans Land! Code ${net.code}`, url: link }).catch(() => {}); });
    $('copy').addEventListener('click', () => {
      const done = () => { $('copy').textContent = 'Copied'; setTimeout(() => { if ($('copy')) $('copy').textContent = 'Copy link'; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => selectLink());
      else selectLink();
    });
    $('cancel').addEventListener('click', () => { clearHost(); showStart(); });
    $('start').addEventListener('click', hostStartMatch);
    $('overlay').querySelectorAll('[data-kind]').forEach(b => b.addEventListener('click', () => { matchKind = b.dataset.kind; drawLobby(); }));
    wireMapSeg(); wireCharSeg(); wireSettings();
  }
  function selectLink() { const r = document.createRange(); r.selectNodeContents($('link')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  function hostStartMatch() {
    if (!net.connected) return;
    if (matchKind === 'factions' && factionsReady()) { startDraft(); return; }
    restoreSet();
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, mapPick, m && m.map ? m.map.id : null, offChars, matchOpts());
    lastSummary = null; nextReady = [false, false]; rematch = [false, false];
    startReport();
    hostBeginRound();
  }

  function hostBeginRound() {
    enterDeploy(deployMs());
    sendSync(); saveHost();
  }

  function onFriendConnected() {
    if (phase === 'deploy' && !deadline && !heldMs) {
      const ms = Math.max(10000, pausedLeft || deployMs()); pausedLeft = 0;
      if (picksPending()) heldMs = ms; else deadline = now() + ms;
    }
    sendSync();
    netStatus();
    if (phase === 'lobby') drawLobby();
    else if (phase === 'draft') drawDraft();
    else if (phase === 'deploy') panelDeploy();
  }
  function onFriendLost() {
    netStatus();
    if (phase === 'lobby') drawLobby();
    else if (phase === 'deploy') tick();
  }

  // What the guest may see: the host's squads from this round stay hidden until the fight
  function syncState() {
    const s = snapshot(m);
    if (phase === 'deploy') {
      s.armies[0] = s.armies[0].filter(q => q.round < m.round && !Game.hiddenFromFoe(m, q)).map(q => { // a squad moved this round shows on its old tile
        if (q.from && q.movedRound === m.round) { q.col = q.from.col; q.row = q.from.row; }
        delete q.from; delete q.movedRound;
        if (q.charmGiven === m.round) { delete q.charm; delete q.charmGiven; } // Matteo's first stack, given this round
        return q;
      });
      if (s.moved) s.moved[0] = null;
      // skills bought this round stay hidden too
      for (const ui in (s.tech && s.tech[0]) || {}) s.tech[0][ui] = s.tech[0][ui].map(r => r === m.round ? 0 : r);
      if (m.round === 1) { // the host's character and buff tiles stay hidden until the first fight
        if (s.chars) s.chars = [null, s.chars[1]];
        if (s.buff) s.buff = [[], s.buff[1]];
      }
      if (m.round === Game.TOWER_PICK_ROUND && s.towers && s.towers[0]) delete s.towers[0].type; // and the host's tower pick
      if (s.bribe) s.bribe[0] = Game.bribeList(s, 0).filter(r => r !== m.round); // bribes paid this round too
      if (s.elfOwn && s.elfOwn[0] && s.elfOwn[0].round === m.round) s.elfOwn[0] = null; // and an elf tower bought this round
      if (s.towerSkill && s.towerSkill[0] === m.round) s.towerSkill[0] = 0; // and a tower skill
      if (s.towerSkill2 && s.towerSkill2[0] === m.round) s.towerSkill2[0] = 0; // and a second one
      if (s.mageGen) s.mageGen[0] = null; // and the mage general called this round
      if (s.loan && s.loan[0] === m.round) s.loan[0] = 0; // and a bank loan taken this round
      if (s.mapFree && s.mapFree[0]) delete s.mapFree[0][m.round]; // and which purchase got Blixten's free slot
      if (s.map && s.map.removed) s.map.removed = s.map.removed.filter(x => !(x.side === 0 && x.round === m.round)); // and mushroom tiles removed this round
      if (s.altar) s.altar = s.altar.filter(x => !(x.side === 0 && x.round === m.round)); // and altar purchases
      if (s.unlocks && s.unlocks[0]) for (const ui in s.unlocks[0]) if (s.unlocks[0][ui] === m.round) delete s.unlocks[0][ui]; // so do this round's unlocks
      if (m.round === 1 && s.packages) { s.packages = [[], s.packages[1]]; s.pack = [null, s.pack ? s.pack[1] : null]; } // and the host's package
    }
    return s;
  }
  function sendSync() {
    if (!net.connected) return;
    const base = { t: 'sync', proto: 1, set: { units: rawSet.units, matrix: rawSet.matrix, skills: rawSet.skills || [], rules: rawSet.rules || null }, custom: customSet, config: { levelCostPerTier: Game.CONFIG.levelCostPerTier } };
    if (!m && phase === 'draft' && draft) { send({ t: 'draft', draft }); return; }
    if (!m) { send({ ...base, phase: 'lobby' }); return; }
    const ph = phase === 'battle' ? 'result' : phase;
    send({ ...base, phase: ph, m: syncState(), remaining: phase === 'deploy' && deadline ? deadline - now() : 0, ready, nextReady, rematch, summary: lastSummary });
  }
  const sendStatus = () => send({ t: 'status', ready, nextReady, rematch });

  function hostRecv(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'side') {
      if (!m || phase !== 'deploy' || d.round !== m.round) return;
      applySide(d);
      releaseClock();
      saveHost();
      if (ready[0] && ready[1]) { runFight(); return; }
      panelDeploy();
    } else if (d.t === 'next') {
      if (!lastSummary || d.round !== lastSummary.round) return;
      nextReady[1] = true; sendStatus(); saveHost();
      if (!checkNext() && phase === 'result') showResult(lastSummary);
    } else if (d.t === 'rematch') {
      rematch[1] = true; sendStatus();
      if (!checkRematch() && phase === 'end') showResult(lastSummary);
    } else if (d.t === 'dpick') {
      if (phase !== 'draft' || !draft || d.step !== draft.step || !Game.draftAct(draft, 1, String(d.id))) return;
      draftChanged();
    } else if (d.t === 'forfeit') foeForfeited();
  }

  function applySide(d) {
    if (!Array.isArray(d.army)) return;
    const n = units.length;
    // skills first: they decide where some squads may stand (Forward planting)
    const tech = {};
    if (d.tech && typeof d.tech === 'object') for (const ui in d.tech) {
      const i = +ui, t = d.tech[ui];
      if (Number.isInteger(i) && i >= 0 && i < n && Array.isArray(t)) tech[i] = Engine.SLOTS.map(k => Math.max(0, Math.min(m.round, t[k] | 0)));
    }
    if (!m.tech) m.tech = [{}, {}];
    m.tech[1] = tech;
    const army = d.army.filter(s => s && Number.isInteger(s.unit) && s.unit >= 0 && s.unit < n && Number.isInteger(s.col) && s.col >= 0 && s.col < Game.COLS && Number.isInteger(s.row) && Game.canPlaceAt(m, 1, s.col, s.row, s.unit));
    const seen = new Set(), had = new Map(m.armies[1].map(q => [q.id, q]));
    m.armies[1] = army.filter(s => { const k = Number.isInteger(s.in) ? 'in' + s.in : s.col + ',' + s.row; if (seen.has(k)) return false; seen.add(k); return true; }).map(s => ({
      ...(Number.isInteger(s.in) ? { in: s.in } : {}),
      id: s.id | 0, unit: s.unit, col: s.col, row: s.row, round: s.round | 0, xp: Math.max(0, +s.xp || 0),
      level: Math.max(0, Math.min(Engine.MAX_LEVEL, s.level | 0)), cost: Math.max(0, +s.cost || 0), ...(s.free ? { free: true } : {}),
      ...(s.boughtLevels && typeof s.boughtLevels === 'object' ? { boughtLevels: s.boughtLevels } : {}),
      ...(s.from && (s.movedRound | 0) === m.round && (s.round | 0) < m.round && Number.isInteger(s.from.col) && Number.isInteger(s.from.row) ? { from: { col: s.from.col, row: s.from.row, ...(Number.isInteger(s.from.in) ? { in: s.from.in } : {}) }, movedRound: m.round } : {}),
    }));
    // riders: each inside a carrier squad on the same tile, one per carrier, never a carrier itself
    const byId = new Map(m.armies[1].map(q => [q.id, q])), full = new Set();
    m.armies[1] = m.armies[1].filter(q => {
      if (q.in == null) return true;
      const c = byId.get(q.in);
      if (!c || c.in != null || !Game.isCarrier(m, c.unit) || Game.isCarrier(m, q.unit) || c.col !== q.col || c.row !== q.row || full.has(c.id)) return false;
      full.add(c.id); return true;
    });
    // the guest's charisma (Matteo): stacks come from the fights played here; the guest only gives the first stack
    for (const q of m.armies[1]) { const h = had.get(q.id); if (h && h.charm > 0 && h.charmGiven !== m.round) { q.charm = h.charm; if (h.charmGiven) q.charmGiven = h.charmGiven; } }
    const gave = d.army.find(s => s && s.charm > 0 && (s.charmGiven | 0) === m.round);
    if (gave) Game.giveCharm(m, 1, gave.id | 0);
    // the guest's move this round: one squad at most
    if (!m.moved) m.moved = [null, null];
    m.moved[1] = null;
    for (const q of m.armies[1]) if (q.movedRound === m.round) { if (m.moved[1] == null) m.moved[1] = q.id; else { delete q.from; delete q.movedRound; } }
    m.gold[1] = Math.max(0, +d.gold || 0);
    m.extraDeploys[1] = Math.max(0, Math.min(Game.CONFIG.maxExtraDeploys, d.extra | 0));
    m.nextId[1] = Math.max(m.nextId[1], d.nextId | 0);
    ready[1] = !!d.ready;
    // the guest's package: picked once in round 1; package squads beyond what it holds are dropped
    if (m.round === 1 && m.pack && m.pack[1] == null && Number.isInteger(d.pack)) Game.choosePack(m, 1, d.pack);
    if (m.round === 1) {
      const allow = (Game.packOf(m, 1) || { squads: [] }).squads.slice();
      m.armies[1] = m.armies[1].filter(s => { if (!s.free) return true; const k = allow.indexOf(s.unit); if (k < 0) return false; allow.splice(k, 1); return true; });
    }
    // the guest's unlocks: earlier ones stay as they were, this round's are taken as sent (gold was checked on their side)
    if (!m.unlocks) m.unlocks = [{}, {}];
    const unl = {};
    for (const ui in m.unlocks[1]) if (m.unlocks[1][ui] < m.round) unl[ui] = m.unlocks[1][ui];
    if (d.unlocks && typeof d.unlocks === 'object') for (const ui in d.unlocks) { const i = +ui; if (Number.isInteger(i) && i >= 0 && i < n && (d.unlocks[ui] | 0) === m.round) unl[i] = m.round; }
    m.unlocks[1] = unl;
    // the guest's tower skill: an earlier one stays, one sent for this round is taken (gold was checked on their side)
    if (!m.towerSkill) m.towerSkill = [0, 0];
    if (!(m.towerSkill[1] > 0 && m.towerSkill[1] < m.round)) m.towerSkill[1] = Game.towerPicked(m, 1) && (d.towerSkill | 0) === m.round ? m.round : 0;
    if (!m.towerSkill2) m.towerSkill2 = [0, 0];
    if (!(m.towerSkill2[1] > 0 && m.towerSkill2[1] < m.round)) m.towerSkill2[1] = Game.towerPicked(m, 1) && Game.towerType(m, 1).skill2 && (d.towerSkill2 | 0) === m.round ? m.round : 0;
    // the guest's mage general for this round (gold was checked on their side)
    if (!m.mageGen) m.mageGen = [null, null];
    const mg = d.mageGen && typeof d.mageGen === 'object' ? d.mageGen : { id: d.mageGen }; // { id, tp } (an older page sends just the id)
    const mgId = Game.mageGenInfo(mg.id) && !Game.isExtraGen(mg.id) ? mg.id : null, mgTp = !!mg.tp || Game.isExtraGen(mg.id);
    m.mageGen[1] = (mgId || mgTp) && Game.towerPicked(m, 1) && Game.towerType(m, 1).id === 'mage' ? { round: m.round, id: mgId, tp: mgTp } : null;
    // the guest's bank loan: an earlier one stays (it is paid back after this round's fight), one sent for this round is taken
    if (!m.loan) m.loan = [0, 0];
    if (!(m.loan[1] > 0 && m.loan[1] < m.round)) m.loan[1] = 0;
    if ((d.loan | 0) === m.round && Game.towerPicked(m, 1) && Game.towerType(m, 1).id === 'bank') m.loan[1] = m.round;
    // the guest's elf bribes: earlier ones stay, the ones sent for this round are taken (gold was checked on their side)
    if (!m.bribe) m.bribe = [[], []];
    const newBribes = Game.elfSpot(m) ? (Array.isArray(d.bribe) ? d.bribe : [d.bribe]).filter(r => (r | 0) === m.round).slice(0, 200) : [];
    m.bribe[1] = Game.bribeList(m, 1).filter(r => r < m.round).concat(newBribes.map(() => m.round));
    // the guest's own elf tower: an earlier one stays, one sent for this round is taken (gold was checked on their side)
    if (!m.elfOwn) m.elfOwn = [null, null];
    if (!(m.elfOwn[1] && m.elfOwn[1].round < m.round)) {
      const e = d.elfOwn;
      m.elfOwn[1] = Game.elfOwnOffered(m, 1) && e && (e.round | 0) === m.round && Game.inZone(1, e.row | 0) && (e.col | 0) >= 0 && (e.col | 0) < Game.COLS ? { col: e.col | 0, row: e.row | 0, round: m.round } : null;
    }
    // the guest's altar purchases this round (gold was checked on their side; Snowgre spots are worked out here)
    if (m.altar) m.altar = m.altar.filter(x => !(x.side === 1 && x.round === m.round));
    if (Array.isArray(d.altar)) for (const type of d.altar.slice(0, 20)) Game.addAltar(m, 1, String(type));
    // the guest's mushroom tile removals this round (gold was checked on their side)
    if (m.map && Game.mapOf(m) && Game.mapOf(m).shrooms) {
      m.map.removed = (m.map.removed || []).filter(x => !(x.side === 1 && x.round === m.round));
      if (Array.isArray(d.shrooms)) for (const q of d.shrooms.slice(0, 20)) {
        if (!q || !Number.isInteger(q.col) || !Number.isInteger(q.row) || !Game.shroomTileAt(m, q.col, q.row)) continue;
        if (m.map.removed.some(x => x.col === q.col && x.row === q.row && (x.round < m.round || x.side === 1))) continue;
        m.map.removed.push({ col: q.col, row: q.row, side: 1, round: m.round });
      }
    }
    // towers are fixed, so the guest's tower spot isn't taken from the guest; its pick is, in the pick round
    if (d.tower && typeof d.tower === 'object' && d.tower.type) Game.setTowerType(m, 1, String(d.tower.type));
  }

  function checkNext() {
    if (mode !== 'host' || phase !== 'result' || !(nextReady[0] && nextReady[1])) return false;
    hostBeginRound();
    return true;
  }
  function checkRematch() {
    if (mode !== 'host' || phase !== 'end' || !(rematch[0] && rematch[1])) return false;
    hostStartMatch();
    return true;
  }

  // The host's match survives a reload (iPhone Safari drops background tabs)
  function saveHost() {
    if (mode !== 'host' || !m) return;
    try {
      localStorage.setItem(HOST_STORE, JSON.stringify({
        code: net.code, ts: now(), set: rawSet, custom: customSet, config: { levelCostPerTier: Game.CONFIG.levelCostPerTier }, mapPick,
        m: snapshot(m), phase: phase === 'battle' ? 'result' : phase, summary: lastSummary, nextReady, rematch,
        left: phase === 'deploy' ? (deadline ? deadline - now() : pausedLeft) : 0,
      }));
    } catch (e) {}
  }
  function clearHost() { try { localStorage.removeItem(HOST_STORE); } catch (e) {} }

  function resumeHost(s) {
    if (!peerAvailable()) { overlayMsg('Couldn’t load the multiplayer code', 'Check your connection and reload the page.'); return; }
    leaveNet();
    mode = 'host'; me = 0;
    restoreSet();
    if (s.m && s.m.factions) { standardSet = { set: rawSet, custom: customSet }; matchKind = 'factions'; } // a Factions match: the player's own units come back after it
    useSet(validSet(s.set) ? s.set : BUILTIN, !!s.custom);
    Game.CONFIG.levelCostPerTier = (s.config && s.config.levelCostPerTier) || Game.CONFIG.levelCostPerTier;
    net.code = s.code; mapPick = typeof s.mapPick === 'string' ? s.mapPick : '';
    m = withUnits(s.m); lastSummary = s.summary || null;
    nextReady = s.nextReady || [false, false]; rematch = s.rematch || [false, false];
    if (s.phase === 'deploy') {
      enterDeploy(0); pausedLeft = Math.max(10000, s.left || deployMs());
      // squads placed this round are kept; ready flags reset
    } else if (lastSummary) { bt = null; showResult(lastSummary); }
    else { phase = 'lobby'; drawLobby(); }
    hud(); netStatus(); render();
    hostOpen(false);
  }

  // ----- guest -----
  function joinMatch(code) {
    if (!peerAvailable()) { overlayMsg('Couldn’t load the multiplayer code', 'Check your connection and reload the page.'); return; }
    leaveNet();
    mode = 'guest'; me = 1; m = null; phase = 'lobby'; bt = null;
    net.code = code; net.alive = true;
    history.replaceState(null, '', shareLink());
    hud(); netStatus(); render();
    guestWaiting('Connecting to match ' + code);
    const peer = new Peer(peerOpts());
    net.peer = peer;
    peer.on('open', () => connectToHost());
    peer.on('disconnected', () => { if (net.alive && !peer.destroyed) setTimeout(() => { if (net.alive && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500); });
    peer.on('error', (err) => {
      console.warn('peer', err.type, err);
      if (!net.alive) return;
      if (err.type === 'peer-unavailable') {
        if (!m) guestWaiting(net.tries > 2 ? `Can’t find match ${code}. Make sure your friend still has it open. Retrying` : 'Connecting to match ' + code);
        retryConnect(2500);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        if (!m) guestWaiting('Can’t reach the match server. Retrying');
        clearTimeout(net.retryTimer);
        net.retryTimer = setTimeout(() => { if (net.alive && !peer.destroyed && peer.disconnected) peer.reconnect(); retryConnect(500); }, 3000);
      }
    });
  }

  function retryConnect(ms) {
    clearTimeout(net.retryTimer);
    net.retryTimer = setTimeout(() => { if (net.alive && !net.connected) connectToHost(); }, ms);
  }

  function connectToHost() {
    const peer = net.peer;
    if (!net.alive || !peer || peer.destroyed || net.connected) return;
    if (peer.disconnected) { peer.reconnect(); return; }
    net.tries++;
    const c = peer.connect(PEER_PREFIX + net.code, { reliable: true });
    let opened = false;
    const giveUp = setTimeout(() => { if (!opened) { try { c.close(); } catch (e) {} retryConnect(500); } }, 9000);
    c.on('open', () => {
      opened = true; clearTimeout(giveUp);
      if (net.conn && net.conn !== c) { try { net.conn.close(); } catch (e) {} }
      net.conn = c; net.connected = true; net.tries = 0;
      netStatus();
      if (phase === 'deploy') { sendSide(); panelDeploy(); }
      if (phase === 'lobby' && !m) guestWaiting('Connected. Waiting for your friend to start the match');
    });
    c.on('data', (d) => { if (c === net.conn) guestRecv(d); });
    c.on('close', () => {
      clearTimeout(giveUp);
      if (c === net.conn) { net.connected = false; net.conn = null; netStatus(); if (phase === 'deploy') panelDeploy(); retryConnect(1500); }
    });
    c.on('error', (e) => console.warn('connection', e));
  }

  function guestWaiting(text) {
    overlay(`<div class="card">
      <span class="eyebrow">Live match</span>
      <span class="code">${esc(net.code)}</span>
      <p class="status wait">${esc(text)}</p>
      <button class="btn" id="leave">Leave</button>
    </div>`);
    panelInfo('Keep this page open.', '', null);
    $('leave').addEventListener('click', showStart);
  }

  function sendSide() {
    if (mode !== 'guest' || !m || phase !== 'deploy') return;
    send({ t: 'side', round: m.round, army: m.armies[1], gold: m.gold[1], extra: m.extraDeploys[1], nextId: m.nextId[1], tech: (m.tech && m.tech[1]) || {}, tower: (m.towers && m.towers[1]) || null, pack: m.pack ? m.pack[1] : null, unlocks: (m.unlocks && m.unlocks[1]) || {}, bribe: Game.bribeList(m, 1), elfOwn: Game.elfOwnOf(m, 1), towerSkill: (m.towerSkill && m.towerSkill[1]) || 0, towerSkill2: (m.towerSkill2 && m.towerSkill2[1]) || 0, mageGen: Game.mageGenOf(m, 1) || Game.mageTpOf(m, 1) ? { id: Game.mageGenOf(m, 1), tp: Game.mageTpOf(m, 1) } : null, loan: Game.loanNow(m, 1) ? m.round : 0, altar: (m.altar || []).filter(x => x.side === 1 && x.round === m.round).map(x => x.type), shrooms: ((m.map && m.map.removed) || []).filter(x => x.side === 1 && x.round === m.round).map(x => ({ col: x.col, row: x.row })), ready: ready[1] || timeUp });
  }

  function guestRecv(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'draft') {
      const x = d.draft;
      if (!x || !Array.isArray(x.pool) || !Array.isArray(x.picks) || !Array.isArray(x.bans) || !Number.isInteger(x.step)) return;
      m = null; bt = null; battlePre = null; deadline = 0;
      draft = x; phase = 'draft'; hud(); netStatus(); render(); drawDraft();
      return;
    }
    if (d.t === 'sync') {
      if (validSet(d.set)) useSet(d.set, !!d.custom);
      if (d.config && d.config.levelCostPerTier) Game.CONFIG.levelCostPerTier = d.config.levelCostPerTier;
      if (d.m) draft = null;
      if (d.phase === 'lobby' || !d.m) { m = null; phase = 'lobby'; hud(); render(); guestWaiting('Connected. Waiting for your friend to start the match'); return; }
      const incoming = withUnits(d.m);
      const theirReady = d.ready ? !!d.ready[0] : false;
      nextReady[0] = d.nextReady ? !!d.nextReady[0] : false;
      rematch[0] = d.rematch ? !!d.rematch[0] : false;
      if (d.phase === 'deploy') {
        if (phase === 'deploy' && m && m.round === incoming.round) {
          // same round after a reconnect: keep our own side as it is here, take everything else from the host
          if (!incoming.tech) incoming.tech = [{}, {}];
          if (!incoming.towers) incoming.towers = [null, null];
          if (!incoming.unlocks) incoming.unlocks = [{}, {}];
          if (!incoming.pack) incoming.pack = [null, null];
          if (!incoming.chars) incoming.chars = [null, null];
          if (!incoming.buff) incoming.buff = [[], []];
          if (!incoming.bribe) incoming.bribe = [[], []];
          if (!m.bribe) m.bribe = [[], []];
          if (!incoming.towerSkill) incoming.towerSkill = [0, 0];
          if (!m.towerSkill) m.towerSkill = [0, 0];
          if (!incoming.towerSkill2) incoming.towerSkill2 = [0, 0];
          if (!m.towerSkill2) m.towerSkill2 = [0, 0];
          if (!incoming.elfOwn) incoming.elfOwn = [null, null];
          if (!m.elfOwn) m.elfOwn = [null, null];
          if (!incoming.mapFree) incoming.mapFree = [{}, {}];
          if (!incoming.mageGen) incoming.mageGen = [null, null];
          if (!incoming.loan) incoming.loan = [0, 0];
          if (!m.loan) m.loan = [0, 0];
          if (!m.mageGen) m.mageGen = [null, null];
          if (!m.mapFree) m.mapFree = [{}, {}];
          for (const k of ['armies', 'gold', 'extraDeploys', 'nextId', 'tech', 'towers', 'unlocks', 'pack', 'chars', 'buff', 'bribe', 'towerSkill', 'towerSkill2', 'elfOwn', 'mapFree', 'mageGen', 'loan']) incoming[k][1] = (m[k] || [null, null])[1];
          if (incoming.map && m.map) incoming.map.removed = (incoming.map.removed || []).filter(x => !(x.side === 1 && x.round === incoming.round)).concat((m.map.removed || []).filter(x => x.side === 1 && x.round === incoming.round));
          incoming.altar = (incoming.altar || []).filter(x => !(x.side === 1 && x.round === incoming.round)).concat((m.altar || []).filter(x => x.side === 1 && x.round === incoming.round));
          m = incoming; ready[0] = theirReady;
          deadline = d.remaining > 0 ? now() + d.remaining - 300 : 0;
          timeUp = false;
          sendSide(); panelDeploy(); render(); hud();
        } else {
          m = incoming; lastSummary = d.summary || lastSummary;
          nextReady = [false, false]; rematch = [false, false];
          enterDeploy(d.remaining > 0 ? d.remaining - 300 : 0);
          ready[0] = theirReady; panelDeploy();
        }
        return;
      }
      // result or end
      if (phase === 'battle' && d.summary && lastSummary && d.summary.round === lastSummary.round) return; // still watching this battle
      m = incoming; lastSummary = d.summary;
      nextReady[1] = d.nextReady ? !!d.nextReady[1] : false;
      rematch[1] = d.rematch ? !!d.rematch[1] : false;
      if (lastSummary) { if (phase !== 'result' && phase !== 'end') bt = null; showResult(lastSummary); }
      render();
    } else if (d.t === 'fight') {
      if (!d.pre || !d.post || !d.summary) return;
      m = withUnits(d.post); lastSummary = d.summary;
      nextReady = [false, false]; rematch = [false, false];
      playBattle(d.pre);
    } else if (d.t === 'status') {
      if (d.ready) ready[0] = !!d.ready[0];
      if (d.nextReady) nextReady[0] = !!d.nextReady[0];
      if (d.rematch) rematch[0] = !!d.rematch[0];
      if (phase === 'deploy') panelDeploy();
      else if (phase === 'end') showResult(lastSummary);
    } else if (d.t === 'forfeit') foeForfeited();
  }

  function overlayMsg(head, text) {
    overlay(`<div class="card"><h2>${esc(head)}</h2><p>${esc(text)}</p><button class="btn primary" id="ok">OK</button></div>`);
    $('ok').addEventListener('click', showStart);
  }

  // Phones pause pages in the background; reconnect when the page comes back
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !net.alive || !net.peer) return;
    if (net.peer.disconnected && !net.peer.destroyed) net.peer.reconnect();
    if (mode === 'guest' && !net.connected) retryConnect(300);
  });

  window.addEventListener('resize', () => { size(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { size(); render(); });
  const joinCode = (qs.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (joinCode.length === 5) { showStart(); joinMatch(joinCode); }
  else showStart();
})();
</script>
</body>
</html>
