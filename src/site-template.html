  };
  const newCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
  const send = (msg) => { if (net.conn && net.connected) { try { net.conn.send(msg); } catch (e) { console.warn(e); } } };
  const peerAvailable = () => typeof Peer === 'function';

  function leaveNet() {
    net.alive = false;
    clearTimeout(net.retryTimer);
    try { if (net.conn) net.conn.close(); } catch (e) {}
    try { if (net.peer) net.peer.destroy(); } catch (e) {}
    net.peer = null; net.conn = null; net.connected = false; net.code = ''; net.tries = 0;
    if (qs.has('join')) { qs.delete('join'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '')); }
  }

  // ----- host -----
  function hostLobby() {
    if (!peerAvailable()) { overlayMsg('Couldn’t load the multiplayer code', 'Check your connection and reload the page.'); return; }
    leaveNet();
    mode = 'host'; me = 0; m = null; phase = 'lobby';
    net.code = newCode();
    clearHost();
    hud(); netStatus(); render();
    drawLobby();
    hostOpen(true);
  }

  function hostOpen(fresh) {
    net.alive = true;
    const peer = new Peer(PEER_PREFIX + net.code, peerOpts());
    net.peer = peer;
    peer.on('open', () => { net.tries = 0; if (phase === 'lobby') drawLobby(); });
    peer.on('connection', (c) => {
      c.on('open', () => {
        if (net.conn && net.conn !== c) { const old = net.conn; net.conn = null; try { old.close(); } catch (e) {} }
        net.conn = c; net.connected = true;
        onFriendConnected();
      });
      c.on('data', (d) => { if (c === net.conn) hostRecv(d); });
      c.on('close', () => { if (c === net.conn) { net.connected = false; onFriendLost(); } });
      c.on('error', (e) => console.warn('connection', e));
    });
    peer.on('disconnected', () => { if (net.alive && !peer.destroyed) setTimeout(() => { if (net.alive && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500); });
    peer.on('error', (err) => {
      console.warn('peer', err.type, err);
      if (!net.alive) return;
      if (err.type === 'unavailable-id') {
        // fresh lobby: pick another code. Resumed match: the old page may still hold the code for a moment
        try { peer.destroy(); } catch (e) {}
        if (fresh && phase === 'lobby' && !m) { net.code = newCode(); drawLobby(); hostOpen(true); }
        else if (net.tries++ < 40) net.retryTimer = setTimeout(() => hostOpen(false), 3000);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        if (phase === 'lobby') drawLobby('Can’t reach the match server. Retrying…');
        clearTimeout(net.retryTimer);
        net.retryTimer = setTimeout(() => { if (!net.alive) return; if (peer.destroyed) hostOpen(fresh); else if (peer.disconnected) peer.reconnect(); }, 3000);
      }
    });
  }

  function drawLobby(problem) {
    const link = shareLink();
    const here = net.connected;
    overlay(`<div class="card">
      <span class="eyebrow">Challenge a friend · match code</span>
      <span class="code" aria-label="Match code">${net.code}</span>
      <p class="status ${here ? '' : 'wait'}" id="lobby-status">${problem ? esc(problem) : here ? 'Your friend is here!' : (net.peer && net.peer.open ? 'Waiting for your friend to open the link' : 'Setting up the match')}</p>
      <button class="btn primary" id="start" ${here ? '' : 'disabled'}>Start match</button>
    </div>`);
    $('panel').innerHTML = `
      <span class="hint">Send your friend this link. It works in any browser and nobody needs an account. Keep this page open while they join.</span>
      <div class="linkbox" id="link">${esc(link)}</div>
      <div class="bar">
        <span class="btnrow">
          ${navigator.share ? '<button class="btn primary" id="share">Share link</button>' : ''}
          <button class="btn ${navigator.share ? '' : 'primary'}" id="copy">Copy link</button>
        </span>
        <button class="btn" id="cancel">Cancel</button>
      </div>
      <span class="hint">You both play with the units on this device: ${customSet ? `your ${units.length} Counter Lab units` : `the ${units.length} built-in units`}.</span>`;
    if ($('share')) $('share').addEventListener('click', () => { navigator.share({ title: 'Phone Bellum', text: `Fight me in Phone Bellum! Code ${net.code}`, url: link }).catch(() => {}); });
    $('copy').addEventListener('click', () => {
      const done = () => { $('copy').textContent = 'Copied'; setTimeout(() => { if ($('copy')) $('copy').textContent = 'Copy link'; }, 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => selectLink());
      else selectLink();
    });
    $('cancel').addEventListener('click', () => { clearHost(); showStart(); });
    $('start').addEventListener('click', hostStartMatch);
  }
  function selectLink() { const r = document.createRange(); r.selectNodeContents($('link')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  function hostStartMatch() {
    if (!net.connected) return;
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0);
    lastSummary = null; nextReady = [false, false]; rematch = [false, false];
    startReport();
    hostBeginRound();
  }

  function hostBeginRound() {
    enterDeploy(deployMs());
    sendSync(); saveHost();
  }

  function onFriendConnected() {
    if (phase === 'deploy' && !deadline) { deadline = now() + Math.max(10000, pausedLeft || deployMs()); pausedLeft = 0; }
    sendSync();
    netStatus();
    if (phase === 'lobby') drawLobby();
    else if (phase === 'deploy') panelDeploy();
  }
  function onFriendLost() {
    netStatus();
    if (phase === 'lobby') drawLobby();
    else if (phase === 'deploy') tick();
  }

  // What the guest may see: the host's squads from this round stay hidden until the fight
  function syncState() {
    const s = snapshot(m);
    if (phase === 'deploy') {
      s.armies[0] = s.armies[0].filter(q => q.round < m.round).map(q => { // a squad moved this round shows on its old tile
        if (q.from && q.movedRound === m.round) { q.col = q.from.col; q.row = q.from.row; }
        delete q.from; delete q.movedRound; return q;
      });
      if (s.moved) s.moved[0] = null;
      // skills bought this round stay hidden too
      for (const ui in (s.tech && s.tech[0]) || {}) s.tech[0][ui] = s.tech[0][ui].map(r => r === m.round ? 0 : r);
      if (m.round === 1) { // the host's character and buff tiles stay hidden until the first fight
        if (s.chars) s.chars = [null, s.chars[1]];
        if (s.buff) s.buff = [[], s.buff[1]];
      }
      if (s.bribe && s.bribe[0] === m.round) s.bribe[0] = 0; // a bribe bought this round too
      if (s.unlocks && s.unlocks[0]) for (const ui in s.unlocks[0]) if (s.unlocks[0][ui] === m.round) delete s.unlocks[0][ui]; // so do this round's unlocks
      if (m.round === 1 && s.packages) { s.packages = [[], s.packages[1]]; s.pack = [null, s.pack ? s.pack[1] : null]; } // and the host's package
    }
    return s;
  }
  function sendSync() {
    if (!net.connected) return;
    const base = { t: 'sync', proto: 1, set: { units: rawSet.units, matrix: rawSet.matrix, skills: rawSet.skills || [] }, custom: customSet, config: { levelCostPerTier: Game.CONFIG.levelCostPerTier } };
    if (!m) { send({ ...base, phase: 'lobby' }); return; }
    const ph = phase === 'battle' ? 'result' : phase;
    send({ ...base, phase: ph, m: syncState(), remaining: phase === 'deploy' && deadline ? deadline - now() : 0, ready, nextReady, rematch, summary: lastSummary });
  }
  const sendStatus = () => send({ t: 'status', ready, nextReady, rematch });

  function hostRecv(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'side') {
      if (!m || phase !== 'deploy' || d.round !== m.round) return;
      applySide(d);
      saveHost();
      if (ready[0] && ready[1]) { runFight(); return; }
      panelDeploy();
    } else if (d.t === 'next') {
      if (!lastSummary || d.round !== lastSummary.round) return;
      nextReady[1] = true; sendStatus(); saveHost();
      if (!checkNext() && phase === 'result') showResult(lastSummary);
    } else if (d.t === 'rematch') {
      rematch[1] = true; sendStatus();
      if (!checkRematch() && phase === 'end') showResult(lastSummary);
    }
  }

  function applySide(d) {
    if (!Array.isArray(d.army)) return;
    const n = units.length;
    // skills first: they decide where some squads may stand (Forward planting)
    const tech = {};
    if (d.tech && typeof d.tech === 'object') for (const ui in d.tech) {
      const i = +ui, t = d.tech[ui];
      if (Number.isInteger(i) && i >= 0 && i < n && Array.isArray(t)) tech[i] = Engine.SLOTS.map(k => Math.max(0, Math.min(m.round, t[k] | 0)));
    }
    if (!m.tech) m.tech = [{}, {}];
    m.tech[1] = tech;
    const army = d.army.filter(s => s && Number.isInteger(s.unit) && s.unit >= 0 && s.unit < n && Number.isInteger(s.col) && s.col >= 0 && s.col < Game.COLS && Number.isInteger(s.row) && Game.canPlaceAt(m, 1, s.col, s.row, s.unit));
    const seen = new Set();
    m.armies[1] = army.filter(s => { const k = s.col + ',' + s.row; if (seen.has(k)) return false; seen.add(k); return true; }).map(s => ({
      id: s.id | 0, unit: s.unit, col: s.col, row: s.row, round: s.round | 0, xp: Math.max(0, +s.xp || 0),
      level: Math.max(0, Math.min(Engine.MAX_LEVEL, s.level | 0)), cost: Math.max(0, +s.cost || 0), ...(s.free ? { free: true } : {}),
      ...(s.boughtLevels && typeof s.boughtLevels === 'object' ? { boughtLevels: s.boughtLevels } : {}),
      ...(s.from && (s.movedRound | 0) === m.round && (s.round | 0) < m.round && Number.isInteger(s.from.col) && Number.isInteger(s.from.row) ? { from: { col: s.from.col, row: s.from.row }, movedRound: m.round } : {}),
    }));
    // the guest's move this round: one squad at most
    if (!m.moved) m.moved = [null, null];
    m.moved[1] = null;
    for (const q of m.armies[1]) if (q.movedRound === m.round) { if (m.moved[1] == null) m.moved[1] = q.id; else { delete q.from; delete q.movedRound; } }
    m.gold[1] = Math.max(0, +d.gold || 0);
    m.extraDeploys[1] = Math.max(0, d.extra | 0);
    m.nextId[1] = Math.max(m.nextId[1], d.nextId | 0);
    ready[1] = !!d.ready;
    // the guest's package: picked once in round 1; package squads beyond what it holds are dropped
    if (m.round === 1 && m.pack && m.pack[1] == null && Number.isInteger(d.pack)) Game.choosePack(m, 1, d.pack);
    if (m.round === 1) {
      const allow = (Game.packOf(m, 1) || { squads: [] }).squads.slice();
      m.armies[1] = m.armies[1].filter(s => { if (!s.free) return true; const k = allow.indexOf(s.unit); if (k < 0) return false; allow.splice(k, 1); return true; });
    }
    // the guest's unlocks: earlier ones stay as they were, this round's are taken as sent (gold was checked on their side)
    if (!m.unlocks) m.unlocks = [{}, {}];
    const unl = {};
    for (const ui in m.unlocks[1]) if (m.unlocks[1][ui] < m.round) unl[ui] = m.unlocks[1][ui];
    if (d.unlocks && typeof d.unlocks === 'object') for (const ui in d.unlocks) { const i = +ui; if (Number.isInteger(i) && i >= 0 && i < n && (d.unlocks[ui] | 0) === m.round) unl[i] = m.round; }
    m.unlocks[1] = unl;
    // the guest's elf bribe: an earlier one stays, one sent for this round is taken (gold was checked on their side)
    if (!m.bribe) m.bribe = [0, 0];
    if (!(m.bribe[1] > 0 && m.bribe[1] < m.round)) m.bribe[1] = Game.elfSpot(m) && (d.bribe | 0) === m.round ? m.round : 0;
    // towers are fixed, so the guest's tower isn't taken from the guest
  }

  function checkNext() {
    if (mode !== 'host' || phase !== 'result' || !(nextReady[0] && nextReady[1])) return false;
    hostBeginRound();
    return true;
  }
  function checkRematch() {
    if (mode !== 'host' || phase !== 'end' || !(rematch[0] && rematch[1])) return false;
    hostStartMatch();
    return true;
  }

  // The host's match survives a reload (iPhone Safari drops background tabs)
  function saveHost() {
    if (mode !== 'host' || !m) return;
    try {
      localStorage.setItem(HOST_STORE, JSON.stringify({
        code: net.code, ts: now(), set: rawSet, custom: customSet, config: { levelCostPerTier: Game.CONFIG.levelCostPerTier },
        m: snapshot(m), phase: phase === 'battle' ? 'result' : phase, summary: lastSummary, nextReady, rematch,
        left: phase === 'deploy' ? (deadline ? deadline - now() : pausedLeft) : 0,
      }));
    } catch (e) {}
  }
  function clearHost() { try { localStorage.removeItem(HOST_STORE); } catch (e) {} }

  function resumeHost(s) {
    if (!peerAvailable()) { overlayMsg('Couldn’t load the multiplayer code', 'Check your connection and reload the page.'); return; }
    leaveNet();
    mode = 'host'; me = 0;
    useSet(validSet(s.set) ? s.set : BUILTIN, !!s.custom);
    Game.CONFIG.levelCostPerTier = (s.config && s.config.levelCostPerTier) || Game.CONFIG.levelCostPerTier;
    net.code = s.code;
    m = withUnits(s.m); lastSummary = s.summary || null;
    nextReady = s.nextReady || [false, false]; rematch = s.rematch || [false, false];
    if (s.phase === 'deploy') {
      enterDeploy(0); pausedLeft = Math.max(10000, s.left || deployMs());
      // squads placed this round are kept; ready flags reset
    } else if (lastSummary) { bt = null; showResult(lastSummary); }
    else { phase = 'lobby'; drawLobby(); }
    hud(); netStatus(); render();
    hostOpen(false);
  }

  // ----- guest -----
  function joinMatch(code) {
    if (!peerAvailable()) { overlayMsg('Couldn’t load the multiplayer code', 'Check your connection and reload the page.'); return; }
    leaveNet();
    mode = 'guest'; me = 1; m = null; phase = 'lobby'; bt = null;
    net.code = code; net.alive = true;
    history.replaceState(null, '', shareLink());
    hud(); netStatus(); render();
    guestWaiting('Connecting to match ' + code);
    const peer = new Peer(peerOpts());
    net.peer = peer;
    peer.on('open', () => connectToHost());
    peer.on('disconnected', () => { if (net.alive && !peer.destroyed) setTimeout(() => { if (net.alive && !peer.destroyed && peer.disconnected) peer.reconnect(); }, 1500); });
    peer.on('error', (err) => {
      console.warn('peer', err.type, err);
      if (!net.alive) return;
      if (err.type === 'peer-unavailable') {
        if (!m) guestWaiting(net.tries > 2 ? `Can’t find match ${code}. Make sure your friend still has it open. Retrying` : 'Connecting to match ' + code);
        retryConnect(2500);
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        if (!m) guestWaiting('Can’t reach the match server. Retrying');
        clearTimeout(net.retryTimer);
        net.retryTimer = setTimeout(() => { if (net.alive && !peer.destroyed && peer.disconnected) peer.reconnect(); retryConnect(500); }, 3000);
      }
    });
  }

  function retryConnect(ms) {
    clearTimeout(net.retryTimer);
    net.retryTimer = setTimeout(() => { if (net.alive && !net.connected) connectToHost(); }, ms);
  }

  function connectToHost() {
    const peer = net.peer;
    if (!net.alive || !peer || peer.destroyed || net.connected) return;
    if (peer.disconnected) { peer.reconnect(); return; }
    net.tries++;
    const c = peer.connect(PEER_PREFIX + net.code, { reliable: true });
    let opened = false;
    const giveUp = setTimeout(() => { if (!opened) { try { c.close(); } catch (e) {} retryConnect(500); } }, 9000);
    c.on('open', () => {
      opened = true; clearTimeout(giveUp);
      if (net.conn && net.conn !== c) { try { net.conn.close(); } catch (e) {} }
      net.conn = c; net.connected = true; net.tries = 0;
      netStatus();
      if (phase === 'deploy') { sendSide(); panelDeploy(); }
      if (phase === 'lobby' && !m) guestWaiting('Connected. Waiting for your friend to start the match');
    });
    c.on('data', (d) => { if (c === net.conn) guestRecv(d); });
    c.on('close', () => {
      clearTimeout(giveUp);
      if (c === net.conn) { net.connected = false; net.conn = null; netStatus(); if (phase === 'deploy') panelDeploy(); retryConnect(1500); }
    });
    c.on('error', (e) => console.warn('connection', e));
  }

  function guestWaiting(text) {
    overlay(`<div class="card">
      <span class="eyebrow">Live match</span>
      <span class="code">${esc(net.code)}</span>
      <p class="status wait">${esc(text)}</p>
      <button class="btn" id="leave">Leave</button>
    </div>`);
    panelInfo('Keep this page open.', '', null);
    $('leave').addEventListener('click', showStart);
  }

  function sendSide() {
    if (mode !== 'guest' || !m || phase !== 'deploy') return;
    send({ t: 'side', round: m.round, army: m.armies[1], gold: m.gold[1], extra: m.extraDeploys[1], nextId: m.nextId[1], tech: (m.tech && m.tech[1]) || {}, tower: (m.towers && m.towers[1]) || null, pack: m.pack ? m.pack[1] : null, unlocks: (m.unlocks && m.unlocks[1]) || {}, bribe: (m.bribe && m.bribe[1]) || 0, ready: ready[1] || timeUp });
  }

  function guestRecv(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'sync') {
      if (validSet(d.set)) useSet(d.set, !!d.custom);
      if (d.config && d.config.levelCostPerTier) Game.CONFIG.levelCostPerTier = d.config.levelCostPerTier;
      if (d.phase === 'lobby' || !d.m) { m = null; phase = 'lobby'; hud(); render(); guestWaiting('Connected. Waiting for your friend to start the match'); return; }
      const incoming = withUnits(d.m);
      const theirReady = d.ready ? !!d.ready[0] : false;
      nextReady[0] = d.nextReady ? !!d.nextReady[0] : false;
      rematch[0] = d.rematch ? !!d.rematch[0] : false;
      if (d.phase === 'deploy') {
        if (phase === 'deploy' && m && m.round === incoming.round) {
          // same round after a reconnect: keep our own side as it is here, take everything else from the host
          if (!incoming.tech) incoming.tech = [{}, {}];
          if (!incoming.towers) incoming.towers = [null, null];
          if (!incoming.unlocks) incoming.unlocks = [{}, {}];
          if (!incoming.pack) incoming.pack = [null, null];
          if (!incoming.chars) incoming.chars = [null, null];
          if (!incoming.buff) incoming.buff = [[], []];
          if (!incoming.bribe) incoming.bribe = [0, 0];
          if (!m.bribe) m.bribe = [0, 0];
          for (const k of ['armies', 'gold', 'extraDeploys', 'nextId', 'tech', 'towers', 'unlocks', 'pack', 'chars', 'buff', 'bribe']) incoming[k][1] = (m[k] || [null, null])[1];
          m = incoming; ready[0] = theirReady;
          deadline = d.remaining > 0 ? now() + d.remaining - 300 : 0;
          timeUp = false;
          sendSide(); panelDeploy(); render(); hud();
        } else {
          m = incoming; lastSummary = d.summary || lastSummary;
          nextReady = [false, false]; rematch = [false, false];
          enterDeploy(d.remaining > 0 ? d.remaining - 300 : 0);
          ready[0] = theirReady; panelDeploy();
        }
        return;
      }
      // result or end
      if (phase === 'battle' && d.summary && lastSummary && d.summary.round === lastSummary.round) return; // still watching this battle
      m = incoming; lastSummary = d.summary;
      nextReady[1] = d.nextReady ? !!d.nextReady[1] : false;
      rematch[1] = d.rematch ? !!d.rematch[1] : false;
      if (lastSummary) { if (phase !== 'result' && phase !== 'end') bt = null; showResult(lastSummary); }
      render();
    } else if (d.t === 'fight') {
      if (!d.pre || !d.post || !d.summary) return;
      m = withUnits(d.post); lastSummary = d.summary;
      nextReady = [false, false]; rematch = [false, false];
      playBattle(d.pre);
    } else if (d.t === 'status') {
      if (d.ready) ready[0] = !!d.ready[0];
      if (d.nextReady) nextReady[0] = !!d.nextReady[0];
      if (d.rematch) rematch[0] = !!d.rematch[0];
      if (phase === 'deploy') panelDeploy();
      else if (phase === 'end') showResult(lastSummary);
    }
  }

  function overlayMsg(head, text) {
    overlay(`<div class="card"><h2>${esc(head)}</h2><p>${esc(text)}</p><button class="btn primary" id="ok">OK</button></div>`);
    $('ok').addEventListener('click', showStart);
  }

  // Phones pause pages in the background; reconnect when the page comes back
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !net.alive || !net.peer) return;
    if (net.peer.disconnected && !net.peer.destroyed) net.peer.reconnect();
    if (mode === 'guest' && !net.connected) retryConnect(300);
  });

  window.addEventListener('resize', () => { size(); render(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { size(); render(); });
  const joinCode = (qs.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (joinCode.length === 5) { showStart(); joinMatch(joinCode); }
  else showStart();
})();
</script>
</body>
</html>
