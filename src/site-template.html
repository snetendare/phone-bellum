<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Mans Land">
<meta name="description" content="A small auto-battler. Deploy squads, counter your opponent, watch the armies fight. Play the AI or challenge a friend.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>No Mans Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*BASECSS*/
[hidden] { display: none !important; }
.panel:empty { display: none; }
body { padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0; }
/* tight on purpose: the HUD, the board and the deploy panel should fit a phone screen with as little scrolling as possible */
.app { gap: 8px; }
html:not(.pc) #panel .btn.small { padding: 5px 10px; }
.net { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: center; min-height: 18px; }
.net i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.net.ok i { background: #6FD08C; }
.net.bad { color: var(--foe); }
.net.bad i { background: var(--foe); }
.timer { font-family: var(--font-data); font-size: 20px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--foe); }
.code { font-family: var(--font-data); font-size: clamp(30px, 10vw, 44px); letter-spacing: 0.22em; color: var(--gold); padding-left: 0.22em; }
.linkbox { font-family: var(--font-data); font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; word-break: break-all; user-select: all; -webkit-user-select: all; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.joinrow { display: flex; gap: 8px; justify-content: center; }
.joinrow input { width: 9ch; font: 500 18px var(--font-data); letter-spacing: 0.16em; text-transform: uppercase; text-align: center; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
.card .stack { display: grid; gap: 8px; justify-items: center; width: 100%; }
.card hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.status { font-size: 14px; color: var(--ink); }
.status.wait::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
a { color: var(--you); }
.round-sub { display: flex; align-items: center; justify-content: center; gap: 6px; }
.hud .round { display: flex; align-items: center; gap: 6px; } /* the round number beside its phase and buttons: one row, not two */
.hud .round b { font-size: 20px; }
.cog { width: 24px; height: 24px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.cog:hover, .cog:focus-visible { color: var(--gold); border-color: var(--gold); }
.cog[aria-expanded="true"] { color: var(--gold); border-color: var(--gold); }
.dd { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); width: min(360px, calc(100vw - 32px)); max-height: 70vh; max-height: 70dvh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
.dd .ticks { display: flex; gap: 14px; font-size: 13px; }
.dd .ticks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.dd h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: flex; justify-content: space-between; }
.dd .row { display: grid; grid-template-columns: 22px 1fr; align-items: end; gap: 0 8px; }
.dd .row .ic { grid-row: span 2; display: grid; place-items: center; align-self: center; }
.dd .row .top { display: flex; justify-content: space-between; font-size: 12px; gap: 8px; }
.dd .row .top b { font: 600 12px var(--font-data); }
.dd .row .top span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd .row .track { height: 8px; border-radius: 2px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; }
.dd .row .track i { display: block; height: 100%; border-radius: 2px; }
.sheet { max-height: 80dvh; } /* iPhones: vh counts the space under Safari's toolbars */
.songs { display: grid; gap: 6px; }
.songs button { text-align: left; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); padding: 10px 12px; font: 500 14px var(--font-body); display: grid; gap: 2px; }
.songs button span { font-size: 12px; color: var(--muted); }
.songs button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.hist { display: grid; gap: 6px; max-height: 60vh; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.hist li { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; display: grid; gap: 2px; font: 500 14px var(--font-body); }
.hist li span { font-size: 12px; color: var(--muted); }
.volrow { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
.volrow input { flex: 1; max-width: 220px; accent-color: var(--gold); }
.volrow .num { width: 3ch; text-align: right; font-family: var(--font-data); font-size: 13px; }
/* unit shop: one tab per tier, rarity colours, locked units greyed out */
.tiers { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 4px; }
.tiers button { min-width: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--muted); padding: 4px 5px; font: 600 13px var(--font-display); display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 0 3px; text-align: left; border-top: 3px solid var(--tier); }
.tiers button small { grid-column: 1 / -1; }
.tiers button em { font: 600 clamp(8px, 2.45vw, 11px) var(--font-display); letter-spacing: -0.02em; font-style: normal; color: var(--tier); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button small { font: 500 10px var(--font-data); letter-spacing: -0.03em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiers button[aria-selected="true"] { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--tier); }
.ucard { border-top: 3px solid var(--tier, var(--line)) !important; }
.shop .ucard { padding: 7px 8px 6px; gap: 2px; }
.shop .ucard .t { padding-right: 24px; }
.shop .ucard .n { font-size: 14px; }
.shop .ucard .c { white-space: nowrap; }
.ucard .tier { font: 600 10px var(--font-data); letter-spacing: 0.08em; color: var(--tier); text-transform: uppercase; }
.ucard[data-locked] { opacity: 0.55; border-style: dashed; background: repeating-linear-gradient(135deg, transparent 0 8px, rgba(255,255,255,0.03) 8px 16px), var(--bg); }
.ucard[data-locked] .t > span:first-child { filter: grayscale(1); }
.ucard[data-locked] .n { color: var(--muted); }
.ucard .lock { display: inline-flex; align-items: center; gap: 4px; font: 700 11px/1.15 var(--font-data); letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); }
.ucard .lock svg { flex: none; }
/* a locked unit you can afford to unlock now: a gold card with darker gold text */
.ucard[data-locked="can"] { opacity: 1; border-style: solid; border-color: var(--gold); background: linear-gradient(180deg, rgba(230, 184, 74, 0.30), rgba(230, 184, 74, 0.14)), var(--bg); box-shadow: inset 0 0 0 1px rgba(230, 184, 74, 0.35); }
.ucard[data-locked="can"] .n { color: var(--ink); }
.ucard[data-locked="can"] .t > span:first-child { filter: none; }
.ucard[data-locked="can"] .roles { filter: none; }
.ucard[data-locked="can"] .lock { color: var(--gold-dark); }
/* the unlock button in the unit sheet: big, centred, gold */
.unlock-cta { display: grid; gap: 8px; justify-items: center; text-align: center; border: 1px solid var(--gold); border-radius: 8px; padding: 12px; background: linear-gradient(180deg, rgba(230, 184, 74, 0.16), rgba(230, 184, 74, 0.05)); }
.unlock-cta.short { border-color: var(--line); background: none; }
.unlock-cta .btn { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 18px; font: 700 17px var(--font-display); letter-spacing: 0.02em; }
.unlock-cta .btn svg { width: 15px; height: 16px; }
.unlock-cta .btn.no { padding: 8px 18px; font-size: 14px; }
/* role symbols on unit cards and in the info sheet */
.roles { display: flex; align-items: center; gap: 5px; }
.roles svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.roles .is, .roles .ex { color: var(--ink); }
.roles .beats { color: var(--you); }
.roles .rng { color: var(--muted); margin-left: auto; }
.ucard .roles { margin: 1px 0 0; }
.ucard[data-locked] .roles { filter: grayscale(1); }
/* compact unit cards, so the shop and the Ready button fit under the board */
.uwrap { flex-basis: 118px; }
.ucard { padding: 6px 24px 6px 8px; gap: 1px; }
.ucard .n { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ucard .t, .ucard .c { font-size: 11px; }
.ucard .lock { font-size: 10px; }
.ucard .c { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ucard .roles { margin: 1px -18px 0 0; }
.ucard .roles svg { width: 13px; height: 13px; }
.uwrap .info { top: 4px; right: 4px; width: 20px; height: 20px; font-size: 11px; }
.tiers button { padding: 3px 6px 4px; font-size: 13px; }
/* the Ready / Fight bar stays in sight at the bottom of the screen (of the side column on a PC) */
.panel > .bar:last-child { position: sticky; bottom: 0; z-index: 1; background: var(--panel); margin: -6px -10px -10px; padding: 6px 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-radius: 0 0 6px 6px; }
html.pc .panel > .bar:last-child { margin: -6px -12px -12px; padding: 6px 12px 12px; }
.roleline { margin: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.roleline .roles .rng { margin-left: 0; }
.unlock-btn { width: 100%; padding: 12px 16px; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.confirm { display: grid; gap: 8px; border: 1px solid var(--gold); border-radius: 6px; padding: 10px; }
/* main menu: short rules, with a tap-to-read-more section per bigger concept */
.learn { width: 100%; display: grid; gap: 6px; text-align: left; }
.learn details { border: 1px solid var(--line); border-radius: 6px; background: rgba(21, 33, 37, 0.7); }
.learn summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; padding: 8px 10px; }
.learn summary::-webkit-details-marker { display: none; }
.learn summary b { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--ink); }
.learn summary span { grid-column: 1; font-size: 12px; line-height: 1.35; color: var(--muted); }
.learn summary::after { content: "Read more ▾"; grid-row: 1; grid-column: 2; font-family: var(--font-data); font-size: 11px; color: var(--gold); align-self: center; }
.learn details[open] summary::after { content: "Less ▴"; }
.learn details ul { padding: 0 10px 10px; }
.learn details ul b { color: var(--ink); font-weight: 600; }
/* map picker: a small picture of each map */
.maps { width: 100%; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.maps button { border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 4px; display: grid; gap: 4px; justify-items: center; font-family: var(--font-data); font-size: 12px; min-width: 0; }
.maps img { width: 100%; aspect-ratio: 12 / 16; object-fit: contain; border-radius: 3px; display: block; background: var(--board); }
.chars-pick { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.chars-pick button { border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 4px; display: flex; align-items: center; justify-content: center; font-family: var(--font-data); font-size: 12px; min-width: 0; color: var(--muted); opacity: 0.45; text-decoration: line-through; }
.chars-pick button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chars-pick button[aria-pressed="true"] { border-color: var(--gold); color: var(--ink); opacity: 1; text-decoration: none; }
/* Leaders and Units in the match settings: a button each, with a small menu that folds out below */
.picks { flex-wrap: wrap; }
.pick-menu { width: 100%; display: grid; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); max-height: 50vh; overflow-y: auto; }
.pick-menu .units-tier { display: grid; gap: 4px; }
.pick-menu .units-tier .chars-pick { grid-template-columns: repeat(2, 1fr); }
.pick-menu .units-tier .chars-pick button { justify-content: flex-start; }
.maps button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
/* folded match settings on the menu and in the lobby */
.settings { border: 1px solid var(--line); border-radius: 6px; }
.settings summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; font: 600 14px var(--font-display); color: var(--ink); }
.settings summary::-webkit-details-marker { display: none; }
.settings summary span { font: 400 13px var(--font-body); color: var(--muted); }
.settings summary span::after { content: " ▾"; color: var(--gold); }
.settings[open] summary span::after { content: " ▴"; }
.settings-body { display: grid; gap: 12px; padding: 0 12px 12px; }
.cog.help { width: 28px; height: 28px; font: 600 14px var(--font-display); }
.cog.help.new { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.helplist { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--gold); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
/* choose one of 3 (starting package, tower): cards over the board, like a level-up pick */
.pick { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 10px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: radial-gradient(ellipse at 50% 40%, rgba(13, 19, 21, 0.72), rgba(13, 19, 21, 0.93)); text-align: center; z-index: 2; }
.pick[hidden] { display: none; }
.pick > * { flex-shrink: 0; }
.pick .ph { display: grid; gap: 2px; }
.pick .ph h2 { font-size: clamp(20px, 6vw, 26px); text-transform: uppercase; line-height: 1.05; }
.pick .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-block: auto; }
.pick .opt { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 12px 6px 10px; display: grid; gap: 6px; justify-items: center; align-content: start; min-width: 0;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); transition: transform 0.15s ease, border-color 0.15s ease; animation: pick-in 0.35s ease both; }
.pick .opt:nth-child(2) { animation-delay: 0.07s; }
.pick .opt:nth-child(3) { animation-delay: 0.14s; }
.pick .opt[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 22px rgba(230, 184, 74, 0.25); transform: translateY(-4px); }
.pick .opt .art { display: flex; gap: 4px; align-items: center; justify-content: center; height: 48px; }
.pick .opt .nm { font-family: var(--font-display); font-weight: 600; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
.pick .opt .sub { font-size: 11px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.pick .opt .who { font-size: 12px; color: var(--gold); font-weight: 600; }
.btn.either { background: #A493DE; border-color: #A493DE; color: var(--bg); } /* a choice that replaces another (one mage general at a time) */
/* an upgrade (unit skill, tower skill, general, building skill...): its name and button on one line, a one-line summary
   under it; press and hold the row (or Enter on it) for the whole text and details (upRow) */
.up { display: grid; gap: 1px; border-top: 1px solid var(--line); padding: 6px 4px 2px; margin: 0 -4px; border-radius: 6px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: background 0.15s; }
.up-h { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.up-h > b { flex: 1; min-width: 0; font: 600 14px/1.2 var(--font-display); }
.up-h > b .lab { color: var(--gold); }
.up-h > .up-a { flex: none; display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.up-h .btn.small { padding: 5px 10px; font-size: 12.5px; }
.up-s { font-size: 12px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-more { display: none; font-size: 12px; line-height: 1.35; color: var(--ink); }
.up.open .up-s { white-space: normal; }
.up.open .up-more { display: block; }
.up.held { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.up:focus-visible { outline: 2px solid var(--you); outline-offset: -2px; }
.up-k { font-size: 11px; color: var(--muted); font-weight: 400; letter-spacing: 0; text-transform: none; }
/* either-or upgrades: boxed together with an OR between them (owning one rules out the others) */
/* a fight: the card of the body tapped (inspectCard), live while it fights */
.bcard { position: absolute; top: 8px; left: 8px; z-index: 3; width: min(250px, calc(100% - 16px)); padding: 8px 10px; border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 8px;
  background: rgba(13, 19, 21, 0.92); color: var(--ink); font-size: 12px; line-height: 1.35; display: grid; gap: 5px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45); }
.bcard .bh { display: flex; align-items: center; gap: 6px; }
.bcard .bh b { flex: 1; min-width: 0; font: 600 14px var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bcard .bx { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--muted); font-size: 13px; line-height: 1; padding: 0; }
.bcard .hpb { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--c) 18%, var(--bg)); overflow: hidden; }
.bcard .hpb i { display: block; height: 100%; background: var(--c); }
.bcard .bs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px 8px; font-family: var(--font-data); }
.bcard .bs span { color: var(--muted); font-family: var(--font-body); font-size: 10.5px; display: block; }
.bcard .st { color: var(--muted); }
.orgrp { border: 1px dashed color-mix(in srgb, #A493DE 60%, transparent); border-radius: 10px; padding: 2px 8px 4px; display: grid; }
.orgrp > .or-h { font: 600 10.5px var(--font-display); letter-spacing: 0.08em; text-transform: uppercase; color: #A493DE; padding-top: 4px; }
.orgrp > .up { border-top: 0; }
.or-div { display: flex; align-items: center; gap: 8px; color: #A493DE; font: 600 10.5px var(--font-display); letter-spacing: 0.1em; }
.or-div::before, .or-div::after { content: ''; flex: 1; height: 1px; background: color-mix(in srgb, #A493DE 40%, transparent); }
.pick .det { min-height: 3.6em; font-size: 12px; line-height: 1.4; color: var(--muted); text-align: left; background: rgba(21, 33, 37, 0.85); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.pick .det b { color: var(--ink); }
.pick .row { display: flex; gap: 8px; justify-content: center; }
.pick-peek { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 2; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5); }
.pick-peek[hidden] { display: none; }
@keyframes pick-in { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pick .opt { animation: none; transition: none; } }
/* Factions draft */
.draft { margin: auto; display: grid; gap: 10px; width: 100%; max-width: 46ch; }
.draft .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: var(--muted); text-align: left; }
.draft .sides b { display: block; font-size: 13px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fgrid .fac { border: 1px solid var(--line); border-left: 4px solid var(--fc); border-radius: 6px; background: var(--panel); padding: 8px; text-align: left; display: grid; gap: 3px; min-width: 0; }
.fgrid .fac .nm { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--fc); overflow-wrap: anywhere; }
.fgrid .fac .sub { font-size: 11px; line-height: 1.3; color: var(--muted); overflow-wrap: anywhere; }
.fgrid .fac .st { font-size: 11px; font-weight: 600; color: var(--gold); }
.fgrid .fac[aria-pressed="true"] { border-color: var(--gold); border-left-color: var(--fc); box-shadow: 0 0 0 1px var(--gold); }
.fgrid .fac:disabled { opacity: 0.45; cursor: default; }
@media (prefers-reduced-motion: reduce) { .status.wait::after { animation: none; content: "…"; } }
#wrap { aspect-ratio: var(--board-ar, 0.75); width: min(100%, calc((100svh - 440px) * var(--board-ar, 0.75))); min-width: 240px; margin: 0 auto; }
html:not(.pc) .panel { padding: 10px; gap: 8px; }
html:not(.pc) .panel .hint { font-size: 12px; line-height: 1.35; }

        if (mode !== 'guest' && left <= (mode === 'host' ? -500 : 0)) runFight();

    }).join('');

    if ($('ready')) $('ready').addEventListener('click', () => ready[me] ? toggleReady() : capCheck(toggleReady));

  // After the player changes their own side
  // ---------- Undo all: this player's side as it stood once the round's picks (package, tower, devtest card) were done ----------
  // Every per-side field of the match ([side 0, side 1] arrays, also inside m.dev) plus this side's entries in the shared
  // lists (altar buys, shroom removals, devtest casts). Only this side is put back, so the opponent's moves stay.
  var undoSnap = null;
  const UNDO_SKIP = new Set(['units', 'matrix', 'history', 'round', 'over', 'winner', 'seed', 'off', 'offTowers', 'rules', 'factions', 'map', 'dev', 'altar', 'hp', 'packages']);
  const UNDO_NULL = new Set(['chars', 'elfOwn', 'mageGen', 'moved', 'towers', 'woke']); // per-side fields that start as null (see game.js)
  const undoKey = () => m ? m.seed + ':' + m.round : '';
  const perSide = (v) => Array.isArray(v) && v.length === 2;
  function sideState() {
    const o = { top: {}, dev: {} };
    for (const [k, v] of Object.entries(m)) if (!UNDO_SKIP.has(k) && perSide(v)) o.top[k] = v[me];
    if (m.dev) for (const [k, v] of Object.entries(m.dev)) if (k !== 'casts' && perSide(v)) o.dev[k] = v[me];
    o.altar = (m.altar || []).filter(x => x.side === me);
    o.removed = ((m.map && m.map.removed) || []).filter(x => x.side === me);
    o.casts = ((m.dev && m.dev.casts) || []).filter(x => x.side === me);
    return JSON.stringify(o);
  }
  function takeUndoSnap() { if (m && (!undoSnap || undoSnap.key !== undoKey())) undoSnap = { key: undoKey(), state: sideState() }; }
  function undoAll() {
    if (!editable() || !undoSnap || undoSnap.key !== undoKey()) return;
    const o = JSON.parse(undoSnap.state);
    const blank = (k, v) => Array.isArray(v) ? [] : typeof v === 'number' ? 0 : UNDO_NULL.has(k) || v == null ? null : {};
    for (const [k, v] of Object.entries(m)) if (!UNDO_SKIP.has(k) && perSide(v)) v[me] = k in o.top ? o.top[k] : blank(k, v[me]);
    if (m.dev) for (const [k, v] of Object.entries(m.dev)) if (k !== 'casts' && perSide(v)) v[me] = k in o.dev ? o.dev[k] : blank(k, v[me]);
    if (m.altar || o.altar.length) m.altar = (m.altar || []).filter(x => x.side !== me).concat(o.altar);
    if (m.map && (m.map.removed || o.removed.length)) m.map.removed = (m.map.removed || []).filter(x => x.side !== me).concat(o.removed);
    if (m.dev) m.dev.casts = (m.dev.casts || []).filter(x => x.side !== me).concat(o.casts);
    selected = null; moveMode = false; moving = null; charmMode = false; elfPlacing = false; wallPlacing = false; fortPlacing = false; markPicking = false; bPlacing = null; castMode = null; guideMode = null; guideDraft = []; guideDrag = null; rangeOf = null;
    closeSheet(); changed();
  }
  function changed() {

    if (mode === 'host') saveHost();

  function toggleReady() {
    if (phase !== 'deploy' || timeUp) return;

  function panelBattle() {
    $('panel').innerHTML = `
      <div class="bar">

  // a speed button: the speed (vs the computer), or this player's pick in a live match (see liveSpeed)
  function pickSpeed(s) {

  function showSpeed() {
    const bs = phase === 'battle' ? $('panel').querySelectorAll('[data-s]') : [];
    if (!bs.length) return;
    const cur = playSpeed(), mine = solo() ? cur : liveSpeed[me], theirs = solo() ? cur : liveSpeed[foe()];
    bs.forEach(x => {
      const s = +x.dataset.s;
      x.setAttribute('aria-pressed', String(s === cur));

      const c = $('code-in').value.toUpperCase().replace(/[^A-Z0-9]/g, '');

      if (c.length !== 5) { $('join-msg').hidden = false; $('join-msg').textContent = 'Match codes are 5 letters and numbers, tournament codes 4.'; return; }

    $('code-in').addEventListener('keydown', (e) => { if (e.key === 'Enter') joinNow(); });
    $('panel').querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => {

    }));
    wireMapSeg(); wireCharSeg(); wirePackSeg(); wireSettings();

      timerOn = b.dataset.tm === '1';

  }

  // the rules, kept out of the way: the menu only has a one-line pitch and this button

  function openEncyclopedia(view = null) {

        .map(x => x.length > 3 ? x : [...x, /always on/.test(x[2]) ? 0 : +((x[2].match(/(\d+) gold/) || [])[1] || 0)])

  function openHowTo() {

  // the health a fallen tower cost its owner this round (less than TOWER_FALL_HP when the round's cap was near)
  const towerLoss = (sum, side) => sum.towerHp ? sum.towerHp[side] : Game.TOWER_FALL_HP;
  function showResult(sum) {
    if (mode === 'tutorial') { tutResult(sum); return; }
    const iWon = sum.winner === me && !sum.timeout, iLost = sum.winner === foe() && !sum.timeout;
    const head = sum.timeout ? 'Time ran out' : iWon ? `Round ${sum.round} won` : iLost ? `Round ${sum.round} lost` : 'Draw';
    const cls = iWon ? 'you' : iLost ? 'foe' : '';
    const them = foeName();
    const lines = [];
    if (sum.dmg[foe()]) lines.push(`${them} takes <b class="num">${sum.dmg[foe()]}</b> damage.`);
    if (sum.dmg[me]) lines.push(`You take <b class="num">${sum.dmg[me]}</b> damage.`);
    if (!sum.dmg[0] && !sum.dmg[1]) lines.push('Nobody takes damage.');
    if (sum.towerFell && sum.towerFell[foe()]) lines.push(`You broke ${mode === 'claude' ? 'Claude’s' : 'the enemy’s'} tower${towerLoss(sum, foe()) ? `: −${towerLoss(sum, foe())} health for them` : ''}.`);
    if (sum.towerFell && sum.towerFell[me]) lines.push(`Your tower fell${towerLoss(sum, me) ? `: −${towerLoss(sum, me)} health` : ''}.`);
    if (sum.devLoss) { // Factions devtest: buildings destroyed in the fight
      const fell = (sd) => sum.devLoss[sd].fell.map(id => esc((Game.devBuilding(id) || {}).name || id)).join(', ');
      if (sum.devLoss[foe()].fell.length) lines.push(`You destroyed ${esc(foeName().toLowerCase() === 'enemy' ? 'the enemy’s' : foeName() + '’s')} ${fell(foe())}${sum.devLoss[foe()].hp ? ` (−${sum.devLoss[foe()].hp} health)` : ''}.`);
      if (sum.devLoss[me].fell.length) lines.push(`Your ${fell(me)} ${sum.devLoss[me].fell.length === 1 ? 'was' : 'were'} destroyed${sum.devLoss[me].hp ? ` (−${sum.devLoss[me].hp} health)` : ''}.`);
    }
    const lv = (list) => list.map(x => `${esc(x.building ? buildingName(x.building) : units[x.unit].name)} (to level ${x.level + 1})`).join(', ');
    const lvLines = [];
    if (solo() && lastAiLevels.length) lvLines.push(`<p><span style="color:var(--gold)">${them} leveled up before the fight:</span> ${lv(lastAiLevels)}.</p>`);

    if (mode === 'claude' && claude.say) lvLines.push(`<p class="big" style="color:var(--foe);font-style:italic">“${esc(claude.say)}”</p>`);
    if (mode === 'claude' && claude.note) lvLines.push(`<p>${esc(claude.note)}</p>`);
    if (sum.gentlemen && sum.gentlemen[me].length) lvLines.push(`<p><span style="color:${CHARM_COL}">Now Gentlemen (5 Charisma):</span> ${sum.gentlemen[me].map(x => esc(units[x.unit].name)).join(', ')}.</p>`);
    if (sum.converted && (sum.converted[me] || sum.converted[foe()])) lvLines.push(`<p><span style="color:${CHARM_COL}">Won over:</span> ${[sum.converted[me] ? `your Gentlemen charmed ${sum.converted[me]} enemy ${sum.converted[me] === 1 ? 'body' : 'bodies'}` : '', sum.converted[foe()] ? `${sum.converted[foe()]} of yours went over to ${esc(them)}` : ''].filter(Boolean).join('; ')}.</p>`);
    if (sum.glut && sum.glut[me].length) lvLines.push(`<p><span style="color:${GLUT_COL}">Glut:</span> ${sum.glut[me].map(x => `${esc(units[x.unit].name)} ate ${x.gained} (${x.glut}${x.full ? ', full' : ''})`).join(', ')}.</p>`);
    for (const [sd, who] of [[me, 'Your'], [foe(), 'Their']]) if (sum.evolved && sum.evolved[sd].length) lvLines.push(`<p><span style="color:${sd === me ? 'var(--gold)' : 'var(--foe)'}">Evolved:</span> ${who} ${sum.evolved[sd].map(x => `${esc(units[x.unit].name)} has ${esc(x.skill)}`).join(', ')} from the next fight on.</p>`);
    if (sum.newlyReady[me].length) lvLines.push(`<p><span style="color:var(--gold)">Ready to level up:</span> ${lv(sum.newlyReady[me])}.</p>`);
    for (const x of (sum.buildings && sum.buildings[me]) || []) lvLines.push(`<p><span style="color:var(--gold)">${esc(buildingName(x.id))}:</span> ${x.built ? 'built. From now on you can buy one of its units each round (tap it).' : x.lost ? 'destroyed. It starts the next round half built, and your Cog Builder builds it again.' : `${Math.round(x.progress * 100)}% built; it carries on next fight.`}</p>`);
    for (const x of (sum.buildings && sum.buildings[foe()]) || []) if (x.built || x.lost) lvLines.push(`<p><span style="color:var(--foe)">${esc(them)}’s ${esc(buildingName(x.id))}</span> ${x.built ? 'is built.' : 'was destroyed.'}</p>`);
    resultShownAt = now();
    if (m.over) {

      if (inTour) tourReport(m.winner);

      phase = 'end'; hud(); netStatus();
      const wait = !solo() && rematch[me];
      const asked = !solo() && rematch[foe()] && !rematch[me];
      overlay(`<div class="card">

        <p class="big">${lines.join(' ')}</p>

        <div class="btnrow">
          ${solo() ? '<button class="btn primary" id="again">Play again</button>'
            : inTour ? '<button class="btn primary" id="again">Back to the tournament</button>'
            : `<button class="btn primary" id="again" ${wait ? 'disabled' : ''}>${wait ? 'Waiting for opponent…' : 'Rematch'}</button>`}

        </div>
      </div>`);
      $('panel').innerHTML = '';
      $('again').addEventListener('click', mode === 'claude' ? startClaudeMatch : mode === 'ai' ? startAiMatch : inTour ? () => { if (mode === 'host') clearHost(); tour.menu = false; showStart(); } : askRematch);
      $('menu').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
      bindLook(asked ? 'Your opponent wants a rematch.' : `${win ? 'Victory' : loss ? 'Defeat' : 'Draw'} · the board before the last fight.`);

    if (sum.shutdown && sum.shutdown[me]) gold.push(`+${sum.shutdown[me]} shutdown`);
    if (sum.capLost && sum.capLost[me]) gold.push(`−${sum.capLost[me]} over the ${Game.CARRY_CAP} cap`);
    if (sum.felix && sum.felix[me]) gold.push(`+${sum.felix[me]} Felix`);
    if (sum.invest && sum.invest[me]) gold.push(`+${sum.invest[me]} investment`);
    if (sum.loan && sum.loan[me]) gold.push(`−${sum.loan[me]} loan`);
    if (sum.markBounty && sum.markBounty[me]) gold.push(`+${sum.markBounty[me]} mark bounty`);
    if (sum.objective && sum.objective[me]) gold.push(`+${sum.objective[me]} bridge held`);
    const tr = sum.treasury && sum.treasury[me];
    if (tr && tr.gold) gold.push(`+${tr.gold} treasury`);
    if (tr && tr.stole) gold.push(`+${tr.stole} stolen from their treasury`);
    if (tr && tr.lost) gold.push(`−${tr.lost} stolen from your treasury`);
    if (sum.devGold && sum.devGold[me]) gold.push(`+${sum.devGold[me]} buildings and Powers`);
    if (sum.devLoss && sum.devLoss[me].gold) gold.push(`−${sum.devLoss[me].gold} buildings lost`);
    const waiting = !solo() && nextReady[me];
    overlay(`<div class="card">
      <h2 class="${cls}">${head}</h2>
      <p class="big">${lines.join(' ')}</p>
      ${lvLines.join('')}
      <p class="num" style="color:var(--gold)">${gold.join(' · ')}</p>
      <div class="btnrow">
        ${waiting ? '<p class="status wait">Waiting for your opponent</p>' : `<button class="btn primary" id="next">Next round</button>`}
        <button class="btn" id="menu">Main menu</button>
      </div>
    </div>`);
    $('panel').innerHTML = '';
    if ($('next')) $('next').addEventListener('click', tapNext);
    // leaving mid-match takes a second tap, so it can't happen by accident
    $('menu').addEventListener('click', () => {
      const b = $('menu');
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = solo() ? 'Tap again to quit this match' : 'Tap again to leave your opponent'; return; }

    });
  }

  // ---------- Main menu from the in-match settings: leaving a match that is still on forfeits it ----------
  function askForfeit() {
    if (!m || phase === 'end' || mode === 'tutorial') { quitToMenu(); return; }
    $('sheet').innerHTML = `
      <div class="bar" data-keep><h3 id="sheet-h">Main menu</h3></div>
      <p class="big" style="margin:0">You will forfeit the match. Are you sure?</p>
      <span class="btnrow"><button class="btn primary" id="forfeit-yes">Yes</button><button class="btn" id="forfeit-no">No</button></span>`;
    $('forfeit-yes').addEventListener('click', forfeit);
    $('forfeit-no').addEventListener('click', openSoundSheet);
  }
  function quitToMenu() { if (mode === 'host') clearHost(); closeSheet(true); showStart(); }
  function forfeit() {
    if (!m || phase === 'end') { quitToMenu(); return; }
    if (tourLive()) tourReport(foe()); // a tournament match: the opponent wins
    if (!solo() && net.connected) {
      send({ t: 'forfeit' });
      // showStart drops the connection: keep it a moment longer so the message gets there
      const c = net.conn, pr = net.peer;
      net.conn = null; net.peer = null; net.connected = false;
      setTimeout(() => { try { c.close(); } catch (e) {} try { pr.destroy(); } catch (e) {} }, 1500);
    }
    quitToMenu(); // the host's saved match goes too, so the link can't resume it
  }
  // the other player forfeited: this one wins
  function foeForfeited() {
    if (!m || phase === 'end') return;
    const inTour = !!tourLive();
    if (inTour) tourReport(me); // before leaveNet: that forgets the match code
    if (mode === 'host') clearHost();
    leaveNet(); cancelAnimationFrame(raf);
    m.over = true; m.winner = me; phase = 'end'; bt = null; battlePre = null; lastPre = null; deadline = 0; selected = null; resultShownAt = 0;
    closeSheet(true); hud(); setNet(''); $('clock').textContent = ''; render();
    overlay(`<div class="card">
      <span class="eyebrow">Round ${m.round}</span>
      <h2 class="you">Victory</h2>
      <p class="big">Your opponent forfeited the match.</p>
      <div class="btnrow"><button class="btn primary" id="menu">${inTour ? 'Back to the tournament' : 'Main menu'}</button><button class="btn" id="look">Look at board</button></div>
    </div>`);
    $('panel').innerHTML = '';
    $('menu').addEventListener('click', () => { if (inTour) tour.menu = false; showStart(); });
    bindLook('Victory · your opponent forfeited.');
  }
  // the match-over screen: Look at board hides it so the final board can be seen (and turned, on the 3D board, or
  // hovered for ranges); Show result in the panel brings it back. note: the line beside that button.
  var endLook = false, endNote = '', endClock = '';
  function bindLook(note) {
    endNote = note; endLook = false;
    if ($('look')) $('look').addEventListener('click', () => lookAtBoard(true));
  }
  function lookAtBoard(on) {

    if (on) {

  // ---------- match reports ----------
  // Inside Claude, every match on this screen is saved to the artifact's own storage (only the owner and editors
  // can read it), so Claude can look back at how matches went when asked.
  let reportDb = null, report = null, reportChain = Promise.resolve();
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') reportDb = await window.claude.use('db'); } catch (e) { reportDb = null; }
    if (reportDb && phase === 'start') showStart();
  })();
  function startReport() {
    report = null;
    if (!reportDb || mode === 'guest') return;
    const t = new Date();
    report = {
      id: 'm' + t.getTime().toString(36), mode, started: t.toISOString(), updated: t.toISOString(),
      units: units.map(u => u.name), customUnits: customSet, timer: mode === 'host' ? DEPLOY_SECONDS : (timerOn ? DEPLOY_SECONDS : 0),
      over: false, winner: null, rounds: [],
    };
  }
  function armyOf(match, side) {
    return match.armies[side].map(q => ({ unit: units[q.unit].name, col: q.col, row: q.row, level: q.level + 1, placed: q.round }));
  }
  const unlocksOf = (match, side) => units.map((u, i) => Game.unlockCost(match, i) > 0 && Game.isUnlocked(match, side, i) ? u.name : null).filter(Boolean);
  function skillsOf(match, side) {
    const out = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.hasSkill(match, side, i, k) && !Game.isInnate(match, i, k)) out.push(`${(u.skillDefs[k] || {}).name} (${u.name})`); }));
    return out;
  }
  function recordRound(pre, sum) {
    if (!report || !reportDb) return;
    const p = withUnits(pre), you = me, them = foe();
    const entry = {
      round: sum.round,
      you: { hpBefore: p.hp[you], gold: p.gold[you], army: armyOf(p, you), skills: skillsOf(p, you), tower: (p.towers && p.towers[you]) || null, unlocked: unlocksOf(p, you), character: Game.charOf(p, you), package: Game.packOf(p, you) ? Game.packOf(p, you).squads.map(ui => units[ui].name) : null },
      them: { hpBefore: p.hp[them], gold: p.gold[them], army: armyOf(p, them), skills: skillsOf(p, them), tower: (p.towers && p.towers[them]) || null, unlocked: unlocksOf(p, them), character: Game.charOf(p, them), package: Game.packOf(p, them) ? Game.packOf(p, them).squads.map(ui => units[ui].name) : null },
      result: { winner: sum.winner === you ? 'you' : sum.winner === them ? 'them' : 'draw', timeout: !!sum.timeout, seconds: Math.round(sum.time), damageToYou: sum.dmg[you], damageToThem: sum.dmg[them], yourTowerFell: !!(sum.towerFell && sum.towerFell[you]), theirTowerFell: !!(sum.towerFell && sum.towerFell[them]) },
    };
    if (mode === 'claude') entry.claude = { said: claude.say || null, alsoDid: claude.did.slice(), leveledUp: lastAiLevels.map(x => `${x.building ? buildingName(x.building) : units[x.unit].name} to level ${x.level + 1}`), botPlayed: !!claude.bot, note: claude.note || null };
    report.rounds.push(entry);
    report.updated = new Date().toISOString();
    if (m && m.over) { report.over = true; report.winner = m.winner === you ? 'you' : m.winner === them ? 'them' : 'draw'; report.hpLeft = { you: m.hp[you], them: m.hp[them] }; }
    const body = JSON.parse(JSON.stringify(report)), ref = reportDb.doc('matches/' + report.id);
    reportChain = reportChain.then(() => ref.set(body)).catch((e) => console.warn('match report not saved', e && e.code));
  }

  // ---------- match history ----------
  // Two-player matches only: the host's phone posts each round, once, to a Google Sheet web app
  // (tools/match-history.gs, deployed from the sheet). Empty URL: nothing is saved and the Match history button is hidden.
  const HISTORY_URL = 'https://script.google.com/macros/s/AKfycbzEXvAprmkKnWLvx0RhqIwjW90EAuL4GSeeRN1vvN5kz6VxZEJQ9Xx_vcwSbDBNi3rI/exec';
  function saveHistory(pre, sum) {
    if (!HISTORY_URL || mode !== 'host') return;
    const p = withUnits(pre), charName = (sd) => { const c = Game.charInfo(Game.charOf(p, sd)); return c ? c.name : ''; };
    const army = (sd) => armyOf(p, sd).map(q => `${q.unit} L${q.level}`).join(', ');
    const row = {
      code: net.code, round: sum.round, map: (Game.mapOf(p) || {}).name || '', hostChar: charName(0), guestChar: charName(1),
      winner: sum.winner === 0 ? 'host' : sum.winner === 1 ? 'guest' : 'draw', timeout: !!sum.timeout, seconds: Math.round(sum.time),
      dmgHost: sum.dmg[0], dmgGuest: sum.dmg[1], hpHost: m.hp[0], hpGuest: m.hp[1], over: !!m.over,
      matchWinner: m.over ? (m.winner === 0 ? 'host' : m.winner === 1 ? 'guest' : 'draw') : '',
      hostArmy: army(0), guestArmy: army(1), hostSkills: skillsOf(p, 0).join(', '), guestSkills: skillsOf(p, 1).join(', '),
    };
    // text/plain keeps it a simple request (no CORS preflight, which Apps Script doesn't answer)
    try { fetch(HISTORY_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(row) }).catch(() => {}); } catch (e) {}
  }
  async function openHistorySheet() {
    $('sheet').innerHTML = `<div class="bar"><h3 id="sheet-h">Match history</h3><button class="btn small" id="close">Close</button></div>
      <p class="hint" id="hist-msg" aria-live="polite" style="margin:0">Loading…</p><ul class="hist" id="hist"></ul>`;
    $('sheet-back').hidden = false;
    $('close').addEventListener('click', closeSheet);
    let rows;
    try { rows = (await (await fetch(HISTORY_URL + '?n=40')).json()).rows || []; } catch (e) { rows = null; }
    if (!$('hist')) return;

    $('hist-msg').textContent = rows.length ? `The latest ${rows.length === 1 ? 'battle' : rows.length + ' battles'} from two-player matches.` : 'No battles saved yet. Play a match against a friend.';
    $('hist').innerHTML = rows.map(r => {
      const who = (w) => w === 'host' ? (r.hostChar || 'Host') : w === 'guest' ? (r.guestChar || 'Guest') : 'Draw';

      return `<li>${esc(r.hostChar || 'Host')} vs ${esc(r.guestChar || 'Guest')} · round ${esc(r.round)}: ${r.winner === 'draw' ? 'draw' : esc(who(r.winner)) + ' won'}${r.timeout ? ' on time' : ''}
        <span>${esc(t)} · match ${esc(r.code)}${r.map ? ' · ' + esc(r.map) : ''} · damage ${esc(r.dmgHost)}/${esc(r.dmgGuest)}${r.over === true || r.over === 'TRUE' ? ` · match over, ${r.matchWinner === 'draw' ? 'draw' : esc(who(r.matchWinner)) + ' won'}` : ''}</span>
        <span>${esc(r.hostArmy || '–')} vs ${esc(r.guestArmy || '–')}</span></li>`;

  // ---------- flow: vs Claude ----------
  // Only inside Claude: the page asks Claude (on the player's own account) for its move each round.
  let sampleFn = null;
  (async () => {
    try { if (window.claude && typeof window.claude.use === 'function') sampleFn = await window.claude.use('sample'); } catch (e) { sampleFn = null; }
    if (sampleFn && phase === 'start') showStart();
  })();
  const claude = { busy: false, fightWaiting: false, bot: false, off: false, did: [], say: '', note: '', started: 0, ctl: null, history: [] };

  function startClaudeMatch() {
    if (!sampleFn) { startAiMatch(); return; }
    leaveNet();
    mode = 'claude'; me = 0; restoreSet();
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, mapPick, m && m.map ? m.map.id : null, matchChars(), matchOpts());
    nextReady = [false, false]; rematch = [false, false];
    claude.off = false; claude.history = [];
    startReport();
    beginAiRound();
  }

  function claudeStatus() {
    if (claude.busy) return `Claude is planning its move… ${Math.max(0, Math.round((now() - claude.started) / 1000))} s`;
    if (claude.bot) return claude.off ? 'The bot is playing for Claude.' : 'Claude had trouble this round, so the bot played it.';
    return 'Claude has made its move.';
  }
  setInterval(() => { if (mode === 'claude' && phase === 'deploy' && claude.busy) { const h = $('panel').querySelector('.bar:last-child .hint'); if (h) h.textContent = claudeStatus(); } }, 1000);

  function startClaudeTurn() {
    claude.did = []; claude.say = ''; claude.note = ''; claude.fightWaiting = false; claude.bot = false;
    if (claude.off) { Game.aiDeploy(m, 1); claude.bot = true; return; }
    const round = m.round, prompt = claudePrompt();
    claude.busy = true; claude.started = now();
    if (claude.ctl) claude.ctl.abort();
    const ctl = claude.ctl = new AbortController();
    const opts = { modelTier: 'complex', cache: false, signal: ctl.signal };
    const once = () => typeof sampleFn.json === 'function'
      ? sampleFn.json(prompt, opts)
      : sampleFn(prompt, opts).then(r => { const t = r.text, a = t.indexOf('{'), b = t.lastIndexOf('}'); return JSON.parse(t.slice(a, b + 1)); });
    const fatal = (e) => e && ['cancelled', 'not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired', 'rate_limited'].includes(e.code);
    // one retry on a hiccup before the bot steps in
    const ask = once().catch(e => (fatal(e) || ctl !== claude.ctl || m.round !== round) ? Promise.reject(e) : once());
    ask.then((mv) => {
      if (ctl !== claude.ctl || mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      applyClaudeMove(mv && typeof mv === 'object' ? mv : {});
    }, (e) => {
      if (ctl !== claude.ctl || (e && e.code === 'cancelled')) return;
      if (mode !== 'claude' || !m || m.round !== round || phase !== 'deploy') return;
      const code = e && e.code;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed', 'session_expired'].includes(code)) {
        claude.off = true;
        claude.note = code === 'not_granted' ? 'Claude wasn’t allowed to play, so the bot is playing for it this match.' : 'Claude isn’t available here, so the bot is playing for it this match.';
      } else claude.note = code === 'rate_limited' ? 'Claude hit a usage limit this round, so the bot played it.' : 'Claude had trouble this round, so the bot played it.';
      Game.aiDeploy(m, 1); claude.bot = true;
    }).finally(() => {
      if (ctl !== claude.ctl) return;
      claude.busy = false;
      if (mode === 'claude' && phase === 'deploy') {
        if (claude.fightWaiting) { claude.fightWaiting = false; runFight(); }
        else panelDeploy();
      }
    });
  }

  // Everything Claude needs to know, from its own (red) side of the board
  function claudePrompt() {
    const n1 = (x, d = 1) => Math.round(x * 10 ** d) / 10 ** d;
    const unitLine = (u, i) => {
      const t = [];
      if (u.splash > 0) t.push(`splash ${u.splash} m`);
      if (u.defense === 'armor') t.push(`armor ${u.defVal}`);
      if (u.defense === 'ward') t.push(`ward ${u.defVal} (max damage per hit)`);
      if (u.burst > 1) t.push(`burst ${u.burst}`);
      if (u.flame > 0) t.push(u.flame >= 180 ? 'every attack hits all enemies in range all around it' : `${u.slam ? 'ground slam' : 'flamethrower'}: every attack hits all enemies in range within ${u.flame}° to each side of its target`);
      if (u.stunHit > 0) t.push(`every hit stuns for ${u.stunHit} s (not towers)`);
      else if (u.pellets > 1) t.push(`shotgun ${u.pellets}`);
      if (u.spinUp > 0) t.push(`spin-up ${u.spinUp}%/s on one target, up to 3x attack speed, starts over when it switches target`);
      if (u.spinHit > 0) t.push(`damage spin-up ${u.spinHit}%/s on one target, up to 3x hit size, starts over when it switches target`);
      if (u.pierce > 0) t.push(`pierce ${u.pierce}`);
      if (u.projSpeed > 0) t.push(`projectile ${u.projSpeed} m/s`);
      if (u.minRange > 0) t.push(`min range ${u.minRange} m`);
      if (u.charge > 1) t.push(`charge x${u.charge}`);
      if (u.knockback > 0) t.push(`knockback ${u.knockback} m`);
      if (u.trample > 0) t.push(`tramples ${u.trample}%`);
      if (u.chargeStun > 0) t.push(`stunned ${u.chargeStun} s after each charge (can't move or attack)`);
      if (u.chargeCd > 0) t.push(`charges at most once every ${u.chargeCd} s`);
      if (u.trampleRun > 0) t.push(`runs on ${u.trampleRun} m past its target after a charge${u.trampleSpeed > 0 ? ` at ${u.trampleSpeed}x speed` : ''}`);
      if (u.stomp > 0) t.push(`every attack hits all enemies within ${u.stomp} m of it`);
      if (u.levelHp > 0) t.push(`each level adds +${u.levelHp}% health (not +100%)`);
      if (u.pctHit > 0) t.push(`every hit also deals ${u.pctHit}% of the target's max health, ignoring armor (not to towers)`);
      if (u.deathBlast > 0) t.push(`explodes on death for ${u.deathBlast}% of max health within ${Engine.BLAST_RADIUS} m`);
      if (u.windUp > 0) t.push(`wind-up ${u.windUp} s`);
      if (u.ram) t.push(`NEVER ATTACKS: runs straight at the enemy tower (the nearest enemy once it is down) and rams it once for its hit (${n1(u.hit)}), then is destroyed`);
      if (u.carrier) t.push('CARRIES ONE SQUAD of any other unit, hidden from the opponent until it is destroyed: place a squad on its tile (price and deployment as usual) and it rides inside, then jumps out where the carrier falls');
      if (u.noFlank) t.push('can\'t be placed on flank tiles');
      if (u.building) t.push(`A BUILDING (${Game.footprint(m, i)}x${Game.footprint(m, i)} tiles: "col"/"row" in "place" is its first column and row, every tile must be free in your zone; it never moves, never attacks and doesn't count as a unit left standing). See Buildings below for how it is built and its skills`);
      if (u.roll > 0) t.push(`NEVER STOPS TO ATTACK: rolls at its target from ${Engine.ROLL_START} m/s up to its speed over ${n1(u.roll)} s, hits every enemy body it rolls over for its hit, carries on ${Engine.ROLL_PAST} m past the target, stops and rolls back (the faster it gets going, the more often it hits)`);
      if (u.build && u.build.unit) { const c = u.build.unit; t.push(`BUILDS once per fight: when an enemy is within ${u.build.range} m it stops for ${n1(u.build.time)} s (faster with other builders next to it) and builds ${u.build.count} ${c.name}${u.build.count > 1 ? 's' : ''} (${n1(c.hp)} health, ${n1(c.hit)} hit, ${n1(c.aps)} attacks/s, ${c.range} m range, never moves, gone after the fight), then fights on`); }
      if (u.link) t.push('linked health: its bodies share one health pool and fall together');
      if (u.escort) t.push(`brings a healbot that heals the squad ${n1(u.escort.pct)}% of max health a second`);
      for (const x of [u.trait, u.trait2, u.trait3, u.trait4]) if (x && x.name) t.push(`trait ${x.name}: ${x.text || ''}`);
      const need = (k) => Game.skillNeeds(m, i, k).map(j => `"${u.skillDefs[j].name}"`).join(' and ');
      const either = (k) => Game.skillOr(m, i, k).map(j => `"${u.skillDefs[j].name}"`).join(' or ');
      const anyNeed = (k) => Game.skillNeedsAny(m, i, k).map(j => `"${u.skillDefs[j].name}"`).join(' or ');
      const sk = (u.skillDefs || []).map((d, k) => d ? `skill ${k + 1} "${d.name}" (${Game.isInnate(m, i, k) ? 'BUILT IN: always on for both players, free' : Game.isEvolve(m, i, k) ? `EVOLVE SKILL: never bought, free: a squad gets it by itself after the fight ${d.needs === 'glutMax' ? 'that fills its Glut' : 'it meets its need in'}, for the rest of the match` : `${Game.isAwaken(m, i, k) ? `AWAKEN SKILL: bought for ONE squad at a time with "awaken": [squad id], only ONE unit type a match${Game.wokeUnit(m, 1) != null ? ` (yours: ${units[Game.wokeUnit(m, 1)].name})` : ''}, ` : Game.isMaster(m, i, k) ? 'MASTER SKILL: for all your squads of it, ' : ''}${Game.skillCost(m, i, k, 1)} gold${Game.hasSkill(m, 1, i, k) ? ', YOU OWN IT' : need(k) ? `, needs ${need(k)} first` : anyNeed(k) ? `, needs ${anyNeed(k)} first` : ''}${either(k) ? `, EITHER OR: can't be owned together with ${either(k)}` : ''}`}): ${Engine.describeSkill(d)}` : null).filter(Boolean);
      const lock = Game.isUnlocked(m, 1, i) ? (Game.unlockCost(m, i, 1) ? ' [unlocked]' : '') : ` [LOCKED: unlock once for ${Game.unlockCost(m, i, 1)} gold before you can place it]`;
      return `- ${u.name}${lock}: price ${Game.shopCost(m, 1, i)}${Game.startLevel(m, 1) ? ` (squads start at level ${Game.startLevel(m, 1) + 1})` : ''}, ${u.bodies} ${u.bodies === 1 ? 'body' : 'bodies'} x ${n1(u.hp, 0)} hp each, hit ${n1(u.hit)} x ${n1(u.aps, 2)}/s, range ${u.range} m, speed ${u.speed} m/s${t.length ? ', ' + t.join(', ') : ''}. Level-up cost ${Game.levelCost(u)}.${sk.length ? '\n    ' + sk.join('\n    ') : ''}`;
    };
    const tag = (u) => u.name;
    const matrix = units.map((u, i) => `${tag(u)}: ` + units.map((v, j) => i === j ? null : `${tag(v)} ${M[i][j] > 0 ? '+' : ''}${Math.round(M[i][j] * 100)}`).filter(Boolean).join(', ')).join('\n');
    const mine = m.armies[1].map(s => {
      const u = units[s.unit], need = s.level < Engine.MAX_LEVEL ? Math.round(Game.xpNeeded(u, s.level)) : null;
      return `- id ${s.id}: ${u.name} at col ${s.col}, row ${s.row}${Game.isRider(s) ? ` (riding inside your ${units[(Game.carrierOf(m, 1, s) || s).unit].name}, id ${s.in})` : ''}, level ${s.level + 1}${need ? `, XP ${Math.round(s.xp)}/${need}` : ', max level'}${Game.isReady(m, s) ? ', READY TO LEVEL UP' : ''}${s.awaken > 0 ? ', AWAKENED' : ''}${Game.isEvolved(s) ? ', EVOLVED' : ''}${s.round < m.round ? `, sells for ${Game.sellValue(m, s)}` : ''}${Game.enzoSkill(m, 1, s) != null ? `, has skill "${u.skillDefs[Game.enzoSkill(m, 1, s)].name}" (Enzo${Game.enzoActive(m, 1, s.unit) ? '' : `; off until you have ${Game.CHAR.enzoMin} squads of this unit`})` : ''}${Game.charmOf(s) ? `, charisma ${Game.charmOf(s)}/${Engine.CHARM_MAX}${Game.isGentleman(s) ? ' (Gentleman)' : ''}` : ''}${Game.glutMax(m, 1, s) ? `, Glut ${Game.glutOf(s)}/${Game.glutMax(m, 1, s)}${Game.glutFull(m, 1, s) ? (Game.isEvolved(s) ? ' (full)' : ' (full: evolves after this fight)') : ''}` : ''}`;
    });
    const theirs = m.armies[0].filter(s => s.round < m.round && !Game.hiddenFromFoe(m, s)).map(s => { const p = Game.seenAt(m, s); return `- ${units[s.unit].name} at col ${p.col}, row ${p.row}, level ${Game.seenLevel(m, s) + 1}${Game.seenAwake(m, s) ? ', awakened' : ''}${Game.isEvolved(s) ? ', evolved' : ''}`; });
    const theirSkills = [];
    units.forEach((u, i) => Engine.SLOTS.forEach(k => { if (Game.skillVisible(m, 0, i, k)) theirSkills.push(`${(u.skillDefs[k] || {}).name} on ${u.name}`); }));
    const hist = m.history.slice(-4).map(h => `- round ${h.round}: ${h.timeout ? 'time ran out' : h.winner === 1 ? 'you won' : h.winner === 0 ? 'you lost' : 'draw'}; you took ${h.dmg[1]} damage, they took ${h.dmg[0]}`);
    // how each unit type did in the last fight
    const last = m.history[m.history.length - 1];
    const howDid = (side) => {
      if (!last || !last.squads) return [];
      const by = {};
      for (const q of last.squads[side]) { const b = by[q.unit] || (by[q.unit] = { n: 0, left: 0, dealt: 0 }); b.n++; b.left += q.left; b.dealt += q.dealt; }
      return Object.keys(by).sort((a, b) => by[b].dealt - by[a].dealt).map(ui => { const b = by[ui]; return `  ${units[ui].name} x${b.n}: dealt ${b.dealt} damage, ${Math.round(b.left / b.n * 100)}% of bodies survived`; });
    };
    const lastFight = last && last.squads ? `LAST FIGHT (round ${last.round}, ${last.winner === 1 ? 'you won' : last.winner === 0 ? 'you lost' : 'draw'} in ${Math.round(last.time)} s)${last.towerFell ? (last.towerFell[1] ? '. YOUR TOWER FELL' : '') + (last.towerFell[0] ? '. THEIR TOWER FELL' : '') : ''}
Your units:
${howDid(1).join('\n') || '  none'}
Their units:
${howDid(0).join('\n') || '  none'}
` : '';
    // their army by unit type, weighted by what it's worth (price x level), and which units beat it
    const foeArmy = m.armies[0].filter(s => s.round < m.round);
    const foeW = {}; let foeTotal = 0;
    for (const s of foeArmy) { const w = Game.unitCostOf(units[s.unit]) * (Game.seenLevel(m, s) + 1); foeW[s.unit] = (foeW[s.unit] || 0) + w; foeTotal += w; }

      if (sq && Game.sell(m, 1, sq.id)) did.push(`sold ${units[sq.unit].name}`);
    }
    const levels = [];
    for (const id of list(mv.levelUp)) {
      const sq = m.armies[1].find(s => s.id === int(id));
      if (sq && Game.levelUp(m, 1, sq.id)) levels.push({ id: sq.id, unit: sq.unit, level: sq.level });
    }
    const skills = list(mv.skills);
    const trySkills = () => {
      for (const x of skills) {
        if (!x || x.done) continue;
        const ui = unitIdx(x.unit), k = int(x.slot) - 1;
        if (ui >= 0 && k >= 0 && k < Engine.SKILL_SLOTS && Game.buySkill(m, 1, ui, k)) { x.done = true; did.push(`bought ${units[ui].skillDefs[k].name} for ${units[ui].name}`); }
        else if (ui >= 0 && Game.isBuildingSkill(m, ui, k) && Game.buyBuilding(m, 1, ui, k, int(x.col), int(x.row))) { x.done = true; did.push(`placed a ${buildingName(Game.buildingIdOf(m, ui, k))} at col ${int(x.col)}, row ${int(x.row)}`); }
      }
    };
    for (const name of list(mv.unlock)) { const ui = unitIdx(name); if (ui >= 0 && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`); }
    trySkills();
    for (const id of list(mv.awaken)) { const sq = m.armies[1].find(s => s.id === int(id)); if (sq && Game.awaken(m, 1, sq.id)) did.push(`awakened ${units[sq.unit].name} (id ${sq.id})`); }
    for (const id of list(mv.levelBuilding)) if (Game.levelBuilding(m, 1, String(id))) levels.push({ building: String(id), level: Game.buildingOf(m, 1, String(id)).level });
    if (mv.buildingSkills && typeof mv.buildingSkills === 'object') for (const id in mv.buildingSkills) if (Game.buyBuildingSkill(m, 1, id, String(mv.buildingSkills[id]))) { const kind = Game.recordOf(m, 1, id).id; did.push(`bought ${Game.buildingSkillInfo(kind, String(mv.buildingSkills[id])).name} at its ${buildingName(kind)}`); }
    const bribes = Math.max(0, Math.min(20, mv.bribe === true ? 1 : int(mv.bribe) || 0));
    let paid = 0;
    for (let k = 0; k < bribes; k++) if (Game.bribe(m, 1)) paid++;
    if (paid) did.push(`bribed the elves ${paid} ${paid === 1 ? 'time' : 'times'}`);
    if (mv.elfTower && typeof mv.elfTower === 'object' && Game.buyElfOwn(m, 1, int(mv.elfTower.col), int(mv.elfTower.row))) did.push(`placed an elf tower at col ${int(mv.elfTower.col)}, row ${int(mv.elfTower.row)}`);
    for (const a of list(mv.altar)) if (Game.buyAltar(m, 1, String(a))) did.push({ walls: 'raised ice walls', push: 'pushed the hailstorm', snowgre: 'summoned a Snowgre' }[a]);
    for (const q of list(mv.removeTiles)) if (q && Game.removeShroom(m, 1, int(q.col), int(q.row))) did.push(`removed the ${Game.shroomTileAt(m, int(q.col), int(q.row)).type} mushroom at col ${int(q.col)}, row ${int(q.row)}`);
    const extra = Math.max(0, Math.min(Game.CONFIG.maxExtraDeploys, int(mv.extraDeployments) || 0));
    for (let k = 0; k < extra; k++) Game.buyDeploy(m, 1);
    if (mv.move && typeof mv.move === 'object') {
      const sq = m.armies[1].find(s => s.id === int(mv.move.id) && s.round < m.round);
      if (sq && Game.moveSquad(m, 1, sq.id, int(mv.move.col), int(mv.move.row))) did.push(`moved ${units[sq.unit].name}`);
    }
    for (const pl of list(mv.place)) {
      const ui = unitIdx(pl && pl.unit);
      if (ui >= 0 && !Game.isUnlocked(m, 1, ui) && m.gold[1] >= Game.unlockCost(m, ui, 1) + Game.shopCost(m, 1, ui) && Game.unlock(m, 1, ui)) did.push(`unlocked ${units[ui].name}`);
      if (ui >= 0) Game.place(m, 1, ui, int(pl.col), int(pl.row));
    }
    trySkills(); // skills for units placed just now
    while (m.extraDeploys[1] > 0 && Game.deploysLeft(m, 1) > 0 && Game.refundDeploy(m, 1)) {}
    lastAiLevels = levels;
    claude.did = did;
    claude.say = String(mv.say || '').replace(/\s+/g, ' ').trim().slice(0, 140);
    if (claude.say) claude.history.push(claude.say);
  }

  // ---------- Factions gamemode: the draft ----------
  // Before a Factions match the players draft factions one at a time (Game.FACTION_MODE.order). The match is then
  // played with the drafted factions' units only (useSet swaps them in; restoreSet puts the player's own units back),
  // each player with their own two factions. Live: the host runs the draft; the guest sends its picks (dpick).
  let matchKind = 'standard'; // standard | factions | devtest (vs AI only): what Play vs AI / Start match / Rematch starts
  let draft = null, draftSel = null, draftTimer = 0, standardSet = null;
  const FALL = { units: FDATA.units, matrix: FDATA.matrix, skills: FDATA.skills || [] };
  const FSHAPES = Shapes.assign(FALL.units); // for showing each faction's units
  const factionsReady = () => Game.draftPossible() && FALL.units.length >= 2;
  const devReady = () => Game.FACTIONS().length >= 1 && FALL.units.length >= 2; // the devtest drafts shared, so one faction will do
  function useFactionSet(picks) {
    if (!standardSet) standardSet = { set: rawSet, custom: customSet };
    // the devtest keeps every faction's units and the neutral ones in the match (a disguise or a building's spawn may
    // need a unit of another faction); each player can only use their own and the neutral units they picked
    useSet(matchKind === 'devtest' ? FALL : Game.factionSet(FALL, [...picks[0], ...picks[1]]), false);
  }
  function restoreSet() { if (standardSet) { useSet(standardSet.set, standardSet.custom); standardSet = null; } }
  function startDraft() {
    restoreSet();
    m = null; bt = null; battlePre = null; deadline = 0; draftSel = null;
    draft = Game.createDraft(Math.random() < 0.5 ? 0 : 1, null, matchKind === 'devtest');
    phase = 'draft'; hud(); netStatus(); render();
    draftChanged();
  }
  // after every pick or ban: the AI's turn, the guest's screen, or the match when the draft is done
  function draftChanged() {
    clearTimeout(draftTimer); draftSel = null;
    if (Game.draftDone(draft)) { finishDraft(); return; }
    const t = Game.draftTurn(draft);
    if (mode === 'ai' && t.side === 1) draftTimer = setTimeout(() => {
      if (mode !== 'ai' || phase !== 'draft' || !draft) return;
      Game.draftAct(draft, 1, Game.aiDraftChoice(draft, 1, FALL, (now() ^ (Math.random() * 1e9)) >>> 0));
      draftChanged();
    }, 900);
    if (mode === 'host') sendSync();
    drawDraft();
  }
  function finishDraft() {
    const picks = draft.picks; draft = null;
    useFactionSet(picks);
    m = Game.createMatch(units, M, (now() ^ (Math.random() * 1e9)) >>> 0, null, null, offChars, { factions: picks, dev: matchKind === 'devtest' });
    lastSummary = null; nextReady = [false, false]; rematch = [false, false];
    startReport();
    if (mode === 'host') hostBeginRound(); else beginAiRound();
  }
  function draftPick(id) {
    const t = Game.draftTurn(draft);
    if (!t || t.side !== me || !Game.draftOpen(draft).includes(id)) return;
    if (mode === 'guest') { send({ t: 'dpick', id, step: draft.step }); draftSel = null; return; }
    if (Game.draftAct(draft, me, id)) draftChanged();
  }
  function drawDraft() {
    if (phase !== 'draft' || !draft) return;
    const t = Game.draftTurn(draft), mine = t && t.side === me, open = Game.draftOpen(draft);
    if (!open.includes(draftSel)) draftSel = null;
    const who = mode === 'ai' ? 'The enemy' : 'Your opponent';
    const owner = (id) => draft.picks[me].includes(id) ? (draft.picks[foe()].includes(id) ? 'Both' : 'Yours') : draft.picks[foe()].includes(id) ? (mode === 'ai' ? 'Enemy’s' : 'Theirs') : (draft.bans[0].includes(id) || draft.bans[1].includes(id)) ? 'Banned' : '';
    const shut = (id) => draft.shared ? draft.picks[me].includes(id) || draft.bans[0].includes(id) || draft.bans[1].includes(id) : !!owner(id); // shared: only what you have
    const names = (ids) => ids.length ? ids.map(id => { const f = Game.factionInfo(id); return `<b style="color:${f.color}">${esc(f.name)}</b>`; }).join('') : '<b>–</b>';
    overlay(`<div class="draft">
      <span class="eyebrow">${draft.shared ? 'Factions – devtest' : 'Factions'} · draft · ${Game.FACTION_MODE.picks} each${draft.shared ? ' · both may take the same' : ''}</span>
      <h2 style="font-size:clamp(20px,6vw,28px);margin:0">${!t ? 'Draft done' : mine ? (t.act === 'ban' ? 'Ban a faction' : 'Pick a faction') : `${who} is ${t.act === 'ban' ? 'banning' : 'picking'}…`}</h2>
      <div class="sides"><span>You${names(draft.picks[me])}</span><span>${mode === 'ai' ? 'Enemy' : 'Opponent'}${names(draft.picks[foe()])}</span></div>
      <div class="fgrid">${draft.pool.map(id => {
        const f = Game.factionInfo(id); if (!f) return '';
        const st = owner(id);
        return `<button class="fac" data-fac="${esc(id)}" style="--fc:${f.color}" aria-pressed="${draftSel === id}" ${shut(id) ? 'disabled' : ''}>
          <span class="nm">${esc(f.name)}</span>${f.theme ? `<span class="sub">${esc(f.theme)}</span>` : ''}${st ? `<span class="st">${st}</span>` : ''}</button>`;
      }).join('')}</div>
    </div>`);
    $('overlay').querySelectorAll('[data-fac]').forEach(b => b.addEventListener('click', () => { draftSel = b.dataset.fac; drawDraft(); }));
    const f = draftSel && Game.factionInfo(draftSel), T = f && f.tower.unit;
    const fu = f ? FSHAPES.filter(u => u.faction === f.id) : [];
    $('panel').innerHTML = `${f ? `<div style="display:grid;gap:6px;font-size:13px;line-height:1.4">
        <b style="color:${f.color};font-family:var(--font-display);font-size:16px">${esc(f.name)}</b>
        ${f.trait ? `<span><span style="color:var(--gold)">${esc(f.trait.name || 'Trait')}:</span> ${esc(f.trait.text || '')}</span>` : ''}
        <span><span style="color:var(--gold)">Tower: ${esc(f.tower.name)}</span> · ${Math.round(T.hp)} hp · hit ${T.hit} × ${T.aps}/s · ${T.range} m${f.tower.text ? `. ${esc(f.tower.text)}` : ''}</span>
        <span class="hint">${fu.map(u => `<span style="color:${u.color};display:inline-flex;vertical-align:middle;margin-right:3px">${Shapes.svg(u.shape, 12)}</span>${esc(u.name)} · ${Game.unitCostOf(u)} gold`).join('<br>') || 'No units yet.'}</span>
      </div>` : `<span class="hint">${mine ? 'Tap a faction to see its units and tower.' : 'Tap a faction to see its units and tower while you wait.'}</span>`}
      <div class="bar">
        <button class="btn" id="draft-leave">${mode === 'ai' ? 'Main menu' : 'Leave'}</button>
        ${mine ? `<button class="btn primary" id="draft-go" ${f && open.includes(f.id) ? '' : 'disabled'}>${f ? `${t.act === 'ban' ? 'Ban' : 'Pick'} ${esc(f.name)}` : (t.act === 'ban' ? 'Ban' : 'Pick')}</button>` : ''}
      </div>`;
    $('draft-leave').addEventListener('click', () => { if (mode === 'host') clearHost(); showStart(); });
    if ($('draft-go')) $('draft-go').addEventListener('click', () => { if (draftSel) draftPick(draftSel); });
  }

  // ---------- tutorial: four guided rounds of one match, the screen built up one step at a time ----------
  // Round 1: your zone blinks on a board that holds only your tower, then a ring on the tower ("Protect it"), then the
  // deploy panel comes in with one card (Goblin Swarm). The enemy's Skeleton Archers stay hidden until the fight and beat the goblins wherever they stand,
  // which shows how damage works. Round 2: the archers are in sight now. Of the two cards on offer, Fire Mage beats
  // crowds and wins the fight from any tile; Sniper beats giants and is turned away with a hint (it nearly always loses).
  // From round 3 the gates open a little, in the same match: the tower pick and its ability (a glowing panel button),
  // the deployment cap with a shop of five basic units (the enemy adds a Brute, hidden until the fight), then in round 4
  // a level-up (whose sheet also has Move, Sell and skills), the flanks and no man's land. After round 4 the enemy plays
  // for real, as the AI, with every unit in the shop and the clock on; one coach line (tutHint) says so on that first
  // screen. A coach line over the board says what to do; the step comes from the match itself (tutStep), so taking a
  // squad back steps back too. Always on the built-in units, on the Standard map, fights at 1x, with no clock, packages
  // or characters, and no AI level-ups until the handover. The X on the coach line leaves the tutorial.
  const TUT_STORE = 'phonebellum.tutorial.v1';
  const TUT = { start: 'Goblin Swarm', foe: 'Skeleton Archers', foeAt: [6, 4], counter: 'Fire Mage', wrong: 'Sniper',
    shop: ['Goblin Swarm', 'Skeleton Archers', 'Ember Imps', 'Fire Mage', 'Sniper'], // the shop from round 3
    adds: { 3: [['Brute', 5, 4]], 4: [['Wisps', 3, 2]] }, // the enemy's new squads by round: [unit, column, row]
    last: 4, // the round after which the enemy plays for real
    towers: { bastion: 'A defensive tower: it takes more hits before it goes down.', keep: 'An all-round tower that can summon more units to aid you in battle.' } }; // round 3's offer
  let tutDone = false, tutHint = '', tutSpeed = 2; // tutHint: the coach line on the first screen after the handover; tutSpeed: the fight speed to go back to
  try { tutDone = localStorage.getItem(TUT_STORE) === 'done'; } catch (e) {}
  const unitIx = (name) => units.findIndex(u => u.name === name);
  function startTutorial() {
    leaveNet();
    mode = 'tutorial'; me = 0; report = null; lastAiLevels = []; tutHint = '';
    if (speed !== 1) { tutSpeed = speed; speed = 1; } // the fights at 1x, to watch them
    if (customSet && !standardSet) standardSet = { set: rawSet, custom: customSet }; // restoreSet puts the player's units back
    useSet(BUILTIN, false);
    m = Game.createMatch(units, M, 1, 'standard');
    m.packages = [[], []];
    for (const n of TUT.shop) m.unlocks[0][unitIx(n)] = 1;
    tutEnemy([[TUT.foe, ...TUT.foeAt]]);
    m.gold = [Game.SQUAD_COST, 0]; // just the first squad
    m.towers[1] = null;            // the enemy's tower comes with the enemy (the fight step)
    m.towerOffer = Object.keys(TUT.towers); // round 3: Bastion or Keep only
    tut = { intro: 0, wrong: false, tskillSeen: false, sheetSeen: false }; // intro: 0 the zone, 1 the tower, 2 on to the shop
    nextReady = [false, false]; rematch = [false, false];
    enterDeploy(0);
  }
  // the enemy's scripted squads (they don't pay for them)
  function tutEnemy(list) {
    for (const [n, c, r] of list) { m.unlocks[1][unitIx(n)] = m.round; m.gold[1] = Game.SQUAD_COST * 9; Game.place(m, 1, unitIx(n), c, r); }
    m.gold[1] = 0;
  }
  // a new round of the tutorial: the enemy's new squads, and in round 4 a squad of yours ready to level up
  function tutRound() {
    tutEnemy(TUT.adds[m.round] || []);
    if (m.round === 4 && !m.armies[me].some(s => Game.isReady(m, s)) && m.armies[me].length) {
      const sq = m.armies[me][0]; sq.xp = Math.max(sq.xp, Game.xpNeeded(units[sq.unit], sq.level));
    }
  }
  // tower, zone, pick, place, fight, counter (rounds 1-2); towerpick, tskill, free (round 3); level, sheet, flank,
  // free (round 4); result; or null (the fight is on)
  function tutStep() {
    if (mode !== 'tutorial' || !m) return null;
    if (phase === 'result') return 'result';
    if (phase !== 'deploy') return null;
    const r = m.round;
    if (r === 1 && tut.intro < 2) return tut.intro ? 'tower' : 'zone';
    if (r <= 2) return m.armies[me].some(s => s.round === r) ? 'fight' : selected !== null ? 'place' : r === 1 ? 'pick' : 'counter';
    if (r === 3) return choosingTower() ? 'towerpick' : !tut.tskillSeen && towerBtn() ? 'tskill' : 'free';
    if (!tut.sheetSeen) { // a level-up, then what else the squad's sheet has
      if (m.armies[me].some(s => s.boughtLevels && s.boughtLevels[r])) return 'sheet';
      if (m.armies[me].some(s => Game.isReady(m, s))) return 'level';
    }
    if (!m.armies[me].some(s => s.round === r && Game.isFlank(me, s.col, s.row))) return 'flank';
    return 'free';
  }
  // the tile the coach's ring is on: your tower, or the squad that can level up
  function tutTarget() {
    const st = tutStep();
    if (st === 'tower') return m.towers[me];
    if (st === 'level') return m.armies[me].find(s => Game.isReady(m, s)) || null;
    return null;
  }
  // the tiles that blink: your zone, then the flanks
  function tutTiles() {
    const st = tutStep(), out = [];
    if (st !== 'zone' && st !== 'flank') return out;
    for (let r = 0; r < Game.ROWS; r++) for (let c = 0; c < Game.COLS; c++) {
      if (Game.occupied(m, me, c, r) || !Game.canPlaceAt(m, me, c, r)) continue;
      if (st === 'zone' ? Game.inZone(me, r) : Game.isFlank(me, c, r)) out.push({ col: c, row: r });
    }
    return out;
  }
  // the coach line over the board: text and buttons ([label, onClick, primary]); null hides it, with the glows
  function coach(text, btns = []) {
    const el = $('coach');
    document.querySelectorAll('.tut-glow').forEach(x => x.classList.remove('tut-glow'));
    if (!text) { el.hidden = true; boardMarks(); return; }
    if (el.hidden || $('coach-text').innerHTML !== text) { el.hidden = true; void el.offsetWidth; } // each new line slides in
    el.hidden = false;
    $('coach-text').innerHTML = text;
    $('coach-btns').innerHTML = btns.map(([label, , primary], k) => `<button class="btn small${primary ? ' primary' : ''}" data-cb="${k}">${label}</button>`).join('');
    $('coach-btns').querySelectorAll('[data-cb]').forEach(b => b.addEventListener('click', btns[+b.dataset.cb][1]));
    $('coach-x').hidden = mode !== 'tutorial';
    boardMarks();
  }
  const glow = (el) => { if (el) el.classList.add('tut-glow'); };
  // the picked tower's ability, as the real panel offers it: its skill to buy, a loan, or the mage generals (on its sheet)
  function towerBtn() {
    if (!Game.towerPicked(m, me) || Game.needsTowerPick(m, me)) return '';
    const tt = Game.towerType(m, me);
    if (tt.skill && !Game.towerSkillOf(m, me)) return `<button class="btn small" id="t-skill" ${editable() && Game.canBuyTowerSkill(m, me) ? '' : 'disabled'}>${esc(tt.skill.name)} · ${Game.towerSkillCost(m, me)}</button>`;
    if (tt.loan && !Game.loanNow(m, me)) return `<button class="btn small" id="t-loan">Loan · +${Game.loanTerms(m, me).gold}</button>`;
    if (tt.generals) return '<button class="btn small" id="t-sheet">Mage general…</button>';
    return '';
  }
  // the tutorial's deploy panel: only what the current step needs, built up as the steps go
  function panelTutorial() {
    const step = tutStep(), r = m.round, g = m.gold[me], left = Game.deploysLeft(m, me);
    const open = step === 'free' || step === 'flank'; // the freer rounds: the shop, the deployment cap, a squad picked stays picked
    if (step === 'fight' && r === 1) Game.ensureTower(m, foe());
    const cards = step === 'pick' ? [TUT.start] : step === 'counter' ? [TUT.counter, TUT.wrong] : open ? TUT.shop : [];
    const canBuy = (i) => !open || (g >= Game.shopCost(m, me, i) && left > 0);
    if (selected !== null && !canBuy(selected)) selected = null;
    const sel = selected !== null && esc(units[selected].name);
    dockTask = moveMode ? { text: moving == null ? 'Tap a squad from an earlier round to move it.' : 'Tap a free tile to move it there.', x: true }
      : step === 'place' ? { text: '', x: false } // the coach says it; the drawer goes down, so the whole zone is in sight
      : open && sel ? { text: step === 'flank' ? `Tap a blinking flank tile to place ${sel}.` : `Tap a tile in your zone to place ${sel}.`, x: true } : null;
    $('panel').innerHTML = step === 'tower' || step === 'zone' || step === 'towerpick' ? '' : `
      ${r >= 3 ? `<div class="bar"><span class="deploys num">${Math.max(0, left)} of ${Game.deploysAllowed(m, me)} deployments left</span><span class="xbtns" style="display:flex;gap:6px">${Game.deployBuyable(m, me) ? `<button class="btn small" id="buy-deploy" ${editable() && Game.canBuyDeploy(m, me) ? '' : 'disabled'}>+1 deployment · ${Game.deployCost(m, me)}</button>` : ''}${towerBtn()}</span></div>` : ''}
      ${cards.length ? `<div class="shop" id="shop">${cards.map(n => shopCard(unitIx(n), !canBuy(unitIx(n)))).join('')}</div>` : ''}
      <div class="bar"><span class="gold num">${g} gold</span>${step === 'fight' || step === 'free' ? '<button class="btn primary" id="fight">Fight</button>' : ''}</div>`;
    $('panel').querySelectorAll('.ucard').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      if (b.getAttribute('aria-disabled') === 'true') return;
      if (step === 'counter' && units[i].name === TUT.wrong) { tut.wrong = true; panelDeploy(); return; }
      selected = selected === i ? null : i; tut.wrong = false; moveMode = false; moving = null; panelDeploy(); render();
    }));
    $('panel').querySelectorAll('[data-info]').forEach(el => el.addEventListener('click', () => openSheet(+el.dataset.info)));
    if ($('fight')) $('fight').addEventListener('click', runFight);
    if ($('buy-deploy')) $('buy-deploy').addEventListener('click', () => { if (editable() && Game.buyDeploy(m, me)) changed(); });
    if ($('t-skill')) $('t-skill').addEventListener('click', () => { if (editable() && Game.buyTowerSkill(m, me)) { tut.tskillSeen = true; changed(); } });
    if ($('t-loan')) $('t-loan').addEventListener('click', () => { if (editable() && Game.takeLoan(m, me)) { tut.tskillSeen = true; changed(); } });
    if ($('t-sheet')) $('t-sheet').addEventListener('click', () => { tut.tskillSeen = true; openTowerSheet(me); panelDeploy(); });
    syncPick();
    const card = (n) => $('panel').querySelector(`.ucard[data-i="${unitIx(n)}"]`);
    const next = () => { tut.intro++; panelDeploy(); render(); };
    if (dockTask && dockTask.text) coach(null); // the task line on the board says what the next tap does
    else if (step === 'tower') coach('This is your <b>Tower</b>. Protect it.', [['Next', next, true]]);
    else if (step === 'zone') coach('This is your <b>deployment zone</b>. You can put troops here.', [['Next', next, true]]);
    else if (step === 'pick') { coach(`Tap <b>${esc(TUT.start)}</b> to recruit your first squad.`); glow(card(TUT.start)); }
    else if (step === 'place') coach('Now tap a tile in your zone to place it.');
    else if (step === 'counter') {
      coach(tut.wrong ? `${esc(TUT.wrong)} beats giants, but ${esc(TUT.foe)} are a crowd. Try <b>${esc(TUT.counter)}</b>.`
        : `Squads stay all match, so now you see theirs: <b>${esc(TUT.foe)}</b>, a crowd. ${esc(TUT.counter)} beats crowds; ${esc(TUT.wrong)} beats giants.`);
      if (tut.wrong) glow(card(TUT.counter));
    } else if (step === 'fight') {

  // ---------- marks over the board: a unit's range under the mouse, the tutorial's tiles and ring ----------
