<title>No Mans Land UI 2.0</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the game's own look (war table at night). One screen: thin HUD on top, the whole board in the middle, a thumb tray at the bottom. Single dark look by choice, as in the game. */
:root {
  --bg: #0D1315;
  --panel: #152125;
  --panel-2: #1B2A2F;
  --board: #13201F;
  --line: #27393D;
  --ink: #E5ECE9;
  --muted: #8DA1A1;
  --you: #5CC6DF;
  --foe: #EE6E5C;
  --gold: #E6B84A;
  --gold-dark: #C4932C;
  --ok: #7BD389;
  --t1: #8DA1A1; --t2: #6FCF97; --t3: #5DA9E9; --t4: #B98AF0;
  --font-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; overflow: hidden;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.app { height: 100%; max-width: 560px; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; position: relative;
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }

/* HUD: health, round clock, leaders */
.hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding-block: 8px 6px; }
.side { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; min-width: 0; }
.side.foe { grid-template-columns: 1fr auto; }
.side.foe .leader { order: 2; }
.bars { display: grid; gap: 3px; min-width: 0; }
.bars .lbl { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
.side.you .lbl { color: var(--you); } .side.foe .lbl { color: var(--foe); flex-direction: row-reverse; }
.lbl .num { color: var(--ink); font-weight: 500; letter-spacing: 0; }
.hp { height: 6px; border-radius: 3px; background: var(--panel); overflow: hidden; }
.hp i { display: block; height: 100%; transition: width .6s ease; }
.you .hp i { background: var(--you); } .foe .hp i { background: var(--foe); margin-left: auto; }
.leader { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px;
  background: var(--panel-2); border: 2px solid var(--you); }
.foe .leader { border-color: var(--foe); }
.clock { position: relative; width: 46px; height: 46px; display: grid; place-items: center; }
.clock svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.clock b { font-family: var(--font-display); font-size: 18px; line-height: 1; }
.clock small { font-family: var(--font-data); font-size: 10px; color: var(--muted); display: block; text-align: center; }

/* Board */
.boardwrap { position: relative; min-height: 0; display: grid; place-items: center; }
#board { width: 100%; height: 100%; display: block; touch-action: none; }
.testtag { position: absolute; top: 4px; left: 0; font-family: var(--font-data); font-size: 11px; color: var(--gold); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 10px; }
.toast { position: absolute; left: 50%; top: 44px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; white-space: nowrap; pointer-events: none; transition: opacity .25s; }

/* Tray */
.tray { padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; position: relative; }
.trayhead { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.gold { font-family: var(--font-data); font-size: 22px; color: var(--gold); font-weight: 500; line-height: 1; }
.gold small { display: block; font-family: var(--font-body); font-size: 11px; color: var(--muted); margin-top: 3px; }
.deploys { display: flex; align-items: center; gap: 4px; }
.pip { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--you); }
.pip.on { background: var(--you); }
.plus { font-size: 12px; border: 1px dashed var(--line); border-radius: 999px; padding: 4px 8px; color: var(--muted); margin-left: 2px; }
.plus .num { color: var(--gold); }
.hint { font-size: 12.5px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 6px; }
.hint b { color: var(--ink); font-weight: 500; }
.ready { background: var(--gold); color: #1A1406; font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em;
  border-radius: 10px; padding: 0 26px; height: 48px; }
.ready:active { background: var(--gold-dark); }
.shop { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; scrollbar-width: none; }
.shop::-webkit-scrollbar { display: none; }
.card { flex: 0 0 76px; height: 112px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc);
  display: grid; grid-template-rows: 46px auto auto; justify-items: center; align-content: start; padding: 6px 4px 4px; position: relative;
  scroll-snap-align: start; touch-action: pan-x; cursor: grab; transition: transform .12s, opacity .12s; }
.card svg { width: 40px; height: 40px; }
.card .nm { font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.15; max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .cost { font-family: var(--font-data); font-size: 13px; color: var(--gold); margin-top: 2px; }
.card .beats { position: absolute; top: 4px; right: 4px; width: 16px; height: 16px; opacity: .85; }
.tier { flex: 0 0 22px; height: 112px; border-radius: 8px; display: grid; grid-template-rows: auto 1fr; justify-items: center; padding-block: 6px;
  background: color-mix(in srgb, var(--tc) 14%, var(--bg)); border: 1px solid color-mix(in srgb, var(--tc) 45%, transparent); scroll-snap-align: start; }
.tier b { font-family: var(--font-display); font-size: 13px; color: var(--tc); line-height: 1; }
.tier span { writing-mode: vertical-rl; transform: rotate(180deg); font-family: var(--font-data); font-size: 11px; color: var(--muted); align-self: center; letter-spacing: .04em; }
.tier.gap { margin-left: 6px; }
.addcard { flex: 0 0 76px; height: 112px; border-radius: 10px; border: 1.5px dashed color-mix(in srgb, var(--tc) 60%, var(--line)); color: var(--tc);
  display: grid; align-content: center; justify-items: center; gap: 2px; scroll-snap-align: start; }
.addcard .p { font-size: 30px; line-height: 1; font-weight: 300; }
.addcard .w { font-size: 12px; font-weight: 600; color: var(--ink); }
.addcard .c { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.addcard:active { background: color-mix(in srgb, var(--tc) 10%, transparent); }
.card.new { animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.7); opacity: 0 } 70% { transform: scale(1.06) } 100% { transform: none } }
.urow { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; }
.urow svg { width: 36px; height: 36px; }
.urow b { font-size: 14px; font-weight: 600; display: block; }
.urow p { margin: 0; font-size: 12.5px; color: var(--muted); }
.urow .info { text-align: left; min-width: 0; }
.urow .go { min-width: 92px; height: 38px; border-radius: 8px; background: var(--gold); color: #1A1406; font-weight: 600; font-size: 13px; }
.urow .go[disabled] { background: var(--panel); color: var(--muted); cursor: default; }
.card.poor { opacity: .45; }
.card.sel { transform: translateY(-6px); border-color: var(--gold); box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.card.lift { opacity: .3; }

/* drop zone shown over the tray while a squad is dragged */
.drop { position: absolute; inset: 0; border: 2px dashed var(--line); border-radius: 12px; background: rgba(13,19,21,.92); display: grid; place-items: center;
  font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.drop.hot { border-color: var(--gold); color: var(--gold); }

/* Sheets */
.scrim { position: absolute; inset: 0; z-index: 5; }
.sheet { grid-row: 3; position: relative; z-index: 6; margin-inline: -6px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0;
  padding: 8px 16px max(16px, env(safe-area-inset-bottom, 0px)); max-height: 46vh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.45); }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.sh-head { display: flex; align-items: center; gap: 10px; }
.sh-head svg { width: 36px; height: 36px; flex: none; }
.sh-head h2 { font-family: var(--font-display); font-size: 21px; margin: 0; flex: 1; letter-spacing: .02em; }
.lv { font-family: var(--font-data); font-size: 12px; color: var(--gold); border: 1px solid var(--gold-dark); border-radius: 999px; padding: 2px 8px; }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--panel-2); font-size: 18px; color: var(--muted); }
.role { color: var(--muted); font-size: 13.5px; margin: 4px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { font-family: var(--font-data); font-size: 12px; background: var(--panel-2); border-radius: 6px; padding: 4px 8px; color: var(--ink); }
.chip span { color: var(--muted); }
.xp { display: grid; gap: 4px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
.xp .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.xp .bar i { display: block; height: 100%; background: var(--gold); }
.big { width: 100%; height: 44px; border-radius: 10px; background: var(--gold); color: #1A1406; font-weight: 600; font-size: 15px; margin-bottom: 10px; }
.big[disabled] { background: var(--panel-2); color: var(--muted); cursor: default; }
.sk-title { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.skills { display: grid; gap: 6px; }
.skill { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; align-items: center; padding: 6px 10px; background: var(--panel-2); border-radius: 8px; }
.skill b { font-size: 14px; font-weight: 600; }
.skill p { margin: 0; grid-column: 1; font-size: 12.5px; color: var(--muted); }
.skill button { grid-row: 1 / 3; grid-column: 2; min-width: 66px; height: 36px; border-radius: 8px; border: 1px solid var(--gold-dark); color: var(--gold); font-family: var(--font-data); font-size: 13px; }
.skill button[disabled] { border-color: var(--line); color: var(--muted); cursor: default; }
.skill.own button { border-color: var(--ok); color: var(--ok); }
.skill.own { box-shadow: inset 3px 0 0 var(--ok); }
.foot { font-size: 12px; color: var(--muted); margin-top: 12px; text-align: center; }

/* Overlays: leader popover, fight, result, notes */
.pop { position: absolute; z-index: 8; top: 58px; width: min(280px, 80%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; }
.pop h3 { font-family: var(--font-display); margin: 0 0 4px; font-size: 16px; }
.pop p { margin: 0; color: var(--muted); }
.over { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; background: rgba(13,19,21,.82); padding: 16px; }
.res { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(330px, 100%); text-align: center; display: grid; gap: 10px; }
.res h2 { font-family: var(--font-display); font-size: 30px; margin: 0; letter-spacing: .04em; }
.res .won { color: var(--ok); } .res .lost { color: var(--foe); }
.res .rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; font-size: 14px; }
.res .rows .num { text-align: right; }
.res .g { color: var(--gold); }
.fightbox { text-align: center; display: grid; gap: 12px; justify-items: center; }
.fightbox h2 { font-family: var(--font-display); font-size: 26px; margin: 0; }
.fightbox p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 28ch; }
.prog { width: 200px; height: 4px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--gold); }
.ghostbtn { border: 1px solid var(--line); border-radius: 10px; height: 44px; padding: 0 18px; color: var(--ink); }
.notes { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: min(380px, 100%); max-height: 86%; overflow-y: auto; }
.notes h2 { font-family: var(--font-display); font-size: 20px; margin: 0 0 8px; }
.notes ul { margin: 0 0 12px; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--ink); }
.notes li span { color: var(--muted); }
.notes .row { display: flex; gap: 8px; flex-wrap: wrap; }
.toggle { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.toggle[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes glow { 0%,100% { opacity: .35 } 50% { opacity: .75 } }
.glow { animation: glow 1.4s ease-in-out infinite; }
</style>

<div class="app" id="app">
  <header class="hud">
    <div class="side you">
      <button class="leader" id="lead-you" aria-label="Your leader">W</button>
      <div class="bars"><div class="lbl"><span>You</span><span class="num" id="hp-you">55</span></div><div class="hp"><i id="hpb-you"></i></div></div>
    </div>
    <div class="clock" id="clock" aria-label="Round and time left">
      <svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="var(--panel-2)" stroke-width="3"/><circle id="clockring" cx="23" cy="23" r="20" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg>
      <div><b id="round">2</b><small class="num" id="secs">30</small></div>
    </div>
    <div class="side foe">
      <button class="leader" id="lead-foe" aria-label="Enemy leader">E</button>
      <div class="bars"><div class="lbl"><span>Enemy</span><span class="num" id="hp-foe">60</span></div><div class="hp"><i id="hpb-foe"></i></div></div>
    </div>
  </header>

  <div class="boardwrap" id="boardwrap">
    <svg id="board" viewBox="0 0 120 160" preserveAspectRatio="xMidYMid meet" aria-label="Battlefield"></svg>
    <button class="testtag" id="notes-btn">UI 2.0 test · notes</button>
    <div class="toast" id="toast" style="opacity:0"></div>
  </div>

  <footer class="tray" id="tray">
    <div class="hint" id="hint"></div>
    <div class="trayhead">
      <div class="gold num" id="gold">550<small>gold</small></div>
      <div class="deploys" id="deploys"></div>
      <div style="flex:1"></div>
      <button class="ready" id="ready">Ready</button>
    </div>
    <div class="shop" id="shop"></div>
  </footer>
</div>

<script>
// ---------- data: the Standard pack (from src/default-roster.json) ----------
const U = [
  ['Goblin Swarm',100,12,26,19,2,'triangle','#9BD35A',50,'giants','Fast melee swarm. Soaks shots and swamps single-target units.',[['AAARGH!',100,'+0.8 m/s speed and +0.3 attacks a second.'],['Tacticalness',150,'Spreads out, so splash hits fewer bodies.'],['More where that came from',150,'Each kill brings one more goblin.']]],
  ['Skeleton Archers',100,8,32,14,18,'triangle','#E9E3CF',50,'giants','Cheap ranged squad that deals steady damage from behind.',[['Longbones',100,'+3 m range and +5 hit.'],['Graverot arrows',150,'Arrows poison for 150% of the hit over 6 s.'],['Dread rangers',150,'Each body shrugs off the first hit it takes.']]],
  ['Fire Mage',100,1,155,33,20,'hexagon','#fb0022',50,'crowds','A lone caster whose splash clears clumps.',[['Long reach',200,'+5 m range.'],['Armor and health',200,'+8 armor and +25% health.'],['Dual Flame',200,'Attacks two different enemies at once.']]],
  ['Sniper',100,1,140,210,29,'cross','#F7D154',50,'giants','Huge single shots from very far away. Wasted on swarms.',[['Ranger scope',100,'+3 m range.'],['Deadeye',150,'+5 m range and +20 hit, slower shots.'],['Assaultgunner',150,'Four times the shots, half the hit, −5 m range.'],['Overwatch',300,'+200 health.']]],
  ['Brute',200,1,1100,98,2,'square','#8D99AE',50,'giants','Armored bruiser landing heavy blows on one target at a time.',[['Tuff skin',150,'+4 armor and +25% health.'],['Rampager',150,'Each kill makes it faster, up to 4 times.'],['Bullhead',150,'Every 3rd hit rams for +100 and knocks back.']]],
  ['Leaf Wizard',200,1,210,95,27,'hexagon','#00d200',50,null,'Nimble caster firing a quick stream of sharp leaves.',[['Wind walk',100,'Moves 33% faster in short dashes.'],['Bouncing blade',150,'Leaves bounce to 2 more enemies for 30%.'],['Petalburst',150,'Twice the attack speed.']]],
  ['Earth Wizard',200,1,650,440,24,'circle','#24590d',50,'both','Slow boulders that roll through every enemy in their path.',[['Regeneration',100,'Heals 2% of its health a second.'],['Stone spikes',150,'+5 m range, slower attacks.'],['Living armor',150,'+8 armor; slams nearby enemies and stuns them.']]],
  ['Shiv',200,4,150,15,18,'knife','#B7A6C9',50,'giants','Knife throwers whose wounds bleed harder with each knife.',[['Aeroblades',150,'Every 3rd throw adds a second knife.'],['Too deep',150,'Bleed lasts longer and stops healing.'],['Anemia',150,'Five bleed stacks stun the target.']]],
  ['Flame Wizard',300,1,2000,12,15,'flame','#b95018',100,'crowds','A slow fortress that sprays fire across everything in front.',[['Armor and health',200,'+8 armor and +25% health.'],['Long reach',200,'+5 m range.']]],
  ['Steel Wizard',300,1,1900,150,15,'bar','#57535a',100,'both','Armored heavy caster that hammers everything in reach.',[['Heavy metal',150,'+4 armor and +25% health.'],['Reforge',200,'Allies within 8 m get +2 armor and +20 hit.'],['Titanium spears',200,'Forges spears that hit for 200 and cause bleed.']]],
  ['Water Mage',300,1,600,50,22,'drop','#3B5BDB',100,'crowds','Water bombs that splash enemies and heal allies.',[['Waterbomb',100,'+50 hit and wider splash.'],['Pool shaper',150,'Leaves pools that hurt enemies and heal allies.'],['Flow state',150,'Standing still builds speed and range.']]],
  ['Ether Golem',500,1,3450,69,5,'square','#51005c',150,'crowds','A walking wall. Heavy armor shrugs off small hits.',[['Regeneration',100,'Heals 2% of its health a second.'],['Armor and health',200,'+8 armor and +25% health.']]],
  ['Sun Priest',500,1,2800,38,18,'sun','#FFD23F',150,'giants','A beam that burns hotter the longer it holds one target.',[['Split beam',100,'Beams up to 4 enemies at once, −30% range.'],['Shortsight',100,'Hits cut the target’s range by 6 m.']]],
  ['War Mammoth',500,1,2450,169,3,'pentagon','#A0785A',150,null,'Charges through the enemy line, trampling every body in its path.',[['Swift strikes',100,'+30% speed and +25% hit.'],['Armor and health',200,'+8 armor and +25% health.']]],
].map(([name,cost,bodies,hp,hit,range,shape,color,unlock,beats,role,skills]) => ({ name, cost, bodies, hp, hit, range, shape, color, unlock, beats, role, skills: skills.map(([n,c,t]) => ({ n, c, t })), tier: [100,200,300,500].indexOf(cost) + 1 }));
const byName = n => U.findIndex(u => u.name === n);
const LEADERS = {
  you: { n: 'Wilhelm', t: 'Squads on the flanks or in no man’s land get +4 armor every fight. Flank start delay halved.' },
  foe: { n: 'Emile', t: 'Tier 1 units are free to unlock.' },
};
const TILE = 10, COLS = 12, ROWS = 16, MOVE_COST = 50, EXTRA_COST = 50;
const levelCost = u => Math.max(10, Math.round(50 * u.cost / 100 / 5) * 5);
const xpNeed = u => Math.round(u.cost * 7.75); // shown only

// ---------- state: a round 2 position ----------
let S;
function fresh() {
  let id = 1;
  const sq = (name, col, row, side, extra) => ({ id: id++, u: byName(name), col, row, side, level: 1, xp: 0, isNew: false, moved: false, ...extra });
  S = {
    round: 2, gold: 550, hp: [55, 60], deploysBase: 2, extra: 0, moved: null,
    unlocked: new Set([byName('Fire Mage'), byName('Leaf Wizard')]),
    skills: {}, skillsNew: {},
    squads: [
      sq('Fire Mage', 4, 12, 0, { xp: 620 }), sq('Leaf Wizard', 7, 12, 0, { xp: 180 }),
      sq('Sniper', 3, 2, 1), sq('Sniper', 5, 2, 1), sq('Goblin Swarm', 6, 4, 1),
    ],
    nextId: 100, sel: null, secs: 30, timerOn: true, seenHints: new Set(), nudge: true,
  };
}
fresh();

// ---------- shapes ----------
function shapePath(s, cx, cy, r) {
  const poly = (n, rot = -Math.PI / 2, rr = r) => Array.from({ length: n }, (_, i) => { const a = rot + i * 2 * Math.PI / n; return `${(cx + rr * Math.cos(a)).toFixed(2)},${(cy + rr * Math.sin(a)).toFixed(2)}`; }).join(' ');
  switch (s) {
    case 'triangle': return `<polygon points="${poly(3, -Math.PI / 2, r * 1.1)}"/>`;

    <div class="sk-title">Skills · all your ${esc(u.name)}</div>
    <div class="skills">${u.skills.map((k, i) => {
      const own = owned.includes(i), fresh = (S.skillsNew[q.u] || []).includes(i), full = owned.length >= 2 && !own;
      const btn = own ? (fresh ? 'Undo' : 'Owned') : full ? 'Full' : k.c;
      return `<div class="skill ${own ? 'own' : ''}"><b>${esc(k.n)}</b><p>${esc(k.t)}</p><button data-sk="${i}" ${own && !fresh ? 'disabled' : ''} ${!own && (full || S.gold < k.c) ? 'disabled' : ''}>${btn}</button></div>`;
    }).join('')}</div>
    <p class="foot">${q.isNew ? 'Drag it to move it. Drag it down to the tray to take it back.' : `Drag it to move it (${MOVE_COST}, once a round). Drag it down to the tray to sell.`}</p>`);
  sheetSq = q; drawBoard();
  const lv = s.querySelector('#lvl'); if (lv) lv.onclick = () => { S.gold -= lc; q.level++; q.xp = 0; toast(`${u.name} is level ${q.level}`); drawHud(); drawTray(); openSquad(q); };
  s.querySelectorAll('[data-sk]').forEach(b => b.onclick = () => {
    const i = +b.dataset.sk, own = (S.skills[q.u] ||= []), fr = (S.skillsNew[q.u] ||= []);
    if (own.includes(i)) { if (fr.includes(i)) { own.splice(own.indexOf(i), 1); fr.splice(fr.indexOf(i), 1); S.gold += u.skills[i].c; toast('Skill refunded'); } }
    else { S.gold -= u.skills[i].c; own.push(i); fr.push(i); toast(`${u.skills[i].n}: all your ${u.name} have it. Hidden from the enemy until the fight.`); }
    drawTray(); openSquad(q);
  });
}
function askSell(q) {
  const u = U[q.u];
  const s = sheet(`<div class="sh-head">${unitIcon(u, 36)}<h2>Sell ${esc(u.name)}?</h2><button class="x" data-close aria-label="Cancel">×</button></div>
    <p class="role">You get half its price back. Its level and XP are lost; skills stay with the unit type.</p>
    <button class="big" id="sellok">Sell · +${sellValue(q)}</button>`);
  s.querySelector('#sellok').onclick = () => { sell(q); closeSheet(); render(); };
}
function openInfo(ui, back) {
  const u = U[ui], locked = !S.unlocked.has(ui);
  const s = sheet(`
    <div class="sh-head">${unitIcon(u, 36)}<h2>${esc(u.name)}</h2><span class="lv">T${u.tier} · ${u.cost}</span>${back ? `<button class="x" id="back" aria-label="Back">‹</button>` : `<button class="x" data-close aria-label="Close">×</button>`}</div>
    <p class="role">${esc(u.role)}${u.beats ? ` <b style="color:var(--gold);font-weight:500">Best: ${BEATS_TXT[u.beats]}.</b>` : ''}</p>
    ${statChips(u)}
    ${locked ? `<button class="big" id="unl" ${S.gold >= u.unlock ? '' : 'disabled'}>Unlock · ${u.unlock}</button>` : ''}
    <div class="sk-title">Skills you can buy once it’s on the board</div>
    <div class="skills">${u.skills.map(k => `<div class="skill"><b>${esc(k.n)}</b><p>${esc(k.t)}</p><button disabled>${k.c}</button></div>`).join('')}</div>
    <p class="foot">${locked ? 'Once unlocked, it gets a card in your tray.' : 'Drag the card onto your zone to place it.'}</p>`);
  const b = s.querySelector('#unl'); if (b) b.onclick = () => unlock(ui);
  const bk = s.querySelector('#back'); if (bk) bk.onclick = () => openUnlock(back);
}
function unlock(ui) {
  const u = U[ui]; if (S.gold < u.unlock) return toast(`Need ${u.unlock} gold`);
  S.gold -= u.unlock; S.unlocked.add(ui); justUnlocked = ui; S.sel = ui;
  closeSheet(false); render(); toast(`${u.name} unlocked · tap a glowing tile or drag the card`);
}
function openUnlock(t) {
  const list = U.map((u, i) => i).filter(i => U[i].tier === t && !S.unlocked.has(i));
  const s = sheet(`
    <div class="sh-head"><h2>Unlock a tier ${t} unit</h2><button class="x" data-close aria-label="Close">×</button></div>
    <p class="role">Unlocking is once per match. Then the unit costs ${TIER_COST[t]} a squad. Tap a name for its details.</p>
    <div class="skills">${list.map(i => { const u = U[i]; return `<div class="urow">${unitIcon(u, 36)}<button class="info" data-info="${i}"><b>${esc(u.name)}</b><p>${u.beats ? BEATS_TXT[u.beats][0].toUpperCase() + BEATS_TXT[u.beats].slice(1) : esc(u.role.split('.')[0])}</p></button><button class="go" data-unl="${i}" ${S.gold >= u.unlock ? '' : 'disabled'}>Unlock · ${u.unlock}</button></div>`; }).join('')}</div>`);
  s.querySelectorAll('[data-unl]').forEach(b => b.onclick = () => unlock(+b.dataset.unl));
  s.querySelectorAll('[data-info]').forEach(b => b.onclick = () => openInfo(+b.dataset.info, t));
}
function openFoe(q) {
  const u = U[q.u];
  sheet(`<div class="sh-head">${unitIcon(u, 36)}<h2 style="color:var(--foe)">${esc(u.name)}</h2><span class="lv" style="color:var(--foe);border-color:var(--foe)">Enemy · Lv ${q.level}</span><button class="x" data-close aria-label="Close">×</button></div>
    <p class="role">${esc(u.role)}</p>${statChips(u)}<p class="foot">Squads the enemy places this round stay hidden until the fight.</p>`);
}
function showLeader(side) {
  const old = $('pop'); if (old) { old.remove(); if (old.dataset.side === side) return; }
  const L = LEADERS[side], p = document.createElement('div'); p.className = 'pop'; p.id = 'pop'; p.dataset.side = side;
  p.style[side === 'you' ? 'left' : 'right'] = '0';
  p.innerHTML = `<h3 style="color:var(--${side})">${esc(L.n)}</h3><p>${esc(L.t)}</p>`;
  $('app').appendChild(p); setTimeout(() => p.remove(), 3500);
}
$('lead-you').onclick = () => showLeader('you');
$('lead-foe').onclick = () => showLeader('foe');

// ---------- fight and result (the fight itself is unchanged, so it is only stood in for here) ----------
function power(side) { return S.squads.filter(q => q.side === side).reduce((a, q) => a + U[q.u].cost * (1 + .9 * (q.level - 1)) * (1 + .15 * (side === 0 ? skillCount(q.u) : 0)), 0); }
let fightT = null;
function fight() {
  closeSheet(false); S.sel = null; render();
  const o = document.createElement('div'); o.className = 'over'; o.id = 'over';
  o.innerHTML = `<div class="fightbox"><h2>Round ${S.round}: fight</h2><p>The battle plays here exactly as in the game now. This test only covers deploying.</p><div class="prog"><i id="prog"></i></div><button class="ghostbtn" id="skip">Skip to result</button></div>`;
  $('boardwrap').appendChild(o);
  const t0 = performance.now();
  const step = () => { const k = Math.min(1, (performance.now() - t0) / 2200); const bar = $('prog'); if (bar) bar.style.width = k * 100 + '%'; if (k < 1) fightT = requestAnimationFrame(step); else result(); };
  fightT = requestAnimationFrame(step);
  $('skip').onclick = () => { cancelAnimationFrame(fightT); result(); };
}
function result() {
  const a = power(0), b = power(1), won = a >= b, dmg = Math.min(20, Math.max(2, Math.round(Math.abs(a - b) / 60) + 2));
  const income = 250 + 100 * (S.round - 1), bonus = won ? 0 : 50;
  if (won) S.hp[1] = Math.max(0, S.hp[1] - dmg); else S.hp[0] = Math.max(0, S.hp[0] - dmg);
  const o = $('over');
  o.innerHTML = `<div class="res"><h2 class="${won ? 'won' : 'lost'}">${won ? 'Round won' : 'Round lost'}</h2>
    <div class="rows"><span>${won ? 'Enemy takes' : 'You take'}</span><b class="num">${dmg} damage</b>
    <span>Next round</span><b class="num g">+${income + bonus} gold</b>
    <span>Your health</span><b class="num">${S.hp[0]}</b></div>
    <button class="big" id="next" style="margin:4px 0 0">Next round</button>
    <p class="foot" style="margin:0">The result here is a rough stand-in, not a real battle.</p></div>`;
  drawHud();
  $('next').onclick = () => nextRound(income + bonus);
}
function nextRound(gold) {
  $('over').remove();
  S.round++; S.gold += gold; S.extra = 0; S.moved = null; S.secs = 30; S.skillsNew = {};
  for (const q of S.squads) { if (q.side === 0) { q.xp += 200 + Math.round(U[q.u].cost * 2.5); q.isNew = false; delete q.home; } }
  // the enemy adds a squad it bought last round
  const picks = ['Brute', 'Fire Mage', 'Steel Wizard', 'Water Mage', 'Sun Priest'];
  const name = picks[(S.round - 3) % picks.length];
  for (let r = 3; r >= 0; r--) { const c = [2, 9, 7, 4, 10][S.round % 5]; if (!at(c, r) && !towerAt(c, r)) { S.squads.push({ id: S.nextId++, u: byName(name), col: c, row: r, side: 1, level: 1, xp: 0 }); break; } }
  render(); toast(`Round ${S.round}. The enemy added a ${name}.`);
}
$('ready').onclick = fight;

// ---------- clock ----------
setInterval(() => {
  if (!S.timerOn || $('over') || $('notesbox')) return;
  S.secs = Math.max(0, S.secs - 1); drawHud();
  if (S.secs === 0) fight();
}, 1000);

// ---------- notes ----------
$('notes-btn').onclick = () => {
  const o = document.createElement('div'); o.className = 'over'; o.id = 'notesbox';
  o.innerHTML = `<div class="notes"><h2>What’s new in this test</h2>
    <ul>
      <li>Your whole zone stays in sight. <span>The shop is one row of cards under your thumb instead of a drawer over the board.</span></li>
      <li>Drag a card up onto a tile. <span>Glowing tiles show where it can go, the range ring shows its reach, and on a phone the squad floats above your finger. Tapping a card, then a tile, still works.</span></li>
      <li>Hold a card for details. <span>A tap picks, a hold explains, so the card itself stays small.</span></li>
      <li>The tray holds only your unlocked units, grouped by tier. <span>A small tab starts each tier (with its price), and the last space in each tier is + Unlock while that tier has units left.</span></li>
      <li>+ Unlock opens a short list of that tier’s locked units. <span>Unlocking adds the card to your tray and picks it, ready to place.</span></li>
      <li>No Move button and no ✕ marks. <span>Drag a new squad anywhere for free, or down to the tray to take it back. Drag an older squad to move it (50, once a round) or down to sell it.</span></li>
      <li>Deployments are pips next to your gold, with +1 beside them.</li>
      <li>Leaders are portraits in the top bar. <span>Tap one to read it.</span></li>
      <li>The round clock wraps the round number.</li>
      <li>Shorter squad sheet. <span>One-line skills with the price on the button; Level up is the one big button.</span></li>
    </ul>
    <div class="row">
      <button class="toggle" id="t-timer" aria-pressed="${S.timerOn}">Clock ${S.timerOn ? 'on' : 'off'}</button>
      <button class="toggle" id="t-reset">Start over</button>
      <button class="toggle" id="t-close" style="margin-left:auto">Close</button>
    </div></div>`;
  $('app').appendChild(o);
  o.onclick = e => { if (e.target === o) o.remove(); };
  $('t-close').onclick = () => o.remove();
  $('t-timer').onclick = () => { S.timerOn = !S.timerOn; S.secs = 30; o.remove(); drawHud(); };
  $('t-reset').onclick = () => { const t = S.timerOn; fresh(); S.timerOn = t; o.remove(); closeSheet(false); render(); };
};

window.addEventListener('resize', () => drawBoard());
render();
</script>
